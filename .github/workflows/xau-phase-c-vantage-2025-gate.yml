name: XAU Phase C Vantage RAW 2025 Gate
# observable rerun: publishes STARTED marker before data acquisition
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-phase-c-vantage-2025-gate.yml'
permissions:
  contents: write
jobs:
  gate-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: Publish STARTED marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,json,os,requests
          path='xau-final-results/phase_c_vantage_raw_2025/status.json'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          payload=json.dumps({'status':'STARTED','source_commit':os.environ.get('GITHUB_SHA')},indent=2).encode()
          body={'message':'mark Vantage RAW 2025 gate started [skip ci]','content':base64.b64encode(payload).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          r=requests.put(u,headers=h,json=body); r.raise_for_status(); print('START_MARKER_OK')
          PY
      - name: Frozen overlay and entry tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_vantage_overlay.py xau-multiyear/tests/test_entries_v1.py xau-multiyear/tests/test_entries_v2.py xau-multiyear/tests/test_entries_s1.py
      - name: Acquire warmup plus 2025
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2024-01 --to-month 2026-01 --out /tmp/xau_vantage_2025.csv
      - name: Run frozen Vantage RAW recalculation
        run: python xau-multiyear/scripts/run_phase_c_vantage_raw.py /tmp/xau_vantage_2025.csv --target-start 2025-01-01 --target-end 2026-01-01 --out /tmp/vantage_2025
      - name: Validate event parity and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,json,os,requests,pandas as pd
          m=json.load(open('/tmp/vantage_2025/manifest.json')); s=pd.read_csv('/tmp/vantage_2025/summary.csv')
          assert m['target_events']==80617, m['target_events']
          assert set(s.scenario)=={'S10_C6','S11_C6_PRIMARY','S12_C6','S18_C9_STRESS'}
          assert {'DISPLACEMENT_ORIGIN_ONLY','OBJECTIVE_LIQUIDITY_ONLY','DOZ_OBJECTIVE_ONLY'}.issubset(set(s['sample']))
          assert 'TOUCH_NEXT_OPEN' in set(s.entry_model)
          assert set(s[s.entry_model=='TOUCH_NEXT_OPEN'].vol_floor_k.dropna().round(2))=={0.25,0.50,0.75,1.00}
          print('VANTAGE_2025_EVENT_PARITY_OK',m['target_events'])
          p=s[s.scenario=='S11_C6_PRIMARY'].sort_values('avg_net_R',ascending=False)
          print(p.head(25).to_string(index=False))
          files={'xau-final-results/phase_c_vantage_raw_2025/summary.csv':'/tmp/vantage_2025/summary.csv','xau-final-results/phase_c_vantage_raw_2025/manifest.json':'/tmp/vantage_2025/manifest.json'}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for path,src in files.items():
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish Vantage RAW 2025 {path.split("/")[-1]} [skip ci]','content':base64.b64encode(open(src,'rb').read()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
