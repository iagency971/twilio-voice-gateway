name: XAU Wick Zone OOS Run Monitor

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-oos-monitor.yml'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - name: Poll latest OOS run and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-wick-zone-pro-dev
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          repo=os.environ['REPO']; branch=os.environ['BRANCH']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          q=urllib.parse.quote(branch,safe='')
          runs_url=f'https://api.github.com/repos/{repo}/actions/workflows/xau-wick-zone-pro-oos.yml/runs?branch={q}&per_page=5'
          latest=None
          for _ in range(30):
              data=get(runs_url); runs=data.get('workflow_runs',[])
              latest=runs[0] if runs else None
              if latest and latest.get('status')=='completed': break
              time.sleep(20)
          out={'workflow':'xau-wick-zone-pro-oos.yml','branch':branch,'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'latest':None}
          if latest:
              rid=latest['id']; jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs',[])
              out['latest']={'id':rid,'status':latest.get('status'),'conclusion':latest.get('conclusion'),'created_at':latest.get('created_at'),'updated_at':latest.get('updated_at'),'head_sha':latest.get('head_sha'),'html_url':latest.get('html_url'),'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs]}
          os.makedirs('xau-wick-zone-pro',exist_ok=True)
          open('xau-wick-zone-pro/OOS_RUN_STATUS.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add xau-wick-zone-pro/OOS_RUN_STATUS.json
          git commit -m 'publish OOS run status [skip ci]' || true
          git push origin HEAD:agent/xau-wick-zone-pro-dev
