# trigger-once: comex-dev-rank1-vantage-outcomes-2026-08-18
name: XAU COMEX DEV_RANK1 Vantage Outcomes

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-vantage-outcomes.yml']

permissions:
  actions: read
  contents: write

jobs:
  annual:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2011,2012,2013,2014,2015,2016,2017,2018]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow requests scikit-learn==1.5.2
      - name: Download frozen canonical COMEX event plan
        uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32102932187
      - name: Resolve frozen annual XAU replay window
        id: dates
        shell: bash
        run: |
          Y=${{ matrix.year }}
          echo "from=$((Y-1))-01" >> "$GITHUB_OUTPUT"
          echo "to=$((Y+1))-01" >> "$GITHUB_OUTPUT"
      - name: Acquire free Dukascopy XAU window — no Databento
        run: |
          python xau-multiyear/scripts/acquire_dukascopy_window.py \
            --from-month ${{ steps.dates.outputs.from }} \
            --to-month ${{ steps.dates.outputs.to }} \
            --out /tmp/xau_${{ matrix.year }}.csv
      - name: Export frozen Vantage economic outcomes
        run: |
          python xau-multiyear/scripts/export_comex_dev_rank1_vantage_outcomes_direct.py \
            /tmp/xau_${{ matrix.year }}.csv \
            --year ${{ matrix.year }} \
            --canonical-events /tmp/plan/canonical_events_all.csv.gz \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --out /tmp/outcomes
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-vantage-outcomes-${{ matrix.year }}-v1
          path: /tmp/outcomes/
          retention-days: 90
      - name: Publish compact annual audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/outcomes')
          root='xau-final-results/comex_dev_rank1_vantage_outcomes_v1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['manifest.json','coverage_by_model.csv','event_outcomes_sample_200.csv']:
              p=src/name
              dst=f"{root}/{os.environ['YEAR']}_{name}"
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}"
              payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']})
                  sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f"publish DEV_RANK1 Vantage outcomes {os.environ['YEAR']} {name} [skip ci]",'content':payload,'branch':os.environ['BRANCH']}
                  if sha: body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201): break
                  if r.status_code not in (409,422): r.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:
                  raise SystemExit(f'could not publish {dst}')
          PY
