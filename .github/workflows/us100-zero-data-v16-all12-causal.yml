name: US100 Zero-Data All12 Causal V16

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-v16-all12-causal
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests matplotlib tabulate python-dotenv
      - name: Run V16 all-12 causal rerun and segmentation
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/v16_all12_causal_segmentation
          python us100-zero-data/run_v16_all12_causal_segmentation.py 2>&1 | tee us100-zero-data/results/v16_all12_causal_segmentation/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/v16_all12_causal_segmentation/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then echo "V16_FAILURE exit_code=$code" > us100-zero-data/results/v16_all12_causal_segmentation/WORKFLOW_FAILURE.txt; else rm -f us100-zero-data/results/v16_all12_causal_segmentation/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish V16 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/v16_all12_causal_segmentation
          git commit -m "Publish V16 all-12 causal segmentation [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
