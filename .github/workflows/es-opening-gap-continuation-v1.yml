name: ES Opening Gap Continuation V1
on:
  push:
    branches: [agent/es-opening-gap-continuation-v1]
    paths: ['opening-gap-cont/**','.github/workflows/es-opening-gap-continuation-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/es-opening-gap-continuation-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen test
        shell: bash
        run: |
          set +e
          mkdir -p opening-gap-cont/results/v1
          python opening-gap-cont/run_v1.py 2>&1 | tee opening-gap-cont/results/v1/run.log
          echo ${PIPESTATUS[0]} > opening-gap-cont/results/v1/exit_code.txt
          exit 0
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- opening-gap-cont/results/v1
          git commit -m "Publish opening-gap continuation V1 [skip ci]" || true
          git push origin HEAD:agent/es-opening-gap-continuation-v1
