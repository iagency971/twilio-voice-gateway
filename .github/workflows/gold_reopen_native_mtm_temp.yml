name: Gold reopen native MTM temp

on:
  push:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27
    paths:
      - '.github/workflows/gold_reopen_native_mtm_temp.yml'

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-reopen-stat-study-2026-08-27
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download recent BID ASK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tail_bid tail_ask
          npx --yes dukascopy-node -i xauusd -from 2026-08-20 -to 2026-08-28 -t m1 -p bid -f csv -bs 1 -bp 5000 -dir tail_bid -fn recent_bid -r 5 -rp 10000 -fr
          sleep 5
          npx --yes dukascopy-node -i xauusd -from 2026-08-20 -to 2026-08-28 -t m1 -p ask -f csv -bs 1 -bp 5000 -dir tail_ask -fn recent_ask -r 5 -rp 10000 -fr
      - name: Compute MTM drawdown
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from concurrent.futures import ThreadPoolExecutor,as_completed
          spec=importlib.util.spec_from_file_location('g','xau-multiyear/reopen-study/gold_reopen_5m_study.py')
          g=importlib.util.module_from_spec(spec); spec.loader.exec_module(g)
          store={'bid':{},'ask':{}}; tasks=[]
          for side in ('bid','ask'):
            for m in range(1,9): tasks.append((side,2026,m))
          with ThreadPoolExecutor(max_workers=6) as ex:
            for fut in as_completed([ex.submit(g.load_archive_month,*t) for t in tasks]):
              side,y,m,o,mx=fut.result(); store[side].update(o)
          g.parse_tail('tail_bid/recent_bid.csv','bid',store,None)
          g.parse_tail('tail_ask/recent_ask.csv','ask',store,None)
          events,reject=g.build_events(store)
          es=sorted([e for e in events if e['year']==2026 and e['type']=='NORMAL'], key=lambda e:e['date'])
          realized=0.0
          peak=0.0; peak_date=None
          maxdd=-1.0; worst=None
          rows=[]
          for e in es:
            ent=e['entries']['55']
            pnl=100.0*ent['exits']['1']
            mae=100.0*max(0.0,ent['mae_by_h']['1'])
            trough=realized-mae
            dd=peak-trough
            if dd>maxdd:
              maxdd=dd
              worst={'date':e['date'],'peak_usd':peak,'peak_date':peak_date,'equity_before_trade_usd':realized,'intratrade_trough_usd':trough,'mae_usd':mae,'trade_pnl_usd':pnl,'drawdown_usd':dd}
            realized += pnl
            if realized>peak:
              peak=realized; peak_date=e['date']
            rows.append({'date':e['date'],'equity_close_usd':realized,'pnl_usd':pnl,'mae_usd':mae})
          out={'definition':'BUY 16:55 ASK -> BID close 18:00 M1; fixed 1.00 lot=100 oz; MTM trough uses M1 low across full exposure through exit minute; Dukascopy spread included; no broker swap/commission','N':len(es),'reject':reject,'max_mark_to_market_drawdown_usd_1lot':maxdd,'worst':worst,'final_gross_pnl_usd_1lot':realized}
          p='xau-multiyear/reopen-study/NATIVE_1655_1801_MTM_2026_2026-08-27.json'
          json.dump(out,open(p,'w'),indent=2,sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xau-multiyear/reopen-study/NATIVE_1655_1801_MTM_2026_2026-08-27.json
          git commit -m 'results: add native 16:55-18:01 MTM drawdown 2026' || exit 0
          git push origin HEAD:agent/gold-reopen-stat-study-2026-08-27
