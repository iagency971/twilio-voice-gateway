name: XAU E second Pro gate additional outcome-blind QA

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-second-pro-gate-additional-outcomeblind-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  SOURCE_MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  CANONICAL_RUN_ID: '33259414496'
  FROZEN_Z4_RUN_ID: '33139524456'
  DEV_END: '2025-08-01T00:00:00Z'

jobs:
  additional-outcome-blind-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"

      - name: Download canonical pre-outcome artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.CANONICAL_RUN_ID }}
          name: e-display-episode-v1-preoutcome
          path: /tmp/canonical

      - name: Download frozen Z4 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_Z4_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true

      - name: Verify canonical artifact and acquire hash-verified M1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/results
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          r=Path('/tmp/canonical')
          m=json.loads((r/'PRE_OUTCOME_PACKAGE_MANIFEST.json').read_text())
          assert m['status']=='E_DISPLAY_EPISODE_V1_PRE_OUTCOME_REPAIR_PASS'
          assert m['future_price_outcomes_used'] is False
          assert m['workflow_run_id']==int(os.environ['CANONICAL_RUN_ID'])
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for name,exp in m['evidence_sha256'].items():
              assert h(r/name)==exp,(name,h(r/name),exp)
          src=json.load(open(os.environ['SOURCE_MANIFEST']))
          rows=[]
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in src['files']:
              if x['side']!='bid': continue
              key=f"{int(x['year']):04d}-{int(x['month']):02d}"
              if '2024-01'<=key<='2026-07':
                  p=Path('/tmp/raw')/x['file']
                  subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
                  assert h(p)==x['sha256'],(x['file'],h(p),x['sha256'])
                  rows.append((key,str(p)))
          assert len(rows)==31,len(rows)
          prefix=[p for key,p in rows if key<='2025-07']
          assert len(prefix)==19,len(prefix)
          Path('/tmp/prefix_files.txt').write_text('\n'.join(prefix)+'\n')
          Path('/tmp/all_files.txt').write_text('\n'.join(p for _,p in rows)+'\n')
          PY

      - name: Assemble DEV-prefix frozen Z4
        shell: bash
        run: |
          python - <<'PY'
          import glob,os
          import pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'));assert len(fs)==24,len(fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z[z.time<pd.Timestamp(os.environ['DEV_END'])].sort_values(['time','side','center']).reset_index(drop=True)
          assert len(z)>0 and z.time.max()<pd.Timestamp(os.environ['DEV_END'])
          z.to_pickle('/tmp/FROZEN_C5_DEV_PREFIX.pkl')
          PY

      - name: Rebuild causal DEV prefix with frozen method
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/prefix_files.txt
          python "$PKG/xau_ebuy_provenance_instrument_v1.py" \
            --files "${FILES[@]}" \
            --z4-pkl /tmp/FROZEN_C5_DEV_PREFIX.pkl \
            --output-csv /tmp/results/PREFIX_PROVENANCE.csv.gz \
            --manifest /tmp/results/PREFIX_PROVENANCE_MANIFEST.json

      - name: Prove DEV prefix invariance and count M1 gaps
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from pandas.testing import assert_frame_equal

          pkg=Path(os.environ['PKG']);canon=Path('/tmp/canonical');cut=pd.Timestamp(os.environ['DEV_END'])
          def load_csv(p): return pd.read_csv(p,compression='infer',float_precision='round_trip')

          # 1) Provenance/display invariance: appending all replication-era prices must not alter any DEV row or ID.
          fullp=load_csv(canon/'E_DISPLAY_PROVENANCE_V1_24M.csv.gz');pref=load_csv('/tmp/results/PREFIX_PROVENANCE.csv.gz')
          fullp['time']=pd.to_datetime(fullp.time,utc=True);pref['time']=pd.to_datetime(pref.time,utc=True)
          fullp=fullp[fullp.time<cut].reset_index(drop=True)
          pref=pref.reset_index(drop=True)
          assert list(pref.columns)==list(fullp.columns),(pref.columns.tolist(),fullp.columns.tolist())
          assert_frame_equal(pref,fullp,check_exact=True,check_dtype=False)

          # 2) Episode/feature invariance on the complete DEV window.
          spec=importlib.util.spec_from_file_location('snap',pkg/'xau_e_display_episode_snapshot_v1.py')
          snap=importlib.util.module_from_spec(spec);sys.modules[spec.name]=snap;spec.loader.exec_module(snap)
          built=snap.build(pref.copy()).reset_index(drop=True)
          full=load_csv(canon/'E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz')
          for c in snap.TIME_FIELDS:
              full[c]=pd.to_datetime(full[c],utc=True,errors='coerce')
          full=full[full.snapshot_time_utc<cut].reset_index(drop=True)
          for c in snap.TIME_FIELDS:
              built[c]=pd.to_datetime(built[c],utc=True,errors='coerce')
          assert list(built.columns)==list(full.columns)
          assert_frame_equal(built,full,check_exact=True,check_dtype=False)

          # 3) M1 availability audit for every NY session represented in the frozen ledger.
          es=importlib.util.spec_from_file_location('v01',Path('xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py'))
          v01=importlib.util.module_from_spec(es);sys.modules[es.name]=v01;es.loader.exec_module(v01)
          files=Path('/tmp/all_files.txt').read_text().splitlines()
          raw=v01.load_raw(files)
          rt=pd.DatetimeIndex(pd.to_datetime(raw.time,utc=True).drop_duplicates())
          present=set(rt.view('int64').tolist())
          sessions=sorted(full.session_date_ny.astype(str).unique().tolist()+load_csv(canon/'E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz').session_date_ny.astype(str).unique().tolist())
          sessions=sorted(set(sessions))
          rows=[]
          for ds in sessions:
              start=pd.Timestamp(f'{ds} 08:00:00',tz='America/New_York').tz_convert('UTC')
              expected=pd.date_range(start,periods=540,freq='min')
              missing=[t for t in expected if t.value not in present]
              rows.append({'session_date_ny':ds,'expected_m1':540,'missing_m1':len(missing),'first_missing_utc':missing[0].isoformat() if missing else None,'last_missing_utc':missing[-1].isoformat() if missing else None})
          gaps=pd.DataFrame(rows)
          dev_dates=set(full.session_date_ny.astype(str));rep_dates=set(sessions)-dev_dates
          def part(dates):
              g=gaps[gaps.session_date_ny.isin(dates)]
              return {'sessions':int(len(g)),'expected_m1':int(g.expected_m1.sum()),'missing_m1':int(g.missing_m1.sum()),'sessions_with_missing':int((g.missing_m1>0).sum()),'max_missing_in_session':int(g.missing_m1.max()) if len(g) else 0}
          out={
            'status':'SECOND_PRO_ADDITIONAL_OUTCOME_BLIND_QA_PASS',
            'future_price_outcomes_used':False,
            'canonical_run_id':int(os.environ['CANONICAL_RUN_ID']),
            'dev_prefix_cutoff_utc':cut.isoformat(),
            'dev_provenance_rows_compared':int(len(pref)),
            'dev_feature_rows_compared':int(len(built)),
            'dev_provenance_prefix_invariance_exact':True,
            'dev_episode_feature_prefix_invariance_exact':True,
            'm1_availability':{'all':part(set(sessions)),'dev':part(dev_dates),'replication':part(rep_dates)},
            'missing_minutes_rule':'missing M1 opens are skipped as unavailable bars; counts are reported here before outcomes',
            'real_outcome_generation':'FORBIDDEN',
            'real_outcome_reading':'FORBIDDEN'
          }
          Path('/tmp/results/SECOND_PRO_ADDITIONAL_OUTCOME_BLIND_QA.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: e-display-second-pro-additional-outcomeblind-qa
          if-no-files-found: error
          retention-days: 90
          path: /tmp/results/SECOND_PRO_ADDITIONAL_OUTCOME_BLIND_QA.json
