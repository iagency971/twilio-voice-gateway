name: MNQ Yahoo QA V1.1 Only
on:
  push:
    branches: [agent/mnq-12model-yahoo-forward-v1]
    paths: ['mnq-12model-yahoo/qa_bridge_only_v1_1.py','.github/workflows/mnq-yahoo-qa-v1-1-only.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/mnq-12model-yahoo-forward-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas requests
      - name: Run QA only
        shell: bash
        run: |
          set +e
          python mnq-12model-yahoo/qa_bridge_only_v1_1.py 2>&1 | tee mnq-12model-yahoo/results/qa_v1_1_only/run.log
          echo ${PIPESTATUS[0]} > mnq-12model-yahoo/results/qa_v1_1_only/exit_code.txt
          exit 0
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-12model-yahoo/results/qa_v1_1_only
          git commit -m "Publish Yahoo bridged QA V1.1 only [skip ci]" || true
          git push origin HEAD:agent/mnq-12model-yahoo-forward-v1
