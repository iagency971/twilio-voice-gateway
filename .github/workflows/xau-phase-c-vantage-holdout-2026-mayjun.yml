name: XAU Phase C Vantage RAW Holdout May-Jun 2026
# diagnostic trigger only; scientific parameters unchanged
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-phase-c-vantage-holdout-2026-mayjun.yml'
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Publish STARTED marker
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,json,os,requests
          path='xau-final-results/phase_c_vantage_holdout_2026_mayjun/status.json'
          data=json.dumps({'status':'STARTED','source_commit':os.environ.get('GITHUB_SHA')},indent=2).encode()
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          body={'message':'mark Vantage holdout STARTED [skip ci]','content':base64.b64encode(data).decode(),'branch':os.environ['BRANCH']}
          if sha:body['sha']=sha
          requests.put(u,headers=h,json=body).raise_for_status()
          PY
      - name: Install dependencies
        id: deps
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: Frozen tests
        id: tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_vantage_overlay.py xau-multiyear/tests/test_entries_v1.py xau-multiyear/tests/test_entries_v2.py xau-multiyear/tests/test_entries_s1.py
      - name: Acquire warmup target and June-30 post-window
        id: acquire
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2025-05 --to-month 2026-06 --out /tmp/xau_holdout.csv
      - name: Run unchanged corrected Vantage surface
        id: runmodel
        run: python xau-multiyear/scripts/run_phase_c_vantage_raw.py /tmp/xau_holdout.csv --target-start 2026-05-01 --target-end 2026-06-30 --out /tmp/holdout
      - name: Apply frozen survivor-only holdout gate and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,requests,pandas as pd
          out=pathlib.Path('/tmp/holdout'); s=pd.read_csv(out/'summary.csv'); m=json.load(open(out/'manifest.json'))
          clean=(s['sample']=='DOZ_OBJECTIVE_ONLY')&(s.entry_model=='CLEAN_REJECTION')&(s.risk_rule=='STRUCTURAL')&s.target_r.isin([0.5,1.0,1.5,2.0,2.5,3.0])
          tno=((s['sample']=='DOZ_OBJECTIVE_ONLY')&(s.entry_model=='TOUCH_NEXT_OPEN')&(((s.risk_rule=='VOL_FLOOR_0.50')&(s.target_r==2.5))|((s.risk_rule=='VOL_FLOOR_0.75')&(s.target_r==3.0))))
          h=s[clean|tno].copy().sort_values(['scenario','entry_model','target_r'])
          assert len(h)==32, len(h)
          assert set(h.scenario)=={'S10_C6','S11_C6_PRIMARY','S12_C6','S18_C9_STRESS'}
          p=h[h.scenario=='S11_C6_PRIMARY']; st=h[h.scenario=='S18_C9_STRESS']; pc=p[p.entry_model=='CLEAN_REJECTION']; sc=st[st.entry_model=='CLEAN_REJECTION']
          gate={'target_start':'2026-05-01T00:00:00Z','target_end':'2026-06-30T00:00:00Z','target_events':int(m['target_events']),'clean_rejection_trades_per_cell':int(pc.trades.iloc[0]) if len(pc) else 0,'primary_positive_rr_cells':int((pc.avg_net_R>0).sum()),'primary_median_net_R_across_rr':float(pc.avg_net_R.median()),'stress_positive_rr_cells':int((sc.avg_net_R>0).sum()),'stress_median_net_R_across_rr':float(sc.avg_net_R.median()),'gate_A_primary':bool((pc.avg_net_R>0).sum()>=4 and pc.avg_net_R.median()>0),'gate_B_stress':bool((sc.avg_net_R>0).sum()>=3 and sc.avg_net_R.median()>=0),'gate_C_trade_count_disclosure':int(pc.trades.iloc[0]) if len(pc) else 0,'clean_rejection_family_pass':bool((pc.avg_net_R>0).sum()>=4 and pc.avg_net_R.median()>0 and (sc.avg_net_R>0).sum()>=3 and sc.avg_net_R.median()>=0),'touch_next_open_primary_positive_cells':int((p[p.entry_model=='TOUCH_NEXT_OPEN'].avg_net_R>0).sum()),'interpretation':'Frozen eight survivors only; no cell promotion from holdout.'}
          h.to_csv(out/'survivors_holdout.csv',index=False); json.dump(gate,open(out/'gate.json','w'),indent=2)
          files={'xau-final-results/phase_c_vantage_holdout_2026_mayjun/survivors_holdout.csv':out/'survivors_holdout.csv','xau-final-results/phase_c_vantage_holdout_2026_mayjun/gate.json':out/'gate.json','xau-final-results/phase_c_vantage_holdout_2026_mayjun/manifest.json':out/'manifest.json'}
          H={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for path,src in files.items():
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=H,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish frozen Vantage holdout {src.name} [skip ci]','content':base64.b64encode(src.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              requests.put(u,headers=H,json=body).raise_for_status()
          status=json.dumps({'status':'COMPLETED','source_commit':os.environ.get('GITHUB_SHA')},indent=2).encode(); path='xau-final-results/phase_c_vantage_holdout_2026_mayjun/status.json'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=H,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None; body={'message':'mark Vantage holdout COMPLETED [skip ci]','content':base64.b64encode(status).decode(),'branch':os.environ['BRANCH']};
          if sha:body['sha']=sha
          requests.put(u,headers=H,json=body).raise_for_status()
          print(json.dumps(gate,indent=2))
          PY
      - name: Publish FAILED marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
          DEPS: ${{ steps.deps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          ACQUIRE: ${{ steps.acquire.outcome }}
          RUNMODEL: ${{ steps.runmodel.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import base64,json,os,requests
          data=json.dumps({'status':'FAILED','source_commit':os.environ.get('GITHUB_SHA'),'steps':{'deps':os.environ.get('DEPS'),'tests':os.environ.get('TESTS'),'acquire':os.environ.get('ACQUIRE'),'runmodel':os.environ.get('RUNMODEL'),'publish':os.environ.get('PUBLISH')}},indent=2).encode(); path='xau-final-results/phase_c_vantage_holdout_2026_mayjun/status.json'; h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None; body={'message':'mark Vantage holdout FAILED [skip ci]','content':base64.b64encode(data).decode(),'branch':os.environ['BRANCH']};
          if sha:body['sha']=sha
          requests.put(u,headers=h,json=body).raise_for_status()
          PY
