name: XAU Z4 Break Retrace E1-E3 Asia Europe No Score v1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-break-retrace-e123-asia-europe-noscore-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  FROZEN_US_STUDY_RUN_ID: '33139524456'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Frozen prereg and code guards
        shell: bash
        run: |
          set -euo pipefail
          test -s xau-wick-zone-pro/session-research/XAUUSD_Z4_BREAK_RETRACE_E123_ASIA_EUROPE_NO_SCORE_PREREG_v1_0_2026-08-28.md
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_z4_break_retrace_e123_rejection_v1_0.py)" = "7862638917015838948001a374f9bea7dba83e07"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py)" = "bfb0d65efce0f5773b2045eaf4c31ed6bc07740f"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py)" = "ef45037d2a99a705ddf9bfbc3ebc666f88119a80"
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py)" = "536ff1fccf766184d7a61f4a2813b15f2fa79e5c"
          python -m py_compile xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py
          echo SESSION_STUDY_PREFLIGHT_PASS

      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1

      - name: Download exact regenerated frozen 24M C5 geometry from prior successful study run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_US_STUDY_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true

      - name: Assemble and validate exact 24M causal C5 Z4 geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/results
          python - <<'PY'
          import glob,pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'))
          assert len(fs)==24,(len(fs),fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z')
          assert z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z')
          assert set(z.columns)=={'time','landmark_i','center','zlo','zhi','side'},z.columns.tolist()
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl')
          print('FROZEN_C5_24M_REUSE_PASS',len(z),z.time.nunique(),z.time.min(),z.time.max())
          PY

      - name: Acquire exact continuous 24M BID M1 source and verify all hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.load(open(os.environ['MANIFEST']))
          fs=[x for x in m['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07']
          assert len(fs)==24,len(fs)
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/raw')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==x['sha256'],(p.name,got,x['sha256'])
          print('RAW_24M_HASH_PASS',len(fs))
          PY

      - name: Run ASIA_BROAD 18-03 no-score structural study
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py \
            --session ASIA_BROAD --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output /tmp/results/ASIA_BROAD_RESULT.json \
            --episodes-csv /tmp/results/ASIA_BROAD_EPISODES.csv.gz \
            --contacts-csv /tmp/results/ASIA_BROAD_CONTACTS.csv.gz \
            --trades-csv /tmp/results/ASIA_BROAD_TRADES.csv.gz

      - name: Run ASIA_CORE_STANDALONE 21-03 no-score structural study
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py \
            --session ASIA_CORE_STANDALONE --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output /tmp/results/ASIA_CORE_STANDALONE_RESULT.json \
            --episodes-csv /tmp/results/ASIA_CORE_STANDALONE_EPISODES.csv.gz \
            --contacts-csv /tmp/results/ASIA_CORE_STANDALONE_CONTACTS.csv.gz \
            --trades-csv /tmp/results/ASIA_CORE_STANDALONE_TRADES.csv.gz

      - name: Run EUROPE 03-08 no-score structural study
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py \
            --session EUROPE --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output /tmp/results/EUROPE_RESULT.json \
            --episodes-csv /tmp/results/EUROPE_EPISODES.csv.gz \
            --contacts-csv /tmp/results/EUROPE_CONTACTS.csv.gz \
            --trades-csv /tmp/results/EUROPE_TRADES.csv.gz

      - name: Build combined preregistered decision table
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          names=['ASIA_BROAD','ASIA_CORE_STANDALONE','EUROPE']
          out={'status':'ASIA_EUROPE_NO_SCORE_STRUCTURAL_STUDY_COMPLETE','sessions':{},'production_authorization':'NONE'}
          for n in names:
              r=json.load(open(f'/tmp/results/{n}_RESULT.json'))
              s={}
              for w in ['H1','H2']:
                  b=r['results'][w]
                  x=r['prespecified_session_diagnostics'][w]
                  s[w]={
                    'all':{
                      'executed_trades':b['executed_trades'],'TP_FIRST':b['TP_FIRST'],'INVALIDATION_FIRST':b['INVALIDATION_FIRST'],
                      'NEITHER':b['NEITHER'],'AMBIGUOUS':b['AMBIGUOUS'],'terminal_tp_rate':b['terminal_tp_rate'],
                      'expectancy_R_before_costs':x['all_terminal_structural_R']['expectancy_R_before_costs'],
                      'profit_factor_R':x['all_terminal_structural_R']['profit_factor_R']},
                    'ABOVE_MAIN':x['by_e_main_relation_terminal_R']['ABOVE_MAIN'],
                    'by_entry_rank':x['by_entry_rank_terminal_R'],
                    'by_relation':x['by_e_main_relation_terminal_R'],
                    'by_trigger_subperiod':x['by_trigger_subperiod_terminal_R'],
                  }
              s['ABOVE_MAIN_directional_replication_gate']=r['prespecified_session_diagnostics']['ABOVE_MAIN_directional_replication_gate']
              out['sessions'][n]=s
          Path('/tmp/results/ASIA_EUROPE_COMBINED_DECISION.json').write_text(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          PY

      - name: Build immutable evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/results')
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir())}
          man={'status':'ASIA_EUROPE_NO_SCORE_EVIDENCE_RECORDED','files':files,'production_authorization':'NONE'}
          (root/'ASIA_EUROPE_MANIFEST.json').write_text(json.dumps(man,indent=2))
          print(json.dumps(man,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: z4-break-retrace-e123-asia-europe-noscore-v1
          path: /tmp/results/*
          retention-days: 30
