name: XAU Z4 Revisit Score DEV Percentile Map

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-score-map.yml'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1
      - name: Download hash-locked DEV BID Jan-Jul 2024
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/bid
          declare -A H
          H[01]=7414d1cf6a02cf4fff5347e79602e9109549622cb73b152e5462188cc797135d
          H[02]=45060c59ccfc0ef3d5f78b49d793b7e3f97757a7659c604b887850068346621f
          H[03]=28c82e54e1bd7f586f5d22c0c39d9217618f62e8dfdd7eab94602c2c2bb81a14
          H[04]=ce55b0d9acdf20c694c37e3c53233455cc8b772269eb39f60357808abe37b9c9
          H[05]=18084ecf8e9d5cef352cc290a55de29f27f006653b5da24a6520f8a02488f4f6
          H[06]=f7cad6452e9666b37f6f7830bb69a61439095919bb1609daa80839fdb3a8fd39
          H[07]=a1c432b64a36118f1934c9c838cee83c1f05181fbfd602452fd3d46acdd4fd52
          for m in 01 02 03 04 05 06 07; do
            f="xauusd_bid_m1_2024_${m}.csv"; curl --fail --location --retry 5 "https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/${f}" -o "/tmp/xau/bid/${f}"
            test "$(sha256sum /tmp/xau/bid/${f}|awk '{print $1}')" = "${H[$m]}"
          done
      - name: Build exact frozen Z4 DEV dataset
        run: python xau-wick-zone-pro/xau_zone_episode_dev_z4.py --files /tmp/xau/bid/*.csv --output /tmp/Z4_DEV_SCORE_MAP.pkl --tag Z4_DEV_SCORE_MAP
      - name: Freeze percentile map
        run: python xau-wick-zone-pro/xau_wick_zone_score_map.py --pkl /tmp/Z4_DEV_SCORE_MAP.pkl --frozen-json xau-wick-zone-pro/results/XAUUSD_Z4_FROZEN_MODEL_PARAMS_v0_1.json --output /tmp/XAUUSD_Z4_REVISIT_SCORE_MAP_v0_1.json
      - name: Publish retry-safe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-wick-zone-pro-dev
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,time,urllib.error,urllib.request
          path='xau-wick-zone-pro/results/XAUUSD_Z4_REVISIT_SCORE_MAP_v0_1.json'; src='/tmp/XAUUSD_Z4_REVISIT_SCORE_MAP_v0_1.json'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          for attempt in range(8):
              body={'message':'publish frozen DEV Revisit Score percentile map [skip ci]','content':base64.b64encode(open(src,'rb').read()).decode(),'branch':os.environ['BRANCH']}
              try:
                  req0=urllib.request.Request(url+'?ref='+os.environ['BRANCH'],headers=h)
                  with urllib.request.urlopen(req0,timeout=30) as r: existing=json.load(r)
                  body['sha']=existing['sha']
              except urllib.error.HTTPError as e:
                  if e.code!=404: raise
              try:
                  req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=h,method='PUT')
                  with urllib.request.urlopen(req,timeout=60) as r:
                      print('published',r.status); break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt==7: raise
                  print('transient conflict, retry',attempt+1); time.sleep(2+attempt)
          PY
