name: XAU COMEX DEV_RANK1 DUAL Routing QA

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-dual-routing-qa.yml']

permissions:
  actions: read
  contents: write

jobs:
  routing_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - name: Install DBN decoder and analysis dependencies
        run: python -m pip install pandas==2.2.3 numpy databento requests

      - name: Download successful DEV_RANK1 acquisition artifacts — GitHub only
        uses: actions/download-artifact@v4
        with:
          pattern: comex-dev-rank1-dual-*
          path: /tmp/new
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Recover successful early artifact 06610 explicitly — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-06610cec170650590cd663ca
          path: /tmp/new
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Recover successful early artifact 010384 explicitly — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-01038430e355d65828fbe711
          path: /tmp/new
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Locate paid pilot raw artifact — GitHub only
        id: locate_pilot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          runs=requests.get(f"{base}/actions/workflows/xau-comex-v4-pilot12-metadata.yml/runs",headers=h,params={'branch':'agent/xau-comex-acquisition-plan','status':'success','per_page':50}).json().get('workflow_runs',[])
          found=None
          for r in runs:
              arts=[]
              for page in range(1,4):
                  z=requests.get(f"{base}/actions/runs/{r['id']}/artifacts",headers=h,params={'per_page':100,'page':page}).json().get('artifacts',[])
                  arts += z
                  if len(z)<100: break
              if any(a['name']=='comex-v4-pilot12-raw-and-qa' and not a.get('expired') for a in arts):
                  found=r['id'];break
          if not found: raise SystemExit('paid pilot raw artifact not found')
          print(f'run_id={found}')
          PY

      - name: Download paid pilot raw artifact — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-v4-pilot12-raw-and-qa
          path: /tmp/pilot
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ steps.locate_pilot.outputs.run_id }}

      - name: Download canonical XAU event artifact — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32102932187

      - name: Build raw QA and causal DUAL routing — no Databento API key
        run: |
          python xau-multiyear/scripts/build_comex_dev_rank1_dual_routing_qa.py \
            --new-root /tmp/new \
            --pilot-root /tmp/pilot \
            --requests xau-final-results/comex_dev_rank1_dual_manifest_v1/dev_rank1_dual_requests.csv \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --mapping xau-final-results/comex_dev_rank1_gate_v1/frozen_session_mapping_all.csv \
            --events /tmp/plan/canonical_events_all.csv.gz \
            --out /tmp/routing

      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-dual-routing-qa-v1
          path: /tmp/routing/
          retention-days: 90

      - name: Publish compact routing QA only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/routing');root='xau-final-results/comex_dev_rank1_dual_routing_qa_v1'
          keep=['dual_routing_qa_summary.json','raw_tape_qa.csv','dual_session_routing_qa.csv','routing_by_model.csv']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in keep:
              p=src/name
              if not p.exists():raise SystemExit(f'missing output {name}')
              path=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish DEV_RANK1 DUAL routing QA {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
