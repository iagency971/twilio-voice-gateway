name: NQ v12 ORB July Holdout V1

on:
  push:
    branches: [agent/nq-v12-orb-july-holdout-v1]
    paths:
      - 'nq-propf/**'
      - '.github/workflows/nq-v12-orb-july-holdout-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nq-v12-orb-july-holdout-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests tzdata
      - name: Run frozen July holdout
        shell: bash
        run: |
          set +e
          rm -rf nq-propf/results/v12_orb_july_holdout_v1
          mkdir -p nq-propf/results/v12_orb_july_holdout_v1
          python nq-propf/run_nq_v12_orb_july_holdout_v1.py 2>&1 | tee nq-propf/results/v12_orb_july_holdout_v1/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > nq-propf/results/v12_orb_july_holdout_v1/exit_code.txt
          if [ "$code" -ne 0 ]; then
            echo "NQ_V12_ORB_JULY_HOLDOUT_V1_FAILURE exit_code=$code" > nq-propf/results/v12_orb_july_holdout_v1/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Print result
        if: always()
        run: |
          if [ -f nq-propf/results/v12_orb_july_holdout_v1/RESULT.json ]; then
            cat nq-propf/results/v12_orb_july_holdout_v1/RESULT.json
          fi
      - name: Publish result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nq-propf/results/v12_orb_july_holdout_v1
          git commit -m "Publish NQ v12 July holdout result [skip ci]" || true
          git push origin HEAD:agent/nq-v12-orb-july-holdout-v1
