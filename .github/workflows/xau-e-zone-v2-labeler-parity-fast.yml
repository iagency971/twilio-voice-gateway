name: XAU E-zone V2 labeler indexed parity fast gate

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - .github/workflows/xau-e-zone-v2-labeler-parity-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        shell: bash
        run: python -m pip install --disable-pip-version-check -r xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2/requirements-lock.txt
      - name: Legacy versus indexed label parity
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2/test_xau_e_zone_v2.py
