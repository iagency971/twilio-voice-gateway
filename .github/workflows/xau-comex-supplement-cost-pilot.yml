name: XAU COMEX Supplement Cost Pilot
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-supplement-cost-pilot.yml']
permissions:
  actions: read
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - run: python -m pip install pandas==2.2.3 databento
      - uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32102932187
      - name: Build supplements and quote stratified deterministic pilot
        run: |
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import pandas as pd, databento as db
          NY=ZoneInfo('America/New_York'); SEED='COMEX_SUPPLEMENT_V1_SEED_971'; c=db.Historical(os.environ['DATABENTO_API_KEY'])
          e=pd.read_csv('/tmp/plan/canonical_events_all.csv.gz',compression='gzip',low_memory=False); s=pd.read_csv('/tmp/plan/session_candidates_all.csv'); s['panel_rank']=pd.to_numeric(s.panel_rank,errors='coerce')
          ct=pd.to_datetime(e.contact_time,utc=True); e['research_trading_date']=(ct.dt.tz_convert(NY)-pd.Timedelta(hours=17)).dt.date.astype(str)
          fam=e.constituent_families.fillna(''); order=['DISPLACEMENT_ORIGIN','OBJECTIVE_LIQUIDITY','MEMORY','FVG']; e['signature']=['+'.join([z for z in order if z in x]) or 'OTHER' for x in fam]; e['h']=[hashlib.sha256(f'{SEED}|{u}'.encode()).hexdigest() for u in e.event_uid]
          pure_targets={'DEV':2000,'VALIDATION':1000,'COMEX_FEATURE_HOLDOUT':1000}; conf_targets={'DEV':1500,'VALIDATION':750,'COMEX_FEATURE_HOLDOUT':750}; pure={'DISPLACEMENT_ORIGIN','OBJECTIVE_LIQUIDITY','MEMORY'}; abundant={'DISPLACEMENT_ORIGIN+FVG','OBJECTIVE_LIQUIDITY+FVG','MEMORY+FVG'}
          def snap10(t,ceil=False):
              t=pd.Timestamp(t); t=t.tz_convert('UTC') if t.tzinfo else t.tz_localize('UTC'); ns=600*10**9; v=t.value; w=((v+ns-1)//ns*ns) if ceil else (v//ns*ns); return pd.Timestamp(w,tz='UTC')
          def merge(iv,gap=30):
              if not iv:return []
              a=sorted(iv); o=[]; s0,e0=a[0]; gd=pd.Timedelta(minutes=gap)
              for s1,e1 in a[1:]:
                  if s1<=e0+gd:e0=max(e0,e1)
                  else:o.append((s0,e0));s0,e0=s1,e1
              o.append((s0,e0));return o
          def build(tier):
              covered=set(s.loc[s.panel_rank<=tier,'research_trading_date'].astype(str)); sel=e[e.research_trading_date.isin(covered)]; pieces=[]
              outside=e[~e.research_trading_date.isin(covered)]
              for (sp,sig),g in outside.groupby(['temporal_split','signature']):
                  already=int(((sel.temporal_split==sp)&(sel.signature==sig)).sum())
                  if sig in {'FVG','OTHER'}:n=0
                  elif sig in pure:n=max(0,pure_targets.get(sp,0)-already)
                  elif sig in abundant:n=max(0,conf_targets.get(sp,0)-already)
                  else:n=len(g)
                  if n:pieces.append(g.sort_values('h').head(n))
              sup=pd.concat(pieces,ignore_index=True) if pieces else outside.iloc[:0]
              iv=[(snap10(pd.Timestamp(t)-pd.Timedelta(minutes=30)),snap10(pd.Timestamp(t)+pd.Timedelta(minutes=16),True)) for t in pd.to_datetime(sup.contact_time,utc=True)]
              return sup,merge(iv,30)
          def quote(z):
              a,b=z; err=None
              for k in range(7):
                  try:return float(c.metadata.get_cost(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema='trades',start=a.isoformat(),end=b.isoformat())),None
                  except Exception as ex:err=str(ex);time.sleep(min(20,2**k))
              return None,err
          results=[]
          for tier in [2,3,4]:
              sup,iv=build(tier); frame=pd.DataFrame(iv,columns=['start','end']); frame['year']=frame.start.dt.year; frame['hash']=[hashlib.sha256(f'PILOT971|{a}|{b}'.encode()).hexdigest() for a,b in iv]
              sample=frame.sort_values('hash').groupby('year',group_keys=False).head(50).copy()
              vals=[]; errs=[]
              with ThreadPoolExecutor(max_workers=2) as ex:
                  fut={ex.submit(quote,(r.start,r.end)):i for i,r in sample.iterrows()}
                  for f in as_completed(fut):
                      x,er=f.result();
                      if er:errs.append(er)
                      else:vals.append((fut[f],x))
              if errs:raise SystemExit(f'{len(errs)} pilot metadata failures')
              mp=dict(vals); sample['cost_usd']=[mp[i] for i in sample.index]
              by=[]; est=0.0
              for y,g in frame.groupby('year'):
                  q=sample[sample.year==y]; mu=float(q.cost_usd.mean()); n=len(g); est+=mu*n; by.append({'year':int(y),'windows':n,'sampled':len(q),'mean_sample_cost':mu,'estimated_cost':mu*n})
              results.append({'session_tier':tier,'supplement_events':len(sup),'merged_windows':len(iv),'sample_windows':len(sample),'estimated_supplement_cost_usd':est,'by_year':by})
          out={'schema':'trades','source_run':32102932187,'pilot_only':True,'rows':results,'download_performed':False}; Path('/tmp/supplement_cost_pilot.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          p=pathlib.Path('/tmp/supplement_cost_pilot.json'); path='xau-final-results/comex_acquisition_plan_v1/supplement_cost_pilot.json'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None; b={'message':'publish COMEX supplement cost pilot [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']};
          if sha:b['sha']=sha
          r=requests.put(u,headers=h,json=b); r.raise_for_status()
          PY
