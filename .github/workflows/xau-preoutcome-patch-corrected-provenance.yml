name: XAU Preoutcome Patch Corrected Provenance

on:
  push:
    branches: [agent/xau-preoutcome-status]
    paths:
      - 'xau-recovery/PREOUTCOME_PATCH_CORRECTED_PROVENANCE_TRIGGER.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
          fetch-depth: 0
      - name: Patch protocol and builder with corrected guarded provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          protocol=Path('xau-multiyear/docs/COMEX_DEV_RANK1_NATIVE_REACTION_PROTOCOL_v1.md')
          p=protocol.read_text()
          old="The final provenance must reconcile to the dedicated zero QA: 92 source sessions, 91 positive source-final30 windows, one missing window, zero flat-present windows, sole missing source date `2013-12-25`, affecting exactly one defined-approach early event. Any discrepancy closes W15 until resolved outcome-blind."
          new="""The final provenance must reconcile to both the recoverable full guarded zero-QA artifact and a fresh reconstruction from the already-owned canonical source raw artifacts: 92 source sessions, 87 positive source-final30 windows, five missing windows, zero flat-present windows. The missing source dates are exactly `2011-07-04`, `2011-11-24`, `2012-11-23`, `2014-06-13`, and `2015-04-01`. Among contacts sourced from those dates, exactly three defined-approach events are in the early branch and therefore actually require source-final30: `8b282f806357a5b0d94b6359` (`2011-07-04`, minute 0), `3fbeb0c82e6201099ba1b73d` (`2011-11-24`, minute 0), and `e300d541f2330b5cd3245ce1` (`2011-11-24`, minute 0). Each receives `FALLBACK_COVARIATE_MISSING_SOURCE_LAST30` and is primary-control ineligible without imputation. The other contacts from missing-window source dates are mature and do not use source-final30. This provenance correction applies the already-approved generic missing-covariate rule; it does not alter the matching method. Canonical correction checkpoint: `CHECKPOINT_COMEX_NATIVE_REACTION_SOURCE_LAST30_PROVENANCE_CORRECTION_2026-08-19.md`. Any future discrepancy closes W15 until resolved outcome-blind."""
          if p.count(old)!=1: raise SystemExit(f'protocol stale block count={p.count(old)}')
          protocol.write_text(p.replace(old,new))

          builder=Path('xau-multiyear/scripts/build_comex_native_reaction_preoutcome_final_v1.py')
          s=builder.read_text()

          old_reconcile='''    ok = (\n        summary["source_sessions_total"] == 92 == summary["expected_source_sessions_total"] and\n        summary["source_last30_positive_sessions"] == 91 == summary["expected_positive_sessions"] and\n        summary["source_last30_missing_sessions"] == 1 == summary["expected_missing_sessions"] and\n        summary["source_last30_flat_sessions"] == 0 == summary["expected_flat_sessions"] and\n        summary["nonpositive_source_dates"] == ["2013-12-25"] == summary["expected_nonpositive_source_dates"]\n    )'''
          new_reconcile='''    expected_dates = ["2011-07-04", "2011-11-24", "2012-11-23", "2014-06-13", "2015-04-01"]\n    summary["canonical_zero_qa_version"] = str(z.get("version", ""))\n    summary["expected_affected_early_fallback_events"] = int(z.get("affected_early_fallback_events", -1))\n    ok = (\n        summary["source_sessions_total"] == summary["expected_source_sessions_total"] == 92 and\n        summary["source_last30_positive_sessions"] == summary["expected_positive_sessions"] == 87 and\n        summary["source_last30_missing_sessions"] == summary["expected_missing_sessions"] == 5 and\n        summary["source_last30_flat_sessions"] == summary["expected_flat_sessions"] == 0 and\n        summary["nonpositive_source_dates"] == summary["expected_nonpositive_source_dates"] == expected_dates and\n        summary["expected_affected_early_fallback_events"] == 3\n    )'''
          if s.count(old_reconcile)!=1: raise SystemExit(f'builder reconcile stale block count={s.count(old_reconcile)}')
          s=s.replace(old_reconcile,new_reconcile)

          old_bad='''    bad = E[(E.matching_branch == "EARLY_SOURCE_LAST30") & E.approach_defined & ~E.source_last30_positive]\n    if len(bad) != 1 or str(bad.iloc[0].source_research_date) != "2013-12-25":\n        raise SystemExit(f"expected sole early missing source-last30 event on 2013-12-25, got {bad[['level_id','source_research_date']].to_dict('records')}")'''
          new_bad='''    bad = E[(E.matching_branch == "EARLY_SOURCE_LAST30") & E.approach_defined & ~E.source_last30_positive].copy()\n    expected_bad = {\n        ("8b282f806357a5b0d94b6359", "2011-07-04"),\n        ("3fbeb0c82e6201099ba1b73d", "2011-11-24"),\n        ("e300d541f2330b5cd3245ce1", "2011-11-24"),\n    }\n    got_bad = set(zip(bad.level_id.astype(str), bad.source_research_date.astype(str)))\n    if got_bad != expected_bad:\n        raise SystemExit(f"early missing source-last30 set mismatch: expected={sorted(expected_bad)} got={sorted(got_bad)}")\n    if bad.primary_control_eligible.map(pb).any():\n        raise SystemExit("early missing source-last30 event incorrectly marked primary-control eligible")\n    if not bad.primary_control_exclusion_reason.astype(str).eq("FALLBACK_COVARIATE_MISSING_SOURCE_LAST30").all():\n        raise SystemExit("early missing source-last30 exclusion reason mismatch")'''
          if s.count(old_bad)!=1: raise SystemExit(f'builder early-missing stale block count={s.count(old_bad)}')
          s=s.replace(old_bad,new_bad)

          old_summary='''- source-last30 reconciliation: PASS (91 positive / 1 missing / 0 flat; sole missing `2013-12-25`)'''
          new_summary='''- source-last30 reconciliation: PASS ({reconciliation['source_last30_positive_sessions']} positive / {reconciliation['source_last30_missing_sessions']} missing / {reconciliation['source_last30_flat_sessions']} flat; missing dates: {', '.join(reconciliation['nonpositive_source_dates'])})'''
          if s.count(old_summary)!=1: raise SystemExit(f'builder summary stale block count={s.count(old_summary)}')
          s=s.replace(old_summary,new_summary)
          builder.write_text(s)

          print('PATCHED_CORRECTED_PROVENANCE_OK')
          PY
      - name: Verify stale claims removed and corrected hard guards present
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('xau-multiyear/docs/COMEX_DEV_RANK1_NATIVE_REACTION_PROTOCOL_v1.md').read_text()
          s=Path('xau-multiyear/scripts/build_comex_native_reaction_preoutcome_final_v1.py').read_text()
          assert '91 positive source-final30 windows' not in p
          assert 'sole missing source date `2013-12-25`' not in p
          assert 'source_last30_positive_sessions"] == summary["expected_positive_sessions"] == 87' in s
          assert 'source_last30_missing_sessions"] == summary["expected_missing_sessions"] == 5' in s
          for x in ['8b282f806357a5b0d94b6359','3fbeb0c82e6201099ba1b73d','e300d541f2330b5cd3245ce1']:
              assert x in s and x in p
          print('PATCH_VERIFICATION_OK')
          PY
      - name: Commit patched target files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xau-multiyear/docs/COMEX_DEV_RANK1_NATIVE_REACTION_PROTOCOL_v1.md xau-multiyear/scripts/build_comex_native_reaction_preoutcome_final_v1.py
          git commit -m 'apply corrected source-last30 provenance to final preoutcome freeze [skip ci]'
          git push origin HEAD:agent/xau-comex-acquisition-plan
