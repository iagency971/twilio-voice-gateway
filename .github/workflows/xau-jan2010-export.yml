name: XAU January 2010 Benchmark Export

on:
  push:
    branches:
      - agent/xau-run-a-transient
    paths:
      - 'xau-perf/**'
      - '.github/workflows/xau-jan2010-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas requests
      - run: python xau-perf/acquire_jan2010.py
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-jan2010-bidask-mid
          path: outputs/xau_jan2010/xauusd_bidask_mid_m1_2010-01.csv
          retention-days: 7
