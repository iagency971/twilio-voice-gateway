name: MNQ Databento CME Economics V1.1
on:
  push:
    branches: [agent/mnq-databento-cme-validation-v1]
    paths:
      - 'mnq-databento/economics_v1_1/**'
      - '.github/workflows/mnq-databento-cme-economics-v1-1.yml'
permissions:
  contents: write
jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mnq-databento-cme-validation-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pandas numpy databento matplotlib tabulate python-dotenv ib_insync
      - name: Run official CME economics from archived paid data
        shell: bash
        run: |
          set +e
          mkdir -p mnq-databento/results/cme_validation_v1_1
          python mnq-databento/economics_v1_1/run_economics_v1_1.py 2>&1 | tee mnq-databento/results/cme_validation_v1_1/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > mnq-databento/results/cme_validation_v1_1/exit_code.txt
          if [ "$code" -ne 0 ]; then
            echo "CME_V1_1_WORKFLOW_FAILURE exit_code=$code" > mnq-databento/results/cme_validation_v1_1/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-databento/results/cme_validation_v1_1
          git commit -m "Publish official CME economics V1.1 [skip ci]" || true
          git push origin HEAD:agent/mnq-databento-cme-validation-v1
