name: XAU Core Evidence Audit V1 2011-2025
on:
  push:
    branches: [agent/xau-core-evidence-audit-v1]
    paths:
      - '.github/workflows/xau-core-evidence-audit-v1.yml'
permissions:
  contents: write
jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: Frozen engine tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_vantage_overlay.py xau-multiyear/tests/test_entries_v1.py xau-multiyear/tests/test_entries_v2.py
      - name: Publish RUNNING marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,json,os,requests
          path='xau-final-results/xau_core_evidence_audit_v1/RUN_STATUS.json'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          payload=json.dumps({'status':'RUNNING','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'source_commit':os.environ.get('GITHUB_SHA'),'protocol':'XAU_CORE_EVIDENCE_AUDIT_PROTOCOL_v1_1'},indent=2).encode()
          body={'message':'mark XAU core evidence audit running [skip ci]','content':base64.b64encode(payload).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY

  annual:
    needs: precheck
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Resolve annual dates
        id: dates
        shell: bash
        run: |
          Y=${{ matrix.year }}
          echo "from=$((Y-1))-01" >> "$GITHUB_OUTPUT"
          echo "to=$((Y+1))-01" >> "$GITHUB_OUTPUT"
      - name: Rehydrate canonical annual input
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month ${{ steps.dates.outputs.from }} --to-month ${{ steps.dates.outputs.to }} --out /tmp/xau_core_audit_${{ matrix.year }}.csv
      - name: Reconstruct frozen core ledger and assert annual parity
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: xau-multiyear/src
        run: |
          python xau-multiyear/scripts/run_xau_core_audit_annual_v1.py /tmp/xau_core_audit_${{ matrix.year }}.csv \
            --year ${{ matrix.year }} \
            --expected-annual-summary xau-final-results/phase_c_vantage_raw_2011_2025/annual/${{ matrix.year }}_summary.csv \
            --out /tmp/core_audit_${{ matrix.year }}
      - name: Upload annual audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-core-audit-year-${{ matrix.year }}
          path: /tmp/core_audit_${{ matrix.year }}
          retention-days: 7
      - name: Enforce annual parity
        if: steps.audit.outcome != 'success'
        run: exit 1

  aggregate:
    if: always()
    needs: annual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Download all annual ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: xau-core-audit-year-*
          path: /tmp/core_annual
          merge-multiple: true
      - name: Aggregate frozen audit and diagnostics
        id: aggregate
        continue-on-error: true
        run: |
          python xau-multiyear/scripts/aggregate_xau_core_audit_v1.py \
            --annual-dir /tmp/core_annual \
            --survivors xau-final-results/phase_c_vantage_raw_2011_2025/survivors.csv \
            --out /tmp/core_final
      - name: Publish final audit outputs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,requests,time
          out=pathlib.Path('/tmp/core_final')
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          root='xau-final-results/xau_core_evidence_audit_v1'
          def put(path,data,msg):
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':msg,'content':base64.b64encode(data).decode(),'branch':os.environ['BRANCH']}
                  if sha: body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201): return
                  if r.status_code not in (409,422): r.raise_for_status()
                  time.sleep(1+attempt)
              raise RuntimeError(f'publish failed {path}')
          if out.exists():
              for p in sorted(out.iterdir()):
                  if p.is_file(): put(f'{root}/{p.name}',p.read_bytes(),f'publish XAU core audit {p.name} [skip ci]')
          status={'status':'COMPLETE' if (out/'audit_verdict.json').exists() else 'AGGREGATION_FAILED','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'source_commit':os.environ.get('GITHUB_SHA'),'aggregate_step_outcome':'${{ steps.aggregate.outcome }}'}
          put(f'{root}/RUN_STATUS.json',json.dumps(status,indent=2).encode(),'mark XAU core evidence audit complete [skip ci]')
          PY
      - name: Enforce aggregate execution
        if: steps.aggregate.outcome != 'success'
        run: exit 1
