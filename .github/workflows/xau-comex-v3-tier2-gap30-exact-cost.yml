name: XAU COMEX V3 Tier2 Gap30 Exact Cost
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v3-tier2-gap30-exact-cost.yml']
permissions:
  actions: read
  contents: write
jobs:
  quote-year:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 databento
      - uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/canonical
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32104889692
      - run: python xau-multiyear/scripts/build_comex_screening_package_v3.py --events /tmp/canonical/canonical_events_all.csv.gz --sessions /tmp/canonical/session_candidates_all.csv --out /tmp/v3 >/tmp/v3_build.log
      - name: Exact metadata quote year slice
        env: {YEAR: '${{ matrix.year }}'}
        run: |
          python - <<'PY'
          import json,os,time
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from pathlib import Path
          import pandas as pd,databento as db
          y=int(os.environ['YEAR']); c=db.Historical(os.environ['DATABENTO_API_KEY'])
          w=pd.read_csv('/tmp/v3/tier2_package_gap30.csv'); w['start']=pd.to_datetime(w.start,utc=True); w['end']=pd.to_datetime(w.end,utc=True); q=w[w.start.dt.year==y].reset_index(drop=True)
          def one(r):
              err=None
              for k in range(8):
                  try:return r.Index,float(c.metadata.get_cost(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema='trades',start=r.start.isoformat(),end=r.end.isoformat())),None
                  except Exception as ex:err=str(ex);time.sleep(min(20,1.5*(2**k)))
              return r.Index,None,err
          vals={};errs=[]
          with ThreadPoolExecutor(max_workers=2) as ex:
              fs=[ex.submit(one,r) for r in q.itertuples()]
              for f in as_completed(fs):
                  i,x,e=f.result(); errs.append(e) if e else vals.__setitem__(i,x)
          if errs:raise SystemExit(f'{y}: {len(errs)} metadata failures {errs[:2]}')
          out={'year':y,'schema':'trades','windows':len(q),'minutes':float(((q.end-q.start).dt.total_seconds()/60).sum()) if len(q) else 0.0,'cost_usd':float(sum(vals.values())),'download_performed':False}
          Path('/tmp/year_cost.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-tier2-gap30-cost-${{ matrix.year }}
          path: /tmp/year_cost.json
          retention-days: 30
  aggregate:
    needs: quote-year
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - run: python -m pip install databento
      - uses: actions/download-artifact@v4
        with:
          pattern: v3-tier2-gap30-cost-*
          path: /tmp/costs
      - name: Aggregate exact V3 cost
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import databento as db
          rows=sorted([json.loads(p.read_text()) for p in Path('/tmp/costs').rglob('year_cost.json')],key=lambda x:x['year']); assert len(rows)==16,len(rows)
          c=db.Historical(os.environ['DATABENTO_API_KEY']); base=dict(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',start='2010-06-06',end='2026-08-17')
          o=float(c.metadata.get_cost(schema='ohlcv-1m',**base)); b=float(c.metadata.get_cost(schema='bbo-1m',**base)); d=float(sum(r['cost_usd'] for r in rows)); total=o+b+d
          out={'version':'COMEX_V3_TIER2_GAP30_EXACT_COST_V1','package':'lean V3: tier2 sessions + family/confluence/acceptance supplements, gap30','year_rows':rows,'costs_usd':{'ohlcv_1m_full':o,'bbo_1m_full':b,'tier2_v3_package_trades':d,'total':total,'credit_125_remaining':125-total},'windows':sum(r['windows'] for r in rows),'minutes':sum(r['minutes'] for r in rows),'download_performed':False,'warning':'Metadata only; no market data download authorized or performed.'}
          Path('/tmp/exact.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Publish exact V3 quote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          p=pathlib.Path('/tmp/exact.json'); path='xau-final-results/comex_screening_package_v3/tier2_gap30_exact_cost.json'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          body={'message':'publish exact COMEX V3 metadata quote [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']};
          if sha:body['sha']=sha
          r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
