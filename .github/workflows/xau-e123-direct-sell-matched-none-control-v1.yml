name: XAU Direct E1-E3 SELL Matched Non-E Control v1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e123-direct-sell-matched-none-control-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  FROZEN_Z4_RUN_ID: '33139524456'
  TREATED_RUN_ID: '33193034282'

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        session: [US, ASIA_BROAD, ASIA_CORE_STANDALONE, EUROPE]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen preregistration and code guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object xau-wick-zone-pro/session-research/XAUUSD_E123_DIRECT_SELL_MATCHED_NONE_CONTROL_PREREG_v1_0_2026-08-28.md)" = "71f52ff66a4f44070e616746d41bfe3d155376fa"
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_v1_0.py)" = "b51be938006fa3d3193e52d257364cdd519c2bc4"
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_aggregate_v1_0.py)" = "3bd6402e8027d8315fddae237427fb8b2ab05361"
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_e123_direct_sell_between_above_z4_v1_0.py)" = "60e6783f8c4e530ae403fa298b8abf3959e08518"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py)" = "ef45037d2a99a705ddf9bfbc3ebc666f88119a80"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py)" = "bfb0d65efce0f5773b2045eaf4c31ed6bc07740f"
          python -m py_compile xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_v1_0.py
          python -m py_compile xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_aggregate_v1_0.py
          echo CONTROL_PREFLIGHT_PASS
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Download immutable treated direct-E evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.TREATED_RUN_ID }}
          pattern: direct-esell-${{ matrix.session }}
          path: /tmp/treated
          merge-multiple: true
      - name: Download exact frozen 24M C5 Z4 geometry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_Z4_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true
      - name: Assemble exact geometry and acquire hash-verified BID M1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/results
          python - <<'PY'
          import glob,hashlib,json,os,subprocess
          from pathlib import Path
          import pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl')); assert len(fs)==24,len(fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True); z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          assert set(z.columns)=={'time','landmark_i','center','zlo','zhi','side'},z.columns.tolist()
          assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z') and z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z')
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl')
          m=json.load(open(os.environ['MANIFEST']))
          rows=[x for x in m['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07']; assert len(rows)==24,len(rows)
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in rows:
              p=Path('/tmp/raw')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],p.name
          print('CONTROL_INPUT_QA_PASS',len(z),len(rows))
          PY
      - name: Run frozen matched non-E control
        shell: bash
        env:
          SESSION: ${{ matrix.session }}
        run: |
          set -euo pipefail
          test -s "/tmp/treated/${SESSION}_TRADES.csv.gz"
          python xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_v1_0.py \
            --session "$SESSION" --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --treated-csv "/tmp/treated/${SESSION}_TRADES.csv.gz" \
            --pairs-csv "/tmp/results/${SESSION}_PAIRS.csv.gz" \
            --controls-csv "/tmp/results/${SESSION}_CONTROL_CANDIDATES.csv.gz" \
            --output "/tmp/results/${SESSION}_CONTROL_RESULT.json"
      - name: Immutable evidence manifest
        shell: bash
        env:
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/results'); files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir())}
          (root/f"{os.environ['SESSION']}_CONTROL_MANIFEST.json").write_text(json.dumps({'session':os.environ['SESSION'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-esell-matched-control-${{ matrix.session }}
          path: /tmp/results/*
          retention-days: 30

  aggregate:
    needs: control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-esell-matched-control-*
          path: /tmp/evidence
          merge-multiple: true
      - name: Aggregate prespecified matched control and bootstrap
        shell: bash
        run: |
          set -euo pipefail; mkdir -p /tmp/final
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_aggregate_v1_0.py)" = "3bd6402e8027d8315fddae237427fb8b2ab05361"
          python xau-wick-zone-pro/session-research/xau_e123_direct_sell_matched_none_control_aggregate_v1_0.py \
            --root /tmp/evidence --output /tmp/final/DIRECT_ESELL_MATCHED_NONE_CONTROL_DECISION.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          e=Path('/tmp/evidence'); f=Path('/tmp/final')
          src={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(e.iterdir())}
          out={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(f.iterdir())}
          (f/'DIRECT_ESELL_MATCHED_NONE_CONTROL_MANIFEST.json').write_text(json.dumps({'source_files':src,'output_files':out},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-esell-matched-none-control-v1-final
          path: /tmp/final/*
          retention-days: 30
