name: US100 Zero-Data Native 12-Model V5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-native12-v5
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests matplotlib tabulate python-dotenv
      - name: Run frozen native 12-model V5 with execution parity acceleration
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/native_12model_port_v5
          python us100-zero-data/run_native_12model_port_v5_fast.py 2>&1 | tee us100-zero-data/results/native_12model_port_v5/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/native_12model_port_v5/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "NATIVE_12MODEL_V5_FAILURE exit_code=$code" > us100-zero-data/results/native_12model_port_v5/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/native_12model_port_v5/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V5 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/native_12model_port_v5
          git commit -m "Publish frozen native US100 12-model V5 results [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
