name: US100 Zero-Data Native 12-Model Drawdown Throttle V8

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-native12-v8
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen V8 drawdown-throttle selection and gated validation
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/native_12model_dd_throttle_v8
          python us100-zero-data/run_native_12model_dd_throttle_v8.py 2>&1 | tee us100-zero-data/results/native_12model_dd_throttle_v8/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/native_12model_dd_throttle_v8/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "NATIVE_12MODEL_V8_FAILURE exit_code=$code" > us100-zero-data/results/native_12model_dd_throttle_v8/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/native_12model_dd_throttle_v8/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V8 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/native_12model_dd_throttle_v8
          git commit -m "Publish frozen native US100 12-model V8 drawdown-throttle adaptation [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
