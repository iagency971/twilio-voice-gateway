name: XAU E V1 Pro pre-prospective execution gate QA

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-v1-pro-pre-prospective-execution-gate.yml'
  workflow_dispatch:

concurrency:
  group: xau-e-v1-pro-pre-prospective-execution-gate
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  BRANCH: agent/xau-wick-zone-pro-dev
  PKG: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  PLAN: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/prospective-planning-v1
  LIVE: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/prospective-live-v1
  SCHEDULER_PATH: .github/workflows/xau-e-v1-prospective-outcome-blind-collector.yml
  GATE_WORKFLOW_PATH: .github/workflows/xau-e-v1-pro-pre-prospective-execution-gate.yml
  GATE_ARTIFACT_NAME: xau-e-v1-pro-pre-prospective-execution-gate
  START_SESSION: '2026-08-31'
  START_UTC: '2026-08-31T12:00:00Z'
  PREDECESSOR_RUN_ID: '33278427735'
  PREDECESSOR_HEAD_SHA: 6f1dd0b787928dc53e7092d74fbe70995a79ab38
  PREDECESSOR_ARTIFACT_ID: '9722228990'
  PREDECESSOR_ARTIFACT_SHA256: 383e92bced5cf4f884f4933169ed5fd85dfe0ff0a57c238509dd9b970fe4d385

jobs:
  finalize-pro-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 2

      - name: Verify predecessor PASS evidence and materialize current immutable gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pro-gate-final
          python - <<'PY'
          import datetime
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          pkg = Path(os.environ['PKG'])
          plan = Path(os.environ['PLAN'])
          live = Path(os.environ['LIVE'])
          predecessor_run_id = int(os.environ['PREDECESSOR_RUN_ID'])
          predecessor_artifact_id = int(os.environ['PREDECESSOR_ARTIFACT_ID'])
          predecessor_head_sha = os.environ['PREDECESSOR_HEAD_SHA']
          expected_artifact_sha = os.environ['PREDECESSOR_ARTIFACT_SHA256']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent': 'xau-e-v1-pro-gate-finalizer',
          }

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def sha256_path(path):
              return sha256_bytes(Path(path).read_bytes())

          def git_blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          def api_json(url):
              return json.loads(
                  urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers), timeout=60
                  ).read()
              )

          def github_artifact_bytes(url):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              try:
                  opener.open(urllib.request.Request(url, headers=headers), timeout=60).read()
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get('Location')
                  if not location:
                      raise RuntimeError('artifact redirect missing Location') from exc
              else:
                  raise RuntimeError('artifact endpoint unexpectedly returned no redirect')
              return urllib.request.urlopen(
                  urllib.request.Request(
                      location,
                      headers={'User-Agent': 'xau-e-v1-pro-gate-finalizer'},
                  ),
                  timeout=120,
              ).read()

          now = datetime.datetime.now(datetime.timezone.utc)
          start = datetime.datetime.fromisoformat(os.environ['START_UTC'].replace('Z', '+00:00'))
          assert now < start, (now, start)
          assert not live.exists(), 'prospective live evidence exists before authorized start'

          run = api_json(f'https://api.github.com/repos/{repo}/actions/runs/{predecessor_run_id}')
          assert run['status'] == 'completed' and run['conclusion'] == 'failure', run
          assert run['path'] == os.environ['GATE_WORKFLOW_PATH'], run
          assert run['head_branch'] == os.environ['BRANCH'], run
          assert run['head_sha'] == predecessor_head_sha, run

          jobs = api_json(
              f'https://api.github.com/repos/{repo}/actions/runs/{predecessor_run_id}/jobs?per_page=100'
          )['jobs']
          assert len(jobs) == 1, jobs
          job = jobs[0]
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          required_success = [
              'Verify canonical R4 authority, artifact, frozen hashes and hardened default-branch scheduler',
              'Re-run frozen environment, synthetic, fail-closed and anti-peeking tests',
              'Materialize final Pro execution gate and immutable QA evidence',
              'Run actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
          ]
          for name in required_success:
              assert steps.get(name) == 'success', (name, steps.get(name))
          assert steps.get('Commit final Pro execution gate to the research branch') == 'failure', steps

          artifact_url = (
              f'https://api.github.com/repos/{repo}/actions/artifacts/'
              f'{predecessor_artifact_id}/zip'
          )
          artifact = github_artifact_bytes(artifact_url)
          assert sha256_bytes(artifact) == expected_artifact_sha, sha256_bytes(artifact)
          Path('/tmp/pro-gate-final/predecessor-gate-artifact.zip').write_bytes(artifact)

          with zipfile.ZipFile(io.BytesIO(artifact)) as zf:
              def unique_basename(name):
                  hits = [n for n in zf.namelist() if Path(n).name == name]
                  assert len(hits) == 1, (name, hits)
                  return zf.read(hits[0])

              old_gate_bytes = unique_basename(
                  'E_DISPLAY_EPISODE_V1_PRO_PRE_PROSPECTIVE_EXECUTION_GATE.json'
              )
              old_qa_bytes = unique_basename(
                  'PRO_PRE_PROSPECTIVE_EXECUTION_INDEPENDENT_QA.json'
              )

          gate = json.loads(old_gate_bytes)
          qa = json.loads(old_qa_bytes)
          assert gate['status'] == 'PRO_PRE_PROSPECTIVE_EXECUTION_GATE_PASS', gate
          assert gate['decision'] == 'GO_PROSPECTIVE_CONFIRMATION_EXECUTION', gate
          assert gate['authorization_scope'] == 'OUTCOME_BLIND_COLLECTION_UNTIL_LOCKED_SINGLE_CHECKPOINT', gate
          assert gate['gate_workflow_run_id'] == predecessor_run_id, gate
          assert gate['gate_workflow_head_sha'] == predecessor_head_sha, gate
          assert gate['prospective_start_session_ny'] == os.environ['START_SESSION'], gate
          assert gate['prospective_start_utc'] == os.environ['START_UTC'], gate
          assert gate['prospective_outcome_generation'] == 'FORBIDDEN_BEFORE_LATER_PRO_CHECKPOINT_GATE', gate
          assert gate['prospective_outcome_reading'] == 'FORBIDDEN_BEFORE_LATER_PRO_CHECKPOINT_GATE', gate
          assert gate['prospective_performance_scoring'] == 'FORBIDDEN_BEFORE_LATER_PRO_CHECKPOINT_GATE', gate
          assert qa['status'] == 'PRO_PRE_PROSPECTIVE_EXECUTION_INDEPENDENT_QA_PASS', qa
          assert qa['frozen_environment_rechecked'] is True, qa
          assert qa['synthetic_tests_rechecked'] is True, qa
          assert qa['empty_live_firewall_rechecked'] is True, qa
          assert qa['unauthorized_future_evaluator_blocked'] is True, qa
          assert qa['prospective_outcomes_opened'] is False, qa

          seal_path = pkg / 'PROSPECTIVE_PLANNING_CANONICAL_SEAL.json'
          seal = json.loads(seal_path.read_text())
          assert seal['status'] == 'E_DISPLAY_EPISODE_V1_PROSPECTIVE_PLANNING_CANONICAL_SEAL_PASS', seal
          assert seal['decision'] == 'READY_FOR_PRO_PRE_PROSPECTIVE_EXECUTION_GATE', seal
          assert seal['seal_revision'] == 'R4_OPERATIONALLY_HARDENED', seal
          assert sha256_path(seal_path) == gate['planning_seal_sha256'], gate
          assert sha256_path(seal_path) == qa['planning_seal_sha256'], qa

          for name, expected in seal['method_sha256'].items():
              path = plan / name
              assert path.is_file() and sha256_path(path) == expected, (name, expected)
          for name, expected in seal['qa_evidence_sha256'].items():
              path = plan / 'qa-r4' / name
              assert path.is_file() and sha256_path(path) == expected, (name, expected)

          auth = seal['frozen_authorities']
          fixed = {
              pkg / 'dev-freeze-canonical-33264659057/DEV_FROZEN_MODEL.json': auth['dev_model_sha256'],
              pkg / 'xau_e_display_episode_reaction_labeler_v1.py': auth['reaction_labeler_sha256'],
              pkg / 'xau_e_display_episode_model_eval_v1.py': auth['model_eval_sha256'],
              pkg / 'requirements-lock.txt': auth['requirements_lock_sha256'],
          }
          for path, expected in fixed.items():
              assert path.is_file() and sha256_path(path) == expected, (str(path), expected)
          engine = Path(
              'xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/'
              'xau_z4_c5_geometry_shifted_grid_equivalent.py'
          )
          engine_bytes = engine.read_bytes()
          assert git_blob(engine_bytes) == auth['z4_engine_git_blob']
          assert sha256_bytes(engine_bytes) == auth['z4_engine_sha256']

          main = api_json(f'https://api.github.com/repos/{repo}/branches/main')
          main_head = main['commit']['sha']
          scheduler_url = (
              f'https://raw.githubusercontent.com/{repo}/{main_head}/'
              f"{os.environ['SCHEDULER_PATH']}"
          )
          scheduler = urllib.request.urlopen(
              urllib.request.Request(
                  scheduler_url,
                  headers={'User-Agent': 'xau-e-v1-pro-gate-finalizer'},
              ),
              timeout=60,
          ).read()
          assert sha256_bytes(scheduler) == gate['scheduler_workflow_sha256'], gate
          assert git_blob(scheduler) == gate['scheduler_workflow_git_blob'], gate
          assert sha256_bytes(scheduler) == qa['scheduler_workflow_sha256'], qa
          assert git_blob(scheduler) == qa['scheduler_workflow_git_blob'], qa

          chain = {
              'status': 'PRO_GATE_PUBLICATION_CHAIN_PASS',
              'reason': (
                  'The predecessor run passed every R4 scientific, frozen-hash, artifact, '
                  'synthetic, fail-closed and anti-peeking check; only its final repository '
                  'publication command failed after the gate artifact had been frozen.'
              ),
              'predecessor_run_id': predecessor_run_id,
              'predecessor_head_sha': predecessor_head_sha,
              'predecessor_artifact_id': predecessor_artifact_id,
              'predecessor_artifact_sha256': expected_artifact_sha,
              'predecessor_required_steps_verified_success': required_success,
              'predecessor_only_failed_step': 'Commit final Pro execution gate to the research branch',
              'finalizer_run_id': int(os.environ['GITHUB_RUN_ID']),
              'finalizer_head_sha': os.environ['GITHUB_SHA'],
              'finalized_at_utc': now.replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
          }
          qa['finalization_chain'] = chain
          qa['scheduler_default_branch_commit'] = main_head
          gate['independent_QA'] = qa
          gate['gate_workflow_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          gate['gate_workflow_head_sha'] = os.environ['GITHUB_SHA']
          gate['gate_workflow_job'] = 'finalize-pro-gate'
          gate['scheduler_default_branch_commit_at_gate'] = main_head
          gate['gate_finalization_chain'] = chain

          qa_path = pkg / 'PRO_PRE_PROSPECTIVE_EXECUTION_INDEPENDENT_QA.json'
          gate_path = pkg / 'E_DISPLAY_EPISODE_V1_PRO_PRE_PROSPECTIVE_EXECUTION_GATE.json'
          qa_path.write_text(json.dumps(qa, indent=2, sort_keys=True) + '\n')
          gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n')
          Path('/tmp/pro-gate-final/PRO_PRE_PROSPECTIVE_EXECUTION_INDEPENDENT_QA.json').write_bytes(
              qa_path.read_bytes()
          )
          Path('/tmp/pro-gate-final/E_DISPLAY_EPISODE_V1_PRO_PRE_PROSPECTIVE_EXECUTION_GATE.json').write_bytes(
              gate_path.read_bytes()
          )
          Path('/tmp/pro-gate-final/GATE_SHA256.txt').write_text(
              sha256_path(gate_path) + '  ' + str(gate_path) + '\n'
          )
          print('PRO_PRE_PROSPECTIVE_EXECUTION_GATE_FINALIZATION_CHAIN_PASS')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xau-e-v1-pro-pre-prospective-execution-gate
          path: |
            /tmp/pro-gate-final/PRO_PRE_PROSPECTIVE_EXECUTION_INDEPENDENT_QA.json
            /tmp/pro-gate-final/E_DISPLAY_EPISODE_V1_PRO_PRE_PROSPECTIVE_EXECUTION_GATE.json
            /tmp/pro-gate-final/GATE_SHA256.txt
          retention-days: 90

      - name: Commit and publish the finalized Pro execution gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$PKG/PRO_PRE_PROSPECTIVE_EXECUTION_INDEPENDENT_QA.json" \
            "$PKG/E_DISPLAY_EPISODE_V1_PRO_PRE_PROSPECTIVE_EXECUTION_GATE.json"
          git commit -m 'publish verified frozen outcome-blind E V1 prospective gate'
          git reset --hard HEAD
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
