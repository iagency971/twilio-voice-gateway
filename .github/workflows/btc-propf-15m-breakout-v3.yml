name: BTC PropF 15m Breakout V3
on:
  push:
    branches: [agent/btc-propf-session-momentum-v1]
    paths:
      - 'btc-propf/run_btc_15m_breakout_v3.py'
      - 'btc-propf/docs/BTC_PROPF_15M_BREAKOUT_PROTOCOL_V3.md'
      - '.github/workflows/btc-propf-15m-breakout-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/btc-propf-session-momentum-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy requests
      - shell: bash
        run: |
          set +e
          mkdir -p btc-propf/results/breakout_v3
          python btc-propf/run_btc_15m_breakout_v3.py 2>&1 | tee btc-propf/results/breakout_v3/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > btc-propf/results/breakout_v3/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "BTC_BREAKOUT_V3_FAILURE exit_code=$code" > btc-propf/results/breakout_v3/WORKFLOW_FAILURE.txt; fi
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-propf/results/breakout_v3
          git commit -m "Publish BTC breakout V3 result [skip ci]" || true
          git push origin HEAD:agent/btc-propf-session-momentum-v1
