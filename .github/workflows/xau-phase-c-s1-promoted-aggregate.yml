name: XAU Phase C S1 Promoted Aggregate
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-phase-c-s1-promoted-aggregate.yml'
permissions:
  contents: write
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Wait for 15 annual promoted S1 summaries and apply frozen gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,io,json,os,pathlib,time,requests,numpy as np,pandas as pd
          years=list(range(2011,2026)); h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path,required=False):
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; r=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']})
              if r.status_code==200: return base64.b64decode(r.json()['content'])
              if required: r.raise_for_status()
              return None
          deadline=time.time()+2400
          while True:
              missing=[y for y in years if get(f'xau-final-results/phase_c_s1_promoted_2011_2025/annual/{y}_summary.csv') is None]
              print('MISSING',missing,flush=True)
              if not missing: break
              if time.time()>=deadline: raise SystemExit(f'annual S1 summaries still missing: {missing}')
              time.sleep(20)
          frames=[]; manifests=[]
          for y in years:
              s=pd.read_csv(io.BytesIO(get(f'xau-final-results/phase_c_s1_promoted_2011_2025/annual/{y}_summary.csv',True))); s.insert(0,'year',y); frames.append(s)
              manifests.append(json.loads(get(f'xau-final-results/phase_c_s1_promoted_2011_2025/annual/{y}_manifest.json',True)))
          a=pd.concat(frames,ignore_index=True).sort_values(['target_r','year'])
          rows=[]
          for tr,g in a.groupby('target_r',sort=True):
              w=g.trades.astype(float); N=float(w.sum()); wa=lambda c: float(np.average(g[c].astype(float),weights=w))
              medpf=float(g.pf_net_legacy22.replace([np.inf,-np.inf],np.nan).median())
              row={'sample':'DISPLACEMENT_ORIGIN_ONLY','entry_model':'TOUCH_NEXT_OPEN','vol_floor_k':1.0,'target_r':float(tr),'years':int(g.year.nunique()),'total_trades':int(N),'weighted_avg_gross_R':wa('avg_gross_R'),'weighted_avg_net_R_legacy22':wa('avg_net_R_legacy22'),'weighted_avg_net_R_cost1_5x':wa('avg_net_R_cost1_5x'),'annual_mean_net_R_legacy22':float(g.avg_net_R_legacy22.mean()),'annual_median_net_R_legacy22':float(g.avg_net_R_legacy22.median()),'positive_years_net_legacy22':int((g.avg_net_R_legacy22>0).sum()),'positive_years_cost1_5x':int((g.avg_net_R_cost1_5x>0).sum()),'median_pf_net_legacy22':medpf,'pf_net_gt1_years':int((g.pf_net_legacy22>1).sum()),'min_annual_net_R_legacy22':float(g.avg_net_R_legacy22.min()),'max_annual_net_R_legacy22':float(g.avg_net_R_legacy22.max()),'median_risk_price_across_years':float(g.median_risk_price.median()),'min_risk_price_all_years':float(g.min_risk_price.min()),'median_structural_risk_price_across_years':float(g.median_structural_risk_price.median())}
              gates=[row['total_trades']>=300,row['weighted_avg_net_R_legacy22']>0,row['annual_median_net_R_legacy22']>0,row['positive_years_net_legacy22']>=10,row['weighted_avg_net_R_cost1_5x']>0,row['positive_years_cost1_5x']>=8,np.isfinite(medpf) and medpf>1]
              for i,v in enumerate(gates,1): row[f'gate_{i}']=bool(v)
              row['survives_s1_multiyear']=bool(all(gates)); rows.append(row)
          m=pd.DataFrame(rows); survivors=m[m.survives_s1_multiyear].copy()
          out=pathlib.Path('/tmp/s1agg'); out.mkdir(exist_ok=True); a.to_csv(out/'annual_summary.csv',index=False); m.to_csv(out/'multiyear_summary.csv',index=False); survivors.to_csv(out/'survivors.csv',index=False)
          json.dump({'years':years,'annual_files':15,'decision_gate':'PHASE_C_S1_MULTIYEAR_GATE.md','promoted_cells':3,'survivors':int(len(survivors)),'selection':'NONE after annual results; only frozen 2025-promoted cells evaluated','annual_manifests':manifests},open(out/'manifest.json','w'),indent=2)
          for fn in ['annual_summary.csv','multiyear_summary.csv','survivors.csv','manifest.json']:
              path=f'xau-final-results/phase_c_s1_promoted_2011_2025/{fn}'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish S1 promoted aggregate {fn} [skip ci]','content':base64.b64encode((out/fn).read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          print(m.to_string(index=False)); print('SURVIVORS',len(survivors))
          PY
