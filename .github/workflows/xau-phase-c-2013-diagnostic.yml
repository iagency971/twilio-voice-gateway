name: XAU Phase C 2013 Extreme Loss Diagnostic
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-phase-c-2013-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Acquire 2012-01 through 2014-01
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2012-01 --to-month 2014-01 --out /tmp/xau2013.csv
      - name: Diagnose objective touch-next-open 1R extremes
        run: python xau-multiyear/scripts/diagnose_phase_c_2013.py /tmp/xau2013.csv /tmp/diag
      - name: Publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,os,requests
          files={
           'xau-final-results/phase_c_2013_diagnostic/diagnostic.json':'/tmp/diag/diagnostic.json',
           'xau-final-results/phase_c_2013_diagnostic/worst30.csv':'/tmp/diag/worst30.csv',
           'xau-final-results/phase_c_2013_diagnostic/worst10_bar_snippets.csv':'/tmp/diag/worst10_bar_snippets.csv'}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for path,src in files.items():
              url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              r=requests.get(url,headers=h,params={'ref':os.environ['BRANCH']}); sha=r.json().get('sha') if r.status_code==200 else None
              body={'message':f'publish Phase C 2013 diagnostic {path.split("/")[-1]} [skip ci]','content':base64.b64encode(open(src,'rb').read()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              rr=requests.put(url,headers=h,json=body); rr.raise_for_status()
          PY
