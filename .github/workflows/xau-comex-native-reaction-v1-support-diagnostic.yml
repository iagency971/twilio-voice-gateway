name: XAU COMEX Native Reaction V1 Support Diagnostic

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - 'xau-recovery/NATIVE_REACTION_V1_SUPPORT_DIAGNOSTIC_TRIGGER.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3
      - name: Outcome-blind control support structure diagnostic
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          root=Path('xau-final-results/comex_dev_rank1_native_reaction_v1_preoutcome')
          c=pd.read_csv(root/'control_candidate_universe.csv.gz',compression='gzip')
          e=pd.read_csv(root/'treated_event_causal_context.csv')
          s=pd.read_csv(root/'treated_event_support.csv')
          out={
            'version':'COMEX_DEV_RANK1_NATIVE_REACTION_V1_SUPPORT_STRUCTURE_V1',
            'post_anchor_outcomes_read':False,
            'reaction_outcomes_computed':False,
            'market_data_api_called':False,
            'control_candidate_rows':int(len(c)),
            'event_rows':int(len(e)),
            'support_rows':int(len(s)),
            'control_columns':list(c.columns),
            'event_columns':list(e.columns),
            'support_columns':list(s.columns),
            'control_head':c.head(3).where(pd.notna(c.head(3)),None).to_dict('records'),
            'event_head':e.head(3).where(pd.notna(e.head(3)),None).to_dict('records')
          }
          Path('/tmp/support_structure.json').write_text(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Publish support structure diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,requests,pathlib
          p=pathlib.Path('/tmp/support_structure.json');dst='xau-final-results/comex_dev_rank1_native_reaction_v1_preoutcome/support_structure_diagnostic.json'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
          body={'message':'publish native reaction outcome-blind support structure [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
