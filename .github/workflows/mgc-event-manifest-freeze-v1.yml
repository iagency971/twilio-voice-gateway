name: MGC Macro Event Manifest Freeze V1
on:
  push:
    branches: [agent/mgc-macro-event-research-v1]
    paths: ['mgc-macro/freeze_event_manifest_v1.py','mgc-macro/EVENT_MANIFEST_TRIGGER.txt','.github/workflows/mgc-event-manifest-freeze-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mgc-macro-event-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas requests lxml beautifulsoup4 html5lib
      - name: Build official event manifest only — no market outcomes
        run: python mgc-macro/freeze_event_manifest_v1.py
      - name: Publish frozen event manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mgc-macro/event_manifest
          git commit -m "Freeze MGC macro event manifest V1 [skip ci]" || true
          git push origin HEAD:agent/mgc-macro-event-research-v1
