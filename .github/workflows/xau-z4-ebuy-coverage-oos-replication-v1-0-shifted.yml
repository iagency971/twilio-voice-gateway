name: XAU Z4 E-BUY Coverage OOS v1.0 Shifted Equivalent

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-coverage-oos-replication-v1-0-shifted.yml'

permissions:
  contents: write

jobs:
  ebuy-oos-shifted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Equivalence and freeze guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/XAUUSD_Z4_C5_SHIFTED_GRID_PARITY.json'))
          assert p['status']=='SHIFTED_GRID_SEMANTIC_PARITY_PASS'
          assert p['max_numeric_abs_diff']<=1e-8
          eng=Path('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py').read_text()
          assert 'out=outcome_zone(' not in eng and '.revisited' not in eng
          pre=Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_PREREG_v1_0_2026-08-25.md').read_text()
          assert 'both OOS_H1 and OOS_H2 pass every gate' in pre
          print('SHIFTED_EQUIVALENCE_GUARD_PASS')
          PY
      - name: Acquire and verify frozen BID Aug2024-Jul2026
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/oos
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          m=json.load(open('xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json'))
          files=[x for x in m['files'] if x['side']=='bid' and '2024-08' <= f"{x['year']}-{x['month']}" <= '2026-07']
          assert len(files)==24
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in files:
              p=Path('/tmp/xau/oos')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],x['file']
          print('24_SOURCE_HASHES_PASS')
          PY
      - name: Build semantically equivalent outcome-blind C5 geometry
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py \
            --files /tmp/xau/oos/*.csv --output /tmp/Z4_C5_OOS_GEOMETRY_SHIFTED.pkl --tag Z4_C5_EBUY_OOS_24M_SHIFTED
      - name: Run frozen OOS coverage replication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ebuy_oos
          python xau-wick-zone-pro/entry-research/xau_ebuy_coverage_oos_replication_v1_0.py \
            --files /tmp/xau/oos/*.csv \
            --z4-pkl /tmp/Z4_C5_OOS_GEOMETRY_SHIFTED.pkl \
            --output /tmp/ebuy_oos/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json \
            --candidates-csv /tmp/ebuy_oos/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv
      - name: Publish shifted-equivalent OOS evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open('/tmp/ebuy_oos/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json'))
          m={'status':'SHIFTED_EQUIVALENT_OOS_EVIDENCE','result_status':r['status'],'future_price_outcomes_used':False,
             'geometry_parity_status':'SHIFTED_GRID_SEMANTIC_PARITY_PASS',
             'geometry_engine_sha256':hashlib.sha256(Path('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py').read_bytes()).hexdigest(),
             'result_sha256':hashlib.sha256(Path('/tmp/ebuy_oos/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json').read_bytes()).hexdigest()}
          Path('/tmp/ebuy_oos/SHIFTED_EQUIVALENT_MANIFEST.json').write_text(json.dumps(m,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0-shifted-equivalent
          mkdir -p "$out"
          cp /tmp/ebuy_oos/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json "$out/"
          cp /tmp/ebuy_oos/SHIFTED_EQUIVALENT_MANIFEST.json "$out/"
          gzip -c /tmp/ebuy_oos/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv > "$out/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv.gz"
          git add "$out"
          git commit -m 'publish shifted-equivalent E-BUY OOS replication [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
