name: XAU Z4 E_BUY_US M1 Fallback Freeze v1.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-score-freeze-v1-1.yml'

permissions:
  contents: write

jobs:
  freeze-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.2 joblib==1.5.2
      - name: Freeze guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile xau-wick-zone-pro/entry-research/xau_ebuy_score_freeze_v1_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_SCORE_DEV_FALLBACK_FREEZE_v1_1_2026-08-25.md').read_text()
          for x in ['M1_LOGISTIC','No threshold is changed','H2 status:** CLOSED','No new feature, parameter, label, threshold']:
              assert x in p,x
          v=json.load(open('xau-wick-zone-pro/entry-research/ebuy-score-dev-v1-0/XAUUSD_Z4_EBUY_SCORE_DEV_RESULT_v1_0.json'))
          assert v['status']=='E_BUY_US_DEV_FAIL' and v['selected_model']=='M2_HGB'
          print('FALLBACK_FREEZE_GUARD_PASS')
          PY
      - name: Acquire exactly H1 BID and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/h1 /tmp/freeze
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          man=json.load(open('xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json'))
          fs=[x for x in man['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2025-07'];assert len(fs)==12
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/xau/h1')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          assert not list(Path('/tmp/xau/h1').glob('*2025_08*')) and not list(Path('/tmp/xau/h1').glob('*2026*'))
          print('H1_ONLY_HASH_PASS')
          PY
      - name: Fit and freeze exact M1 artifact
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/entry-research/xau_ebuy_score_freeze_v1_1.py \
            --files /tmp/xau/h1/*.csv \
            --triggers-gz xau-wick-zone-pro/entry-research/reaction-dev-h1-v1-0/XAUUSD_Z4_EBUY_REACTION_DEV_H1_TRIGGERS_v1_0.csv.gz \
            --candidates-gz xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv.gz \
            --v10-result xau-wick-zone-pro/entry-research/ebuy-score-dev-v1-0/XAUUSD_Z4_EBUY_SCORE_DEV_RESULT_v1_0.json \
            --model-pkl /tmp/freeze/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib \
            --output /tmp/freeze/XAUUSD_Z4_EBUY_US_M1_FREEZE_v1_1.json
      - name: Publish frozen M1 artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1
          mkdir -p "$out"
          cp /tmp/freeze/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib "$out/"
          cp /tmp/freeze/XAUUSD_Z4_EBUY_US_M1_FREEZE_v1_1.json "$out/"
          git add "$out"
          git commit -m 'freeze exact M1 E_BUY_US DEV fallback v1.1 [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
