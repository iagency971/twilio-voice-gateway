name: MNQ 12-Model Post-Freeze Proxy V1
on:
  push:
    branches: [agent/mnq-12model-postfreeze-proxy-v1]
    paths: ['mnq-12model-proxy/**','.github/workflows/mnq-12model-proxy-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mnq-12model-postfreeze-proxy-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests matplotlib tabulate python-dotenv ib_insync
      - name: Run frozen proxy screen
        shell: bash
        run: |
          set +e
          mkdir -p mnq-12model-proxy/results/v1
          python mnq-12model-proxy/run_v1.py 2>&1 | tee mnq-12model-proxy/results/v1/run.log
          code=${PIPESTATUS[0]}; echo "$code" > mnq-12model-proxy/results/v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "MNQ_12MODEL_PROXY_FAILURE exit_code=$code" > mnq-12model-proxy/results/v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-12model-proxy/results/v1
          git commit -m "Publish MNQ 12-model proxy V1 result [skip ci]" || true
          git push origin HEAD:agent/mnq-12model-postfreeze-proxy-v1
