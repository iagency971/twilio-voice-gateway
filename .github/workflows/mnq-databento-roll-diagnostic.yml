name: MNQ Databento Roll Diagnostic
on:
  push:
    branches: [agent/mnq-databento-cme-validation-v1]
    paths:
      - 'mnq-databento/roll_diag/**'
      - '.github/workflows/mnq-databento-roll-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mnq-databento-cme-validation-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pandas databento
      - name: Run free symbology diagnostic only
        run: python mnq-databento/roll_diag/run_roll_diag.py
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-databento/roll_diag/results
          git commit -m "Publish Databento roll diagnostic [skip ci]" || true
          git push origin HEAD:agent/mnq-databento-cme-validation-v1
