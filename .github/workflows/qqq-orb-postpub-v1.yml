name: QQQ ORB Post-Publication V1
on:
  push:
    branches: [agent/qqq-propf-orb-postpub-v1]
    paths:
      - 'qqq-propf/**'
      - '.github/workflows/qqq-orb-postpub-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'qqq-propf/**'
      - '.github/workflows/qqq-orb-postpub-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/qqq-propf-orb-postpub-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy requests
      - shell: bash
        run: |
          set +e
          mkdir -p qqq-propf/results/postpub_v1
          python qqq-propf/run_qqq_orb_postpub_v1.py 2>&1 | tee qqq-propf/results/postpub_v1/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > qqq-propf/results/postpub_v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "QQQ_ORB_WORKFLOW_FAILURE exit_code=$code" > qqq-propf/results/postpub_v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qqq-propf/results/postpub_v1
          git commit -m "Publish QQQ ORB post-publication V1 result [skip ci]" || true
          git push origin HEAD:agent/qqq-propf-orb-postpub-v1
# PR trigger added only to execute frozen protocol; trading logic and gates unchanged
