name: XAU Z4 corridor retrace V3 PREOUTCOME

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - .github/workflows/xau-z4-corridor-v3-preoutcome.yml
      - xau-wick-zone-pro/entry-research/XAUUSD_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_*
      - xau-wick-zone-pro/entry-research/xau_z4_corridor_v3_preoutcome.py
      - xau-wick-zone-pro/entry-research/xau_z4_corridor_v3_preoutcome_qa.py
      - xau-wick-zone-pro/entry-research/xau_z4_corridor_v3_preoutcome_runner.py
      - xau-wick-zone-pro/entry-research/test_xau_z4_corridor_v3_preoutcome.py
  workflow_dispatch:

concurrency:
  group: xau-z4-corridor-v3-preoutcome
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PKG: xau-wick-zone-pro/entry-research
  V2: xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2
  DATA: /tmp/xau-v3-data
  WORK: /tmp/xau-v3-work
  REPLAY: /tmp/xau-v3-replay
  BENCH: /tmp/xau-v3-bench

jobs:
  preoutcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify triggering commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo EXACT_HEAD_PASS "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify Pro V3 PREOUTCOME authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('xau-wick-zone-pro/entry-research')
          g=json.load(open(p/'XAUUSD_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_PRO_GATE.json'))
          assert g['status']=='PRO_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_METHOD_GATE_PASS'
          assert g['decision']=='GO_V3_PREOUTCOME_IMPLEMENTATION'
          assert g['v3_reaction_outcomes_opened'] is False
          assert g['rep_2023_status']=='SEALED_UNTIL_COMPLETE_VAL_CONTINUATION_PASS'
          assert g['legacy_br70_status']=='FORBIDDEN_AS_V3_TRIGGER'
          assert g['pine_authorization']=='NONE' and g['production_authorization']=='NONE'
          for f in [
            'XAUUSD_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_PREREG_2026-08-31.md',
            'XAUUSD_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_PREREG_ADDENDUM_A_EXACT_CAUSAL_RULES_2026-08-31.md',
            'XAUUSD_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_PREREG_ADDENDUM_B_DYNAMIC_CONTROL_NEUTRALITY_2026-08-31.md',
            'XAUUSD_Z4_CORRIDOR_RETRACE_LEVEL_REACTION_V3_PREREG_ADDENDUM_C_GAP_PASS_RULE_2026-08-31.md']:
            assert (p/f).is_file(),f
          print('V3_PREOUTCOME_PRO_AUTHORITY_PASS')
          PY
      - name: Install frozen environment and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$V2/requirements-lock.txt"
          python - <<'PY'
          import platform,numpy,pandas,scipy,sklearn
          assert platform.python_version()=='3.11.16'
          assert numpy.__version__=='2.3.2' and pandas.__version__=='2.3.1'
          assert scipy.__version__=='1.16.1' and sklearn.__version__=='1.7.1'
          print('FROZEN_ENVIRONMENT_PASS')
          PY
          python -m py_compile "$PKG/xau_z4_corridor_v3_preoutcome.py" "$PKG/xau_z4_corridor_v3_preoutcome_qa.py" "$PKG/xau_z4_corridor_v3_preoutcome_runner.py" "$PKG/test_xau_z4_corridor_v3_preoutcome.py"
      - name: Synthetic causal tests before data outcomes
        shell: bash
        run: |
          set -euo pipefail
          python "$PKG/test_xau_z4_corridor_v3_preoutcome.py"
      - name: Acquire and pin M1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATA" "$WORK" "$REPLAY" "$BENCH"
          python "$V2/xau_e_zone_v2_acquire.py" --output-dir "$DATA" --manifest "$DATA/DATA_INPUT_MANIFEST.json"
      - name: One-month outcome-blind candidate runtime benchmark
        shell: bash
        run: |
          set -euo pipefail
          FILES=("$DATA/xauusd_bid_m1_2024_05.csv" "$DATA/xauusd_bid_m1_2024_06.csv" "$DATA/xauusd_bid_m1_2024_07.csv")
          python "$V2/xau_z4_geometry_only_v2.py" --files "${FILES[@]}" --output-pkl "$BENCH/z4.pkl" --output-csv "$BENCH/z4.csv" --manifest "$BENCH/z4_manifest.json" --tag CORRIDOR_V3_BENCH
          START=$(date +%s)
          python "$PKG/xau_z4_corridor_v3_preoutcome.py" --files "${FILES[@]}" --z4-pkl "$BENCH/z4.pkl" --target-start 2024-07-01T00:00:00Z --target-end 2024-08-01T00:00:00Z --episodes-out "$BENCH/episodes.csv.gz" --candidates-out "$BENCH/candidates.csv.gz" --controls-out "$BENCH/controls.csv.gz" --candidate-contacts-out "$BENCH/candidate_contacts.csv.gz" --control-contacts-out "$BENCH/control_contacts.csv.gz" --manifest "$BENCH/manifest.json" --tag BENCH
          ELAPSED=$(($(date +%s)-START))
          echo "$ELAPSED" > "$BENCH/candidate_runtime_seconds.txt"
          python "$PKG/xau_z4_corridor_v3_preoutcome_qa.py" --phase BENCH --episodes "$BENCH/episodes.csv.gz" --candidates "$BENCH/candidates.csv.gz" --controls "$BENCH/controls.csv.gz" --candidate-contacts "$BENCH/candidate_contacts.csv.gz" --control-contacts "$BENCH/control_contacts.csv.gz" --manifest "$BENCH/manifest.json" --output "$BENCH/preoutcome_qa.json"
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('/tmp/xau-v3-bench');n=int((b/'candidate_runtime_seconds.txt').read_text())
          m=json.load(open(b/'manifest.json'))
          assert m['future_v3_reaction_outcomes_used'] is False
          # Fail only on an engineering pathology, not on scientific counts.
          assert n <= 900,(n,'candidate generator exceeded 15 min on one-month benchmark')
          print('V3_OUTCOME_BLIND_RUNTIME_BENCH_PASS',n,'seconds',m['candidate_contacts'],'contacts')
          PY
      - name: Deterministic replay of benchmark generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPLAY/BENCH"
          FILES=("$DATA/xauusd_bid_m1_2024_05.csv" "$DATA/xauusd_bid_m1_2024_06.csv" "$DATA/xauusd_bid_m1_2024_07.csv")
          python "$PKG/xau_z4_corridor_v3_preoutcome.py" --files "${FILES[@]}" --z4-pkl "$BENCH/z4.pkl" --target-start 2024-07-01T00:00:00Z --target-end 2024-08-01T00:00:00Z --episodes-out "$REPLAY/BENCH/episodes.csv.gz" --candidates-out "$REPLAY/BENCH/candidates.csv.gz" --controls-out "$REPLAY/BENCH/controls.csv.gz" --candidate-contacts-out "$REPLAY/BENCH/candidate_contacts.csv.gz" --control-contacts-out "$REPLAY/BENCH/control_contacts.csv.gz" --manifest "$REPLAY/BENCH/manifest.json" --tag BENCH
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('/tmp/xau-v3-bench');b=Path('/tmp/xau-v3-replay/BENCH')
          def h(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for f in ['episodes.csv.gz','candidates.csv.gz','controls.csv.gz','candidate_contacts.csv.gz','control_contacts.csv.gz','manifest.json']:
              assert h(a/f)==h(b/f),(f,h(a/f),h(b/f))
          out={'status':'Z4_CORRIDOR_V3_DETERMINISTIC_REPLAY_PASS','future_v3_reaction_outcomes_used':False}
          (a/'deterministic_replay.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(out['status'])
          PY
      - name: Build and QA complete DEV VAL REP PREOUTCOME
        shell: bash
        run: |
          set -euo pipefail
          python "$PKG/xau_z4_corridor_v3_preoutcome_runner.py" --data-dir "$DATA" --work-dir "$WORK"
          test "$(python -c "import json;print(json.load(open('$WORK/V3_PREOUTCOME_FREEZE.json'))['status'])")" = "Z4_CORRIDOR_V3_COMPLETE_PREOUTCOME_FREEZE_PASS"
      - name: Final fail-closed outcome assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          w=Path('/tmp/xau-v3-work');bad=[]
          for pat in ['*reaction*label*','*score_report*','*frozen_model*','*mfe*','*mae*','*zone_test*']:
              bad.extend(w.rglob(pat))
          assert not bad,[str(x) for x in bad]
          print('NO_V3_REACTION_OUTCOME_BEFORE_AUTHORIZATION_PASS')
          PY
      - name: Upload immutable V3 PREOUTCOME package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z4-corridor-v3-preoutcome
          retention-days: 90
          compression-level: 6
          path: |
            /tmp/xau-v3-data/DATA_INPUT_MANIFEST.json
            /tmp/xau-v3-bench/manifest.json
            /tmp/xau-v3-bench/preoutcome_qa.json
            /tmp/xau-v3-bench/candidate_runtime_seconds.txt
            /tmp/xau-v3-bench/deterministic_replay.json
            /tmp/xau-v3-work/V3_PREOUTCOME_FREEZE.json
            /tmp/xau-v3-work/DEV/manifest.json
            /tmp/xau-v3-work/DEV/preoutcome_qa.json
            /tmp/xau-v3-work/DEV/episodes.csv.gz
            /tmp/xau-v3-work/DEV/candidates.csv.gz
            /tmp/xau-v3-work/DEV/controls.csv.gz
            /tmp/xau-v3-work/DEV/candidate_contacts.csv.gz
            /tmp/xau-v3-work/DEV/control_contacts.csv.gz
            /tmp/xau-v3-work/VAL/manifest.json
            /tmp/xau-v3-work/VAL/preoutcome_qa.json
            /tmp/xau-v3-work/VAL/episodes.csv.gz
            /tmp/xau-v3-work/VAL/candidates.csv.gz
            /tmp/xau-v3-work/VAL/controls.csv.gz
            /tmp/xau-v3-work/VAL/candidate_contacts.csv.gz
            /tmp/xau-v3-work/VAL/control_contacts.csv.gz
            /tmp/xau-v3-work/REP/manifest.json
            /tmp/xau-v3-work/REP/preoutcome_qa.json
            /tmp/xau-v3-work/REP/episodes.csv.gz
            /tmp/xau-v3-work/REP/candidates.csv.gz
            /tmp/xau-v3-work/REP/controls.csv.gz
            /tmp/xau-v3-work/REP/candidate_contacts.csv.gz
            /tmp/xau-v3-work/REP/control_contacts.csv.gz
