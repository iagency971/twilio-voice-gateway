name: XAU Phase C S1 Volatility Floor 2025
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-phase-c-s1-2025.yml'
permissions:
  contents: write
jobs:
  s1-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: S1 tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_entries_v1.py xau-multiyear/tests/test_entries_s1.py
      - run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2024-01 --to-month 2026-01 --out /tmp/xau_s1.csv
      - run: python xau-multiyear/scripts/run_phase_c_s1.py /tmp/xau_s1.csv --target-start 2025-01-01 --target-end 2026-01-01 --out /tmp/s1
      - name: Apply frozen 2025 computational screen and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,os,requests,pandas as pd,json,numpy as np
          p='/tmp/s1/summary.csv'; s=pd.read_csv(p)
          promoted=[]
          for _,r in s.iterrows():
              if r['trades']<300 or r['avg_net_R_legacy22']<=0 or r['avg_net_R_cost1_5x'] < -0.02: continue
              neigh=s[(s['sample']==r['sample'])&(s['entry_model']==r['entry_model']) & (((s['vol_floor_k']==r['vol_floor_k'])&(abs(s['target_r']-r['target_r']).isin([0.5]))) | ((s['target_r']==r['target_r'])&(abs(s['vol_floor_k']-r['vol_floor_k']).isin([0.25]))))]
              if len(neigh) and (neigh['avg_net_R_legacy22']>=0).any(): promoted.append(r.to_dict())
          pd.DataFrame(promoted).to_csv('/tmp/s1/promoted_2025.csv',index=False)
          m=json.load(open('/tmp/s1/manifest.json')); m['promoted_cells_2025']=len(promoted); json.dump(m,open('/tmp/s1/manifest.json','w'),indent=2)
          print('S1_PROMOTED_CELLS',len(promoted)); print(pd.DataFrame(promoted).to_string(index=False) if promoted else 'NONE')
          files={'xau-final-results/phase_c_s1_2025/summary.csv':'/tmp/s1/summary.csv','xau-final-results/phase_c_s1_2025/promoted_2025.csv':'/tmp/s1/promoted_2025.csv','xau-final-results/phase_c_s1_2025/manifest.json':'/tmp/s1/manifest.json'}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for path,src in files.items():
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; rr=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=rr.json().get('sha') if rr.status_code==200 else None
              body={'message':f'publish S1 2025 {path.split("/")[-1]} [skip ci]','content':base64.b64encode(open(src,'rb').read()).decode(),'branch':os.environ['BRANCH']};
              if sha:body['sha']=sha
              z=requests.put(u,headers=h,json=body); z.raise_for_status()
          PY
