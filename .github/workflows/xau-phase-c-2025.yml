name: XAU Phase C Entry Surface 2025
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - 'xau-multiyear/src/rzr/entries_v1.py'
      - 'xau-multiyear/scripts/run_phase_c_entries.py'
      - 'xau-multiyear/tests/test_entries_v1.py'
      - '.github/workflows/xau-phase-c-2025.yml'
permissions:
  contents: write
jobs:
  phase-c-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: Phase C unit tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_entries_v1.py
      - name: Acquire 2024-01 through 2026-01
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2024-01 --to-month 2026-01 --out /tmp/xau_phase_c.csv
      - name: Run frozen Phase C surface on 2025
        run: python xau-multiyear/scripts/run_phase_c_entries.py /tmp/xau_phase_c.csv --target-start 2025-01-01 --target-end 2026-01-01 --out /tmp/phase_c_2025
      - name: Validate and publish isolated result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd, json
          s=pd.read_csv('/tmp/phase_c_2025/summary.csv')
          assert {'DISPLACEMENT_ORIGIN_ONLY','OBJECTIVE_LIQUIDITY_ONLY'}.issubset(set(s['sample']))
          assert {'TOUCH_NEXT_OPEN','CLEAN_REJECTION','FAILED_AUCTION','ACCEPTANCE_RETEST'}.intersection(set(s['entry_model']))
          assert int(s['trades'].max()) > 100
          m=json.load(open('/tmp/phase_c_2025/manifest.json'))
          print('PHASE_C_2025_GATE_OK')
          print(json.dumps(m,indent=2))
          print(s.to_string(index=False))
          PY
          mkdir -p xau-phase-c-results/2025
          cp /tmp/phase_c_2025/summary.csv xau-phase-c-results/2025/summary.csv
          cp /tmp/phase_c_2025/manifest.json xau-phase-c-results/2025/manifest.json
          cp /tmp/phase_c_2025/trade_surface.csv.gz xau-phase-c-results/2025/trade_surface.csv.gz
          git config user.name 'xau-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xau-phase-c-results/2025
          git commit -m 'record Phase C 2025 entry surface [skip ci]'
          git push --force origin HEAD:agent/xau-phase-c-2025-result
