name: XAU Outcome Exact V1.1 Binder

on:
  push:
    branches: [agent/xau-core-evidence-audit-v1]
    paths:
      - '.github/workflows/xau-outcome-actions-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-core-evidence-audit-v1
      - name: Publish exact frozen V1.1 machine protocol bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,requests,zlib
          packed=''
          data=zlib.decompress(base64.b64decode(packed))
          expected='f72ec721c1fd754140dec9aba46173ee6f7b42873b8a7553470a14e382314eda'
          got=hashlib.sha256(data).hexdigest()
          if got!=expected: raise SystemExit(f'EMBEDDED_PROTOCOL_HASH_FAIL {got}')
          path='xau-multiyear/docs/XAU_CORE_CAUSAL_CONFLUENCE_OUTCOME_PROTOCOL_v1_1.json'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); old.raise_for_status()
          body={'message':'publish exact V1.1 machine protocol bytes [skip ci]','content':base64.b64encode(data).decode(),'branch':os.environ['BRANCH'],'sha':old.json()['sha']}
          r=requests.put(u,headers=h,json=body); r.raise_for_status()
          marker_path='xau-final-results/xau_core_causal_confluence_outcome_v1_1/V1_1_EXACT_BINDING_PASS.json'
          marker=json.dumps({'status':'V1_1_EXACT_BINDING_PASS','workflow_run_id':os.environ['GITHUB_RUN_ID'],'machine_protocol_sha256':got},indent=2,sort_keys=True).encode()+b'\n'
          u2=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{marker_path}"
          old2=requests.get(u2,headers=h,params={'ref':os.environ['BRANCH']})
          body2={'message':'publish exact V1.1 binding marker [skip ci]','content':base64.b64encode(marker).decode(),'branch':os.environ['BRANCH']}
          if old2.status_code==200: body2['sha']=old2.json()['sha']
          elif old2.status_code!=404: old2.raise_for_status()
          rr=requests.put(u2,headers=h,json=body2); rr.raise_for_status()
          print(marker.decode())
          PY
