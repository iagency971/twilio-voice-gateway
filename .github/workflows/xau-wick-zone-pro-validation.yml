name: XAU Wick Zone Z4 Frozen VALIDATION

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-pro-validation.yml'

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify prospective code freeze BEFORE data download
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object xau-wick-zone-pro/xau_zone_episode_dev_z4.py)" = "a8a147615c3fd366c49e93b340fd2018b5b66e9e"
          test "$(git hash-object xau-wick-zone-pro/xau_wick_zone_validation_score.py)" = "1bdbf2d628fab93b8d777d782c8b9b55405752d4"
          test "$(git hash-object xau-wick-zone-pro/results/XAUUSD_Z4_FROZEN_MODEL_PARAMS_v0_1.json)" = "c95fd545ec451968cb421f81ed6add0c508f387d"
          test "$(git hash-object xau-wick-zone-pro/results/XAUUSD_Z4_DEV_BID_ASK_COMPLETION_v0_1_results.json)" = "fb90bb4ac1e05f7cafc2f0fc6abb278bd806513b"
          python - <<'PY'
          import json
          f=json.load(open('xau-wick-zone-pro/XAUUSD_Z4_VALIDATION_CODE_FREEZE_v0_1.json'))
          assert f['status']=='FROZEN_BEFORE_VALIDATION_DATA_READ'
          assert f['oos_status']=='SEALED'
          assert f['validation_period_utc']==['2024-08-01','2025-08-01']
          print('Prospective freeze verification: PASS')
          PY

      - name: Install fixed research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1

      - name: Download causal warm-up plus VALIDATION only — NO OOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/bid /tmp/xau/ask
          for side in bid ask; do
            for y in 2024 2025; do
              if [ "$y" = "2024" ]; then months="01 02 03 04 05 06 07 08 09 10 11 12"; else months="01 02 03 04 05 06 07"; fi
              for m in $months; do
                file="xauusd_${side}_m1_${y}_${m}.csv"
                url="https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/${side}/m1/${file}"
                echo "GET $url"
                curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 "$url" -o "/tmp/xau/${side}/${file}"
              done
            done
          done
          if find /tmp/xau -type f | grep -E '2025_(08|09|10|11|12)|2026_' ; then
            echo 'FORBIDDEN OOS FILE DETECTED' >&2
            exit 1
          fi

      - name: QA Validation source and verify DEV prefix identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/xau')
          frozen=json.load(open('xau-wick-zone-pro/results/XAUUSD_Z4_DEV_SOURCE_MANIFEST_v0_1.json'))
          expected={(x['side'],x['month']):x['sha256'] for x in frozen['files']}
          out={'status':'VALIDATION_SOURCE_QA_NO_OOS','source':'kevingtlin/Market-Data-Lab Dukascopy XAUUSD M1','allowed_max_month':'2025-07','files':[],'dev_prefix_hash_checks':{}}
          for side in ('bid','ask'):
            for p in sorted((root/side).glob('*.csv')):
              name=p.stem; parts=name.split('_'); year=parts[-2]; month=parts[-1]
              if year>'2025' or (year=='2025' and month>'07'): raise SystemExit(f'OOS file forbidden: {p}')
              raw=p.read_bytes(); sha=hashlib.sha256(raw).hexdigest(); d=pd.read_csv(p)
              if list(d.columns)!=['timestamp','open','high','low','close']: raise SystemExit(f'bad schema {p}')
              if d.timestamp.duplicated().any() or not d.timestamp.is_monotonic_increasing: raise SystemExit(f'timestamp QA failed {p}')
              bad=((d.high<d[['open','close','low']].max(axis=1)) | (d.low>d[['open','close','high']].min(axis=1))).sum()
              if bad: raise SystemExit(f'OHLC QA failed {p}: {bad}')
              active=int((d.high>d.low).sum())
              rec={'side':side,'year':year,'month':month,'file':p.name,'sha256':sha,'bytes':len(raw),'rows':int(len(d)),'active_rows':active,'flat_rows':int(len(d)-active),'first_timestamp':int(d.timestamp.iloc[0]),'last_timestamp':int(d.timestamp.iloc[-1])}
              out['files'].append(rec)
              if year=='2024' and month in ('01','02','03','04','05','06','07'):
                ok=(sha==expected[(side,month)]); out['dev_prefix_hash_checks'][f'{side}_{month}']=ok
                if not ok: raise SystemExit(f'DEV prefix changed {side} {month}')
          if not all(out['dev_prefix_hash_checks'].values()): raise SystemExit('DEV prefix hash gate failed')
          Path('/tmp/XAUUSD_Z4_VALIDATION_SOURCE_MANIFEST_v0_1.json').write_text(json.dumps(out,indent=2))
          print('source files',len(out['files']),'DEV prefix checks',len(out['dev_prefix_hash_checks']))
          PY

      - name: Build continuous Z4 BID through end of Validation
        run: python xau-wick-zone-pro/xau_zone_episode_dev_z4.py --files /tmp/xau/bid/*.csv --output /tmp/XAUUSD_Z4_VALIDATION_CONTINUOUS_BID.pkl --tag BID_Z4_VALIDATION_JAN2024_JUL2025

      - name: Build continuous Z4 ASK secondary diagnostic
        run: python xau-wick-zone-pro/xau_zone_episode_dev_z4.py --files /tmp/xau/ask/*.csv --output /tmp/XAUUSD_Z4_VALIDATION_CONTINUOUS_ASK.pkl --tag ASK_Z4_VALIDATION_JAN2024_JUL2025

      - name: Score frozen Validation models — NO fitting
        run: |
          python xau-wick-zone-pro/xau_wick_zone_validation_score.py \
            --bid-pkl /tmp/XAUUSD_Z4_VALIDATION_CONTINUOUS_BID.pkl \
            --ask-pkl /tmp/XAUUSD_Z4_VALIDATION_CONTINUOUS_ASK.pkl \
            --frozen-json xau-wick-zone-pro/results/XAUUSD_Z4_FROZEN_MODEL_PARAMS_v0_1.json \
            --source-manifest /tmp/XAUUSD_Z4_VALIDATION_SOURCE_MANIFEST_v0_1.json \
            --output /tmp/XAUUSD_Z4_VALIDATION_RESULTS_v0_1.json

      - name: Publish immutable Validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xau-wick-zone-pro/validation
          cp /tmp/XAUUSD_Z4_VALIDATION_SOURCE_MANIFEST_v0_1.json xau-wick-zone-pro/validation/XAUUSD_Z4_VALIDATION_SOURCE_MANIFEST_v0_1.json
          cp /tmp/XAUUSD_Z4_VALIDATION_CONTINUOUS_BID_summary.json xau-wick-zone-pro/validation/XAUUSD_Z4_VALIDATION_CONTINUOUS_BID_summary.json
          cp /tmp/XAUUSD_Z4_VALIDATION_CONTINUOUS_ASK_summary.json xau-wick-zone-pro/validation/XAUUSD_Z4_VALIDATION_CONTINUOUS_ASK_summary.json
          cp /tmp/XAUUSD_Z4_VALIDATION_RESULTS_v0_1.json xau-wick-zone-pro/validation/XAUUSD_Z4_VALIDATION_RESULTS_v0_1.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add xau-wick-zone-pro/validation
          git commit -m 'publish frozen Z4 validation evidence [skip ci]'
          git push origin HEAD:agent/xau-wick-zone-pro-dev
