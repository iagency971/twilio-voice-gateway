name: XAU Z4 E-BUY Pine Model Export v1.0

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-pine-model-export-v1-0.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scikit-learn==1.7.2 joblib==1.5.2
      - name: Verify frozen model and export without refit
        shell: bash
        run: |
          set -euo pipefail
          MOD=xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib
          echo 'ac1c3effe84b64ffd1deebd82c3c6009ae56be9505974e3824b20169e3b38342  '"$MOD" | sha256sum -c -
          python xau-wick-zone-pro/entry-research/xau_ebuy_export_pine_model_v1_0.py --model "$MOD" --output /tmp/E_BUY_US_PINE_MODEL_EXPORT_v1_0.json
      - name: Publish export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions;git config user.email github-actions@github.com;git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/ebuy-pine-engineering-v1-0;mkdir -p "$out";cp /tmp/E_BUY_US_PINE_MODEL_EXPORT_v1_0.json "$out/"
          git add "$out";git commit -m 'publish frozen E-BUY Pine model export [skip ci]' || true;git push origin HEAD:agent/xau-wick-zone-pro-dev
