name: XAU Wick Zone Finalization Monitor

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-finalization-monitor.yml'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - name: Poll recovery and parity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-wick-zone-pro-dev
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['BRANCH']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return json.load(r)
          def latest(wf):
            q=urllib.parse.quote(branch,safe='')
            runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch={q}&per_page=5').get('workflow_runs',[])
            if not runs:return None
            x=runs[0]
            return {'id':x['id'],'status':x['status'],'conclusion':x.get('conclusion'),'created_at':x.get('created_at'),'updated_at':x.get('updated_at'),'html_url':x.get('html_url')}
          wfs=['xau-wick-zone-pro-oos-bid-recovery.yml','xau-wick-zone-pine-parity.yml']
          state={}
          for _ in range(55):
            state={w:latest(w) for w in wfs}
            if all(v and v['status']=='completed' for v in state.values()):break
            time.sleep(20)
          out={'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'workflows':state}
          data=json.dumps(out,indent=2).encode()
          path='xau-wick-zone-pro/FINALIZATION_RUN_STATUS.json'; url=f'https://api.github.com/repos/{repo}/contents/{path}'
          body={'message':'publish wick-zone finalization workflow status [skip ci]','content':__import__('base64').b64encode(data).decode(),'branch':branch}
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=h,method='PUT')
          with urllib.request.urlopen(req,timeout=60) as r:print(r.status)
          print(json.dumps(out,indent=2))
          PY
