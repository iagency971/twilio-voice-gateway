name: NQ Yahoo Source Diagnostic
on:
  push:
    branches: [agent/mnq-12model-yahoo-forward-v1]
    paths: ['source-diagnostics/**','.github/workflows/nq-yahoo-source-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/mnq-12model-yahoo-forward-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas
      - name: Run source diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p source-diagnostics/results/yahoo_getdata_jul28_31
          python source-diagnostics/yahoo_getdata_jul28_31.py 2>&1 | tee source-diagnostics/results/yahoo_getdata_jul28_31/run.log
          echo ${PIPESTATUS[0]} > source-diagnostics/results/yahoo_getdata_jul28_31/exit_code.txt
          exit 0
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source-diagnostics/results/yahoo_getdata_jul28_31
          git commit -m "Publish Yahoo/GetData source diagnostic [skip ci]" || true
          git push origin HEAD:agent/mnq-12model-yahoo-forward-v1
