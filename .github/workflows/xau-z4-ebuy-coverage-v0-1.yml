name: XAU Z4 E-BUY Coverage v0.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-coverage-v0-1.yml'

permissions:
  contents: write

jobs:
  ebuy-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1

      - name: Static and preregistration guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py
          python - <<'PY'
          from pathlib import Path
          p=Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_COVERAGE_PREREG_v0_1_2026-08-25.md')
          s=p.read_text()
          required=[
            'BUY only',
            'coverage >= **80%** with >=1 candidate inside 1.0v',
            'coverage >= **90%** with >=1 candidate inside 1.5v',
            'coverage >= **95%** with >=1 candidate inside 2.0v',
            'one-step 5-minute pooled zone persistence >= **70%**',
            'No reaction or future-price outcome may enter selection.'
          ]
          for x in required: assert x in s,x
          code=Path('xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py').read_text()
          assert "FORBIDDEN" in code and "future outcome columns present" in code
          print('PREREG_AND_STATIC_GUARD_PASS')
          PY

      - name: Download exact frozen BID DEV Jan-Jul 2024
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/bid
          for m in 01 02 03 04 05 06 07; do
            f="xauusd_bid_m1_2024_${m}.csv"
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/${f}" \
              -o "/tmp/xau/bid/${f}"
          done

      - name: Verify exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.load(open('xau-wick-zone-pro/results/XAUUSD_Z4_DEV_SOURCE_MANIFEST_v0_1.json'))
          exp={x['file']:x['sha256'] for x in m['files'] if x.get('side')=='bid'}
          got={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('/tmp/xau/bid').glob('*.csv')}
          assert len(got)==7
          for k,v in got.items(): assert exp[k]==v,(k,exp.get(k),v)
          print('FROZEN_BID_HASH_GATE_PASS')
          PY

      - name: Build mechanical outcome-blind C5 Z4 geometry engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          src=Path('xau-wick-zone-pro/xau_zone_episode_dev_z4.py').read_text()
          replacements=[
            ('p=utc_ts(ts); return p.minute%15==0 and p.second==0','p=utc_ts(ts); return p.minute%5==0 and p.second==0'),
            ('if i<LOOKBACK-1 or i+HORIZON+REACT_MAX>=N or not landmark_ok(T[i]): continue','if i<LOOKBACK-1 or not landmark_ok(T[i]): continue'),
            ('out=outcome_zone(i,zlo,zhi,center,side,v)','out={}'),
            ("'revisit_rate':float(Z.revisited.mean()),'runtime_sec':time.time()-t0","'revisit_rate':None,'runtime_sec':time.time()-t0")
          ]
          for old,new in replacements:
              assert src.count(old)==1,(old,src.count(old)); src=src.replace(old,new)
          assert src.count('outcome_zone(')==1
          assert 'out=outcome_zone(' not in src
          assert '.revisited' not in src
          p=Path('/tmp/z4_c5_geometry_only.py'); p.write_text(src)
          print('geometry_engine_sha256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Build exact causal C5 Z4 geometry table
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/z4_c5_geometry_only.py --files /tmp/xau/bid/*.csv --output /tmp/Z4_C5_GEOMETRY_ONLY.pkl --tag Z4_C5_EBUY_COVERAGE
          python - <<'PY'
          import pandas as pd
          d=pd.read_pickle('/tmp/Z4_C5_GEOMETRY_ONLY.pkl')
          forbidden={'revisited','touch_idx','mfe5_v','mae5_v','sweep_far','reclaim_peak','reclaim_full'}
          assert not (forbidden & set(d.columns)), forbidden & set(d.columns)
          assert len(d)>100000 and d.time.nunique()>20000,(len(d),d.time.nunique())
          print({'rows':len(d),'zone_landmark_times':int(d.time.nunique())})
          PY

      - name: Run frozen E-BUY coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ebuy
          python xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py \
            --files /tmp/xau/bid/*.csv \
            --z4-pkl /tmp/Z4_C5_GEOMETRY_ONLY.pkl \
            --output /tmp/ebuy/XAUUSD_Z4_EBUY_COVERAGE_RESULT_v0_1.json \
            --selected-csv /tmp/ebuy/XAUUSD_Z4_EBUY_SELECTED_CANDIDATES_v0_1.csv

      - name: Build immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          result=Path('/tmp/ebuy/XAUUSD_Z4_EBUY_COVERAGE_RESULT_v0_1.json')
          x=json.loads(result.read_text())
          files={
            'prereg':'xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_COVERAGE_PREREG_v0_1_2026-08-25.md',
            'coverage_engine':'xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py',
            'z4_geometry_engine':'/tmp/z4_c5_geometry_only.py',
            'result':str(result),
            'selected_candidates':'/tmp/ebuy/XAUUSD_Z4_EBUY_SELECTED_CANDIDATES_v0_1.csv'
          }
          sha={k:hashlib.sha256(Path(v).read_bytes()).hexdigest() for k,v in files.items()}
          sources={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('/tmp/xau/bid').glob('*.csv'))}
          m={'status':'EBUY_COVERAGE_PROVENANCE_RECORDED','result_status':x['status'],'future_price_outcomes_used':False,'sha256':sha,'source_sha256':sources,
             'selected_architecture':x.get('selected_architecture'),'eligible_snapshot_count':x.get('eligible_snapshot_count')}
          Path('/tmp/ebuy/XAUUSD_Z4_EBUY_COVERAGE_MANIFEST_v0_1.json').write_text(json.dumps(m,indent=2))
          print(json.dumps(m,indent=2))
          PY

      - name: Publish frozen E-BUY coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/ebuy-coverage-v0-1
          mkdir -p "$out"
          cp /tmp/ebuy/XAUUSD_Z4_EBUY_COVERAGE_RESULT_v0_1.json "$out/"
          cp /tmp/ebuy/XAUUSD_Z4_EBUY_COVERAGE_MANIFEST_v0_1.json "$out/"
          gzip -c /tmp/ebuy/XAUUSD_Z4_EBUY_SELECTED_CANDIDATES_v0_1.csv > "$out/XAUUSD_Z4_EBUY_SELECTED_CANDIDATES_v0_1.csv.gz"
          cp /tmp/Z4_C5_GEOMETRY_ONLY_summary.json "$out/Z4_C5_GEOMETRY_ONLY_summary.json"
          git add "$out"
          git commit -m 'publish frozen BUY-only E-zone coverage evidence [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
