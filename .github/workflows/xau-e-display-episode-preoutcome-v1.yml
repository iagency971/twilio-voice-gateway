name: XAU E display episode V1 pre-outcome repair

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-display-episode-preoutcome-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  SOURCE_MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  FROZEN_Z4_RUN_ID: '33139524456'

jobs:
  preoutcome:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Frozen upstream guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py)" = "ef45037d2a99a705ddf9bfbc3ebc666f88119a80"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_2.py)" = "8d7a7d93e7259d98b0a69a5ebcb50960be7be1bb"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_3.py)" = "10747fcf3bc9fa4e362fc7b42592d3eebba2fe12"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py)" = "bfb0d65efce0f5773b2045eaf4c31ed6bc07740f"
          test "$(git hash-object "$SOURCE_MANIFEST")" = "3f22fdf2602f158b4e0ef6a845e20cb85be68fce"
          python -m py_compile \
            "$PKG/xau_ebuy_provenance_instrument_v1.py" \
            "$PKG/xau_e_v04_exact_parity_v1.py" \
            "$PKG/xau_e_display_episode_snapshot_v1.py" \
            "$PKG/xau_e_display_episode_snapshot_qa_v1.py" \
            "$PKG/xau_e_display_episode_reaction_labeler_v1.py" \
            "$PKG/xau_e_display_episode_model_eval_v1.py"

      - name: Install locked scientific environment
        run: |
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          python -m pip freeze | sort > /tmp/PIP_FREEZE.txt
          python - <<'PY' > /tmp/ENVIRONMENT.json
          import json,platform,numpy,pandas,scipy,sklearn
          print(json.dumps({'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,'scipy':scipy.__version__,'scikit_learn':sklearn.__version__},indent=2,sort_keys=True))
          PY

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_Z4_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true

      - name: Assemble frozen Z4 and acquire hash-verified causal BID M1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/results
          python - <<'PY'
          import glob,hashlib,json,os,subprocess
          from pathlib import Path
          import pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'))
          assert len(fs)==24, len(fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          assert set(z.columns)=={'time','landmark_i','center','zlo','zhi','side'}, set(z.columns)
          assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z')
          assert z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z')
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl')
          m=json.load(open(os.environ['SOURCE_MANIFEST']))
          rows=[]
          for x in m['files']:
              if x['side']!='bid': continue
              key=f"{int(x['year']):04d}-{int(x['month']):02d}"
              if '2024-01'<=key<='2026-07': rows.append(x)
          assert len(rows)==31, len(rows)
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          actual={}
          for x in rows:
              p=Path('/tmp/raw')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              h=hashlib.sha256(p.read_bytes()).hexdigest();assert h==x['sha256'],(x['file'],h,x['sha256'])
              actual[x['file']]={'expected_sha256':x['sha256'],'actual_sha256':h,'bytes':p.stat().st_size}
          zparts={Path(f).name:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in fs}
          out={'status':'E_DISPLAY_EPISODE_INPUT_QA_PASS','future_price_outcomes_used':False,'bid_months':len(rows),'bid_files':actual,'frozen_z4_run_id':33139524456,'z4_monthly_parts':zparts,'z4_rows':len(z),'z4_first':str(z.time.min()),'z4_last':str(z.time.max())}
          Path('/tmp/results/DATA_INPUT_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':out['status'],'bid_months':len(rows),'z4_parts':len(fs),'z4_rows':len(z)},indent=2))
          PY

      - name: Rebuild frozen v0.4 display reference outcome-blind
        shell: bash
        run: |
          python xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py \
            --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output /tmp/results/V04_REFERENCE_RESULT.json \
            --candidates-csv /tmp/results/V04_REFERENCE_CANDIDATES.csv.gz

      - name: Instrument provenance with geometry-neutral sidecar
        shell: bash
        run: |
          python "$PKG/xau_ebuy_provenance_instrument_v1.py" \
            --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output-csv /tmp/results/E_DISPLAY_PROVENANCE_V1_24M.csv.gz \
            --manifest /tmp/results/E_DISPLAY_PROVENANCE_V1_MANIFEST.json \
            --reference-v04-csv /tmp/results/V04_REFERENCE_CANDIDATES.csv.gz
          python "$PKG/xau_e_v04_exact_parity_v1.py" \
            --reference /tmp/results/V04_REFERENCE_CANDIDATES.csv.gz \
            --instrumented /tmp/results/E_DISPLAY_PROVENANCE_V1_24M.csv.gz \
            --output /tmp/results/E_V04_EXACT_DISPLAY_PARITY.json

      - name: Build display-episode ledger twice deterministically
        shell: bash
        run: |
          python "$PKG/xau_e_display_episode_snapshot_v1.py" \
            --candidates /tmp/results/E_DISPLAY_PROVENANCE_V1_24M.csv.gz \
            --output /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz \
            --dev-output /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz \
            --replication-output /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz \
            --manifest /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_MANIFEST.json
          python "$PKG/xau_e_display_episode_snapshot_v1.py" \
            --candidates /tmp/results/E_DISPLAY_PROVENANCE_V1_24M.csv.gz \
            --output /tmp/results/REPEAT_LEDGER.csv.gz \
            --dev-output /tmp/results/REPEAT_DEV.csv.gz \
            --replication-output /tmp/results/REPEAT_REPLICATION.csv.gz \
            --manifest /tmp/results/REPEAT_MANIFEST.json
          cmp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz /tmp/results/REPEAT_LEDGER.csv.gz
          cmp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz /tmp/results/REPEAT_DEV.csv.gz
          cmp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz /tmp/results/REPEAT_REPLICATION.csv.gz
          rm /tmp/results/REPEAT_*.gz /tmp/results/REPEAT_MANIFEST.json

      - name: Independent feature-ledger QA
        shell: bash
        run: |
          python "$PKG/xau_e_display_episode_snapshot_qa_v1.py" \
            --ledger /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz \
            --dev-ledger /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz \
            --replication-ledger /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz \
            --builder-manifest /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_MANIFEST.json \
            --provenance-manifest /tmp/results/E_DISPLAY_PROVENANCE_V1_MANIFEST.json \
            --output /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_QA.json

      - name: Synthetic-only reaction and model tests
        shell: bash
        run: |
          python "$PKG/test_xau_e_display_episode_reaction_labeler_v1.py" | tee /tmp/results/SYNTHETIC_REACTION_LABELER_V1.json
          python "$PKG/test_xau_e_display_episode_model_eval_v1.py" | tee /tmp/results/SYNTHETIC_MODEL_EVAL_V1.json

      - name: Freeze hashes and pre-outcome authorization state
        shell: bash
        env:
          METHOD_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cp /tmp/ENVIRONMENT.json /tmp/results/ENVIRONMENT.json
          cp /tmp/PIP_FREEZE.txt /tmp/results/PIP_FREEZE.txt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          pkg=Path(os.environ['PKG']);r=Path('/tmp/results')
          method_files=[
            pkg/'XAUUSD_E_DISPLAY_EPISODE_PRE_OUTCOME_REPAIR_SPEC_v1_0_2026-08-29.md',
            pkg/'XAUUSD_E_DISPLAY_EPISODE_TIMING_ADDENDUM_v1_0_2026-08-29.md',
            pkg/'E_DISPLAY_EPISODE_FEATURE_REGISTRY_v1.json',pkg/'requirements-lock.txt',
            pkg/'xau_ebuy_provenance_instrument_v1.py',pkg/'xau_e_v04_exact_parity_v1.py',
            pkg/'xau_e_display_episode_snapshot_v1.py',pkg/'xau_e_display_episode_snapshot_qa_v1.py',
            pkg/'xau_e_display_episode_reaction_labeler_v1.py',pkg/'test_xau_e_display_episode_reaction_labeler_v1.py',
            pkg/'xau_e_display_episode_model_eval_v1.py',pkg/'test_xau_e_display_episode_model_eval_v1.py',
            Path('xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py'),Path('xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_2.py'),
            Path('xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_3.py'),Path('xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py'),Path(os.environ['SOURCE_MANIFEST'])]
          evidence=[p for p in sorted(r.iterdir()) if p.name!='V04_REFERENCE_CANDIDATES.csv.gz']
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          qa=json.loads((r/'E_DISPLAY_EPISODE_LEDGER_V1_QA.json').read_text());par=json.loads((r/'E_V04_EXACT_DISPLAY_PARITY.json').read_text())
          syn1=json.loads((r/'SYNTHETIC_REACTION_LABELER_V1.json').read_text());syn2=json.loads((r/'SYNTHETIC_MODEL_EVAL_V1.json').read_text())
          ready=qa['status']=='E_DISPLAY_EPISODE_SNAPSHOT_V1_REAL_QA_PASS' and par['status']=='E_V04_EXACT_DISPLAY_PARITY_PASS' and syn1['status']=='SYNTHETIC_REACTION_LABELER_V1_PASS' and syn2['status']=='SYNTHETIC_MODEL_EVAL_V1_PASS'
          out={'status':'E_DISPLAY_EPISODE_V1_PRE_OUTCOME_REPAIR_PASS' if ready else 'E_DISPLAY_EPISODE_V1_PRE_OUTCOME_REPAIR_FAIL','future_price_outcomes_used':False,'method_commit':os.environ['METHOD_COMMIT'],'workflow_run_id':int(os.environ['RUN_ID']),'frozen_z4_run_id':33139524456,
            'method_sha256':{str(p):h(p) for p in method_files},'evidence_sha256':{p.name:h(p) for p in evidence},
            'real_outcome_generation':'FORBIDDEN','real_outcome_reading':'FORBIDDEN','model_fit_on_real_labels':'FORBIDDEN','pine_modification':'FORBIDDEN',
            'next_authorization':'READY_FOR_NEW_PRO_PRE_OUTCOME_GATE' if ready else 'BLOCK_OUTCOME_OPENING'}
          (r/'PRE_OUTCOME_PACKAGE_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps({'status':out['status'],'next_authorization':out['next_authorization']},indent=2))
          if not ready:raise SystemExit(5)
          PY

      - name: Stage canonical outcome-blind evidence in repository
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/results/E_DISPLAY_PROVENANCE_V1_24M.csv.gz "$PKG/"
          cp /tmp/results/E_DISPLAY_PROVENANCE_V1_MANIFEST.json "$PKG/"
          cp /tmp/results/E_V04_EXACT_DISPLAY_PARITY.json "$PKG/"
          cp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz "$PKG/"
          cp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz "$PKG/"
          cp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz "$PKG/"
          cp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_MANIFEST.json "$PKG/"
          cp /tmp/results/E_DISPLAY_EPISODE_LEDGER_V1_QA.json "$PKG/"
          cp /tmp/results/SYNTHETIC_REACTION_LABELER_V1.json "$PKG/"
          cp /tmp/results/SYNTHETIC_MODEL_EVAL_V1.json "$PKG/"
          cp /tmp/results/DATA_INPUT_MANIFEST.json "$PKG/"
          cp /tmp/results/ENVIRONMENT.json "$PKG/"
          cp /tmp/results/PIP_FREEZE.txt "$PKG/"
          cp /tmp/results/PRE_OUTCOME_PACKAGE_MANIFEST.json "$PKG/"

      - uses: actions/upload-artifact@v4
        with:
          name: e-display-episode-v1-preoutcome
          if-no-files-found: error
          retention-days: 90
          path: /tmp/results/*

      - name: Commit canonical outcome-blind repair package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/xau-wick-zone-pro-dev
          git rebase origin/agent/xau-wick-zone-pro-dev
          git add "$PKG"
          git commit -m 'freeze E display episode V1 pre-outcome repair package'
          git push origin HEAD:agent/xau-wick-zone-pro-dev
