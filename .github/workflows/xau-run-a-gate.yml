name: XAUUSD Run A Gate

on:
  push:
    branches:
      - agent/xau-run-a-transient
    paths:
      - 'xau-run-a/**'
      - '.github/workflows/xau-run-a-gate.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  run-a-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout transient branch
        uses: actions/checkout@v4

      - name: Diagnose transferred research runner
        shell: bash
        run: |
          set -u
          sha256sum xau-run-a/minrunner.b64.part00 xau-run-a/minrunner.b64.part01 xau-run-a/minrunner.b64.part02 xau-run-a/minrunner.b64.part03
          cat xau-run-a/minrunner.b64.part00 xau-run-a/minrunner.b64.part01 xau-run-a/minrunner.b64.part02 xau-run-a/minrunner.b64.part03 > /tmp/minrunner.b64
          echo "B64_BYTES=$(wc -c < /tmp/minrunner.b64)"
          sha256sum /tmp/minrunner.b64
          base64 -d /tmp/minrunner.b64 > /tmp/xau_runner_min.zip
          echo "ZIP_SHA=$(sha256sum /tmp/xau_runner_min.zip)"
          unzip -t /tmp/xau_runner_min.zip || true
          exit 1
