name: XAU Core Evidence Audit V1 Repair 2012 and Aggregate
on:
  push:
    branches: [agent/xau-core-evidence-audit-v1]
    paths:
      - '.github/workflows/xau-core-evidence-audit-repair-2012.yml'
permissions:
  contents: write
  actions: read
jobs:
  repair2012:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Publish REPAIR_RUNNING marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,json,os,requests
          path='xau-final-results/xau_core_evidence_audit_v1/RUN_STATUS.json'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          payload=json.dumps({'status':'REPAIR_RUNNING','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'source_commit':os.environ.get('GITHUB_SHA'),'repair':'2012_JSON_INF_SERIALIZATION_ONLY','original_audit_run_id':'32298780353'},indent=2).encode()
          body={'message':'mark XAU core audit 2012 repair running [skip ci]','content':base64.b64encode(payload).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Rehydrate exact canonical 2012 input window
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2011-01 --to-month 2013-01 --out /tmp/xau_core_audit_2012.csv
      - name: Reconstruct 2012 ledger and parity with JSON-safe serializer
        env:
          PYTHONPATH: xau-multiyear/src:xau-multiyear/scripts
        run: |
          python xau-multiyear/scripts/run_xau_core_audit_annual_v1_jsonsafe.py /tmp/xau_core_audit_2012.csv \
            --year 2012 \
            --expected-annual-summary xau-final-results/phase_c_vantage_raw_2011_2025/annual/2012_summary.csv \
            --out /tmp/core_audit_2012
      - name: Assert repaired 2012 parity passes
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/core_audit_2012/parity_2012.json'))
          assert p['pass'] is True, p
          print('REPAIRED_2012_PARITY_PASS',p['core_entry_events'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-core-audit-year-2012-repaired
          path: /tmp/core_audit_2012
          retention-days: 7

  aggregate:
    needs: repair2012
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Download 2011-2025 artifacts from original audit run
        uses: actions/download-artifact@v4
        with:
          pattern: xau-core-audit-year-*
          path: /tmp/core_annual
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32298780353
      - name: Overlay repaired 2012 artifact
        uses: actions/download-artifact@v4
        with:
          name: xau-core-audit-year-2012-repaired
          path: /tmp/core_annual
          merge-multiple: true
      - name: Verify complete annual input set
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/core_annual')
          par=sorted(p.glob('parity_*.json')); led=sorted(p.glob('ledger_*.csv.gz'))
          print('PARITY_FILES',len(par),'LEDGER_FILES',len(led))
          assert len(par)==15 and len(led)==15
          assert (p/'parity_2012.json').exists() and (p/'ledger_2012.csv.gz').exists()
          PY
      - name: Aggregate frozen audit and diagnostics
        run: |
          python xau-multiyear/scripts/aggregate_xau_core_audit_v1.py \
            --annual-dir /tmp/core_annual \
            --survivors xau-final-results/phase_c_vantage_raw_2011_2025/survivors.csv \
            --out /tmp/core_final
      - name: Publish final audit outputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,requests,time
          out=pathlib.Path('/tmp/core_final')
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          root='xau-final-results/xau_core_evidence_audit_v1'
          def put(path,data,msg):
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':msg,'content':base64.b64encode(data).decode(),'branch':os.environ['BRANCH']}
                  if sha: body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201): return
                  if r.status_code not in (409,422): r.raise_for_status()
                  time.sleep(1+attempt)
              raise RuntimeError(f'publish failed {path}')
          for p in sorted(out.iterdir()):
              if p.is_file(): put(f'{root}/{p.name}',p.read_bytes(),f'publish repaired XAU core audit {p.name} [skip ci]')
          status={'status':'COMPLETE','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'source_commit':os.environ.get('GITHUB_SHA'),'repair':'2012_JSON_INF_SERIALIZATION_ONLY','original_audit_run_id':'32298780353'}
          put(f'{root}/RUN_STATUS.json',json.dumps(status,indent=2).encode(),'mark repaired XAU core evidence audit complete [skip ci]')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-core-evidence-audit-v1-final
          path: /tmp/core_final
          retention-days: 14
