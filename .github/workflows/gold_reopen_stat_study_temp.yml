name: Gold reopen statistical study temp

on:
  push:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Compute BID ASK executable statistics from archived Dukascopy data
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,io,json,statistics,urllib.request
          from datetime import datetime,timezone,timedelta
          from zoneinfo import ZoneInfo
          from concurrent.futures import ThreadPoolExecutor,as_completed
          ny=ZoneInfo('America/New_York')
          tasks=[]
          for side in ('bid','ask'):
            for y in range(2020,2027):
              for m in range(1,(8 if y==2026 else 12)+1): tasks.append((side,y,m))
          def one(t):
            side,y,m=t; url=f'https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/{side}/m1/xauusd_{side}_m1_{y}_{m:02d}.csv'
            req=urllib.request.Request(url,headers={'User-Agent':'gold-reopen-study'})
            o={};mx=None
            with urllib.request.urlopen(req,timeout=90) as resp:
              for row in csv.DictReader(io.TextIOWrapper(resp,encoding='utf-8')):
                du=datetime.fromtimestamp(int(float(row['timestamp']))/1000,timezone.utc);mx=du if mx is None or du>mx else mx;d=du.astimezone(ny)
                if (d.hour==16 and 55<=d.minute<=59) or (d.hour==18 and d.minute==0):
                  o[f'{d.date().isoformat()}|{d.hour:02d}:{d.minute:02d}']={'open':float(row['open']),'high':float(row['high']),'low':float(row['low']),'close':float(row['close'])}
            return side,o,mx.isoformat() if mx else None
          D={'bid':{},'ask':{}};mx={'bid':None,'ask':None}
          with ThreadPoolExecutor(max_workers=6) as ex:
            for fut in as_completed([ex.submit(one,t) for t in tasks]):
              s,o,m=fut.result();D[s].update(o);mx[s]=m if m and (mx[s] is None or m>mx[s]) else mx[s]
          def g(s,d,h,m):return D[s].get(f'{d.isoformat()}|{h:02d}:{m:02d}')
          def active(bs):
            if any(x is None for x in bs):return False
            v=[]
            for b in bs:v += [b['open'],b['high'],b['low'],b['close']]
            return max(v)-min(v)>1e-9
          events=[]
          for k in sorted(D['bid']):
            ds,ts=k.split('|')
            if ts!='18:00':continue
            d=datetime.fromisoformat(ds).date()
            if d.weekday()==6:typ='WEEKEND';prev=d-timedelta(days=2)
            elif d.weekday() in (0,1,2,3):typ='NORMAL';prev=d
            else:continue
            be=[g('bid',prev,16,m) for m in range(55,60)];ae=[g('ask',prev,16,m) for m in range(55,60)];rb=g('bid',d,18,0)
            if rb is None or any(x is None for x in be+ae) or not active(be):continue
            e={'year':d.year,'type':typ,'m':{}}
            for i,m in enumerate(range(55,60)):
              ent=ae[i]['open'];e['m'][str(m)]={'to_open':rb['open']-ent,'to_1m':rb['close']-ent,'spread':ae[i]['open']-be[i]['open']}
            events.append(e)
          def pct(k,n):return 100*k/n if n else None
          def mean(x):return statistics.fmean(x) if x else None
          def med(x):return statistics.median(x) if x else None
          def S(es):
            n=len(es);z={'N':n,'entry':{}}
            for m in range(55,60):
              a=[e['m'][str(m)]['to_open'] for e in es];b=[e['m'][str(m)]['to_1m'] for e in es];s=[e['m'][str(m)]['spread'] for e in es]
              z['entry'][f'16:{m}']={'reopen_win_pct':pct(sum(x>0 for x in a),n),'reopen_mean':mean(a),'after1m_win_pct':pct(sum(x>0 for x in b),n),'after1m_mean':mean(b),'after1m_median':med(b),'spread_mean':mean(s),'spread_median':med(s)}
            return z
          out={'cutoff':mx,'events':len(events),'groups':{'NORMAL':S([e for e in events if e['type']=='NORMAL']),'WEEKEND':S([e for e in events if e['type']=='WEEKEND'])},'yearly':{}}
          for y in range(2020,2027):
            ys=[e for e in events if e['year']==y];out['yearly'][str(y)]={'NORMAL':S([e for e in ys if e['type']=='NORMAL']),'WEEKEND':S([e for e in ys if e['type']=='WEEKEND'])}
          print('EXEC_JSON_START');print(json.dumps(out,sort_keys=True));print('EXEC_JSON_END')
          PY