name: XAU Z4 FOREXCOM Final NoAuth Probes

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-forexcom-last-noauth-probes.yml'

permissions:
  contents: write

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check websocket-client==1.8.0 requests==2.31.0

      - name: Probe official FOREX.com REST without credentials
        shell: bash
        run: |
          mkdir -p xau-wick-zone-pro/feed-parity/forexcom-noauth-probes
          python - <<'PY'
          import json,requests
          from pathlib import Path
          base='https://ciapi.cityindex.com/TradingAPI'
          urls=[
            base+'/market/search?SearchByMarketName=TRUE&Query=Gold&MaxResults=5&includeOptions=False',
            base+'/market/search?SearchByMarketName=TRUE&Query=XAU%2FUSD&MaxResults=5&includeOptions=False',
            base+'/market/401166448/barhistory?interval=MINUTE&span=1&PriceBars=10&PriceType=MID'
          ]
          out=[]
          for u in urls:
            try:
              r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              out.append({'url':u,'status_code':r.status_code,'content_type':r.headers.get('content-type'),'body_prefix':r.text[:1000]})
            except Exception as e:out.append({'url':u,'error':repr(e)})
          Path('xau-wick-zone-pro/feed-parity/forexcom-noauth-probes/FOREXCOM_OFFICIAL_REST_NOAUTH_PROBE.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Probe large initial chart-series request
        shell: bash
        run: |
          python - <<'PY'
          import gzip,json,random,string,time,websocket
          from datetime import datetime,timezone
          from pathlib import Path
          SYMBOL='FOREXCOM:XAUUSD';REQUEST=50000
          def rid(p):return p+'_'+''.join(random.choice(string.ascii_lowercase) for _ in range(12))
          def pack(m,p):
            s=json.dumps({'m':m,'p':p},separators=(',',':'));return f'~m~{len(s)}~m~'+s
          ws=websocket.create_connection('wss://data.tradingview.com/socket.io/websocket?from=chart%2F',timeout=25,origin='https://www.tradingview.com',header=['User-Agent: Mozilla/5.0'])
          cs=rid('cs');rows={};resolved=None;events=[]
          def send(m,p):ws.send(pack(m,p))
          send('set_auth_token',['unauthorized_user_token']);send('chart_create_session',[cs,''])
          send('resolve_symbol',[cs,'symbol_1','={"symbol":"FOREXCOM:XAUUSD","adjustment":"splits","session":"regular"}'])
          send('create_series',[cs,'s1','s1','symbol_1','1',REQUEST])
          t0=time.time();complete=False
          while time.time()-t0<60:
            try:msg=ws.recv()
            except Exception as e:events.append({'recv_error':repr(e)});break
            if isinstance(msg,str) and msg.startswith('~m~') and '~h~' in msg and msg.count('~m~')==2:
              try:ws.send(msg)
              except:pass
            if not isinstance(msg,str):continue
            for part in msg.split('~m~'):
              if not part or part.isdigit() or part.startswith('~h~'):continue
              try:o=json.loads(part)
              except:continue
              m=o.get('m');p=o.get('p',[])
              if m=='symbol_resolved' and len(p)>=3:resolved=p[2]
              if m in ('series_error','critical_error','protocol_error','symbol_error'):events.append(o)
              if m=='timescale_update' and len(p)>=2 and isinstance(p[1],dict):
                s=p[1].get('s1')
                if isinstance(s,dict):
                  for rec in s.get('s',[]) or []:
                    v=rec.get('v') if isinstance(rec,dict) else None
                    if v and len(v)>=5 and v[0] is not None:rows[int(v[0])]=v
              if m=='series_completed' and len(p)>=2 and p[0]==cs and p[1]=='s1':complete=True;break
            if complete:break
          ws.close();keys=sorted(rows)
          meta={'requested':REQUEST,'bars':len(keys),'series_completed':complete,'events':events,'resolved_full_name':resolved.get('full_name') if isinstance(resolved,dict) else None,
                'bar_source':resolved.get('bar_source') if isinstance(resolved,dict) else None,
                'first':datetime.fromtimestamp(keys[0],timezone.utc).isoformat().replace('+00:00','Z') if keys else None,
                'last':datetime.fromtimestamp(keys[-1],timezone.utc).isoformat().replace('+00:00','Z') if keys else None}
          Path('xau-wick-zone-pro/feed-parity/forexcom-noauth-probes/FOREXCOM_TV_INITIAL_50000_PROBE.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY

      - name: Publish no-auth probe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          git add xau-wick-zone-pro/feed-parity/forexcom-noauth-probes/ || true
          git commit -m 'publish final FOREXCOM no-auth depth probes [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
