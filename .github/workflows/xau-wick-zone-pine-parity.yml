name: XAU Z4 Pine Outcome-Blind Parity

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-pine-parity.yml'

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen parity prereg and scientific reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object xau-wick-zone-pro/xau_zone_episode_dev_z4.py)" = "a8a147615c3fd366c49e93b340fd2018b5b66e9e"
          test "$(git hash-object xau-wick-zone-pro/results/XAUUSD_Z4_FROZEN_MODEL_PARAMS_v0_1.json)" = "c95fd545ec451968cb421f81ed6add0c508f387d"
      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1
      - name: Download and hash-lock DEV BID Jan-Jul 2024
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/bid
          declare -A H
          H[01]=7414d1cf6a02cf4fff5347e79602e9109549622cb73b152e5462188cc797135d
          H[02]=45060c59ccfc0ef3d5f78b49d793b7e3f97757a7659c604b887850068346621f
          H[03]=28c82e54e1bd7f586f5d22c0c39d9217618f62e8dfdd7eab94602c2c2bb81a14
          H[04]=ce55b0d9acdf20c694c37e3c53233455cc8b772269eb39f60357808abe37b9c9
          H[05]=18084ecf8e9d5cef352cc290a55de29f27f006653b5da24a6520f8a02488f4f6
          H[06]=f7cad6452e9666b37f6f7830bb69a61439095919bb1609daa80839fdb3a8fd39
          H[07]=a1c432b64a36118f1934c9c838cee83c1f05181fbfd602452fd3d46acdd4fd52
          for m in 01 02 03 04 05 06 07; do
            f="xauusd_bid_m1_2024_${m}.csv"
            curl --fail --location --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/${f}" -o "/tmp/xau/bid/${f}"
            got=$(sha256sum "/tmp/xau/bid/${f}" | awk '{print $1}')
            test "$got" = "${H[$m]}"
          done
      - name: Build exact frozen Z4 DEV reference
        run: python xau-wick-zone-pro/xau_zone_episode_dev_z4.py --files /tmp/xau/bid/*.csv --output /tmp/Z4_EXACT.pkl --tag Z4_EXACT_PARITY_DEV
      - name: Build Pine-feasible Z4 3-box proxy
        run: python xau-wick-zone-pro/xau_wick_zone_box3_proxy.py --files /tmp/xau/bid/*.csv --output /tmp/Z4_BOX3.pkl --tag Z4_BOX3_PARITY_DEV
      - name: Apply frozen outcome-blind parity gate
        run: |
          python xau-wick-zone-pro/xau_wick_zone_parity_compare.py \
            --exact-pkl /tmp/Z4_EXACT.pkl \
            --proxy-pkl /tmp/Z4_BOX3.pkl \
            --frozen-json xau-wick-zone-pro/results/XAUUSD_Z4_FROZEN_MODEL_PARAMS_v0_1.json \
            --output /tmp/XAUUSD_Z4_PINE_BOX3_PARITY_RESULTS_v0_1.json
      - name: Publish parity evidence race-safe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-wick-zone-pro-dev
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          files={
            'xau-wick-zone-pro/parity/XAUUSD_Z4_EXACT_PARITY_DEV_summary.json':'/tmp/Z4_EXACT_summary.json',
            'xau-wick-zone-pro/parity/XAUUSD_Z4_BOX3_PARITY_DEV_summary.json':'/tmp/Z4_BOX3_summary.json',
            'xau-wick-zone-pro/parity/XAUUSD_Z4_PINE_BOX3_PARITY_RESULTS_v0_1.json':'/tmp/XAUUSD_Z4_PINE_BOX3_PARITY_RESULTS_v0_1.json',
            'xau-wick-zone-pro/parity/XAUUSD_Z4_PINE_BOX3_PARITY_MATCHED_v0_1.csv':'/tmp/XAUUSD_Z4_PINE_BOX3_PARITY_RESULTS_v0_1.matched.csv'
          }
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          for path,src in files.items():
              url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              body={'message':f'publish outcome-blind Z4 Pine parity {path.split("/")[-1]} [skip ci]','content':base64.b64encode(open(src,'rb').read()).decode(),'branch':os.environ['BRANCH']}
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=h,method='PUT')
              with urllib.request.urlopen(req,timeout=60) as r: print(path,r.status)
          PY
