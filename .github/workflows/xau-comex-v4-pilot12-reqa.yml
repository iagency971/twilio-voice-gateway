# qa-only: canonical research-day DEV_RANK1 coverage
name: XAU COMEX DEV_RANK1 Coverage Correct DayKey

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v4-pilot12-reqa.yml']

permissions:
  actions: read
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 requests
      - uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32102932187
      - name: Rebuild coverage with exact canonical trading_day_key semantics
        run: |
          python xau-multiyear/scripts/rebuild_comex_dev_rank1_coverage_correct_daykey.py \
            --events /tmp/plan/canonical_events_all.csv.gz \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --out /tmp/coverage
      - name: Publish corrected coverage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/coverage');root='xau-final-results/comex_dev_rank1_gate_v1';h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for p in src.iterdir():
              if not p.is_file():continue
              path=f'{root}/{p.name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None;body={'message':f'publish canonical-day DEV_RANK1 coverage {p.name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
