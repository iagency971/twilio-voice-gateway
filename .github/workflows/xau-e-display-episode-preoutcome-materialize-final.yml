name: Materialize final E display pre-outcome package

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-display-episode-preoutcome-materialize-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  CANONICAL_RUN_ID: '33259414496'
  CANONICAL_METHOD_COMMIT: '7ef065e209c94e21950c346eed9d4ae0a2d786da'

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.CANONICAL_RUN_ID }}
          name: e-display-episode-v1-preoutcome
          path: /tmp/final

      - name: Verify canonical artifact and method hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('/tmp/final')
          m=json.loads((r/'PRE_OUTCOME_PACKAGE_MANIFEST.json').read_text())
          assert m['status']=='E_DISPLAY_EPISODE_V1_PRE_OUTCOME_REPAIR_PASS',m
          assert m['next_authorization']=='READY_FOR_NEW_PRO_PRE_OUTCOME_GATE',m
          assert m['future_price_outcomes_used'] is False,m
          assert m['real_outcome_generation']=='FORBIDDEN',m
          assert m['real_outcome_reading']=='FORBIDDEN',m
          assert m['model_fit_on_real_labels']=='FORBIDDEN',m
          assert m['historical_replication_opening_before_dev_model_freeze']=='FORBIDDEN',m
          assert m['method_commit']==os.environ['CANONICAL_METHOD_COMMIT'],m
          assert int(m['workflow_run_id'])==int(os.environ['CANONICAL_RUN_ID']),m
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for name,exp in m['evidence_sha256'].items():
              p=r/name
              assert p.is_file(),name
              assert h(p)==exp,(name,h(p),exp)
          for name,exp in m['method_sha256'].items():
              p=Path(name)
              assert p.is_file(),name
              assert h(p)==exp,(name,h(p),exp)
          qa=json.loads((r/'E_DISPLAY_EPISODE_LEDGER_V1_QA.json').read_text())
          assert qa['status']=='E_DISPLAY_EPISODE_SNAPSHOT_V1_REAL_QA_PASS',qa
          assert qa['authorization']=='READY_FOR_NEW_PRO_PRE_OUTCOME_GATE',qa
          assert all(qa['checks'].values()),qa
          assert json.loads((r/'E_V04_EXACT_DISPLAY_PARITY.json').read_text())['status']=='E_V04_EXACT_DISPLAY_PARITY_PASS'
          assert json.loads((r/'SYNTHETIC_REACTION_LABELER_V1.json').read_text())['status']=='SYNTHETIC_REACTION_LABELER_V1_PASS'
          assert json.loads((r/'SYNTHETIC_MODEL_EVAL_V1.json').read_text())['status']=='SYNTHETIC_MODEL_EVAL_V1_PASS'
          print('FINAL_PREOUTCOME_ARTIFACT_AND_METHOD_HASHES_VERIFIED')
          PY

      - name: Materialize canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          files=(
            E_DISPLAY_PROVENANCE_V1_24M.csv.gz
            E_DISPLAY_PROVENANCE_V1_MANIFEST.json
            E_V04_EXACT_DISPLAY_PARITY.json
            E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz
            E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz
            E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz
            E_DISPLAY_EPISODE_LEDGER_V1_MANIFEST.json
            E_DISPLAY_EPISODE_LEDGER_V1_QA.json
            SYNTHETIC_REACTION_LABELER_V1.json
            SYNTHETIC_MODEL_EVAL_V1.json
            DATA_INPUT_MANIFEST.json
            ENVIRONMENT.json
            PIP_FREEZE.txt
            PRE_OUTCOME_PACKAGE_MANIFEST.json
          )
          for f in "${files[@]}"; do cp "/tmp/final/$f" "$PKG/$f"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PKG"
          if git diff --cached --quiet; then
            echo 'Canonical files already materialized'
          else
            git commit -m 'materialize canonical E display V1 pre-outcome PASS evidence'
            git push origin HEAD:agent/xau-wick-zone-pro-dev
          fi
