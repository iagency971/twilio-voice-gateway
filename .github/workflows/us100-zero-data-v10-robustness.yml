name: US100 Zero-Data FTMO Robustness V10

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-ftmo-v10
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen V10 robustness stress
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/ftmo_2step_robustness_v10
          python us100-zero-data/run_ftmo_2step_robustness_v10.py 2>&1 | tee us100-zero-data/results/ftmo_2step_robustness_v10/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/ftmo_2step_robustness_v10/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "FTMO_V10_FAILURE exit_code=$code" > us100-zero-data/results/ftmo_2step_robustness_v10/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/ftmo_2step_robustness_v10/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V10 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/ftmo_2step_robustness_v10
          git commit -m "Publish frozen FTMO robustness V10 [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
