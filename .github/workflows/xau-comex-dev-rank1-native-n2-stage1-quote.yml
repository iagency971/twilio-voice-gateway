name: XAU COMEX DEV_RANK1 Native N2 Stage1 Quote Only

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - 'xau-recovery/NATIVE_N2_STAGE1_QUOTE_TRIGGER.json'

permissions:
  contents: write

env:
  DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - run: python -m pip install pandas==2.2.3 databento requests

      - name: Build frozen Stage1 manifest and metadata quote only
        run: |
          python - <<'PY'
          import hashlib,json,os,time
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from pathlib import Path
          import pandas as pd,databento as db

          src=Path('xau-final-results/comex_dev_rank1_native_n2_quote_v1/native_n2_candidate_level_minutes.csv')
          out=Path('/tmp/stage1');out.mkdir(parents=True,exist_ok=True)
          x=pd.read_csv(src,dtype={'source_instrument_id':str})
          x['minute_start']=pd.to_datetime(x.minute_start_utc,utc=True)
          x=x.sort_values(['level_id','minute_start']).copy()
          x['candidate_rank']=x.groupby('level_id').cumcount()+1
          first=x[x.candidate_rank.eq(1)].copy()
          assert len(first)==243 and first.level_id.nunique()==243
          u=first[['eligible_next_research_date','source_instrument_id','minute_start']].drop_duplicates().copy()
          assert len(u)==222

          runs=[];minute_to_run={}
          for (date,iid),g in u.groupby(['eligible_next_research_date','source_instrument_id'],sort=True):
              times=sorted(g.minute_start.tolist());cur=[times[0]];groups=[]
              for ts in times[1:]:
                  if ts==cur[-1]+pd.Timedelta(minutes=1):cur.append(ts)
                  else:groups.append(cur);cur=[ts]
              groups.append(cur)
              for seq in groups:
                  start=seq[0];end=seq[-1]+pd.Timedelta(minutes=1)
                  rid=hashlib.sha256(f'NATIVE_N2_STAGE1|{iid}|{start.isoformat()}|{end.isoformat()}|trades'.encode()).hexdigest()[:24]
                  runs.append({'market_request_id':rid,'request_type':'NATIVE_N2_STAGE1_EXACT_TRADES','eligible_next_research_date':str(date),'source_instrument_id':str(iid),'dataset':'GLBX.MDP3','schema':'trades','symbols':str(iid),'stype_in':'instrument_id','start':start.isoformat(),'end':end.isoformat(),'candidate_minute_count':len(seq)})
                  for ts in seq:minute_to_run[(str(date),str(iid),ts.isoformat())]=rid
          r=pd.DataFrame(runs)
          assert len(r)==214 and int(r.candidate_minute_count.sum())==222
          first['stage1_market_request_id']=[minute_to_run[(str(z.eligible_next_research_date),str(z.source_instrument_id),z.minute_start.isoformat())] for z in first.itertuples()]

          c=db.Historical(os.environ['DATABENTO_API_KEY'])
          def cost(z):
              err=None
              for k in range(7):
                  try:return float(c.metadata.get_cost(dataset=z.dataset,symbols=str(z.symbols),stype_in=z.stype_in,schema=z.schema,start=z.start,end=z.end))
                  except Exception as e:err=e;time.sleep(min(20,2**k))
              raise RuntimeError(err)
          costs={};errs=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              fs={ex.submit(cost,z):z.market_request_id for z in r.itertuples(index=False)}
              for f in as_completed(fs):
                  rid=fs[f]
                  try:costs[rid]=f.result()
                  except Exception as e:errs.append({'market_request_id':rid,'error':str(e)})
          if errs:raise SystemExit(f'Stage1 quote failures={len(errs)} {errs[:3]}')
          r['cost_usd']=r.market_request_id.map(costs).astype(float)
          total=float(r.cost_usd.sum())
          first.drop(columns=['minute_start']).to_csv(out/'native_n2_stage1_level_manifest.csv',index=False)
          r.to_csv(out/'native_n2_stage1_market_request_manifest.csv',index=False)
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          z={'version':'COMEX_DEV_RANK1_NATIVE_N2_STAGE1_QUOTE_V1','authorization':'METADATA_ONLY_N2_STAGE1_DOWNLOAD_NOT_AUTHORIZED','market_data_download_performed':False,'n2_download_performed':False,'source_candidate_manifest_sha256':sha(src),'levels_stage1':243,'stage1_level_rows':243,'unique_first_candidate_minutes':222,'stage1_merged_market_requests':214,'one_minute_requests':int((r.candidate_minute_count==1).sum()),'two_minute_requests':int((r.candidate_minute_count==2).sum()),'exact_stage1_cost_usd':total,'level_manifest_sha256':sha(out/'native_n2_stage1_level_manifest.csv'),'market_request_manifest_sha256':sha(out/'native_n2_stage1_market_request_manifest.csv'),'sequential_freeze':'COMEX_DEV_RANK1_NATIVE_N2_SEQUENTIAL_ACQUISITION_FREEZE_v1.md','full_n2_union_quote_usd':3.637339174767,'n2_full_union_download_authorized':False,'dev_rank2_opened':False,'retro_confirm_opened':False,'locked_comex_test_opened':False,'notes':['metadata.get_cost only','No timeseries.get_range or batch market-data download is called','A separate explicit financial authorization is required before Stage1 raw trades download.']}
          (out/'native_n2_stage1_quote.json').write_text(json.dumps(z,indent=2));print(json.dumps(z,indent=2))
          PY

      - name: Hard QA quote-only
        run: |
          python - <<'PY'
          import json,pandas as pd
          z=json.load(open('/tmp/stage1/native_n2_stage1_quote.json'))
          assert z['version']=='COMEX_DEV_RANK1_NATIVE_N2_STAGE1_QUOTE_V1'
          assert z['market_data_download_performed'] is False and z['n2_download_performed'] is False
          assert z['levels_stage1']==243 and z['unique_first_candidate_minutes']==222 and z['stage1_merged_market_requests']==214
          assert z['one_minute_requests']==206 and z['two_minute_requests']==8
          assert z['exact_stage1_cost_usd']>=0
          assert z['n2_full_union_download_authorized'] is False
          a=pd.read_csv('/tmp/stage1/native_n2_stage1_level_manifest.csv');b=pd.read_csv('/tmp/stage1/native_n2_stage1_market_request_manifest.csv')
          assert len(a)==243 and a.level_id.nunique()==243 and len(b)==214
          print('N2_STAGE1_QUOTE_QA_OK',z['exact_stage1_cost_usd'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-n2-stage1-quote-v1
          path: /tmp/stage1/
          retention-days: 90

      - name: Publish Stage1 quote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/stage1');root='xau-final-results/comex_dev_rank1_native_n2_stage1_quote_v1'
          names=['native_n2_stage1_quote.json','native_n2_stage1_level_manifest.csv','native_n2_stage1_market_request_manifest.csv']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in names:
              p=src/name;dst=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}";payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish native N2 Stage1 quote {name} [skip ci]','content':payload,'branch':os.environ['BRANCH']}
                  if sha:body['sha']=sha
                  q=requests.put(u,headers=h,json=body)
                  if q.status_code in (200,201):break
                  if q.status_code not in (409,422):q.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:raise SystemExit(f'could not publish {dst}')
          PY
