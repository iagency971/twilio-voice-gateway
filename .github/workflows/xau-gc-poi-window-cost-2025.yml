name: XAU GC POI Window Cost 2025
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-gc-poi-window-cost-2025.yml'
permissions:
  contents: write
jobs:
  poi-window-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 databento requests==2.31.0
      - name: Fetch 2025 Phase B events
        run: |
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/iagency971/twilio-voice-gateway/agent/xau-phase-b-2025-result/xau-phase-b-results/2025/phase_b_events.csv.gz' \
            -o /tmp/phase_b_events_2025.csv.gz
      - name: Build causal POI windows and cost them only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          import databento as db

          EVENTS='/tmp/phase_b_events_2025.csv.gz'
          BEFORE_MIN=60
          AFTER_MIN=15
          ROUND_MIN=10
          FAMILIES=('DISPLACEMENT_ORIGIN','OBJECTIVE_LIQUIDITY','MEMORY')

          df=pd.read_csv(EVENTS)
          fam=df['constituent_families'].fillna('')
          mask=False
          for f in FAMILIES:
              mask = mask | fam.str.contains(f, regex=False)
          x=df.loc[mask].copy()
          ct=pd.to_datetime(x['contact_time'], utc=True).sort_values()

          starts=(ct-pd.Timedelta(minutes=BEFORE_MIN)).dt.floor(f'{ROUND_MIN}min')
          ends=(ct+pd.Timedelta(minutes=AFTER_MIN)).dt.ceil(f'{ROUND_MIN}min')
          intervals=sorted(zip(starts.tolist(), ends.tolist()), key=lambda z:z[0])
          merged=[]
          for s,e in intervals:
              if not merged or s > merged[-1][1]:
                  merged.append([s,e])
              elif e > merged[-1][1]:
                  merged[-1][1]=e

          covered_min=sum((e-s).total_seconds()/60 for s,e in merged)
          full_year_min=(pd.Timestamp('2026-01-01',tz='UTC')-pd.Timestamp('2025-01-01',tz='UTC')).total_seconds()/60

          client=db.Historical(os.environ['DATABENTO_API_KEY'])
          total=0.0
          rows=[]
          for i,(s,e) in enumerate(merged,1):
              kw=dict(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema='trades',start=s.isoformat(),end=e.isoformat())
              c=float(client.metadata.get_cost(**kw))
              total += c
              rows.append({'i':i,'start':s.isoformat(),'end':e.isoformat(),'cost_usd':c})
              if i % 100 == 0:
                  print('COSTED',i,'OF',len(merged),'RUNNING_USD',round(total,4))

          full_year_cost=float(client.metadata.get_cost(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema='trades',start='2025-01-01',end='2026-01-01'))
          out={
            'year':2025,
            'source_events_total':int(len(df)),
            'selected_events':int(len(x)),
            'selected_families_any':list(FAMILIES),
            'fvg_only_excluded':True,
            'window_before_minutes':BEFORE_MIN,
            'window_after_minutes':AFTER_MIN,
            'rounded_outward_to_minutes':ROUND_MIN,
            'merged_windows':int(len(merged)),
            'covered_minutes':covered_min,
            'calendar_coverage_pct':100*covered_min/full_year_min,
            'windowed_trades_cost_usd':total,
            'full_year_trades_cost_usd':full_year_cost,
            'saving_pct_vs_full_year':100*(1-total/full_year_cost),
            'download_performed':False,
            'note':'Metadata get_cost only. No market data downloaded.'
          }
          Path('/tmp/poi_window_cost_2025.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          Path('/tmp/poi_window_cost_2025_windows.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Publish compact cost result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64, os, pathlib, requests
          src=pathlib.Path('/tmp/poi_window_cost_2025.json')
          path='xau-final-results/gc_databento_cost/poi_window_cost_2025.json'
          url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          r=requests.get(url,headers=h,params={'ref':os.environ['BRANCH']})
          sha=r.json().get('sha') if r.status_code==200 else None
          body={'message':'publish GC POI window cost 2025 [skip ci]','content':base64.b64encode(src.read_bytes()).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          rr=requests.put(url,headers=h,json=body); rr.raise_for_status()
          PY
