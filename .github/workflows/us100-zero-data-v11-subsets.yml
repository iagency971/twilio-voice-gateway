name: US100 Zero-Data Six-Model 0.80 Robustness V13

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-v13-robustness
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen V13 six-model 0.80 robustness stress
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/v13_six_model_080_robustness
          python us100-zero-data/run_v13_six_model_080_robustness.py 2>&1 | tee us100-zero-data/results/v13_six_model_080_robustness/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/v13_six_model_080_robustness/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "V13_FAILURE exit_code=$code" > us100-zero-data/results/v13_six_model_080_robustness/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/v13_six_model_080_robustness/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V13 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/v13_six_model_080_robustness
          git commit -m "Publish frozen V13 six-model robustness results [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
