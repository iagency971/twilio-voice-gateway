name: US100 Zero-Data Fastest FTMO Subset Risk V12

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-v12-fastest
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run frozen V12 fastest subset-risk search
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/v12_fastest_ftmo_subset_risk
          python us100-zero-data/run_v12_fastest_ftmo_subset_risk.py 2>&1 | tee us100-zero-data/results/v12_fastest_ftmo_subset_risk/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/v12_fastest_ftmo_subset_risk/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "V12_FAILURE exit_code=$code" > us100-zero-data/results/v12_fastest_ftmo_subset_risk/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/v12_fastest_ftmo_subset_risk/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V12 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/v12_fastest_ftmo_subset_risk
          git commit -m "Publish frozen V12 fastest subset-risk results [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
