name: GBPUSD PropF DEV V1
on:
  push:
    branches: [agent/eurusd-propf-sprint-v1]
    paths:
      - 'eurusd-propf/gbpusd_dev_v1.py'
      - '.github/workflows/gbpusd-propf-dev-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/eurusd-propf-sprint-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy requests tzdata
      - shell: bash
        run: |
          set +e
          mkdir -p eurusd-propf/results/gbpusd_dev_v1
          python eurusd-propf/gbpusd_dev_v1.py --out eurusd-propf/results/gbpusd_dev_v1 --workers 10 2>&1 | tee eurusd-propf/results/gbpusd_dev_v1/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > eurusd-propf/results/gbpusd_dev_v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "GBPUSD_DEV_V1_FAILURE exit_code=$code" > eurusd-propf/results/gbpusd_dev_v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eurusd-propf/results/gbpusd_dev_v1
          git commit -m "Publish GBPUSD DEV V1 result [skip ci]" || true
          git push origin HEAD:agent/eurusd-propf-sprint-v1
