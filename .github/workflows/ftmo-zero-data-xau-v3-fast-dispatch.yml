name: FTMO Zero-Data XAUUSD V3 Fast DEV

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/ftmo-zero-data-xau-v3-fast.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ftmo-zero-data-xau-v3-fast
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-xau-v3
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run exact DEV-only fast gate
        shell: bash
        run: |
          set +e
          mkdir -p ftmo-zero-data/results/xau_v3_fast
          python ftmo-zero-data/run_xau_v3_dev_fast.py 2>&1 | tee ftmo-zero-data/results/xau_v3_fast/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > ftmo-zero-data/results/xau_v3_fast/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "XAU_V3_FAST_FAILURE exit_code=$code" > ftmo-zero-data/results/xau_v3_fast/WORKFLOW_FAILURE.txt; else rm -f ftmo-zero-data/results/xau_v3_fast/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish fast DEV results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ftmo-zero-data/results/xau_v3_fast
          git commit -m "Publish zero-data XAUUSD V3 fast DEV [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-xau-v3
