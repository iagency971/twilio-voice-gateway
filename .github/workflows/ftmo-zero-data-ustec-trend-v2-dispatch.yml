name: FTMO Zero-Data USTEC Trend V2 Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/ftmo-zero-data-ustec-trend-v2.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ftmo-zero-data-ustec-trend-v2
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-ustec-trend-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run sealed trend V2 DEV/validation
        shell: bash
        run: |
          set +e
          mkdir -p ftmo-zero-data/results/ustec_trend_v2
          python ftmo-zero-data/run_ustec_trend_v2.py 2>&1 | tee ftmo-zero-data/results/ustec_trend_v2/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > ftmo-zero-data/results/ustec_trend_v2/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "USTEC_TREND_V2_FAILURE exit_code=$code" > ftmo-zero-data/results/ustec_trend_v2/WORKFLOW_FAILURE.txt; else rm -f ftmo-zero-data/results/ustec_trend_v2/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish to research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ftmo-zero-data/results/ustec_trend_v2
          git commit -m "Publish zero-data USTEC trend V2 results [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-ustec-trend-v2
