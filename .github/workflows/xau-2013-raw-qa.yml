name: XAU 2013 Raw Feed QA
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-2013-raw-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2013-01 --to-month 2013-12 --out /tmp/xau2013.csv
      - run: python xau-multiyear/scripts/qa_xau_2013_raw.py /tmp/xau2013.csv /tmp/qa
      - name: Publish QA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64,os,requests
          files={'xau-final-results/phase_c_2013_raw_qa/qa.json':'/tmp/qa/qa.json','xau-final-results/phase_c_2013_raw_qa/top_gaps.csv':'/tmp/qa/top_gaps.csv','xau-final-results/phase_c_2013_raw_qa/top_spreads.csv':'/tmp/qa/top_spreads.csv','xau-final-results/phase_c_2013_raw_qa/top_ranges.csv':'/tmp/qa/top_ranges.csv'}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for path,src in files.items():
              url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              r=requests.get(url,headers=h,params={'ref':os.environ['BRANCH']}); sha=r.json().get('sha') if r.status_code==200 else None
              body={'message':f'publish 2013 raw QA {path.split("/")[-1]} [skip ci]','content':base64.b64encode(open(src,'rb').read()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              rr=requests.put(url,headers=h,json=body); rr.raise_for_status()
          PY
