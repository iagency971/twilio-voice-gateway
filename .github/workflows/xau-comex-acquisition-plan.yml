name: XAU COMEX Acquisition Plan V1
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - '.github/workflows/xau-comex-acquisition-plan.yml'
      - 'xau-multiyear/scripts/build_comex_event_table.py'
      - 'xau-multiyear/scripts/aggregate_comex_acquisition_plan.py'
permissions:
  contents: write
jobs:
  annual-events:
    strategy:
      fail-fast: false
      matrix:
        year: [2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Resolve annual acquisition window
        id: w
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          y=int(os.environ['YEAR'])
          print(f"from_month={'2010-06' if y==2011 else str(y-1)+'-01'}")
          print(f"to_month={y+1}-01")
          print(f"target_start={y}-01-01")
          print(f"target_end={y+1}-01-01")
          PY
        env:
          YEAR: ${{ matrix.year }}
      - name: Acquire XAUUSD M1 warmup + target
        run: >-
          python xau-multiyear/scripts/acquire_dukascopy_window.py
          --from-month '${{ steps.w.outputs.from_month }}'
          --to-month '${{ steps.w.outputs.to_month }}'
          --out /tmp/xau_${{ matrix.year }}.csv
      - name: Build canonical event timing table
        run: >-
          python xau-multiyear/scripts/build_comex_event_table.py
          /tmp/xau_${{ matrix.year }}.csv
          --target-start '${{ steps.w.outputs.target_start }}'
          --target-end '${{ steps.w.outputs.target_end }}'
          --out /tmp/comex_${{ matrix.year }}
      - name: Hash annual outputs
        run: |
          cd /tmp/comex_${{ matrix.year }}
          sha256sum events.csv.gz session_candidates.csv manifest.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: comex-events-${{ matrix.year }}
          path: /tmp/comex_${{ matrix.year }}
          retention-days: 30
          compression-level: 0

  aggregate:
    needs: annual-events
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          pattern: comex-events-*
          path: /tmp/annual
      - name: Aggregate frozen plan
        run: python xau-multiyear/scripts/aggregate_comex_acquisition_plan.py --root /tmp/annual --out /tmp/plan
      - name: Hash aggregate
        run: |
          cd /tmp/plan
          sha256sum canonical_events_all.csv.gz window_frontier.csv fvg_sampling_tiers.csv session_sampling_tiers.csv annual_manifest.csv manifest.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          retention-days: 30
          compression-level: 0
      - name: Publish compact planning outputs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64, os, pathlib, requests
          src=pathlib.Path('/tmp/plan')
          names=['manifest.json','annual_manifest.csv','event_counts_by_year.csv','fvg_sampling_tiers.csv','session_sampling_tiers.csv','window_frontier.csv','SHA256SUMS.txt']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in names:
              p=src/name
              if not p.exists(): continue
              path=f'xau-final-results/comex_acquisition_plan_v1/{name}'
              url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              r=requests.get(url,headers=h,params={'ref':os.environ['BRANCH']})
              sha=r.json().get('sha') if r.status_code==200 else None
              body={'message':f'publish COMEX acquisition plan {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              rr=requests.put(url,headers=h,json=body); rr.raise_for_status(); print('PUBLISHED',path)
          PY
