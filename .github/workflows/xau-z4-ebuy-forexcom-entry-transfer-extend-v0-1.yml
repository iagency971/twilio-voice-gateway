name: XAU Z4 E-BUY FOREXCOM Entry Transfer Extend v0.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-forexcom-entry-transfer-extend-v0-1.yml'

permissions:
  contents: write

jobs:
  extend-entry-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.2 joblib==1.5.2 requests==2.31.0 websocket-client==1.8.0

      - name: Frozen prereg and model guards
        shell: bash
        run: |
          set -euo pipefail
          test -f xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_PREREG_v0_1_2026-08-25.md
          test -f xau-wick-zone-pro/entry-research/xau_ebuy_forexcom_entry_transfer_v0_1.py
          test -f xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib
          echo 'ac1c3effe84b64ffd1deebd82c3c6009ae56be9505974e3824b20169e3b38342  xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          s=Path('xau-wick-zone-pro/entry-research/xau_ebuy_forexcom_entry_transfer_v0_1.py').read_text()
          for x in ['mfe_v','mae_v','tp1_invalidation_status','target_invalidation_status(','trigger_outcome(']:
              if x in s: raise SystemExit(f'future-outcome token found: {x}')
          assert "'common_c5_ge_250':metrics['common_eligible_c5']>=250" in s
          print('FROZEN_ENTRY_TRANSFER_GUARD_PASS')
          PY

      - name: Acquire fresh exact TradingView FOREXCOM XAUUSD M1 depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/entry-transfer-extend
          python - <<'PY'
          import gzip,json,random,string,time,websocket
          from datetime import datetime,timezone
          SYMBOL='FOREXCOM:XAUUSD'; TARGET=100000; BATCH=5000
          OUT='/tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_depth_entry_extend.csv.gz'
          META='/tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_depth_entry_extend_meta.json'
          def rid(p): return p+'_'+''.join(random.choice(string.ascii_lowercase) for _ in range(12))
          def pack(m,p):
              s=json.dumps({'m':m,'p':p},separators=(',',':')); return f'~m~{len(s)}~m~'+s
          ws=websocket.create_connection('wss://data.tradingview.com/socket.io/websocket?from=chart%2F',timeout=25,origin='https://www.tradingview.com',header=['User-Agent: Mozilla/5.0'])
          cs=rid('cs');qs=rid('qs')
          def send(m,p): ws.send(pack(m,p))
          send('set_auth_token',['unauthorized_user_token']);send('chart_create_session',[cs,'']);send('quote_create_session',[qs])
          send('quote_add_symbols',[qs,SYMBOL,{'flags':['force_permission']}])
          send('resolve_symbol',[cs,'symbol_1','={"symbol":"FOREXCOM:XAUUSD","adjustment":"splits","session":"regular"}'])
          rows={}
          def collect(limit_s=40):
              start=time.time();before=len(rows)
              while time.time()-start<limit_s:
                  msg=ws.recv()
                  if isinstance(msg,str) and msg.startswith('~m~') and '~h~' in msg and msg.count('~m~')==2:
                      try: ws.send(msg)
                      except: pass
                  if not isinstance(msg,str): continue
                  for part in msg.split('~m~'):
                      if not part or part.isdigit() or part.startswith('~h~'): continue
                      try: obj=json.loads(part)
                      except: continue
                      m=obj.get('m');p=obj.get('p',[])
                      if m=='timescale_update' and len(p)>=2 and isinstance(p[1],dict):
                          s=p[1].get('s1')
                          if isinstance(s,dict):
                              for rec in s.get('s',[]) or []:
                                  v=rec.get('v') if isinstance(rec,dict) else None
                                  if v and len(v)>=5 and v[0] is not None:
                                      rows[int(v[0])]=[int(v[0]),v[1],v[2],v[3],v[4],v[5] if len(v)>5 else None]
                      if m=='series_completed' and len(p)>=2 and p[0]==cs and p[1]=='s1': return len(rows)-before
              return -1
          send('create_series',[cs,'s1','s1','symbol_1','1',BATCH])
          incs=[collect()];no_progress=0
          while len(rows)<TARGET and no_progress<2:
              before=len(rows);send('request_more_data',[cs,'s1',BATCH]);incs.append(collect())
              no_progress=no_progress+1 if len(rows)<=before else 0;time.sleep(.2)
          ws.close();data=[rows[k] for k in sorted(rows)]
          if not data: raise RuntimeError('No FOREXCOM data')
          with gzip.open(OUT,'wt',newline='') as f:
              f.write('timestamp_utc,open,high,low,close,volume\n')
              for ts,o,h,l,c,v in data:
                  t=datetime.fromtimestamp(ts,timezone.utc).isoformat().replace('+00:00','Z')
                  f.write(f'{t},{o},{h},{l},{c},{"" if v is None else v}\n')
          meta={'status':'PASS' if len(data)>BATCH else 'LIMITED','symbol':SYMBOL,'interval':'1','target_bars':TARGET,'batch':BATCH,'received_unique_bars':len(data),'increments':incs,'first_timestamp_utc':datetime.fromtimestamp(data[0][0],timezone.utc).isoformat().replace('+00:00','Z'),'last_timestamp_utc':datetime.fromtimestamp(data[-1][0],timezone.utc).isoformat().replace('+00:00','Z'),'acquired_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'transport':'TradingView chart websocket / request_more_data','purpose':'extend frozen E-BUY entry transfer overlap without changing v0.1 gate'}
          open(META,'w').write(json.dumps(meta,indent=2));print(json.dumps(meta,indent=2))
          PY

      - name: Acquire fresh Dukascopy BID+ASK August 2026
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2026-08 --to-month 2026-08 --out /tmp/entry-transfer-extend/duka_aug_2026.csv

      - name: Freeze overlap bytes and prepare engine inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          import pandas as pd
          F=pd.read_csv('/tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_depth_entry_extend.csv.gz');F['time']=pd.to_datetime(F.timestamp_utc,utc=True);F=F.sort_values('time').drop_duplicates('time')
          D=pd.read_csv('/tmp/entry-transfer-extend/duka_aug_2026.csv');D['time']=pd.to_datetime(D.timestamp,utc=True);D=D.sort_values('time').drop_duplicates('time')
          lo=max(F.time.min(),D.time.min());hi=min(F.time.max(),D.time.max())
          F=F[(F.time>=lo)&(F.time<=hi)].copy();D=D[(D.time>=lo)&(D.time<=hi)].copy()
          if len(F)<5000 or len(D)<5000: raise RuntimeError(f'insufficient fresh overlap F={len(F)} D={len(D)} {lo} {hi}')
          D.drop(columns=['time']).to_csv('/tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv',index=False)
          F.drop(columns=['time']).to_csv('/tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_overlap_entry_extend.csv',index=False)
          def engine(df,cols,out):
              x=pd.DataFrame({'timestamp':(df.time.astype('int64')//1_000_000).astype('int64')})
              for src,dst in zip(cols,['open','high','low','close']):x[dst]=pd.to_numeric(df[src],errors='coerce')
              x=x.dropna();x.to_csv(out,index=False)
          engine(F,['open','high','low','close'],'/tmp/entry-transfer-extend/forex.csv')
          engine(D,['open','high','low','close'],'/tmp/entry-transfer-extend/duka_mid.csv')
          engine(D,['open_bid','high_bid','low_bid','close_bid'],'/tmp/entry-transfer-extend/duka_bid.csv')
          meta={'overlap_window_utc':[str(lo),str(hi)],'forex_overlap_rows':len(F),'duka_overlap_rows':len(D),'forex_overlap_sha256':hashlib.sha256(Path('/tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_overlap_entry_extend.csv').read_bytes()).hexdigest(),'duka_overlap_sha256':hashlib.sha256(Path('/tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv').read_bytes()).hexdigest()}
          Path('/tmp/entry-transfer-extend/overlap_meta.json').write_text(json.dumps(meta,indent=2));print(json.dumps(meta,indent=2))
          PY

      - name: Build independent outcome-blind Z4 geometry
        shell: bash
        run: |
          set -euo pipefail
          G=xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py
          python "$G" --files /tmp/entry-transfer-extend/duka_bid.csv --output /tmp/entry-transfer-extend/z4_bid.pkl --tag ENTRY_TRANSFER_EXT_DUKA_BID & p1=$!
          python "$G" --files /tmp/entry-transfer-extend/duka_mid.csv --output /tmp/entry-transfer-extend/z4_mid.pkl --tag ENTRY_TRANSFER_EXT_DUKA_MID & p2=$!
          python "$G" --files /tmp/entry-transfer-extend/forex.csv --output /tmp/entry-transfer-extend/z4_forex.pkl --tag ENTRY_TRANSFER_EXT_FOREX & p3=$!
          wait $p1;wait $p2;wait $p3

      - name: Re-run unchanged frozen entry-layer transfer v0.1 gate
        shell: bash
        run: |
          set -euo pipefail
          gzip -c /tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv > /tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv.gz
          gzip -c /tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_overlap_entry_extend.csv > /tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_overlap_entry_extend.csv.gz
          python xau-wick-zone-pro/entry-research/xau_ebuy_forexcom_entry_transfer_v0_1.py \
            --forex-csv /tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_overlap_entry_extend.csv.gz \
            --duka-csv /tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv.gz \
            --z4-bid-pkl /tmp/entry-transfer-extend/z4_bid.pkl \
            --z4-mid-pkl /tmp/entry-transfer-extend/z4_mid.pkl \
            --z4-forex-pkl /tmp/entry-transfer-extend/z4_forex.pkl \
            --model-pkl xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib \
            --output /tmp/entry-transfer-extend/result.json \
            --matched-bid-csv /tmp/entry-transfer-extend/matched_bid.csv \
            --matched-mid-csv /tmp/entry-transfer-extend/matched_mid.csv

      - name: Build immutable extension provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          files={'prereg':'xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_PREREG_v0_1_2026-08-25.md','comparator':'xau-wick-zone-pro/entry-research/xau_ebuy_forexcom_entry_transfer_v0_1.py','model':'xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib','forex_snapshot':'/tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_depth_entry_extend.csv.gz','duka_overlap':'/tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv.gz','result':'/tmp/entry-transfer-extend/result.json'}
          sha={k:hashlib.sha256(Path(v).read_bytes()).hexdigest() for k,v in files.items()};r=json.load(open(files['result']))
          m={'status':'ENTRY_TRANSFER_EXTENDED_PROVENANCE_RECORDED','transfer_status':r['status'],'future_trade_outcomes_used':False,'thresholds_changed':False,'model_refit':False,'e_remap':False,'sha256':sha}
          Path('/tmp/entry-transfer-extend/manifest.json').write_text(json.dumps(m,indent=2));print(json.dumps(m,indent=2))
          PY

      - name: Publish immutable extended transfer evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/feed-parity/forexcom-entry-transfer-v0-1-extended
          mkdir -p "$out"
          cp /tmp/entry-transfer-extend/result.json "$out/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_RESULT_v0_1_EXTENDED.json"
          cp /tmp/entry-transfer-extend/manifest.json "$out/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_MANIFEST_v0_1_EXTENDED.json"
          cp /tmp/entry-transfer-extend/overlap_meta.json "$out/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_OVERLAP_META_v0_1_EXTENDED.json"
          cp /tmp/entry-transfer-extend/FOREXCOM_XAUUSD_M1_depth_entry_extend.csv.gz "$out/"
          cp /tmp/entry-transfer-extend/DUKASCOPY_XAUUSD_M1_overlap_entry_extend.csv.gz "$out/"
          gzip -c /tmp/entry-transfer-extend/matched_bid.csv > "$out/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_MATCHED_BID_v0_1_EXTENDED.csv.gz"
          gzip -c /tmp/entry-transfer-extend/matched_mid.csv > "$out/XAUUSD_Z4_EBUY_FOREXCOM_ENTRY_TRANSFER_MATCHED_MID_v0_1_EXTENDED.csv.gz"
          git add "$out"
          git commit -m 'publish immutable extended FOREXCOM E-BUY entry transfer evidence [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
