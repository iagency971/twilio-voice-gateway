name: Trigger corrected E display episode pre-outcome V1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-display-episode-preoutcome-v1-trigger.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical pre-outcome workflow on current branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'field-aware serialization-stable row hashes V2'
          gh workflow run xau-e-display-episode-preoutcome-v1.yml --repo iagency971/twilio-voice-gateway --ref agent/xau-wick-zone-pro-dev
