name: XAU E display episode V1 historical replication diagnostic

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-historical-replication-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  REPOUT: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/replication-outcome-v1
  SOURCE_MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  GO_TOKEN: GO_HISTORICAL_REPLICATION_DIAGNOSTIC
  REP_START: '2025-08-01T00:00:00Z'
  REP_END: '2026-08-01T00:00:00Z'
  EXPECTED_REP_LEDGER_SHA256: a3baa2f48b9d397ebcdd3e0be936e5947e49caa4ca77dec531f726c321f586a6
  EXPECTED_DEV_MODEL_SHA256: 72e7548de826e2ae2ba66ddcaaf6b2fa7cd35ada0f5f2cd9db585d9734fd48e1
  EXPECTED_LABELER_SHA256: 08ed29422ede890c300073789daa4669a22fbe48b74171c68402310c00aebef8
  EXPECTED_MODEL_SHA256: f547853609f16b00080049629f708fc0d4170c54071fd22a99228c807cd6dd2e
  EXPECTED_REQUIREMENTS_SHA256: 4cb67a768b857847b7ecad790e77637174a79e7cb299176b5543edc12a1b82cf

jobs:
  replication-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Pro authorization and immutable replication contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$PKG/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz" | awk '{print $1}')" = "$EXPECTED_REP_LEDGER_SHA256"
          test "$(sha256sum "$PKG/dev-freeze-canonical-33264659057/DEV_FROZEN_MODEL.json" | awk '{print $1}')" = "$EXPECTED_DEV_MODEL_SHA256"
          test "$(sha256sum "$PKG/xau_e_display_episode_reaction_labeler_v1.py" | awk '{print $1}')" = "$EXPECTED_LABELER_SHA256"
          test "$(sha256sum "$PKG/xau_e_display_episode_model_eval_v1.py" | awk '{print $1}')" = "$EXPECTED_MODEL_SHA256"
          test "$(sha256sum "$PKG/requirements-lock.txt" | awk '{print $1}')" = "$EXPECTED_REQUIREMENTS_SHA256"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['PKG'])
          g=json.loads((p/'E_DISPLAY_EPISODE_V1_PRO_POST_DEV_GATE.json').read_text())
          assert g['status']=='PRO_POST_DEV_SCIENTIFIC_GATE_PASS',g
          assert g['decision']=='GO_HISTORICAL_REPLICATION_DIAGNOSTIC',g
          a=g['authorization']
          assert a['authorized_phase']=='HISTORICAL_REPLICATION_DIAGNOSTIC_ONLY',a
          assert a['authorized_token']==os.environ['GO_TOKEN'],a
          assert a['authorized_replication_ledger']['sha256']==os.environ['EXPECTED_REP_LEDGER_SHA256'],a
          assert a['authorized_frozen_DEV_model']['sha256']==os.environ['EXPECTED_DEV_MODEL_SHA256'],a
          assert a['authorized_frozen_DEV_model']['refit']=='FORBIDDEN',a
          print('PRO_POST_DEV_REPLICATION_AUTHORIZATION_VERIFIED')
          PY
          mkdir -p /tmp/rep_raw /tmp/rep_shards /tmp/results
          cp "$PKG/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz" /tmp/REP_LEDGER.csv.gz
          cp "$PKG/dev-freeze-canonical-33264659057/DEV_FROZEN_MODEL.json" /tmp/DEV_FROZEN_MODEL.json
          # DEV labels and non-replication ledgers are removed from the execution workspace.
          rm -rf "$PKG/dev-outcome-v1" || true
          rm -f "$PKG/E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz" "$PKG/E_DISPLAY_EPISODE_LEDGER_V1_24M.csv.gz" "$PKG/E_DISPLAY_PROVENANCE_V1_24M.csv.gz"
          test ! -e "$PKG/E_DISPLAY_EPISODE_LEDGER_V1_DEV.csv.gz"
          test ! -e "$PKG/dev-outcome-v1/DEV_REACTION_LABELS.csv.gz"

      - name: Install frozen scientific environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          python -m pip freeze | sort > /tmp/results/PIP_FREEZE_REPLICATION.txt
          python - <<'PY' > /tmp/results/ENVIRONMENT_REPLICATION.json
          import json,platform,numpy,pandas,scipy,sklearn
          print(json.dumps({'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,'scipy':scipy.__version__,'scikit_learn':sklearn.__version__},indent=2,sort_keys=True))
          PY

      - name: Acquire exactly 12 hash-verified replication BID months and shard ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import pandas as pd
          src=json.load(open(os.environ['SOURCE_MANIFEST']))
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          selected=[]
          for x in src['files']:
              if x['side']!='bid': continue
              key=f"{int(x['year']):04d}-{int(x['month']):02d}"
              if '2025-08'<=key<='2026-07': selected.append((key,x))
          selected=sorted(selected); assert len(selected)==12,[k for k,_ in selected]
          assert selected[0][0]=='2025-08' and selected[-1][0]=='2026-07'
          meta=[]; frames=[]
          for key,x in selected:
              p=Path('/tmp/rep_raw')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              h=hashlib.sha256(p.read_bytes()).hexdigest(); assert h==x['sha256'],(x['file'],h,x['sha256'])
              d=pd.read_csv(p); frames.append(d)
              meta.append({'month':key,'file':x['file'],'path':str(p),'sha256':h,'bytes':p.stat().st_size,'rows':int(len(d))})
          led=pd.read_csv('/tmp/REP_LEDGER.csv.gz',compression='gzip',float_precision='round_trip')
          assert set(led.feature_window.astype(str).unique())=={'HISTORICAL_REPLICATION_DIAGNOSTIC'}
          led['month']=led.session_date_ny.astype(str).str[:7]
          total=0
          for m in [x['month'] for x in meta]:
              g=led[led.month==m].drop(columns=['month']).copy(); assert len(g)>0,m
              g.to_csv(f'/tmp/rep_shards/ledger_{m}.csv.gz',index=False,compression={'method':'gzip','mtime':0},float_format='%.17g')
              total+=len(g)
          assert total==len(led),(total,len(led))
          Path('/tmp/rep_files.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          out={'status':'REPLICATION_INPUT_QA_PASS','execution_strategy':'MONTHLY_SHARDED_EXACT_FROZEN_LABELER','replication_files':meta,'replication_file_count':12,'replication_ledger_rows':int(len(led)),'replication_ledger_sha256':os.environ['EXPECTED_REP_LEDGER_SHA256'],'frozen_dev_model_sha256':os.environ['EXPECTED_DEV_MODEL_SHA256'],'dev_m1_files_downloaded':0,'dev_labels_loaded':False,'model_refit':False}
          Path('/tmp/results/REPLICATION_INPUT_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Pre-outcome M1 availability QA including known partial sessions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          meta=json.loads(Path('/tmp/rep_files.json').read_text())
          raw=[]
          for x in meta:
              d=pd.read_csv(x['path'])
              if 'time' in d.columns: t=pd.to_datetime(d['time'],utc=True)
              else: t=pd.to_datetime(d['timestamp'],unit='ms',utc=True)
              raw.extend(t.tolist())
          actual=set(pd.DatetimeIndex(raw))
          led=pd.read_csv('/tmp/REP_LEDGER.csv.gz',compression='gzip')
          sessions=sorted(led.session_date_ny.astype(str).unique())
          details=[]
          for s in sessions:
              start=pd.Timestamp(f'{s} 08:00:00',tz='America/New_York').tz_convert('UTC')
              expected=pd.date_range(start=start,periods=540,freq='min')
              missing=[x for x in expected if x not in actual]
              details.append({'session_date_ny':s,'expected_m1':540,'missing_m1':len(missing),'first_missing_utc':missing[0].isoformat() if missing else None,'last_missing_utc':missing[-1].isoformat() if missing else None})
          miss=sum(x['missing_m1'] for x in details); bad=[x for x in details if x['missing_m1']]
          assert len(sessions)==258,len(sessions)
          assert miss==482,(miss,bad)
          assert len(bad)==2,(len(bad),bad)
          out={'status':'REPLICATION_M1_AVAILABILITY_QA_PASS','sessions':len(sessions),'expected_m1':len(sessions)*540,'missing_m1':miss,'sessions_with_missing':len(bad),'complete_data_sessions':len(sessions)-len(bad),'partial_sessions':bad,'frozen_rule':'missing M1 opens are skipped as unavailable bars; partial sessions are retained'}
          Path('/tmp/results/REPLICATION_M1_AVAILABILITY_QA.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Generate replication labels sharded with exact frozen labeler
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          import pandas as pd
          pkg=Path(os.environ['PKG']); meta=json.loads(Path('/tmp/rep_files.json').read_text())
          parts=[]; mans=[]
          for x in meta:
              m=x['month']; out=Path(f'/tmp/rep_shards/labels_{m}.csv.gz'); man=Path(f'/tmp/rep_shards/manifest_{m}.json')
              cmd=['python',str(pkg/'xau_e_display_episode_reaction_labeler_v1.py'),'--m1',x['path'],'--ledger',f'/tmp/rep_shards/ledger_{m}.csv.gz','--output',str(out),'--manifest',str(man),'--declared-window','HISTORICAL_REPLICATION_DIAGNOSTIC','--authorization-token',os.environ['GO_TOKEN']]
              subprocess.run(cmd,check=True)
              d=pd.read_csv(out,compression='gzip',float_precision='round_trip'); d['_shard_month']=m; parts.append(d)
              mm=json.loads(man.read_text()); assert mm['status']=='E_DISPLAY_EPISODE_REACTION_LABELER_V1_COMPLETE'; mans.append({'month':m,**mm})
          labels=pd.concat(parts,ignore_index=True).drop(columns=['_shard_month']).sort_values('display_episode_id',kind='mergesort').reset_index(drop=True)
          assert not labels.display_episode_id.duplicated().any()
          labels.to_csv('/tmp/results/REPLICATION_REACTION_LABELS.csv.gz',index=False,compression={'method':'gzip','mtime':0},float_format='%.17g')
          Path('/tmp/results/REPLICATION_LABELER_MANIFEST.json').write_text(json.dumps({'status':'E_DISPLAY_EPISODE_REACTION_LABELER_V1_COMPLETE','declared_window':'HISTORICAL_REPLICATION_DIAGNOSTIC','execution_strategy':'MONTHLY_SHARDED_EXACT_FROZEN_LABELER','labeler_sha256':os.environ['EXPECTED_LABELER_SHA256'],'monthly_manifests':mans,'episodes':len(labels),'primary_contacts':int((labels.selection_status=='PRIMARY_CONTACT').sum()),'model_refit':False},indent=2,sort_keys=True)+'\n')
          PY

      - name: Independent combined replication label QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          labels=pd.read_csv('/tmp/results/REPLICATION_REACTION_LABELS.csv.gz',compression='gzip',float_precision='round_trip')
          ledger=pd.read_csv('/tmp/REP_LEDGER.csv.gz',compression='gzip',float_precision='round_trip')
          av=json.loads(Path('/tmp/results/REPLICATION_M1_AVAILABILITY_QA.json').read_text())
          assert len(labels)==ledger.display_episode_id.nunique()
          assert not labels.display_episode_id.duplicated().any()
          assert set(labels.selection_status.astype(str).unique()).issubset({'NEVER_ARMED','NO_CONTACT_BEFORE_EPISODE_END','PRIMARY_CONTACT'})
          pri=labels[labels.selection_status=='PRIMARY_CONTACT'].copy(); assert len(pri)>0
          t=pd.to_datetime(pri.contact_bar_open_time_utc,utc=True,errors='raise')
          assert ((t>=pd.Timestamp('2025-08-01T00:00:00Z'))&(t<pd.Timestamp('2026-08-01T00:00:00Z'))).all()
          hashes=set(ledger.row_sha256.astype(str)); assert pri.feature_row_sha256.astype(str).isin(hashes).all()
          lkp=ledger.set_index('row_sha256')
          for _,r in pri.iterrows():
              q=lkp.loc[str(r.feature_row_sha256)]
              assert str(q.current_family)==str(r.current_family)
              assert int(q.display_persistence_c5)==int(r.display_persistence_c5)
              assert abs(float(q.zone_width_v)-float(r.zone_width_v))<=1e-12
          partial=[x['session_date_ny'] for x in av['partial_sessions']]
          represented=set(labels.session_date_ny.astype(str)); assert all(x in represented for x in partial)
          out={'status':'REPLICATION_LABELS_INDEPENDENT_QA_PASS','episodes_total':int(len(labels)),'primary_contacts':int(len(pri)),'sessions_primary':int(pri.session_date_ny.nunique()),'selection_status_counts':{str(k):int(v) for k,v in labels.selection_status.value_counts().sort_index().items()},'primary_class_counts':{str(k):int(v) for k,v in pri.primary_class.value_counts().sort_index().items()},'primary_binary_counts':{str(k):int(v) for k,v in pri.primary_binary_label.astype(int).value_counts().sort_index().items()},'first_contact_utc':t.min().isoformat(),'last_contact_utc':t.max().isoformat(),'feature_hash_linkage_all_pass':True,'partial_sessions_retained':partial,'model_refit':False}
          Path('/tmp/results/REPLICATION_LABELS_QA.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Apply immutable DEV model to historical replication without refit
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(sha256sum /tmp/DEV_FROZEN_MODEL.json | awk '{print $1}')"
          test "$BEFORE" = "$EXPECTED_DEV_MODEL_SHA256"
          python "$PKG/xau_e_display_episode_model_eval_v1.py" \
            --phase HISTORICAL_REPLICATION_DIAGNOSTIC \
            --labels /tmp/results/REPLICATION_REACTION_LABELS.csv.gz \
            --model-json /tmp/DEV_FROZEN_MODEL.json \
            --report-json /tmp/results/REPLICATION_MODEL_REPORT.json \
            --authorization-token "$GO_TOKEN"
          AFTER="$(sha256sum /tmp/DEV_FROZEN_MODEL.json | awk '{print $1}')"
          test "$AFTER" = "$BEFORE"

      - name: Independent no-refit QA and frozen replication support gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          import numpy as np,pandas as pd
          pkg=Path(os.environ['PKG']); spec=importlib.util.spec_from_file_location('me',pkg/'xau_e_display_episode_model_eval_v1.py'); me=importlib.util.module_from_spec(spec);sys.modules[spec.name]=me;spec.loader.exec_module(me)
          report=json.load(open('/tmp/results/REPLICATION_MODEL_REPORT.json'))
          assert report['status']=='E_DISPLAY_EPISODE_HISTORICAL_REPLICATION_DIAGNOSTIC_COMPLETE',report
          assert report['frozen_dev_model_status']=='LOADED_NO_REFIT',report
          assert report['production_authorization']=='NONE_HISTORICAL_REPLICATION_CANNOT_AUTHORIZE',report
          labels=pd.read_csv('/tmp/results/REPLICATION_REACTION_LABELS.csv.gz',compression='gzip'); pri=labels[labels.selection_status=='PRIMARY_CONTACT'].copy()
          m=me.load_model('/tmp/DEV_FROZEN_MODEL.json'); scored,qa=me.transform_score(pri,m); ev=me.evaluation(scored); gate=me.prospective_gate(scored,qa,ev)
          assert report['historical_replication_diagnostic']==ev,(report['historical_replication_diagnostic'],ev)
          modelqa={'status':'REPLICATION_MODEL_INDEPENDENT_QA_PASS','scored_rows':int(len(scored)),'frozen_dev_model_sha256':os.environ['EXPECTED_DEV_MODEL_SHA256'],'model_refit':False,'feature_excluded_rows':int(qa['feature_excluded_rows']),'feature_exclusion_rate':qa['feature_exclusion_rate'],'unseen_family_rows':int(qa['unseen_family_rows']),'unseen_family_rate':qa['unseen_family_rate'],'categories':m.categories,'reference_category':m.reference_category,'coef':m.coef,'intercept':m.intercept,'quartiles':m.quartiles,'replication_report_reproduced_exactly':True}
          Path('/tmp/results/REPLICATION_MODEL_QA.json').write_text(json.dumps(modelqa,indent=2,sort_keys=True)+'\n')
          support={'status':'REPLICATION_SUPPORT_GATE_EVALUATED_FROZEN_RULE','source_rule':'E_DISPLAY_EPISODE_V1_PRO_POST_DEV_GATE.json','all_checks_required':True,'pass':bool(gate['pass']),'checks':{k:bool(v) for k,v in gate['checks'].items()},'blocks':gate['blocks'],'evaluation':ev,'feature_transform_qa':qa,'no_refit':True,'production_authorization':'NONE'}
          Path('/tmp/results/REPLICATION_SUPPORT_GATE.json').write_text(json.dumps(support,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':support['status'],'pass':support['pass'],'checks':support['checks'],'auc_minus_0_5':ev['auc_minus_0_5'],'q4_minus_q1':ev['q4_minus_q1']},indent=2,sort_keys=True))
          PY

      - name: Freeze replication evidence and next checkpoint
        shell: bash
        env:
          EXECUTION_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('/tmp/results'); h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          lq=json.loads((r/'REPLICATION_LABELS_QA.json').read_text()); mq=json.loads((r/'REPLICATION_MODEL_QA.json').read_text()); inp=json.loads((r/'REPLICATION_INPUT_MANIFEST.json').read_text()); av=json.loads((r/'REPLICATION_M1_AVAILABILITY_QA.json').read_text()); support=json.loads((r/'REPLICATION_SUPPORT_GATE.json').read_text())
          assert lq['status']=='REPLICATION_LABELS_INDEPENDENT_QA_PASS'; assert mq['status']=='REPLICATION_MODEL_INDEPENDENT_QA_PASS'; assert inp['dev_m1_files_downloaded']==0 and inp['dev_labels_loaded'] is False and inp['model_refit'] is False; assert av['missing_m1']==482 and av['sessions_with_missing']==2
          files=['REPLICATION_REACTION_LABELS.csv.gz','REPLICATION_LABELER_MANIFEST.json','REPLICATION_LABELS_QA.json','REPLICATION_MODEL_REPORT.json','REPLICATION_MODEL_QA.json','REPLICATION_INPUT_MANIFEST.json','REPLICATION_M1_AVAILABILITY_QA.json','REPLICATION_SUPPORT_GATE.json','ENVIRONMENT_REPLICATION.json','PIP_FREEZE_REPLICATION.txt']
          out={'status':'E_DISPLAY_EPISODE_V1_REPLICATION_FREEZE_PASS','next_authorization':'READY_FOR_PRO_POST_REPLICATION_GATE','execution_strategy':'MONTHLY_SHARDED_EXACT_FROZEN_LABELER','execution_commit':os.environ['EXECUTION_COMMIT'],'workflow_run_id':int(os.environ['RUN_ID']),'authorized_token_used':'GO_HISTORICAL_REPLICATION_DIAGNOSTIC','replication_ledger_sha256':os.environ['EXPECTED_REP_LEDGER_SHA256'],'frozen_dev_model_sha256':os.environ['EXPECTED_DEV_MODEL_SHA256'],'reaction_labeler_sha256':os.environ['EXPECTED_LABELER_SHA256'],'model_eval_sha256':os.environ['EXPECTED_MODEL_SHA256'],'evidence_sha256':{f:h(r/f) for f in files},'primary_contacts':lq['primary_contacts'],'sessions_primary':lq['sessions_primary'],'missing_m1':av['missing_m1'],'partial_sessions':av['partial_sessions'],'support_gate_pass':support['pass'],'model_refit':False,'production_authorization':'NONE','pine_modification':'FORBIDDEN'}
          (r/'REPLICATION_FREEZE_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps({'status':out['status'],'next_authorization':out['next_authorization'],'primary_contacts':out['primary_contacts'],'support_gate_pass':out['support_gate_pass']},indent=2))
          PY

      - name: Upload immutable replication freeze artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: e-display-episode-v1-replication-freeze
          path: /tmp/results/*
          if-no-files-found: error
          retention-days: 90

      - name: Materialize replication freeze on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin agent/xau-wick-zone-pro-dev
            git reset --hard origin/agent/xau-wick-zone-pro-dev
            mkdir -p "$REPOUT"
            cp /tmp/results/* "$REPOUT/"
            git add "$REPOUT"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'freeze E display episode V1 historical replication results for Pro gate'
            if git push origin HEAD:agent/xau-wick-zone-pro-dev; then exit 0; fi
          done
          exit 1
