# execute 2026-08-18
name: XAU COMEX Screening Package V3
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - '.github/workflows/xau-comex-screening-package-v3.yml'
      - 'xau-multiyear/scripts/build_comex_screening_package_v3.py'
permissions:
  actions: read
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/canonical
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32104889692
      - run: python xau-multiyear/scripts/build_comex_screening_package_v3.py --events /tmp/canonical/canonical_events_all.csv.gz --sessions /tmp/canonical/session_candidates_all.csv --out /tmp/v3
      - name: QA
        run: |
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open('/tmp/v3/manifest.json'))
          assert m['canonical_events']==1274307
          assert m['session_tier']==2
          assert m['base_session_dates']==357
          assert m['market_data_download_performed'] is False
          c=pd.read_csv('/tmp/v3/counts_by_family.csv')
          assert {'DEV','VALIDATION','COMEX_FEATURE_HOLDOUT'}.issubset(set(c['split']))
          print('V3_QA_OK'); print(json.dumps(m,indent=2)); print(c.to_string(index=False))
          PY
      - run: cd /tmp/v3 && sha256sum manifest.json counts_by_family.csv counts_by_signature.csv supplement_events.csv.gz tier2_local_gap30.csv tier2_sessions_gap0.csv tier2_package_gap30.csv > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: comex-screening-package-v3
          path: /tmp/v3
          retention-days: 30
          compression-level: 0
      - name: Publish compact outputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/v3'); names=['manifest.json','counts_by_family.csv','counts_by_signature.csv','SHA256SUMS.txt']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in names:
              p=src/name; path=f'xau-final-results/comex_screening_package_v3/{name}'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish COMEX screening V3 {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
