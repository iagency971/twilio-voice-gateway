name: FTMO Zero-Data XAU ML V6 DEV
on:
  push:
    branches: [main]
    paths: ['.github/dispatch/ftmo-zero-data-xau-ml-v6.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ftmo-zero-data-xau-ml-v6
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/ftmo-zero-data-xau-ml-v6, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Run sealed V6 walk-forward DEV
        shell: bash
        run: |
          set +e
          mkdir -p ftmo-zero-data/results/xau_ml_v6_dev
          python ftmo-zero-data/run_xau_ml_v6_dev.py 2>&1 | tee ftmo-zero-data/results/xau_ml_v6_dev/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > ftmo-zero-data/results/xau_ml_v6_dev/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "XAU_ML_V6_DEV_FAILURE exit_code=$code" > ftmo-zero-data/results/xau_ml_v6_dev/WORKFLOW_FAILURE.txt; else rm -f ftmo-zero-data/results/xau_ml_v6_dev/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ftmo-zero-data/results/xau_ml_v6_dev
          git commit -m "Publish zero-data XAU ML V6 DEV [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-xau-ml-v6
