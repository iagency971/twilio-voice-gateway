name: XAU Z4 C1 Exact Local Grid Fallback v1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-c1-local-grid-fallback-v1.yml'

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  FULL_SOURCE_RUN_ID: '33009725953'
  FULL_SOURCE_SHA: '7575e67330b52e5ebc1f6466df9014ed2f04199f'

jobs:
  local-grid-month:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ['2025-10','2026-02','2026-03','2026-04']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Exact context and local-grid projection patch
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$(git hash-object xau-wick-zone-pro/xau_zone_episode_dev_z4.py)" = "a8a147615c3fd366c49e93b340fd2018b5b66e9e"
          test -s xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_G_GEOMETRY_PROJECTION_ACCELERATOR_2026-08-26.md
          test -s xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_J_EXACT_LOCAL_GRID_ACCELERATOR_2026-08-26.md
          mkdir -p /tmp/in /tmp/out
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          t=os.environ['TARGET'];y,m=map(int,t.split('-'));pm=m-1;py=y
          if pm==0:pm=12;py-=1
          nm=m+1;ny=y
          if nm==13:nm=1;ny+=1
          months=[f'{py:04d}-{pm:02d}',t,f'{ny:04d}-{nm:02d}']
          man=json.load(open(os.environ['MANIFEST']));ix={f"{x['year']}-{x['month']}":x for x in man['files'] if x['side']=='bid'}
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for mm in months:
              x=ix[mm];p=Path('/tmp/in')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL);got=hashlib.sha256(p.read_bytes()).hexdigest();assert got==x['sha256'],(p.name,got,x['sha256'])
          print('LOCAL_GRID_SOURCE_HASH_PASS',t,months)
          PY
          python - <<'PY'
          import hashlib
          from pathlib import Path
          src=Path('xau-wick-zone-pro/xau_zone_episode_dev_z4.py').read_text()
          replacements=[
            ('p=utc_ts(ts); return p.minute%15==0 and p.second==0','p=utc_ts(ts); return p.minute%1==0 and p.second==0'),
            ('out=outcome_zone(i,zlo,zhi,center,side,v)','out={}'),
            ('def zone_detect(wick, vs, lo_idx, hi_idx):','def zone_detect(wick, vs, lo_idx, hi_idx, global_offset=0):'),
            ('gi=lo_idx+m; center=base+gi*STEP; zlo=base+(lo_idx+float(left_ips[0]))*STEP; zhi=base+(lo_idx+float(right_ips[0]))*STEP',
             'gi=global_offset+lo_idx+m; center=base+gi*STEP; zlo=base+(global_offset+lo_idx+float(left_ips[0]))*STEP; zhi=base+(global_offset+lo_idx+float(right_ips[0]))*STEP'),
            ('out.append((center,zlo,zhi,prom,bg,strength,mass,gi,lo_idx+lb,lo_idx+rb))',
             'out.append((center,zlo,zhi,prom,bg,strength,mass,gi,global_offset+lo_idx+lb,global_offset+lo_idx+rb))')]
          for old,new in replacements:
              assert src.count(old)==1,(old,src.count(old));src=src.replace(old,new)
          old="""        cntL=np.cumsum(dL[:-1],dtype=np.int32); cntB=np.cumsum(dB[:-1],dtype=np.int32); cntU=np.cumsum(dU[:-1],dtype=np.int32); wick=cntL+cntU
        ilo=max(0,int(math.floor((rlo[i]-base)/STEP))-5); ihi=min(nlevels-1,int(math.ceil((rhi[i]-base)/STEP))+5)
        zones=zone_detect(wick,vs,ilo,ihi); zone_counts.append(len(zones)); landmarks+=1
"""
          new="""        ilo=max(0,int(math.floor((rlo[i]-base)/STEP))-5); ihi=min(nlevels-1,int(math.ceil((rhi[i]-base)/STEP))+5)
        def local_counts(d):
            offset=int(np.sum(d[:ilo],dtype=np.int64))
            return (offset+np.cumsum(d[ilo:ihi+1],dtype=np.int64)).astype(np.int32)
        cntL=local_counts(dL); cntB=local_counts(dB); cntU=local_counts(dU); wick=cntL+cntU
        zones=zone_detect(wick,vs,0,len(wick)-1,ilo); zone_counts.append(len(zones)); landmarks+=1
"""
          assert src.count(old)==1,src.count(old);src=src.replace(old,new)
          old="""            exp_center=float(cntL[gi]+cntB[gi]+cntU[gi]); same_center=float(cntL[gi] if side<0 else cntU[gi]); body_center=float(cntB[gi])
            zl=max(0,int(math.floor((zlo-base)/STEP))); zh=min(nlevels-1,int(math.ceil((zhi-base)/STEP)))
            mean_wick=float(wick[zl:zh+1].mean()); mean_body=float(cntB[zl:zh+1].mean()); mean_exp=mean_wick+mean_body
"""
          new="""            li=gi-ilo
            exp_center=float(cntL[li]+cntB[li]+cntU[li]); same_center=float(cntL[li] if side<0 else cntU[li]); body_center=float(cntB[li])
            zl=max(ilo,int(math.floor((zlo-base)/STEP))); zh=min(ihi,int(math.ceil((zhi-base)/STEP))); lzl=zl-ilo; lzh=zh-ilo
            mean_wick=float(wick[lzl:lzh+1].mean()); mean_body=float(cntB[lzl:lzh+1].mean()); mean_exp=mean_wick+mean_body
"""
          assert src.count(old)==1,src.count(old);src=src.replace(old,new)
          anchor='    m=len(Z)\n';assert src.count(anchor)==1
          src=src.replace(anchor,"    keep=['time','side','center','zlo','zhi']\n    Z[keep].to_pickle(args.output)\n    return\n\n"+anchor)
          p=Path('/tmp/local_grid.py');p.write_text(src);sha=hashlib.sha256(p.read_bytes()).hexdigest();Path('/tmp/out/LOCAL_GRID_PATCH_SHA256.txt').write_text(sha+'\n')
          assert 'i+HORIZON+REACT_MAX>=N' in src and 'out=outcome_zone(' not in src
          print('LOCAL_GRID_PATCH_READY',sha)
          PY
      - name: Build exact local-grid target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          t0=$(date +%s);python /tmp/local_grid.py --files /tmp/in/*.csv --output /tmp/all.pkl --tag "C1_${TARGET}_LOCAL_GRID";t1=$(date +%s)
          python - <<'PY'
          import os,pandas as pd
          t=os.environ['TARGET'];lo=pd.Timestamp(t+'-01T00:00:00Z');hi=lo+pd.offsets.MonthBegin(1);d=pd.read_pickle('/tmp/all.pkl');d['time']=pd.to_datetime(d.time,utc=True);q=d[(d.time>=lo)&(d.time<hi)].copy().reset_index(drop=True);assert len(q)>0;q.to_pickle('/tmp/out/C1_'+t.replace('-','_')+'.pkl');print('LOCAL_GRID_TARGET_READY',t,len(q),q.time.min(),q.time.max())
          PY
          echo "$((t1-t0))" > "/tmp/out/C1_${TARGET//-/_}_RUNTIME_SEC.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: local-grid-C1-${{ matrix.target }}
          path: /tmp/out/*
          retention-days: 1

  parity-and-package:
    needs: local-grid-month
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1
      - name: Guard full source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail;got=$(gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${FULL_SOURCE_RUN_ID}" --jq .head_sha);test "$got" = "$FULL_SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: local-grid-C1-*
          path: /tmp/local
          merge-multiple: false
      - name: Download full C1 2025-10
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FULL_SOURCE_RUN_ID }}
          name: mechanical-month-C1-2025-10
          path: /tmp/full/2025-10
      - name: Download full C1 2026-04
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FULL_SOURCE_RUN_ID }}
          name: mechanical-month-C1-2026-04
          path: /tmp/full/2026-04
      - name: Exact parity and validated package
        shell: bash
        run: |
          set -euo pipefail;mkdir -p /tmp/validated
          python - <<'PY'
          import json,numpy as np,pandas as pd
          from pathlib import Path
          out={}
          for t in ('2025-10','2026-04'):
              a=pd.read_pickle(f'/tmp/local/local-grid-C1-{t}/C1_{t.replace("-","_")}.pkl').copy();b=pd.read_pickle(f'/tmp/full/{t}/C1_{t.replace("-","_")}.pkl').copy()
              for q in (a,b):q['time']=pd.to_datetime(q.time,utc=True)
              cols=['time','side','center','zlo','zhi'];a=a[cols].sort_values(cols).reset_index(drop=True);b=b[cols].sort_values(cols).reset_index(drop=True);shape=len(a)==len(b);same_time=side=False;ec=el=eh=float('inf')
              if shape:
                  same_time=bool((a.time.to_numpy()==b.time.to_numpy()).all());side=bool((a.side.to_numpy()==b.side.to_numpy()).all());ec=float(np.max(np.abs(a.center.to_numpy(float)-b.center.to_numpy(float)))) if len(a) else 0.0;el=float(np.max(np.abs(a.zlo.to_numpy(float)-b.zlo.to_numpy(float)))) if len(a) else 0.0;eh=float(np.max(np.abs(a.zhi.to_numpy(float)-b.zhi.to_numpy(float)))) if len(a) else 0.0
              ok=bool(shape and same_time and side and ec<=1e-12 and el<=1e-8 and eh<=1e-8);out[t]={'local_rows':len(a),'full_rows':len(b),'same_shape':shape,'same_time':same_time,'same_side':side,'center_max_abs_usd':ec,'zlo_max_abs_usd':el,'zhi_max_abs_usd':eh,'pass':ok};assert ok,out[t]
          result={'status':'C1_EXACT_LOCAL_GRID_PARITY_PASS','references':out,'authorization':'MISSING_2026_C1_SHARDS_ONLY'};Path('/tmp/validated/C1_EXACT_LOCAL_GRID_PARITY.json').write_text(json.dumps(result,indent=2))
          for t in ('2026-02','2026-03'):
              for suffix in ('.pkl','_RUNTIME_SEC.txt'):
                  src=Path(f'/tmp/local/local-grid-C1-{t}/C1_{t.replace("-","_")}{suffix}');assert src.exists();(Path('/tmp/validated')/src.name).write_bytes(src.read_bytes())
          shas={p.read_text().strip() for p in Path('/tmp/local').glob('local-grid-C1-*/LOCAL_GRID_PATCH_SHA256.txt')};assert len(shas)==1;Path('/tmp/validated/LOCAL_GRID_PATCH_SHA256.txt').write_text(next(iter(shas))+'\n');print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-local-grid-C1-2026-02-03
          path: /tmp/validated/*
          retention-days: 30
