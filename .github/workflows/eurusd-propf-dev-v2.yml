name: EURUSD PropF DEV V2

on:
  push:
    branches: [agent/eurusd-propf-sprint-v1]
    paths:
      - 'eurusd-propf/dev_research_v2.py'
      - '.github/workflows/eurusd-propf-dev-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dev-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eurusd-propf-sprint-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests tzdata
      - name: Run DEV-only search
        shell: bash
        run: |
          set +e
          mkdir -p eurusd-propf/results/dev_v2
          python eurusd-propf/dev_research_v2.py --out eurusd-propf/results/dev_v2 --workers 10 2>&1 | tee eurusd-propf/results/dev_v2/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > eurusd-propf/results/dev_v2/exit_code.txt
          if [ "$code" -ne 0 ]; then
            echo "DEV_V2_WORKFLOW_FAILURE exit_code=$code" > eurusd-propf/results/dev_v2/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Persist DEV result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eurusd-propf/results/dev_v2
          if ! git diff --cached --quiet; then
            git commit -m "Publish EURUSD DEV V2 result [skip ci]"
            git push origin HEAD:agent/eurusd-propf-sprint-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: eurusd-propf-dev-v2
          path: eurusd-propf/results/dev_v2
          retention-days: 14
