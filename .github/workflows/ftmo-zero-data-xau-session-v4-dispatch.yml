name: FTMO Zero-Data XAU Session V4
on:
  push:
    branches: [main]
    paths: ['.github/dispatch/ftmo-zero-data-xau-session-v4.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ftmo-zero-data-xau-session-v4
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/ftmo-zero-data-xau-session-v4, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run sealed session-liquidity V4
        shell: bash
        run: |
          set +e
          mkdir -p ftmo-zero-data/results/xau_session_v4
          python ftmo-zero-data/run_xau_session_v4.py 2>&1 | tee ftmo-zero-data/results/xau_session_v4/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > ftmo-zero-data/results/xau_session_v4/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "XAU_SESSION_V4_FAILURE exit_code=$code" > ftmo-zero-data/results/xau_session_v4/WORKFLOW_FAILURE.txt; else rm -f ftmo-zero-data/results/xau_session_v4/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ftmo-zero-data/results/xau_session_v4
          git commit -m "Publish zero-data XAU session V4 results [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-xau-session-v4
