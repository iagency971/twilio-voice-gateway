name: XAU Z4 FOREXCOM M1 Depth Test

on:
  push:
    branches:
      - agent/xau-wick-zone-pro-dev
    paths:
      - '.github/workflows/xau-z4-forexcom-m1-depth-test.yml'

permissions:
  contents: write

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Test backward history depth
        run: |
          mkdir -p xau-wick-zone-pro/feed-parity/forexcom-depth-test
          python - <<'PY'
          import gzip, json, random, string, time, websocket
          from datetime import datetime, timezone

          SYMBOL='FOREXCOM:XAUUSD'; TARGET=100000; BATCH=5000
          OUT='xau-wick-zone-pro/feed-parity/forexcom-depth-test/FOREXCOM_XAUUSD_M1_depth_test.csv.gz'
          META='xau-wick-zone-pro/feed-parity/forexcom-depth-test/FOREXCOM_XAUUSD_M1_depth_test_meta.json'

          def rid(p): return p+'_'+''.join(random.choice(string.ascii_lowercase) for _ in range(12))
          def pack(m,p):
              s=json.dumps({'m':m,'p':p},separators=(',',':')); return f'~m~{len(s)}~m~'+s
          ws=websocket.create_connection('wss://data.tradingview.com/socket.io/websocket?from=chart%2F',timeout=25,origin='https://www.tradingview.com',header=['User-Agent: Mozilla/5.0'])
          cs=rid('cs'); qs=rid('qs')
          def send(m,p): ws.send(pack(m,p))
          send('set_auth_token',['unauthorized_user_token']); send('chart_create_session',[cs,'']); send('quote_create_session',[qs])
          send('quote_add_symbols',[qs,SYMBOL,{'flags':['force_permission']}])
          send('resolve_symbol',[cs,'symbol_1','={"symbol":"FOREXCOM:XAUUSD","adjustment":"splits","session":"regular"}'])
          rows={}; resolved=None

          def collect_until_complete(limit_s=40):
              nonlocal_completed=False; start=time.time(); before=len(rows)
              while time.time()-start < limit_s:
                  msg=ws.recv()
                  if isinstance(msg,str) and msg.startswith('~m~') and '~h~' in msg and msg.count('~m~')==2:
                      try: ws.send(msg)
                      except: pass
                  if not isinstance(msg,str): continue
                  for part in msg.split('~m~'):
                      if not part or part.isdigit() or part.startswith('~h~'): continue
                      try: obj=json.loads(part)
                      except: continue
                      m=obj.get('m'); p=obj.get('p',[])
                      if m=='symbol_resolved' and len(p)>=3:
                          globals()['_resolved_tmp']=p[2]
                      if m=='timescale_update' and len(p)>=2 and isinstance(p[1],dict):
                          s=p[1].get('s1')
                          if isinstance(s,dict):
                              for rec in s.get('s',[]) or []:
                                  v=rec.get('v') if isinstance(rec,dict) else None
                                  if v and len(v)>=5 and v[0] is not None:
                                      rows[int(v[0])] = [int(v[0]),v[1],v[2],v[3],v[4],v[5] if len(v)>5 else None]
                      if m=='series_completed' and len(p)>=2 and p[0]==cs and p[1]=='s1':
                          return len(rows)-before
              return -1

          send('create_series',[cs,'s1','s1','symbol_1','1',BATCH])
          increments=[]
          inc=collect_until_complete(); increments.append(inc)
          no_progress=0
          while len(rows)<TARGET and no_progress<2:
              before=len(rows)
              send('request_more_data',[cs,'s1',BATCH])
              inc=collect_until_complete()
              increments.append(inc)
              if len(rows)<=before: no_progress+=1
              else: no_progress=0
              time.sleep(0.2)
          ws.close()
          data=[rows[k] for k in sorted(rows)]
          if not data: raise RuntimeError('No data returned')
          with gzip.open(OUT,'wt',newline='') as f:
              f.write('timestamp_utc,open,high,low,close,volume\n')
              for ts,o,h,l,c,v in data:
                  t=datetime.fromtimestamp(ts,timezone.utc).isoformat().replace('+00:00','Z')
                  f.write(f'{t},{o},{h},{l},{c},{"" if v is None else v}\n')
          meta={
              'status':'PASS' if len(data)>BATCH else 'LIMITED',
              'symbol':SYMBOL,'interval':'1','target_bars':TARGET,'batch':BATCH,
              'received_unique_bars':len(data),'increments':increments,
              'first_timestamp_utc':datetime.fromtimestamp(data[0][0],timezone.utc).isoformat().replace('+00:00','Z'),
              'last_timestamp_utc':datetime.fromtimestamp(data[-1][0],timezone.utc).isoformat().replace('+00:00','Z'),
              'acquired_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'transport':'TradingView chart websocket / request_more_data',
              'purpose':'determine how far exact FOREXCOM:XAUUSD M1 can be acquired without manual TradingView export'
          }
          with open(META,'w') as f: json.dump(meta,f,indent=2)
          print(json.dumps(meta,indent=2))
          PY
      - name: Commit depth-test evidence
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add xau-wick-zone-pro/feed-parity/forexcom-depth-test/
          git commit -m 'publish FOREXCOM XAUUSD M1 depth test [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
