name: US100 Zero-Data Opening Pullback V4 DEV

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-opening-pullback-v4-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen Opening Pullback V4 DEV 2021-2023
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/opening_impulse_pullback_v4
          python us100-zero-data/run_opening_impulse_pullback_v4_dev.py 2>&1 | tee us100-zero-data/results/opening_impulse_pullback_v4/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/opening_impulse_pullback_v4/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "US100_OPENING_PULLBACK_V4_DEV_FAILURE exit_code=$code" > us100-zero-data/results/opening_impulse_pullback_v4/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/opening_impulse_pullback_v4/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V4 DEV result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/opening_impulse_pullback_v4
          git commit -m "Publish frozen US100 Opening Pullback V4 DEV [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
