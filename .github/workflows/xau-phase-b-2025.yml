name: XAU Phase B Behavior 2025
# dedicated result branch; force update is safe because this branch stores transient research outputs only
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - 'xau-multiyear/scripts/run_phase_b_behavior.py'
      - '.github/workflows/xau-phase-b-2025.yml'
permissions:
  contents: write
jobs:
  phase-b-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Acquire 2024-01 through 2026-01
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2024-01 --to-month 2026-01 --out /tmp/xau_phase_b.csv
      - name: Run Phase B 2025
        run: python xau-multiyear/scripts/run_phase_b_behavior.py /tmp/xau_phase_b.csv --target-start 2025-01-01 --target-end 2026-01-01 --out /tmp/phase_b_2025
      - name: Validate and publish compact result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv('/tmp/phase_b_2025/behavior_summary.csv')
          assert {'DISPLACEMENT_ORIGIN_ONLY','OBJECTIVE_LIQUIDITY_ONLY'}.issubset(set(s['sample']))
          assert int(s['events'].sum()) > 1000
          print('PHASE_B_2025_GATE_OK')
          print(s.to_string(index=False))
          PY
          mkdir -p xau-phase-b-results/2025
          cp /tmp/phase_b_2025/behavior_summary.csv xau-phase-b-results/2025/behavior_summary.csv
          cp /tmp/phase_b_2025/manifest.json xau-phase-b-results/2025/manifest.json
          cp /tmp/phase_b_2025/phase_b_events.csv.gz xau-phase-b-results/2025/phase_b_events.csv.gz
          git config user.name 'xau-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xau-phase-b-results/2025
          git commit -m 'record Phase B 2025 behavior gate [skip ci]'
          git push --force origin HEAD:agent/xau-phase-b-2025-result
