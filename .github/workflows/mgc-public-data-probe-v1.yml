name: MGC Public Data Probe V1
on:
  push:
    branches: [agent/mgc-macro-event-research-v1]
    paths: ['mgc-macro/**','.github/workflows/mgc-public-data-probe-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mgc-macro-event-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas
      - name: Probe only
        run: python mgc-macro/data_probe.py
      - name: Publish probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mgc-macro/results/data_probe
          git commit -m "Publish MGC public data probe [skip ci]" || true
          git push origin HEAD:agent/mgc-macro-event-research-v1
