name: XAU Behavior V2 Tests
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - 'xau-multiyear/src/rzr/behavior_v2.py'
      - 'xau-multiyear/tests/test_behavior_v2.py'
      - '.github/workflows/xau-behavior-v2-tests.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pytest
      - name: Run behavior v2 tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: pytest -q xau-multiyear/tests/test_behavior_v2.py
      - name: Record green gate on isolated branch
        shell: bash
        run: |
          mkdir -p xau-phase-b-results
          printf '{"behavior_v2_tests":"PASS","commit":"%s"}\n' "$GITHUB_SHA" > xau-phase-b-results/behavior_v2_tests.json
          git config user.name 'xau-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xau-phase-b-results/behavior_v2_tests.json
          git commit -m 'record behavior v2 test gate [skip ci]'
          git push origin HEAD:agent/xau-multiyear-research
