name: PropF FXCM Symbol Probe
on:
  push:
    branches: [agent/eurusd-propf-sprint-v1]
    paths:
      - 'eurusd-propf/probe_fxcm_symbols.py'
      - '.github/workflows/propf-fxcm-symbol-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/eurusd-propf-sprint-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas requests
      - run: python eurusd-propf/probe_fxcm_symbols.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eurusd-propf/results/symbol_probe
          git commit -m "Publish FXCM symbol probe [skip ci]" || true
          git push origin HEAD:agent/eurusd-propf-sprint-v1
