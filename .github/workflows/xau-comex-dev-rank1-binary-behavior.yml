# trigger-once: dev-rank1-binary-behavior-2026-08-18-v2
name: XAU COMEX DEV_RANK1 Binary Behavior Diagnostic

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-binary-behavior.yml']

permissions:
  actions: read
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow scikit-learn==1.5.2 requests
      - name: Download frozen DEV_RANK1 event feature artifact
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-event-features-v1
          path: /tmp/features
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32183736697
      - name: Run frozen binary reject-versus-accept diagnostic
        run: |
          python xau-multiyear/scripts/run_comex_dev_rank1_binary_behavior.py \
            --features /tmp/features/dev_rank1_event_features.parquet \
            --out /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-binary-behavior-v1
          path: /tmp/result/
          retention-days: 90
      - name: Publish compact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/result');root='xau-final-results/comex_dev_rank1_binary_behavior_v1';h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['result.json','metrics.csv','annual_metrics.csv','outer_fold_audit.json']:
              p=src/name
              if not p.exists():raise SystemExit(f'missing {name}')
              path=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None;body={'message':f'publish DEV_RANK1 binary behavior {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
