name: MNQ Forward Shadow V1

on:
  push:
    branches: [agent/mnq-12model-forward-shadow-v1]
    paths:
      - 'mnq-forward-shadow/TRIGGER.txt'
      - 'mnq-forward-shadow/**'
      - '.github/workflows/mnq-forward-shadow-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mnq-12model-forward-shadow-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pandas numpy yfinance matplotlib tabulate python-dotenv ib_insync
      - name: Run zero-cost frozen shadow
        shell: bash
        run: |
          set +e
          mkdir -p mnq-forward-shadow/results
          python mnq-forward-shadow/compat_runner.py 2>&1 | tee mnq-forward-shadow/results/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > mnq-forward-shadow/results/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "MNQ_FORWARD_SHADOW_FAILURE exit_code=$code" > mnq-forward-shadow/results/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish ledger and summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-forward-shadow/results
          git commit -m "Update prospective MNQ shadow ledger [skip ci]" || true
          git push origin HEAD:agent/mnq-12model-forward-shadow-v1
