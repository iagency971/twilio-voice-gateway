name: FTMO Zero-Data XAUUSD V3 Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/ftmo-zero-data-xau-v3.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftmo-zero-data-xau-v3
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-xau-v3
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run sealed XAUUSD V3 DEV and gated validation
        shell: bash
        run: |
          set +e
          mkdir -p ftmo-zero-data/results/xau_v3
          python ftmo-zero-data/run_xau_v3.py 2>&1 | tee ftmo-zero-data/results/xau_v3/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > ftmo-zero-data/results/xau_v3/exit_code.txt
          if [ "$code" -ne 0 ]; then
            echo "XAU_V3_FAILURE exit_code=$code" > ftmo-zero-data/results/xau_v3/WORKFLOW_FAILURE.txt
          else
            rm -f ftmo-zero-data/results/xau_v3/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish to research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ftmo-zero-data/results/xau_v3
          git commit -m "Publish zero-data XAUUSD V3 results [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-xau-v3
