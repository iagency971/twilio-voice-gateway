name: XAU Z4 Break Retrace E1-E3 Rejection v1.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-break-retrace-e123-rejection-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - name: Frozen prereg and exact-engine guards
        shell: bash
        run: |
          set -euo pipefail
          test -s xau-wick-zone-pro/entry-research/XAUUSD_Z4_BREAK_RETRACE_E123_REJECTION_PREREG_v1_0_2026-08-27.md
          test -s xau-wick-zone-pro/entry-research/XAUUSD_Z4_BREAK_RETRACE_E123_REJECTION_PREREG_ADDENDUM_A_CAUSAL_ORDERING_2026-08-27.md
          test -s xau-wick-zone-pro/entry-research/XAUUSD_Z4_BREAK_RETRACE_E123_REJECTION_PREREG_ADDENDUM_B_EPISODE_IDENTITY_2026-08-27.md
          python -m py_compile xau-wick-zone-pro/entry-research/xau_z4_break_retrace_e123_rejection_v1_0.py
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py)" = "bfb0d65efce0f5773b2045eaf4c31ed6bc07740f"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py)" = "ef45037d2a99a705ddf9bfbc3ebc666f88119a80"
          test "$(git hash-object xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py)" = "ac2448f448df2b873b482fd74c4eddf031790117"
          echo PREFLIGHT_PASS

  frozen-geometry-month:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 24
      matrix:
        target: ['2024-08','2024-09','2024-10','2024-11','2024-12','2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Download exact target month plus causal warmup
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in /tmp/out
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          t=os.environ['TARGET']; y,m=map(int,t.split('-')); months=[t]
          if t!='2024-08':
              pm=m-1; py=y
              if pm==0: pm=12; py-=1
              months.insert(0,f'{py:04d}-{pm:02d}')
          man=json.load(open(os.environ['MANIFEST']))
          ix={f"{x['year']}-{x['month']}":x for x in man['files'] if x['side']=='bid'}
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for mm in months:
              x=ix[mm]; p=Path('/tmp/in')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              got=hashlib.sha256(p.read_bytes()).hexdigest(); assert got==x['sha256'],(x['file'],got,x['sha256'])
          print('MONTH_SOURCE_HASH_PASS',t,months)
          PY
      - name: Rebuild exact source-faithful target-month C5 geometry
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py').read_text()
          anchor='    m=len(Z)\n'; assert src.count(anchor)==1
          insert="    keep=['time','landmark_i','center','zlo','zhi','side']\n    Z[keep].to_pickle(args.output)\n    return\n\n"
          Path('/tmp/geom.py').write_text(src.replace(anchor,insert+anchor))
          PY
          python /tmp/geom.py --files /tmp/in/*.csv --output /tmp/all.pkl --tag FROZEN_MONTH_${TARGET}
          python - <<'PY'
          import os,pandas as pd
          t=os.environ['TARGET']; lo=pd.Timestamp(t+'-01T00:00:00Z'); hi=lo+pd.offsets.MonthBegin(1)
          d=pd.read_pickle('/tmp/all.pkl'); d['time']=pd.to_datetime(d.time,utc=True)
          q=d[(d.time>=lo)&(d.time<hi)].copy().reset_index(drop=True); assert len(q)>0,(t,len(d))
          q.to_pickle('/tmp/out/z4_'+t.replace('-','_')+'.pkl')
          print('FROZEN_TARGET_GEOMETRY_READY',t,len(q),q.time.min(),q.time.max())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: z4br-frozen-z4-${{ matrix.target }}
          path: /tmp/out/*.pkl
          retention-days: 30

  study:
    needs: frozen-geometry-month
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Download newly regenerated exact monthly C5 geometry
        uses: actions/download-artifact@v4
        with:
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true
      - name: Assemble exact 24M C5 geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl')); assert len(fs)==24,fs
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z')
          assert z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z')
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl')
          print('FROZEN_C5_24M_READY',len(z),z.time.nunique(),z.time.min(),z.time.max())
          PY
      - name: Acquire exact continuous 24M BID M1 source and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/results
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.load(open(os.environ['MANIFEST']))
          fs=[x for x in m['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07']
          assert len(fs)==24,len(fs)
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/raw')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              got=hashlib.sha256(p.read_bytes()).hexdigest(); assert got==x['sha256'],(p.name,got,x['sha256'])
          print('RAW_24M_HASH_PASS',len(fs))
          PY
      - name: Run preregistered structural breakout/retrace/E rejection study
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/entry-research/xau_z4_break_retrace_e123_rejection_v1_0.py \
            --files /tmp/raw/*.csv \
            --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output /tmp/results/XAUUSD_Z4_BREAK_RETRACE_E123_REJECTION_RESULT_v1_0.json \
            --episodes-csv /tmp/results/XAUUSD_Z4_BREAK_RETRACE_E123_EPISODES_v1_0.csv.gz \
            --contacts-csv /tmp/results/XAUUSD_Z4_BREAK_RETRACE_E123_CONTACTS_v1_0.csv.gz \
            --trades-csv /tmp/results/XAUUSD_Z4_BREAK_RETRACE_E123_TRADES_v1_0.csv.gz
      - name: Build immutable evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/results'); files=sorted(root.iterdir())
          man={'status':'Z4_BREAK_RETRACE_E123_REJECTION_EVIDENCE_RECORDED','production_authorization':'NONE','files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (root/'XAUUSD_Z4_BREAK_RETRACE_E123_REJECTION_MANIFEST_v1_0.json').write_text(json.dumps(man,indent=2))
          print(json.dumps(man,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: z4-break-retrace-e123-rejection-v1-1
          path: /tmp/results/*
          retention-days: 30
