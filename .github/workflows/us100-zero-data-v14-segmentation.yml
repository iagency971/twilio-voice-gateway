name: US100 Zero-Data Six-Model Segmentation V14

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-v14-segmentation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run frozen V14 segmentation diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/v14_six_model_segmentation
          python us100-zero-data/run_v14_six_model_segmentation.py 2>&1 | tee us100-zero-data/results/v14_six_model_segmentation/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/v14_six_model_segmentation/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then echo "V14_FAILURE exit_code=$code" > us100-zero-data/results/v14_six_model_segmentation/WORKFLOW_FAILURE.txt; else rm -f us100-zero-data/results/v14_six_model_segmentation/WORKFLOW_FAILURE.txt; fi
          python us100-zero-data/run_v14b_weekday_stability.py 2>&1 | tee us100-zero-data/results/v14_six_model_segmentation/WEEKDAY_RUN_LOG.txt
          code2=${PIPESTATUS[0]}
          echo "$code2" > us100-zero-data/results/v14_six_model_segmentation/WEEKDAY_EXIT_CODE.txt
          if [ "$code2" -ne 0 ]; then echo "V14B_FAILURE exit_code=$code2" > us100-zero-data/results/v14_six_model_segmentation/WEEKDAY_FAILURE.txt; else rm -f us100-zero-data/results/v14_six_model_segmentation/WEEKDAY_FAILURE.txt; fi
          exit 0
      - name: Publish V14 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/v14_six_model_segmentation
          git commit -m "Publish V14 six-model segmentation diagnostic [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
