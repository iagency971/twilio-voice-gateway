name: XAU E-zone V2 parity serialization diagnostic

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - .github/workflows/xau-e-zone-score-buy-us-v2-parity-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2
  V1: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  DATA: /tmp/xau-v2-data
  FROZEN_Z4_RUN_ID: '33139524456'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Frozen environment and data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          mkdir -p "$DATA" /tmp/paritydiag
          python "$PKG/xau_e_zone_v2_acquire.py" --output-dir "$DATA" --manifest "$DATA/DATA_INPUT_MANIFEST.json"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_Z4_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true
      - name: Assemble canonical frozen Z4
        shell: bash
        run: |
          python - <<'PY'
          import glob,pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl')); assert len(fs)==24,len(fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl')
          print('FROZEN_Z4_ROWS',len(z))
          PY
      - name: Generate instrumented display without parity abort
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(python - <<'PY'
          import pandas as pd
          print(' '.join(f'/tmp/xau-v2-data/xauusd_bid_m1_{p.year:04d}_{p.month:02d}.csv' for p in pd.period_range('2024-01','2026-07',freq='M')))
          PY
          )
          python "$PKG/xau_e_zone_v2_instrument.py" \
            --files $FILES \
            --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --output-features /tmp/paritydiag/features.csv.gz \
            --output-display-all /tmp/paritydiag/display_all.csv.gz \
            --output-full-pool /tmp/paritydiag/full_pool.csv.gz \
            --output-context /tmp/paritydiag/context.csv.gz \
            --manifest /tmp/paritydiag/instrument_manifest.json \
            --target-start 2024-08-01T00:00:00Z \
            --target-end 2026-08-01T00:00:00Z
      - name: Compare canonical parser semantics and expose every mismatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np,pandas as pd
          refp=Path('xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/E_DISPLAY_PROVENANCE_V1_24M.csv.gz')
          gotp=Path('/tmp/paritydiag/display_all.csv.gz')
          def cmp(fp):
              kw={} if fp is None else {'float_precision':fp}
              r=pd.read_csv(refp,compression='infer',**kw); g=pd.read_csv(gotp,compression='infer',**kw)
              r['time']=pd.to_datetime(r.time,utc=True); g['time']=pd.to_datetime(g.time,utc=True)
              r=r.sort_values(['time','entry_rank']).reset_index(drop=True); g=g.sort_values(['time','entry_rank']).reset_index(drop=True)
              cols=['time','entry_rank','family','center','zlo','zhi']; bad={}; details=[]
              assert len(r)==len(g)==88557,(len(r),len(g))
              for c in cols:
                  if c=='time': neq=r[c].to_numpy()!=g[c].to_numpy()
                  elif c in {'entry_rank','family'}: neq=r[c].astype(str).to_numpy()!=g[c].astype(str).to_numpy()
                  else: neq=r[c].to_numpy(float)!=g[c].to_numpy(float)
                  ix=np.where(neq)[0]; bad[c]=int(len(ix))
                  for i in ix:
                      details.append({'column':c,'row':int(i),'time':str(r.at[i,'time']),'entry_rank':int(r.at[i,'entry_rank']),'family':str(r.at[i,'family']),'center':repr(float(r.at[i,'center'])),'reference':repr(float(r.at[i,c])) if c not in {'time','family'} else str(r.at[i,c]),'instrumented':repr(float(g.at[i,c])) if c not in {'time','family'} else str(g.at[i,c]),'abs_diff':abs(float(r.at[i,c])-float(g.at[i,c])) if c not in {'time','family'} else None})
              return {'float_precision':fp or 'default','mismatch_counts':bad,'details':details}
          out={'status':'V2_PARITY_SERIALIZATION_DIAGNOSTIC','future_price_outcomes_used':False,'default_parser':cmp(None),'round_trip_parser':cmp('round_trip')}
          Path('/tmp/paritydiag/PARITY_SERIALIZATION_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          python "$V1/xau_e_v04_exact_parity_v1.py" \
            --reference "$V1/E_DISPLAY_PROVENANCE_V1_24M.csv.gz" \
            --instrumented /tmp/paritydiag/display_all.csv.gz \
            --output /tmp/paritydiag/CANONICAL_V1_PARSER_PARITY.json
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/paritydiag/PARITY_SERIALIZATION_DIAGNOSTIC.json "$PKG/PARITY_SERIALIZATION_DIAGNOSTIC_R3.json"
          cp /tmp/paritydiag/CANONICAL_V1_PARSER_PARITY.json "$PKG/CANONICAL_V1_PARSER_PARITY_R3.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PKG/PARITY_SERIALIZATION_DIAGNOSTIC_R3.json" "$PKG/CANONICAL_V1_PARSER_PARITY_R3.json"
          git commit -m 'record outcome-blind V2 parity serialization diagnostic'
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          git push origin HEAD:agent/xau-wick-zone-pro-dev
