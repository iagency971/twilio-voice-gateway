name: XAU COMEX V2 Tier2 Gap30 Exact Cost
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v2-tier2-gap30-exact-cost.yml']
permissions:
  actions: read
  contents: write
jobs:
  quote-year:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 databento
      - uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/canonical
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32104889692
      - name: Rebuild frozen V2 package
        run: python xau-multiyear/scripts/build_comex_screening_package_v2.py --events /tmp/canonical/canonical_events_all.csv.gz --sessions /tmp/canonical/session_candidates_all.csv --out /tmp/v2 >/tmp/v2_build.log
      - name: Exact metadata quote for year slice
        env: {YEAR: '${{ matrix.year }}'}
        run: |
          python - <<'PY'
          import json,os,time
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from pathlib import Path
          import pandas as pd, databento as db
          year=int(os.environ['YEAR']); c=db.Historical(os.environ['DATABENTO_API_KEY'])
          w=pd.read_csv('/tmp/v2/tier2_package_gap30.csv')
          w['start']=pd.to_datetime(w.start,utc=True); w['end']=pd.to_datetime(w.end,utc=True)
          q=w[w.start.dt.year==year].copy().reset_index(drop=True)
          def one(r):
              err=None
              for k in range(9):
                  try:
                      x=float(c.metadata.get_cost(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema='trades',start=r.start.isoformat(),end=r.end.isoformat()))
                      return r.Index,x,None
                  except Exception as ex:
                      err=str(ex); time.sleep(min(30,1.5*(2**k)))
              return r.Index,None,err
          vals={}; errs=[]
          with ThreadPoolExecutor(max_workers=2) as ex:
              futs=[ex.submit(one,r) for r in q.itertuples()]
              for f in as_completed(futs):
                  i,x,er=f.result()
                  if er:errs.append({'index':int(i),'error':er})
                  else:vals[i]=x
          if errs: raise SystemExit(f'{year}: metadata failures {len(errs)} {errs[:2]}')
          costs=[vals[i] for i in range(len(q))] if len(q) else []
          out={'year':year,'schema':'trades','windows':int(len(q)),'minutes':float(((q.end-q.start).dt.total_seconds()/60).sum()) if len(q) else 0.0,'cost_usd':float(sum(costs)),'download_performed':False}
          Path('/tmp/year_cost.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-tier2-gap30-cost-${{ matrix.year }}
          path: /tmp/year_cost.json
          retention-days: 30
  aggregate:
    needs: quote-year
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - run: python -m pip install databento
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-tier2-gap30-cost-*
          path: /tmp/costs
      - name: Aggregate plus continuous context costs
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import databento as db
          rows=[json.loads(p.read_text()) for p in Path('/tmp/costs').rglob('year_cost.json')]
          rows=sorted(rows,key=lambda x:x['year']); assert len(rows)==16,len(rows)
          c=db.Historical(os.environ['DATABENTO_API_KEY'])
          base=dict(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',start='2010-06-06',end='2026-08-17')
          ohlcv=float(c.metadata.get_cost(schema='ohlcv-1m',**base)); bbo=float(c.metadata.get_cost(schema='bbo-1m',**base))
          detailed=float(sum(r['cost_usd'] for r in rows)); total=ohlcv+bbo+detailed
          out={'version':'COMEX_V2_TIER2_GAP30_EXACT_COST_V1','package':'screening V2; tier2 sessions + V2 local supplements; union merged through <=30m gaps','detailed_schema':'trades','continuous_schemas':['ohlcv-1m','bbo-1m'],'year_rows':rows,'costs_usd':{'ohlcv_1m_full':ohlcv,'bbo_1m_full':bbo,'tier2_package_trades':detailed,'total':total,'credit_125_remaining':125.0-total},'windows':sum(r['windows'] for r in rows),'minutes':sum(r['minutes'] for r in rows),'download_performed':False,'warning':'Metadata quote only. No Databento market-data download has been performed or authorized.'}
          Path('/tmp/exact.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Publish exact quote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          p=pathlib.Path('/tmp/exact.json'); path='xau-final-results/comex_screening_package_v2/tier2_gap30_exact_cost.json'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          b={'message':'publish exact COMEX V2 tier2 gap30 metadata quote [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
          if sha:b['sha']=sha
          r=requests.put(u,headers=h,json=b); r.raise_for_status()
          PY
