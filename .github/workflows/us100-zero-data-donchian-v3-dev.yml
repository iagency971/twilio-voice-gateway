name: US100 Zero-Data Donchian V3 DEV

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-donchian-v3-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen Donchian V3 DEV 2021-2023
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/donchian_momentum_v3
          python us100-zero-data/run_donchian_momentum_v3_dev.py 2>&1 | tee us100-zero-data/results/donchian_momentum_v3/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/donchian_momentum_v3/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "US100_DONCHIAN_V3_DEV_FAILURE exit_code=$code" > us100-zero-data/results/donchian_momentum_v3/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/donchian_momentum_v3/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish V3 DEV result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/donchian_momentum_v3
          git commit -m "Publish frozen US100 Donchian V3 DEV results [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
