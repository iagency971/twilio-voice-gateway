# include low-cost continuous L1 candidate
name: XAU GC Schema Cost Upper Bounds
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-gc-schema-cost-upper-bounds.yml']
permissions:
  contents: write
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install databento
      - name: Metadata quotes only
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import databento as db
          c=db.Historical(os.environ['DATABENTO_API_KEY']); rows=[]
          for schema in ['ohlcv-1m','bbo-1m','trades','tbbo','bbo-1s','mbp-1']:
              kw=dict(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema=schema,start='2010-06-06',end='2026-08-17')
              try: rows.append({'schema':schema,'cost_usd':float(c.metadata.get_cost(**kw)),'records':int(c.metadata.get_record_count(**kw)),'billable_bytes':int(c.metadata.get_billable_size(**kw)),'status':'OK'})
              except Exception as e: rows.append({'schema':schema,'status':'ERROR','error':str(e)})
          out={'period':['2010-06-06','2026-08-17'],'rows':rows,'download_performed':False}
          Path('/tmp/schema_costs.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          p=pathlib.Path('/tmp/schema_costs.json'); path='xau-final-results/gc_databento_cost/schema_upper_bounds.json'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          r=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=r.json().get('sha') if r.status_code==200 else None
          b={'message':'publish GC schema metadata costs [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
          if sha:b['sha']=sha
          rr=requests.put(u,headers=h,json=b); rr.raise_for_status()
          PY
