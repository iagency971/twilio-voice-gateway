name: XAU COMEX DEV_RANK1 Native N1 502 Recovery

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - 'xau-recovery/NATIVE_N1_502_RECOVERY.json'

concurrency:
  group: xau-comex-dev-rank1-native-n1-recovery
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - run: python -m pip install pandas==2.2.3 numpy pyarrow databento requests

      - name: Download original partial N1 artifact
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-raw-v1
          path: /tmp/n1
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32204581441

      - name: Download original exact N1 gate
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-gate-v1
          path: /tmp/gate
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32204581441

      - name: Audit recovery plan — no market-data call
        run: |
          python - <<'PY'
          import json, pathlib
          p=json.load(open('xau-recovery/NATIVE_N1_502_RECOVERY.json'))
          a=json.load(open('xau-authorizations/NATIVE_N1_0_45.json'))
          assert p['version']=='COMEX_DEV_RANK1_NATIVE_N1_502_RECOVERY_PLAN_V1'
          assert p['original_authorization']==a['authorization']=='OK NATIVE N1, plafond 0,45 $'
          assert p['original_run_id']==32204581441
          assert p['hard_cap_usd']==a['hard_cap_usd']==0.45
          assert p['existing_completed_requests']==16
          assert abs(p['existing_success_cost_upper_bound_usd']-0.07492505014)<1e-12
          assert p['failed_request_id']=='2c5c189b29c97a8ba504a54a'
          assert abs(p['possible_prior_failed_attempt_reserve_usd']-0.004954114556)<1e-12
          assert p['n2_download_authorized'] is False
          assert p['dev_rank2_authorized'] is False
          print('RECOVERY_PLAN_QA_OK')
          PY

      - name: Resume only missing N1 requests — no replay of 16 successes
        run: |
          python xau-multiyear/scripts/resume_comex_native_n1.py \
            --gate /tmp/gate/gate.json \
            --authorization xau-authorizations/NATIVE_N1_0_45.json \
            --partial-root /tmp/n1 \
            --out /tmp/n1

      - name: Preserve recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-recovery-v1
          path: /tmp/n1/
          retention-days: 90
          if-no-files-found: warn

      - name: Hard QA complete N1 under original 0.45 USD cap
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/n1/ACQUISITION_COMPLETE.json'))
          s=json.load(open('/tmp/n1/acquisition_summary.json'))
          g=json.load(open('/tmp/n1/RECOVERY_GATE.json'))
          assert z['version']=='COMEX_DEV_RANK1_NATIVE_N1_ACQUISITION_COMPLETE_V1'
          assert z['complete'] is True and z['requests']==92
          assert z['worst_case_total_cost_usd'] <= 0.45 + 1e-12
          assert s['complete'] is True and s['completed_request_markers']==92
          assert s['original_run_completed']==16 and s['recovery_completed']==76
          assert s['worst_case_total_cost_usd'] <= 0.45 + 1e-12
          assert g['worst_case_full_completion_usd'] <= 0.45 + 1e-12
          assert z['n2_download_authorized'] is False
          print('NATIVE_N1_RECOVERY_COMPLETE_QA_OK', s['records_downloaded_total'], s['confirmed_success_cost_upper_bound_usd'], s['worst_case_total_cost_usd'])
          PY

      - name: Upload complete N1 raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-raw-complete-v1
          path: /tmp/n1/
          retention-days: 90

      - name: Publish compact complete N1 state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/n1');root='xau-final-results/comex_dev_rank1_native_n1_acquisition_v1'
          names=['RECOVERY_GATE.json','acquisition_summary.json','ACQUISITION_COMPLETE.json']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in names:
              p=src/name;dst=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}";payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish complete native N1 recovery state {name} [skip ci]','content':payload,'branch':os.environ['BRANCH']}
                  if sha:body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201):break
                  if r.status_code not in (409,422):r.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:raise SystemExit(f'could not publish {dst}')
          PY
