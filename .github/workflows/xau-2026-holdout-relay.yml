name: XAU 2026 Holdout Relay
# explicit rerun marker 2026-08-17
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-2026-holdout-relay.yml'
permissions:
  contents: write
jobs:
  holdout-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Acquire frozen holdout window
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2025-05 --to-month 2026-06 --out /tmp/xau_holdout.csv
      - name: Run frozen worker
        run: python xau-multiyear/scripts/run_a_annual_worker.py /tmp/xau_holdout.csv --target-start 2026-05-01 --target-end 2026-06-23 --out /tmp/holdout --controls 5
      - name: Validate and publish compact result on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pandas as pd
          m=json.load(open('/tmp/holdout/run_manifest.json'))
          assert m['target_events'] > 10000, m
          assert m['paired_events_any'] > 0.95*m['target_events'], m
          s=pd.read_csv('/tmp/holdout/paired_summary_by_family.csv')
          assert set(s['family']) >= {'DISPLACEMENT_ORIGIN','FVG','MEMORY','OBJECTIVE_LIQUIDITY'}
          print('HOLDOUT_RELAY_GATE_OK')
          PY
          mkdir -p xau-holdout-results/2026-may-june
          cp /tmp/holdout/paired_summary_by_family.csv xau-holdout-results/2026-may-june/paired_summary_by_family.csv
          cp /tmp/holdout/run_manifest.json xau-holdout-results/2026-may-june/run_manifest.json
          cp /tmp/holdout/event_pairs.csv.gz xau-holdout-results/2026-may-june/event_pairs.csv.gz
          git config user.name 'xau-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xau-holdout-results/2026-may-june
          git commit -m 'record frozen May-Jun 2026 holdout result [skip ci]'
          git push origin HEAD:agent/xau-multiyear-research
