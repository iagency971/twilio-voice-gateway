name: XAU COMEX Native Reaction Final Preoutcome Freeze

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - 'xau-recovery/NATIVE_REACTION_PREOUTCOME_FINAL_TRIGGER.json'

concurrency:
  group: xau-comex-native-reaction-preoutcome-final
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
          fetch-depth: 0

      - run: python -m pip install pandas==2.2.3 numpy databento requests

      - name: Download canonical source-session raw artifacts — GitHub only
        uses: actions/download-artifact@v4
        with:
          pattern: comex-dev-rank1-dual-*
          path: /tmp/source_new
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Recover early source artifact 06610 explicitly
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-06610cec170650590cd663ca
          path: /tmp/source_new
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Recover early source artifact 010384 explicitly
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-01038430e355d65828fbe711
          path: /tmp/source_new
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Locate already-paid pilot raw artifact — GitHub only
        id: pilot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          runs=requests.get(f"{base}/actions/workflows/xau-comex-v4-pilot12-metadata.yml/runs",headers=h,params={'branch':'agent/xau-comex-acquisition-plan','status':'success','per_page':50}).json().get('workflow_runs',[])
          found=None
          for r in runs:
              arts=requests.get(f"{base}/actions/runs/{r['id']}/artifacts",headers=h,params={'per_page':100}).json().get('artifacts',[])
              if any(x['name']=='comex-v4-pilot12-raw-and-qa' and not x.get('expired') for x in arts):
                  found=r['id'];break
          if not found: raise SystemExit('pilot raw artifact not found')
          print(f'run_id={found}')
          PY

      - name: Download already-paid pilot raw — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-v4-pilot12-raw-and-qa
          path: /tmp/source_pilot
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ steps.pilot.outputs.run_id }}

      - name: Download already-owned GC.n.0 M1 context — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-n0_ohlcv_1m_context_20100606_20190101
          path: /tmp/context
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819

      - name: Download owned N1 complete J+1 M1 artifact — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-raw-complete-v1
          path: /tmp/n1
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32205624009

      - name: Download owned N2 Stage1 complete artifact — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-native-n2-stage1-complete-v1
          path: /tmp/n2_stage1
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32211696605

      - name: Download owned N2 Stage2 complete artifact — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-native-n2-stage2-raw-complete-v1
          path: /tmp/n2_stage2
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32250737768

      - name: Download owned N2 Stage3 complete artifact — GitHub only
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-native-n2-stage3-raw-complete-v1
          path: /tmp/n2_stage3
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32251356108

      - name: Build final repaired preoutcome universe — ZERO OUTCOME / ZERO MARKET API
        run: |
          python xau-multiyear/scripts/build_comex_native_reaction_preoutcome_final_v1.py \
            --final-status xau-final-results/comex_dev_rank1_native_n2_final_contact_classification_v1/native_368_contact_status_final.csv \
            --source-levels xau-final-results/comex_dev_rank1_native_source_levels_v1/native_source_levels.csv \
            --dual-requests xau-final-results/comex_dev_rank1_dual_manifest_v1/dev_rank1_dual_requests.csv \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --mapping xau-final-results/comex_dev_rank1_gate_v1/frozen_session_mapping_all.csv \
            --routing xau-final-results/comex_dev_rank1_dual_routing_qa_v1/dual_session_routing_qa.csv \
            --n1-market-manifest xau-final-results/comex_dev_rank1_native_n1_quote_v1/native_n1_market_request_manifest.csv \
            --stage1-resolution xau-final-results/comex_dev_rank1_native_n2_stage1_resolution_stage2_quote_v1/native_n2_stage1_resolution.csv \
            --stage2-resolution xau-final-results/comex_dev_rank1_native_n2_stage2_resolution_stage3_quote_v1/native_n2_stage2_resolution.csv \
            --stage3-resolution xau-final-results/comex_dev_rank1_native_n2_final_contact_classification_v1/native_n2_stage3_resolution.csv \
            --source-new-root /tmp/source_new \
            --source-pilot-root /tmp/source_pilot \
            --n1-root /tmp/n1 \
            --stage1-root /tmp/n2_stage1 \
            --stage2-root /tmp/n2_stage2 \
            --stage3-root /tmp/n2_stage3 \
            --context-root /tmp/context \
            --source-last30-zero-qa xau-final-results/comex_dev_rank1_native_reaction_source_last30_zero_qa_v1/source_last30_zero_qa.json \
            --protocol xau-multiyear/docs/COMEX_DEV_RANK1_NATIVE_REACTION_PROTOCOL_v1.md \
            --initial-pro-memo xau-multiyear/docs/PRO_DECISION_MEMO_COMEX_NATIVE_REACTION_PROTOCOL_2026-08-19.md \
            --repair-pro-memo xau-multiyear/docs/PRO_DECISION_MEMO_COMEX_NATIVE_REACTION_CONTROL_SUPPORT_REPAIR_2026-08-19.md \
            --builder-script xau-multiyear/scripts/build_comex_native_reaction_preoutcome_final_v1.py \
            --workflow .github/workflows/xau-comex-native-reaction-preoutcome-final.yml \
            --out /tmp/preoutcome_final

      - name: Hard guard — causal matching only, support pass, no outcomes, no spend
        run: |
          python - <<'PY'
          import json,pandas as pd
          root='/tmp/preoutcome_final'
          g=json.load(open(root+'/preoutcome_guard.json'))
          assert g['post_contact_values_used_for_matching'] is False
          assert g['post_anchor_outcomes_read'] is False
          assert g['reaction_outcomes_computed'] is False
          assert g['mfe_mae_computed'] is False
          assert g['market_data_api_called'] is False
          assert g['market_data_download_performed'] is False
          assert g['bar_open_fallback_used'] is False
          assert g['source_last30_reconciliation_pass'] is True
          assert g['stable_parity_all_pass'] is True
          assert g['stable_same_iid_blocks']==85 and g['stable_blocks_exact_parity']==85
          assert g['support_gate_status']=='SUPPORT_GATE_REPAIRED_AND_PASS'
          assert g['support']['support_gate_pass'] is True
          e=pd.read_csv(root+'/treated_event_causal_context_final.csv')
          assert len(e)==238 and int(e.approach_defined.astype(str).str.lower().eq('true').sum())==235
          assert not e.A0_used_for_matching.astype(str).str.lower().eq('true').any()
          m=pd.read_csv(root+'/matched_control_manifest.csv')
          early=m[m.matching_branch.eq('EARLY_SOURCE_LAST30')]
          assert early.d_move.isna().all()
          assert early.d_move_status.eq('NOT_APPLICABLE').all()
          assert not m.post_contact_values_used_for_matching.astype(str).str.lower().eq('true').any()
          assert not m.post_anchor_outcomes_read.astype(str).str.lower().eq('true').any()
          print('FINAL_PREOUTCOME_HARD_GUARD_OK',g['support'])
          PY

      - name: Check GitHub shard sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('/tmp/preoutcome_final').glob('control_candidate_universe_*.csv.gz'):
              mb=p.stat().st_size/1024/1024
              print(p.name,mb,'MiB')
              assert mb < 95, f'{p.name} exceeds GitHub single-file limit guard'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-reaction-preoutcome-final-v1
          path: /tmp/preoutcome_final/
          retention-days: 90

      - name: Publish final preoutcome freeze in one commit
        id: publish
        run: |
          root='xau-final-results/comex_dev_rank1_native_reaction_preoutcome_final_v1'
          rm -rf "$root"
          mkdir -p "$root"
          cp -a /tmp/preoutcome_final/. "$root/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root"
          git commit -m 'freeze final outcome-blind native reaction control manifests [skip ci]'
          git push origin HEAD:agent/xau-comex-acquisition-plan
          echo "freeze_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record exact freeze publication commit
        run: |
          root='xau-final-results/comex_dev_rank1_native_reaction_preoutcome_final_v1'
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('xau-final-results/comex_dev_rank1_native_reaction_preoutcome_final_v1')
          p=root/'preoutcome_freeze_manifest.json'
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          z={
            'version':'COMEX_DEV_RANK1_NATIVE_REACTION_PREOUTCOME_PUBLICATION_V1',
            'artifact_freeze_commit_sha':os.environ['FREEZE_COMMIT'],
            'preoutcome_freeze_manifest_sha256':h,
            'support_gate_status':'SUPPORT_GATE_REPAIRED_AND_PASS',
            'reaction_outcomes_computed':False,
            'w15_opened':False,
            'market_data_api_called':False,
            'market_data_download_performed':False,
          }
          (root/'FREEZE_PUBLICATION.json').write_text(json.dumps(z,indent=2))
          PY
          git add "$root/FREEZE_PUBLICATION.json"
          git commit -m 'record native reaction preoutcome freeze commit [skip ci]'
          git push origin HEAD:agent/xau-comex-acquisition-plan
        env:
          FREEZE_COMMIT: ${{ steps.publish.outputs.freeze_commit }}
