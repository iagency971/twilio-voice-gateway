name: XAU Z4 Cadence Sensitivity DEV v0.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-cadence-sensitivity-dev-v0-1.yml'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cadence: [1, 5, 15]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify prereg and frozen Z4 engine
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FROZEN BEFORE CADENCE-SENSITIVITY DEV OUTCOMES' xau-wick-zone-pro/XAUUSD_Z4_LANDMARK_CADENCE_SENSITIVITY_PREREG_v0_1_2026-08-24.md
          test "$(git hash-object xau-wick-zone-pro/xau_zone_episode_dev_z4.py)" = "a8a147615c3fd366c49e93b340fd2018b5b66e9e"
          test "$(git hash-object xau-wick-zone-pro/xau_wick_zone_completion_models.py)" = "94fcd68539176e9e6d64d7490e68baa555990001"
          echo 'Cadence prereg/frozen-engine provenance: PASS'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1

      - name: Build mechanically patched cadence engine
        env:
          C: ${{ matrix.cadence }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          C=int(os.environ['C'])
          assert C in {1,5,15}
          src=Path('xau-wick-zone-pro/xau_zone_episode_dev_z4.py')
          text=src.read_text()
          old='p=utc_ts(ts); return p.minute%15==0 and p.second==0'
          new=f'p=utc_ts(ts); return p.minute%{C}==0 and p.second==0'
          assert text.count(old)==1, text.count(old)
          patched=text.replace(old,new)
          assert patched.replace(new,old)==text
          out=Path(f'/tmp/xau_zone_episode_dev_z4_C{C}.py')
          out.write_text(patched)
          att={
            'status':'MECHANICAL_SINGLE_CADENCE_REPLACEMENT_PASS',
            'cadence_min':C,
            'lookback_active_m1':1440,
            'frozen_source_git_blob':'a8a147615c3fd366c49e93b340fd2018b5b66e9e',
            'old_literal':old,
            'new_literal':new,
            'patched_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
            'other_source_mutations':0
          }
          Path(f'/tmp/C{C}_engine_patch.json').write_text(json.dumps(att,indent=2))
          print(json.dumps(att,indent=2))
          PY

      - name: Download exact DEV BID and ASK Jan-Jul 2024
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/bid /tmp/xau/ask
          for side in bid ask; do
            for m in 01 02 03 04 05 06 07; do
              file="xauusd_${side}_m1_2024_${m}.csv"
              url="https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/${side}/m1/${file}"
              curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 "$url" -o "/tmp/xau/${side}/${file}"
            done
          done

      - name: Verify all 14 DEV source hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          man=json.load(open('xau-wick-zone-pro/results/XAUUSD_Z4_DEV_SOURCE_MANIFEST_v0_1.json'))
          exp={x['file']:x['sha256'] for x in man['files']}
          got={}
          for side in ('bid','ask'):
            for p in sorted(Path('/tmp/xau',side).glob('*.csv')):
              got[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(got)==14, len(got)
          assert set(got)==set(exp)
          bad={k:(got[k],exp[k]) for k in got if got[k]!=exp[k]}
          assert not bad,bad
          print('DEV source hash gate PASS',len(got))
          PY

      - name: Rebuild cadence candidate BID
        env:
          C: ${{ matrix.cadence }}
        shell: bash
        run: |
          set -euo pipefail
          python "/tmp/xau_zone_episode_dev_z4_C${C}.py" \
            --files /tmp/xau/bid/*.csv \
            --output "/tmp/C${C}_BID.pkl" \
            --tag "BID_Z4_CADENCE_C${C}"

      - name: Rebuild cadence candidate ASK
        env:
          C: ${{ matrix.cadence }}
        shell: bash
        run: |
          set -euo pipefail
          python "/tmp/xau_zone_episode_dev_z4_C${C}.py" \
            --files /tmp/xau/ask/*.csv \
            --output "/tmp/C${C}_ASK.pkl" \
            --tag "ASK_Z4_CADENCE_C${C}"

      - name: Evaluate cadence predictive and common-anchor gates
        env:
          C: ${{ matrix.cadence }}
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/xau_z4_cadence_candidate_dev_eval_v0_1.py \
            --bid-pkl "/tmp/C${C}_BID.pkl" \
            --ask-pkl "/tmp/C${C}_ASK.pkl" \
            --cadence "$C" \
            --engine-patch-json "/tmp/C${C}_engine_patch.json" \
            --output "/tmp/XAUUSD_Z4_CADENCE_C${C}_DEV_RESULTS_v0_1.json"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: z4-cadence-${{ matrix.cadence }}
          path: |
            /tmp/XAUUSD_Z4_CADENCE_C${{ matrix.cadence }}_DEV_RESULTS_v0_1.json
            /tmp/C${{ matrix.cadence }}_engine_patch.json
            /tmp/C${{ matrix.cadence }}_BID_summary.json
            /tmp/C${{ matrix.cadence }}_ASK_summary.json
          retention-days: 30

  aggregate:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all cadence evidence
        uses: actions/download-artifact@v4
        with:
          pattern: z4-cadence-*
          path: /tmp/cadence-results
          merge-multiple: true

      - name: Aggregate preregistered cadence gate
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/xau_z4_cadence_sensitivity_aggregate_v0_1.py \
            --inputs '/tmp/cadence-results/XAUUSD_Z4_CADENCE_C*_DEV_RESULTS_v0_1.json' \
            --output-json /tmp/XAUUSD_Z4_CADENCE_SENSITIVITY_DEV_RESULTS_v0_1.json \
            --output-md /tmp/XAUUSD_Z4_CADENCE_SENSITIVITY_DEV_RESULTS_v0_1.md

      - name: Publish immutable cadence DEV evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          mkdir -p xau-wick-zone-pro/cadence-sensitivity/candidates
          cp /tmp/XAUUSD_Z4_CADENCE_SENSITIVITY_DEV_RESULTS_v0_1.json xau-wick-zone-pro/cadence-sensitivity/
          cp /tmp/XAUUSD_Z4_CADENCE_SENSITIVITY_DEV_RESULTS_v0_1.md xau-wick-zone-pro/cadence-sensitivity/
          cp /tmp/cadence-results/XAUUSD_Z4_CADENCE_C*_DEV_RESULTS_v0_1.json xau-wick-zone-pro/cadence-sensitivity/candidates/
          cp /tmp/cadence-results/C*_engine_patch.json xau-wick-zone-pro/cadence-sensitivity/candidates/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add xau-wick-zone-pro/cadence-sensitivity
          git commit -m 'publish Z4 cadence sensitivity DEV results v0.1 [skip ci]'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:agent/xau-wick-zone-pro-dev; then exit 0; fi
            git pull --rebase origin agent/xau-wick-zone-pro-dev
            sleep 5
          done
          exit 1
