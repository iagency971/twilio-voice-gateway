name: BTC PropF Session Momentum V1
on:
  push:
    branches: [agent/btc-propf-session-momentum-v1]
    paths:
      - 'btc-propf/run_btc_session_momentum_v1.py'
      - 'btc-propf/docs/BTC_PROPF_SESSION_MOMENTUM_PROTOCOL_V1.md'
      - '.github/workflows/btc-propf-session-momentum-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/btc-propf-session-momentum-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy requests
      - shell: bash
        run: |
          set +e
          mkdir -p btc-propf/results/session_momentum_v1
          python btc-propf/run_btc_session_momentum_v1.py 2>&1 | tee btc-propf/results/session_momentum_v1/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > btc-propf/results/session_momentum_v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "BTC_SESSION_MOMENTUM_V1_FAILURE exit_code=$code" > btc-propf/results/session_momentum_v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-propf/results/session_momentum_v1
          git commit -m "Publish BTC session momentum V1 result [skip ci]" || true
          git push origin HEAD:agent/btc-propf-session-momentum-v1
