name: US100 Zero-Data All24 Branch Search V17

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-v17-all24
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests matplotlib tabulate python-dotenv
      - name: Run V17 all-24 true causal branch search
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/v17_all24_branch_search
          python us100-zero-data/run_v17_all24_branch_search.py 2>&1 | tee us100-zero-data/results/v17_all24_branch_search/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/v17_all24_branch_search/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then echo "V17_FAILURE exit_code=$code" > us100-zero-data/results/v17_all24_branch_search/WORKFLOW_FAILURE.txt; else rm -f us100-zero-data/results/v17_all24_branch_search/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish V17 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/v17_all24_branch_search
          git commit -m "Publish V17 all-24 branch search [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
