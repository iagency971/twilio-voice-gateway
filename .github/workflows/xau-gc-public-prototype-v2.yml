name: XAU GC Public Prototype V2

on:
  push:
    branches:
      - agent/xau-run-a-transient
    paths:
      - 'xau-gc-prototype/**'
      - '.github/workflows/xau-gc-public-prototype-v2.yml'

permissions:
  contents: read

jobs:
  gc-xau-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout transient branch
        uses: actions/checkout@v4

      - name: Compile prototype source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum xau-gc-prototype/gc_xau_public_prototype.py
          python -m py_compile xau-gc-prototype/gc_xau_public_prototype.py

      - name: Install analysis dependencies
        run: python -m pip install pandas numpy requests

      - name: Download and align fixed-contract GCJ26 with XAUUSD BID-ASK
        run: python xau-gc-prototype/gc_xau_public_prototype.py --out outputs/gc_xau_public

      - name: Validate prototype outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/gc_xau_public/alignment_summary.json')
          s=json.loads(p.read_text())
          print(json.dumps(s,indent=2))
          assert s['gc_contract']=='GCJ26 / Apr-2026'
          assert s['overlap_rows'] > 50000
          assert s['overlap_fraction_gc'] > 0.80
          assert s['causal_feature_rows'] > 50000
          assert -1.0 <= s['return_corr_1m'] <= 1.0
          print('GC_XAU_PROTOTYPE_GATE_OK')
          PY

      - name: Upload compact prototype results
        uses: actions/upload-artifact@v4
        with:
          name: xau-gc-public-prototype-v2
          path: |
            outputs/gc_xau_public/alignment_summary.json
            outputs/gc_xau_public/basis_daily.csv
            outputs/gc_xau_public/aligned_causal_features.csv
          retention-days: 7
