name: QQQ Formed OpenMove V1
on:
  push:
    branches: [agent/qqq-formed-openmove-v1]
    paths:
      - 'qqq-formed/run_qqq_formed_openmove_v1.py'
      - 'qqq-formed/docs/QQQ_FORMED_OPENMOVE_PROTOCOL_V1.md'
      - '.github/workflows/qqq-formed-openmove-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/qqq-formed-openmove-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pandas numpy requests
      - shell: bash
        run: |
          set +e
          mkdir -p qqq-formed/results/v1
          python qqq-formed/run_qqq_formed_openmove_v1.py 2>&1 | tee qqq-formed/results/v1/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > qqq-formed/results/v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "QQQ_FORMED_OPENMOVE_V1_FAILURE exit_code=$code" > qqq-formed/results/v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qqq-formed/results/v1
          git commit -m "Publish QQQ formed opening-move V1 result [skip ci]" || true
          git push origin HEAD:agent/qqq-formed-openmove-v1
