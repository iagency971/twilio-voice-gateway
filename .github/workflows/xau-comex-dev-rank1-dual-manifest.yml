name: XAU COMEX DEV_RANK1 DUAL Manifest Build

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-dual-manifest.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 requests
      - name: Build frozen request manifest — local files only
        run: |
          python xau-multiyear/scripts/build_comex_dev_rank1_dual_manifest.py \
            --mapping xau-final-results/comex_dev_rank1_gate_v1/frozen_session_mapping_all.csv \
            --quote xau-final-results/comex_dev_rank1_gate_v1/dev_rank1_exact_raw_contract_quote.json \
            --roll-policy xau-multiyear/docs/COMEX_DEV_RANK1_ROLL_POLICY_CANONICAL_v2.md \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --weights xau-final-results/comex_dev_rank1_gate_v1/corrected_strata_weights.csv \
            --analysis-prereg xau-multiyear/docs/COMEX_DEV_RANK1_ANALYSIS_PREREG_v1.md \
            --feature-v11 xau-multiyear/docs/COMEX_DEV_RANK1_FEATURE_SPEC_CANONICAL_v1_1.md \
            --feature-v12 xau-multiyear/docs/COMEX_DEV_RANK1_FEATURE_SPEC_CANONICAL_v1_2.md \
            --availability-policy xau-multiyear/docs/COMEX_DEV_RANK1_AVAILABILITY_POLICY_v1.md \
            --out /tmp/dual_manifest
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-dual-manifest-v1
          path: /tmp/dual_manifest/
          retention-days: 90
      - name: Publish frozen manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64, os, pathlib, requests
          src=pathlib.Path('/tmp/dual_manifest')
          root='xau-final-results/comex_dev_rank1_dual_manifest_v1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for p in sorted(src.iterdir()):
              if not p.is_file(): continue
              path=f'{root}/{p.name}'
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']})
              sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish frozen DEV_RANK1 DUAL manifest {p.name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
