name: CL EIA Cost Probe V1
on:
  push:
    branches: [agent/cl-eia-intraday-momentum-v1]
    paths: ['cl-eia/**','.github/workflows/cl-eia-cost-probe-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cl-eia-intraday-momentum-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip databento
      - name: Estimate only — no data download
        run: python cl-eia/cost_probe.py
      - name: Publish estimate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cl-eia/results/cost_probe
          git commit -m "Publish CL cost estimate [skip ci]" || true
          git push origin HEAD:agent/cl-eia-intraday-momentum-v1
