name: XAU Z4 E-BUY Fused Zone Sensitivity v0.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-fused-zone-sensitivity-v0-1.yml'

permissions:
  contents: write
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.2 joblib==1.5.2

      - name: Acquire exact 24-month BID raw and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau /tmp/fused
          python - <<'PY'
          import json,subprocess,hashlib,os
          from pathlib import Path
          man=json.load(open(os.environ['MANIFEST']))
          fs=[x for x in man['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07']
          assert len(fs)==24
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/xau')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          assert len(list(Path('/tmp/xau').glob('*.csv')))==24
          print('RAW_24M_HASH_PASS')
          PY

      - name: Build canonical continuous outcome-blind C5 Z4 geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('xau-wick-zone-pro/xau_zone_episode_dev_z4.py').read_text()
          repl=[
            ('p=utc_ts(ts); return p.minute%15==0 and p.second==0','p=utc_ts(ts); return p.minute%5==0 and p.second==0'),
            ('if i<LOOKBACK-1 or i+HORIZON+REACT_MAX>=N or not landmark_ok(T[i]): continue','if i<LOOKBACK-1 or not landmark_ok(T[i]): continue'),
            ('out=outcome_zone(i,zlo,zhi,center,side,v)','out={}'),
            ("'revisit_rate':float(Z.revisited.mean()),'runtime_sec':time.time()-t0","'revisit_rate':None,'runtime_sec':time.time()-t0")]
          for o,n in repl:
              assert src.count(o)==1,(o,src.count(o));src=src.replace(o,n)
          assert 'out=outcome_zone(' not in src and '.revisited' not in src
          Path('/tmp/z4_c5_geometry_only.py').write_text(src)
          PY
          python /tmp/z4_c5_geometry_only.py --files /tmp/xau/*.csv --output /tmp/fused/Z4_C5_24M_CONTINUOUS.pkl --tag Z4_C5_EBUY_FUSED_SENSITIVITY_24M
          python - <<'PY'
          import pandas as pd
          z=pd.read_pickle('/tmp/fused/Z4_C5_24M_CONTINUOUS.pkl');z['time']=pd.to_datetime(z.time,utc=True)
          assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z') and z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z')
          print('CANONICAL_CONTINUOUS_Z4_READY',len(z),z.time.nunique())
          PY

      - name: Download exact frozen H1 reaction target geometry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32908654286
          pattern: z4-*
          path: /tmp/h1z4
          merge-multiple: true

      - name: Assemble canonical target map and diagnose H1 difference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import numpy as np
          import pandas as pd
          cont=pd.read_pickle('/tmp/fused/Z4_C5_24M_CONTINUOUS.pkl');cont['time']=pd.to_datetime(cont.time,utc=True)
          fs=sorted(glob.glob('/tmp/h1z4/z4_*.pkl'));assert len(fs)==12,fs
          h1=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True);h1['time']=pd.to_datetime(h1.time,utc=True)
          lo=pd.Timestamp('2024-08-01T00:00:00Z');mid=pd.Timestamp('2025-08-01T00:00:00Z');hi=pd.Timestamp('2026-08-01T00:00:00Z')
          h1=h1[(h1.time>=lo)&(h1.time<mid)].copy()
          assert h1.time.min()>=lo and h1.time.max()<mid
          h2=cont[(cont.time>=mid)&(cont.time<hi)].copy()
          z=pd.concat([h1,h2],ignore_index=True).sort_values(['time','side','center']).reset_index(drop=True)
          z.to_pickle('/tmp/fused/Z4_C5_24M_CANONICAL_REACTION_TARGETS.pkl')

          cand=pd.read_csv('xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv.gz',compression='gzip',low_memory=False)
          cand=cand[cand.window.astype(str)=='OOS_H1'].copy();cand['time']=pd.to_datetime(cand.time,utc=True)
          closes=cand.groupby('time',sort=False)['close'].first().to_dict()
          cH=cont[(cont.time>=lo)&(cont.time<mid)]
          by_c={pd.Timestamp(t):g for t,g in cH.groupby('time',sort=False)}
          by_m={pd.Timestamp(t):g for t,g in h1.groupby('time',sort=False)}
          def target(g,close):
              if g is None:return None
              u=g[(g.side==1)&(g.zlo>close)]
              if len(u)==0:u=g[g.side==1]
              if len(u)==0:return None
              r=u.iloc[int(np.argmin(u.zlo.to_numpy(float)-close))]
              return (float(r.zlo),float(r.center),float(r.zhi))
          dif=[]
          for t,cl in closes.items():
              a=target(by_c.get(t),float(cl));b=target(by_m.get(t),float(cl))
              if a!=b:dif.append((t,float(cl),a,b))
          print('H1_TARGET_MAP_DIFFERING_SNAPSHOTS',len(dif))
          for x in dif[:20]:print('H1_TARGET_DIFF',x)
          print('CANONICAL_REACTION_TARGET_Z4_READY',len(z),len(h1),len(h2))
          PY

      - name: Frozen-study guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile xau-wick-zone-pro/entry-research/xau_ebuy_fused_zone_sensitivity_v0_1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_PREREG_v0_1_2026-08-26.md').read_text()
          for x in ['0.10v, 0.20v, 0.25v, 0.30v, 0.40v, 0.50v','retrospective sensitivity','No model refit','No fusion threshold may be promoted']:
              assert x in p,x
          m=Path('xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib')
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='ac1c3effe84b64ffd1deebd82c3c6009ae56be9505974e3824b20169e3b38342'
          print('FUSED_STUDY_GUARDS_PASS')
          PY

      - name: Run frozen fused-zone sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/entry-research/xau_ebuy_fused_zone_sensitivity_v0_1.py \
            --files /tmp/xau/*.csv \
            --z4-pkl /tmp/fused/Z4_C5_24M_CANONICAL_REACTION_TARGETS.pkl \
            --candidates-gz xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv.gz \
            --model-pkl xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib \
            --coverage-result xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json \
            --h2-reference xau-wick-zone-pro/entry-research/ebuy-h2-validation-v1-0/XAUUSD_Z4_EBUY_H2_VALIDATION_RESULT_v1_0.json \
            --output-json /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_RESULT_v0_1.json \
            --output-csv /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_SUMMARY_v0_1.csv

      - name: Publish sensitivity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/ebuy-fused-zone-sensitivity-v0-1
          mkdir -p "$out"
          cp /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_RESULT_v0_1.json "$out/"
          cp /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_SUMMARY_v0_1.csv "$out/"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('xau-wick-zone-pro/entry-research/ebuy-fused-zone-sensitivity-v0-1')
          paths={
            'prereg':Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_PREREG_v0_1_2026-08-26.md'),
            'engine':Path('xau-wick-zone-pro/entry-research/xau_ebuy_fused_zone_sensitivity_v0_1.py'),
            'result':out/'XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_RESULT_v0_1.json',
            'summary':out/'XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_SUMMARY_v0_1.csv'}
          x=json.loads(paths['result'].read_text())
          (out/'XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_MANIFEST_v0_1.json').write_text(json.dumps({'status':'RECORDED','study_status':x['status'],'sha256':{k:hashlib.sha256(v.read_bytes()).hexdigest() for k,v in paths.items()}},indent=2))
          PY
          git add "$out"
          git commit -m 'publish E-BUY fused-zone retrospective sensitivity v0.1 [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
