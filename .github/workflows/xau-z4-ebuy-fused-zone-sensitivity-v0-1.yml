name: XAU Z4 E-BUY Fused Zone Sensitivity v0.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-fused-zone-sensitivity-v0-1.yml'

permissions:
  contents: write

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json

jobs:
  geometry-month:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: ['2024-08','2024-09','2024-10','2024-11','2024-12','2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Download target plus one-month causal geometry warmup
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in /tmp/out
          python - <<'PY'
          import os,json,subprocess,hashlib
          from pathlib import Path
          t=os.environ['TARGET'];y,m=map(int,t.split('-'));pm=m-1;py=y
          if pm==0:pm=12;py-=1
          months=[f'{py:04d}-{pm:02d}',t]
          man=json.load(open(os.environ['MANIFEST']));ix={f"{x['year']}-{x['month']}":x for x in man['files'] if x['side']=='bid'}
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for mm in months:
              x=ix[mm];p=Path('/tmp/in')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          PY
      - name: Build target-month outcome-blind Z4 geometry
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py').read_text();anchor='    m=len(Z)\n';assert src.count(anchor)==1
          Path('/tmp/geom.py').write_text(src.replace(anchor,"    keep=['time','landmark_i','center','zlo','zhi','side']\n    Z[keep].to_pickle(args.output)\n    return\n\n"+anchor))
          PY
          python /tmp/geom.py --files /tmp/in/*.csv --output /tmp/all.pkl --tag FUSED_${TARGET}
          python - <<'PY'
          import os,pandas as pd
          t=os.environ['TARGET'];lo=pd.Timestamp(t+'-01T00:00:00Z');hi=lo+pd.offsets.MonthBegin(1);d=pd.read_pickle('/tmp/all.pkl');d['time']=pd.to_datetime(d.time,utc=True);q=d[(d.time>=lo)&(d.time<hi)].copy().reset_index(drop=True);assert len(q)>0;q.to_pickle('/tmp/out/z4_'+t.replace('-','_')+'.pkl')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fused-z4-${{ matrix.target }}
          path: /tmp/out/*.pkl
          retention-days: 1

  sensitivity:
    needs: geometry-month
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.2 joblib==1.5.2
      - uses: actions/download-artifact@v4
        with:
          pattern: fused-z4-*
          path: /tmp/z4parts
          merge-multiple: true
      - name: Assemble 24-month Z4 geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fused /tmp/xau
          python - <<'PY'
          import glob,pandas as pd
          fs=sorted(glob.glob('/tmp/z4parts/z4_*.pkl'));assert len(fs)==24,fs
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True);z['time']=pd.to_datetime(z.time,utc=True);lo=pd.Timestamp('2024-08-01T00:00:00Z');hi=pd.Timestamp('2026-08-01T00:00:00Z');assert z.time.min()>=lo and z.time.max()<hi;z.sort_values(['time','side','center']).reset_index(drop=True).to_pickle('/tmp/fused/Z4_C5_24M.pkl')
          print('Z4_24M_READY',len(z),z.time.nunique())
          PY
      - name: Acquire exact 24-month BID raw and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,hashlib,os
          from pathlib import Path
          man=json.load(open(os.environ['MANIFEST']));fs=[x for x in man['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07'];assert len(fs)==24
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/xau')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL);assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          assert len(list(Path('/tmp/xau').glob('*.csv')))==24
          print('RAW_24M_HASH_PASS')
          PY
      - name: Frozen-study guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile xau-wick-zone-pro/entry-research/xau_ebuy_fused_zone_sensitivity_v0_1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_PREREG_v0_1_2026-08-26.md').read_text()
          for x in ['0.10v, 0.20v, 0.25v, 0.30v, 0.40v, 0.50v','retrospective sensitivity','No model refit','No fusion threshold may be promoted'] : assert x in p,x
          m=Path('xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib');assert hashlib.sha256(m.read_bytes()).hexdigest()=='ac1c3effe84b64ffd1deebd82c3c6009ae56be9505974e3824b20169e3b38342'
          print('FUSED_STUDY_GUARDS_PASS')
          PY
      - name: Run frozen fused-zone sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/entry-research/xau_ebuy_fused_zone_sensitivity_v0_1.py \
            --files /tmp/xau/*.csv \
            --z4-pkl /tmp/fused/Z4_C5_24M.pkl \
            --candidates-gz xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv.gz \
            --model-pkl xau-wick-zone-pro/entry-research/ebuy-score-freeze-v1-1/XAUUSD_Z4_EBUY_US_M1_MODEL_FROZEN_v1_1.joblib \
            --coverage-result xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json \
            --h2-reference xau-wick-zone-pro/entry-research/ebuy-h2-validation-v1-0/XAUUSD_Z4_EBUY_H2_VALIDATION_RESULT_v1_0.json \
            --output-json /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_RESULT_v0_1.json \
            --output-csv /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_SUMMARY_v0_1.csv
      - name: Publish sensitivity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions;git config user.email github-actions@github.com;git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/ebuy-fused-zone-sensitivity-v0-1;mkdir -p "$out";cp /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_RESULT_v0_1.json "$out/";cp /tmp/fused/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_SUMMARY_v0_1.csv "$out/"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('xau-wick-zone-pro/entry-research/ebuy-fused-zone-sensitivity-v0-1');paths={'prereg':Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_PREREG_v0_1_2026-08-26.md'),'engine':Path('xau-wick-zone-pro/entry-research/xau_ebuy_fused_zone_sensitivity_v0_1.py'),'result':out/'XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_RESULT_v0_1.json','summary':out/'XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_SUMMARY_v0_1.csv'};x=json.loads(paths['result'].read_text());(out/'XAUUSD_Z4_EBUY_FUSED_ZONE_SENSITIVITY_MANIFEST_v0_1.json').write_text(json.dumps({'status':'RECORDED','study_status':x['status'],'sha256':{k:hashlib.sha256(v.read_bytes()).hexdigest() for k,v in paths.items()}},indent=2))
          PY
          git add "$out";git commit -m 'publish E-BUY fused-zone retrospective sensitivity v0.1 [skip ci]' || exit 0;git push origin HEAD:agent/xau-wick-zone-pro-dev
