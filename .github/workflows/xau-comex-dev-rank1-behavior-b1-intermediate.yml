# trigger-once: behavior-b1-intermediate-2026-08-18
name: XAU COMEX DEV_RANK1 Behavior B1 Intermediate

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-behavior-b1-intermediate.yml']

permissions:
  actions: read
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow scikit-learn==1.5.2 requests
      - name: Download frozen DEV_RANK1 features
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-event-features-v1
          path: /tmp/features
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32183736697
      - name: Download completed B0 folds
        uses: actions/download-artifact@v4
        with:
          pattern: comex-dev-rank1-behavior-fold-B0-*
          path: /tmp/folds
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32190353775
      - name: Download completed B1 folds
        uses: actions/download-artifact@v4
        with:
          pattern: comex-dev-rank1-behavior-fold-B1-*
          path: /tmp/folds
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32190353775
      - name: Aggregate frozen B1 versus B0 only
        run: |
          python xau-multiyear/scripts/aggregate_comex_dev_rank1_behavior_b1_partial.py \
            --features /tmp/features/dev_rank1_event_features.parquet \
            --fold-root /tmp/folds \
            --out /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-behavior-b1-intermediate-v1
          path: /tmp/result/
          retention-days: 90
      - name: Publish intermediate freeze
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/result');root='xau-final-results/comex_dev_rank1_behavior_b1_intermediate_v1';h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['result.json','metrics.csv','annual_metrics.csv','outer_fold_audit.json']:
              p=src/name;path=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None;body={'message':f'publish DEV_RANK1 behavior B1 intermediate {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
