name: Gold reopen FTMO quick temp

on:
  push:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27
    paths:
      - '.github/workflows/gold_reopen_ftmo_quick_temp.yml'

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-reopen-stat-study-2026-08-27
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download recent BID ASK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tail_bid tail_ask
          npx --yes dukascopy-node -i xauusd -from 2026-08-20 -to 2026-08-28 -t m1 -p bid -f csv -bs 1 -bp 5000 -dir tail_bid -fn recent_bid -r 5 -rp 10000 -fr
          sleep 5
          npx --yes dukascopy-node -i xauusd -from 2026-08-20 -to 2026-08-28 -t m1 -p ask -f csv -bs 1 -bp 5000 -dir tail_ask -fn recent_ask -r 5 -rp 10000 -fr
      - name: Compute 2025 2026 FTMO result
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,json,os
          from concurrent.futures import ThreadPoolExecutor,as_completed
          spec=importlib.util.spec_from_file_location('g','xau-multiyear/reopen-study/gold_reopen_ftmo_study.py')
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g)
          store={'bid':{},'ask':{}}; tasks=[]
          for side in ('bid','ask'):
            for y in (2025,2026):
              for m in range(1,(8 if y==2026 else 12)+1): tasks.append((side,y,m))
          with ThreadPoolExecutor(max_workers=6) as ex:
            for fut in as_completed([ex.submit(g.load_archive_month,*t) for t in tasks]):
              side,y,m,o,mx=fut.result(); store[side].update(o)
          g.parse_tail('tail_bid/recent_bid.csv','bid',store,None)
          g.parse_tail('tail_ask/recent_ask.csv','ask',store,None)
          events,reject=g.build_events(store)
          out={'reject':reject,'years':{},'months2026':{},'weekdays2026':{}}
          for y in (2025,2026):
            for typ in ('NORMAL','WEEKEND'):
              es=[e for e in events if e['year']==y and e['type']==typ]
              z=g.summarize_entries(es)
              out['years'].setdefault(str(y),{})[typ]=z
          for m in range(1,9):
            es=[e for e in events if e['year']==2026 and e['month']==m and e['type']=='NORMAL']
            out['months2026'][f'{m:02d}']=g.summarize_entries(es)
          for wd in range(4):
            es=[e for e in events if e['year']==2026 and e['type']=='NORMAL' and e['entry_weekday_num']==wd]
            out['weekdays2026'][str(wd)]=g.summarize_entries(es)
          p='xau-multiyear/reopen-study/FTMO_QUICK_2025_2026_2026-08-27.json'
          json.dump(out,open(p,'w'),sort_keys=True,indent=2)
          print(json.dumps({'reject':reject,'N2025':out['years']['2025']['NORMAL']['N'],'N2026':out['years']['2026']['NORMAL']['N']}))
          PY
      - name: Commit quick result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xau-multiyear/reopen-study/FTMO_QUICK_2025_2026_2026-08-27.json
          git commit -m 'results: add FTMO quick 2025-2026 output' || exit 0
          git push origin HEAD:agent/gold-reopen-stat-study-2026-08-27
