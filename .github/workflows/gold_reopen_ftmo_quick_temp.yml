name: Gold reopen FTMO compact extractor temp

on:
  push:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27
    paths:
      - '.github/workflows/gold_reopen_ftmo_quick_temp.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-reopen-stat-study-2026-08-27
      - name: Extract headline results from completed 2025-2026 run
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          src='xau-multiyear/reopen-study/FTMO_QUICK_2025_2026_2026-08-27.json'
          d=json.load(open(src))
          def b(z):
            if not z or not z.get('N'): return {'N':0}
            return {k:z.get(k) for k in ('N','mean','median','win_pct','pf','p10','p25','p75','p90')}
          def s(z):
            if not z or not z.get('N'): return {'N':0}
            return {'N':z['N'],'spread':{k:z['spread'].get(k) for k in ('mean','median','p75','p90','p95')},
                    'to1800':b(z['to_1800_open']),'to1805':b(z['exit']['18:05_OPEN']),
                    '1805close':b(z['exit']['18:05_CLOSE']),'1806close':b(z['exit']['18:06_CLOSE']),
                    '1808close':b(z['exit']['18:08_CLOSE']),'1810close':b(z['exit']['18:10_CLOSE']),
                    'missed1800_1805':b(z['missed_1800_to_1805_open']),
                    'avg_swap_mult':z['avg_swap_multiplier'],'swap_be':z['break_even_base_swap_price_units_no_extra_slippage'],
                    'swap_sens':{k:b(z['swap_sensitivity_1805_open'][k]) for k in ('0.25','0.5','1.0','2.0')},
                    'slip_sens':{k:b(z['extra_slippage_sensitivity_1805_open'][k]) for k in ('0.25','0.5','1.0','2.0')}}
          out={'reject':d['reject'],'years':{},'months2026':{},'weekdays2026':{}}
          for y in ('2025','2026'):
            out['years'][y]={}
            for typ in ('NORMAL','WEEKEND'):
              g=d['years'][y][typ]
              out['years'][y][typ]={'N':g['N'],'entries':{e:s(g['entries'][e]) for e in ('16:45','16:46','16:47','16:48','16:49')},'diag_16:50':s(g['diagnostic_16:50'])}
          for m in d['months2026']:
            g=d['months2026'][m]
            out['months2026'][m]={'N':g['N'],'entries':{e:s(g['entries'][e]) for e in ('16:45','16:49')}}
          for wd in d['weekdays2026']:
            g=d['weekdays2026'][wd]
            out['weekdays2026'][wd]={'N':g['N'],'entries':{'16:49':s(g['entries']['16:49'])}}
          dst='xau-multiyear/reopen-study/FTMO_HEADLINE_2025_2026_2026-08-27.json'
          json.dump(out,open(dst,'w'),sort_keys=True,indent=2)
          PY
      - name: Commit headline result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xau-multiyear/reopen-study/FTMO_HEADLINE_2025_2026_2026-08-27.json
          git commit -m 'results: add compact FTMO headline output' || exit 0
          git push origin HEAD:agent/gold-reopen-stat-study-2026-08-27
