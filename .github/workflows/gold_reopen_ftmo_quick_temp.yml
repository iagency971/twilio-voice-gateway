name: Gold reopen FTMO quick temp

on:
  pull_request:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-reopen-stat-study-2026-08-27
      - name: Print compact FTMO results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='xau-multiyear/reopen-study/FTMO_QUICK_2025_2026_2026-08-27.json'
          d=json.load(open(p))
          def m(x):
              if not x or not x.get('N'): return {'N':0}
              def b(k):
                  z=x[k]
                  return {'mean':round(z['mean'],6),'median':round(z['median'],6),'win':round(z['win_pct'],4),'pf':None if z['pf'] is None else round(z['pf'],4)}
              return {'N':x['N'],'spread':round(x['spread']['mean'],6),'to1800':b('to1800'),'to1805':b('to1805'),
                      '1805c':b('1805close'),'1806c':b('1806close'),'1808c':b('1808close'),'1810c':b('1810close'),
                      'missed':b('missed'),'avgSwapMult':round(x['avgSwapMult'],6),'swapBE':round(x['swapBE'],6),
                      'swap025':b('swap025'),'swap050':b('swap050'),'swap100':b('swap100'),
                      'slip025':b('slip025'),'slip050':b('slip050'),'slip100':b('slip100')}
          out={'reject':d['reject'],'years':{},'aug2026':{},'weekdays2026':{}}
          for y in ('2025','2026'):
              out['years'][y]={}
              for typ in ('NORMAL','WEEKEND'):
                  g=d['years'][y][typ]
                  out['years'][y][typ]={'N':g['N'],'entries':{}}
                  for e in ('16:45','16:46','16:47','16:48','16:49','16:50'):
                      out['years'][y][typ]['entries'][e]=m(g['entries'][e])
          for e in ('16:45','16:49'):
              out['aug2026'][e]=m(d['months2026']['08']['entries'][e])
          for wd,name in [('0','Mon'),('1','Tue'),('2','Wed'),('3','Thu')]:
              out['weekdays2026'][name]={'16:49':m(d['weekdays2026'][wd]['entries']['16:49'])}
          print('HEADLINE_START')
          print(json.dumps(out,sort_keys=True))
          print('HEADLINE_END')
          PY
