name: CL Proxy Screen 2026 V1
on:
  push:
    branches: [agent/cl-eia-intraday-momentum-v1]
    paths: ['cl-eia/**','.github/workflows/cl-proxy-screen-2026-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cl-eia-intraday-momentum-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run free proxy screen
        shell: bash
        run: |
          set +e
          mkdir -p cl-eia/results/proxy_screen_2026_v1
          python cl-eia/run_proxy_screen_2026_v1.py 2>&1 | tee cl-eia/results/proxy_screen_2026_v1/run.log
          code=${PIPESTATUS[0]}; echo "$code" > cl-eia/results/proxy_screen_2026_v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "CL_PROXY_SCREEN_FAILURE exit_code=$code" > cl-eia/results/proxy_screen_2026_v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cl-eia/results/proxy_screen_2026_v1
          git commit -m "Publish CL free proxy screen V1 [skip ci]" || true
          git push origin HEAD:agent/cl-eia-intraday-momentum-v1
