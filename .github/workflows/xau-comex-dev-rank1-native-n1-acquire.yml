name: XAU COMEX DEV_RANK1 Native N1 One-Shot Acquisition

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - 'xau-authorizations/NATIVE_N1_0_45.json'

concurrency:
  group: xau-comex-dev-rank1-native-n1-one-shot
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}

jobs:
  acquire-and-quote-n2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - run: python -m pip install pandas==2.2.3 numpy pyarrow databento requests

      - name: N1 global exact pre-download hard gate
        run: |
          python xau-multiyear/scripts/acquire_comex_native_n1.py gate \
            --quote xau-final-results/comex_dev_rank1_native_n1_quote_v1/native_n1_quote.json \
            --market-requests xau-final-results/comex_dev_rank1_native_n1_quote_v1/native_n1_market_request_manifest.csv \
            --source-requests xau-final-results/comex_dev_rank1_native_n1_quote_v1/native_n1_source_request_manifest.csv \
            --authorization xau-authorizations/NATIVE_N1_0_45.json \
            --completion-marker xau-final-results/comex_dev_rank1_native_n1_acquisition_v1/ACQUISITION_COMPLETE.json \
            --out /tmp/n1_gate

      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-gate-v1
          path: /tmp/n1_gate/
          retention-days: 90

      - name: N1 one-shot acquisition — hard cap 0.45 USD, no paid retry
        run: |
          python xau-multiyear/scripts/acquire_comex_native_n1.py acquire \
            --gate /tmp/n1_gate/gate.json \
            --out /tmp/n1

      - name: Preserve N1 raw acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-n1-raw-v1
          path: /tmp/n1/
          retention-days: 90
          if-no-files-found: warn

      - name: Hard QA N1 completion before any N2 work
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/n1/ACQUISITION_COMPLETE.json'))
          s=json.load(open('/tmp/n1/acquisition_summary.json'))
          assert z['version']=='COMEX_DEV_RANK1_NATIVE_N1_ACQUISITION_COMPLETE_V1'
          assert z['complete'] is True and z['requests']==92
          assert z['paid_cost_upper_bound_usd'] <= 0.45 + 1e-12
          assert z['n2_download_authorized'] is False
          assert s['complete'] is True and s['hard_cap_respected'] is True
          assert s['n2_download_performed'] is False
          print('NATIVE_N1_ACQUISITION_QA_OK', z['paid_cost_upper_bound_usd'], s['records_downloaded_total'])
          PY

      - name: Publish compact N1 acquisition state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/n1');root='xau-final-results/comex_dev_rank1_native_n1_acquisition_v1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['acquisition_summary.json','ACQUISITION_COMPLETE.json']:
              p=src/name;dst=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}";payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish native N1 acquisition state {name} [skip ci]','content':payload,'branch':os.environ['BRANCH']}
                  if sha:body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201):break
                  if r.status_code not in (409,422):r.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:raise SystemExit(f'could not publish {dst}')
          PY

      - name: Screen N1 and quote N2 only — no N2 download
        run: |
          python xau-multiyear/scripts/build_quote_comex_native_n2.py \
            --source-levels xau-final-results/comex_dev_rank1_native_source_levels_v1/native_source_levels.csv \
            --source-requests xau-final-results/comex_dev_rank1_native_n1_quote_v1/native_n1_source_request_manifest.csv \
            --n1-root /tmp/n1 \
            --out /tmp/n2_quote

      - name: Hard QA N2 remains quote-only
        run: |
          python - <<'PY'
          import json,pandas as pd
          z=json.load(open('/tmp/n2_quote/native_n2_quote.json'))
          assert z['version']=='COMEX_DEV_RANK1_NATIVE_N2_QUOTE_V1'
          assert z['authorization']=='N2_DOWNLOAD_NOT_AUTHORIZED'
          assert z['market_data_download_performed'] is False
          assert z['n2_download_performed'] is False
          assert z['n1_complete'] is True
          assert z['source_levels']==368 and z['source_sessions']==92
          assert z['levels_no_exact_contact_by_n1_screen'] + z['levels_requiring_n2'] == 368
          assert z['exact_n2_cost_usd'] >= 0
          assert z['dev_rank2_opened'] is False and z['retro_confirm_opened'] is False and z['locked_comex_test_opened'] is False
          x=pd.read_csv('/tmp/n2_quote/native_n1_level_screen.csv')
          assert len(x)==368 and x.level_id.nunique()==368
          print('NATIVE_N2_QUOTE_ONLY_QA_OK', z['levels_requiring_n2'], z['n2_merged_market_requests'], z['exact_n2_cost_usd'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-n2-quote-v1
          path: /tmp/n2_quote/
          retention-days: 90

      - name: Publish N1 screen and exact N2 quote
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/n2_quote');root='xau-final-results/comex_dev_rank1_native_n2_quote_v1'
          names=['native_n2_quote.json','native_n1_level_screen.csv','native_n2_candidate_level_minutes.csv','native_n2_market_request_manifest.csv']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in names:
              p=src/name;dst=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}";payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish native N2 metadata quote {name} [skip ci]','content':payload,'branch':os.environ['BRANCH']}
                  if sha:body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201):break
                  if r.status_code not in (409,422):r.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:raise SystemExit(f'could not publish {dst}')
          PY
