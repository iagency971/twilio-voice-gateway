# refresh accelerated V3 exact-cost status 2
name: XAU COMEX Run Status Probe
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-run-status.yml']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query recent branch workflows and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,json,os,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          u=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs"
          r=requests.get(u,headers=h,params={'branch':os.environ['BRANCH'],'per_page':100}); r.raise_for_status()
          wanted={'XAU COMEX Acquisition Plan V1','XAU COMEX Event Timing Smoke 2025','XAU GC Schema Cost Upper Bounds','XAU GC Prewindow Cost Curve 2025','XAU COMEX Session Reuse Analysis','XAU COMEX Supplement Package Preview','XAU COMEX Session Tier Costs','XAU COMEX Supplement Cost Pilot','XAU COMEX Stage0 Exact Cost','XAU COMEX Screening Package V2','XAU COMEX V2 Tier2 Gap30 Exact Cost','XAU COMEX Screening Package V3','XAU COMEX V3 Tier2 Gap30 Exact Cost'}
          rows=[]
          for x in r.json().get('workflow_runs',[]):
              if x.get('name') in wanted:
                  rows.append({k:x.get(k) for k in ['id','name','event','status','conclusion','head_sha','run_number','created_at','updated_at']})
          out={'branch':os.environ['BRANCH'],'runs':rows}
          raw=(json.dumps(out,indent=2)+'\n').encode(); path='xau-final-results/comex_acquisition_plan_v1/run_status.json'
          cu=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          old=requests.get(cu,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
          b={'message':'publish accelerated COMEX V3 exact-cost status [skip ci]','content':base64.b64encode(raw).decode(),'branch':os.environ['BRANCH']}
          if sha:b['sha']=sha
          q=requests.put(cu,headers=h,json=b); q.raise_for_status(); print(json.dumps(out,indent=2))
          PY
