name: XAU GC Trades Cost Only
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-gc-trades-cost-only.yml'
permissions:
  contents: write
jobs:
  cost-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Databento
        run: python -m pip install databento
      - name: Get GC trades historical cost only
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import databento as db
          if not os.getenv('DATABENTO_API_KEY'):
              raise SystemExit('DATABENTO_API_KEY missing')
          client=db.Historical(os.environ['DATABENTO_API_KEY'])
          kw=dict(dataset='GLBX.MDP3',symbols='GC.v.0',stype_in='continuous',schema='trades',start='2011-01-01',end='2026-08-17')
          cost=float(client.metadata.get_cost(**kw))
          out={'dataset':'GLBX.MDP3','symbol':'GC.v.0','schema':'trades','start':'2011-01-01','end':'2026-08-17','cost_usd':cost,'download_performed':False}
          Path('/tmp/gc_trades_cost_only.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, requests
          p=pathlib.Path('/tmp/gc_trades_cost_only.json')
          path='xau-final-results/gc_databento_cost/trades_cost_only.json'
          url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          r=requests.get(url,headers=h,params={'ref':os.environ['BRANCH']})
          sha=r.json().get('sha') if r.status_code==200 else None
          body={'message':'publish GC trades cost-only result [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          rr=requests.put(url,headers=h,json=body); rr.raise_for_status()
          PY
