# trigger-once: 2026-08-18-dev-rank1-zero-cost-v1
name: XAU COMEX DEV_RANK1 Zero-Cost Gate

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-zero-cost-gate.yml']

permissions:
  actions: read
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - run: python -m pip install pandas==2.2.3 databento requests

      - name: Download canonical event/session artifact
        uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32102932187

      - name: Locate paid pilot raw artifact — no Databento call
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          runs=requests.get(f"{base}/actions/workflows/xau-comex-v4-pilot12-metadata.yml/runs",headers=h,params={'branch':'agent/xau-comex-acquisition-plan','status':'success','per_page':30}).json().get('workflow_runs',[])
          found=None
          for r in runs:
              arts=requests.get(f"{base}/actions/runs/{r['id']}/artifacts",headers=h,params={'per_page':100}).json().get('artifacts',[])
              if any(a['name']=='comex-v4-pilot12-raw-and-qa' and not a.get('expired') for a in arts):
                  found=r['id']; break
          if not found: raise SystemExit('paid pilot raw artifact not found')
          print(f'run_id={found}')
          PY

      - name: Download existing paid raw pilot artifact
        uses: actions/download-artifact@v4
        with:
          name: comex-v4-pilot12-raw-and-qa
          path: /tmp/acq
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ steps.locate.outputs.run_id }}

      - name: Pilot session-boundary QA — local files only
        run: |
          python xau-multiyear/scripts/qa_comex_pilot_session_boundaries.py \
            --raw-root /tmp/acq \
            --sessions xau-final-results/comex_v4_pilot12/pilot12_sessions.csv \
            --out /tmp/boundary

      - name: Correct roles, replacements, weights, coverage and metadata quote
        run: |
          python xau-multiyear/scripts/prepare_comex_dev_rank1_gate.py \
            --candidates /tmp/plan/session_candidates_all.csv \
            --events /tmp/plan/canonical_events_all.csv.gz \
            --pilot xau-final-results/comex_v4_pilot12/pilot12_sessions.csv \
            --out /tmp/gate

      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-zero-cost-gate-v1
          path: |
            /tmp/gate/
            /tmp/boundary/
          retention-days: 90

      - name: Publish compact gate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64, os, pathlib, requests
          roots=[pathlib.Path('/tmp/gate'),pathlib.Path('/tmp/boundary')]
          dest='xau-final-results/comex_dev_rank1_gate_v1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for root in roots:
              for p in sorted(root.iterdir()):
                  if not p.is_file(): continue
                  path=f'{dest}/{p.name}'
                  u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']})
                  sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish COMEX DEV_RANK1 zero-cost gate {p.name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
                  if sha: body['sha']=sha
                  r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
