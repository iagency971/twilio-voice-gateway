name: XAU Preoutcome Target Status Probe

on:
  push:
    branches: [agent/xau-preoutcome-status]
    paths:
      - 'xau-recovery/PREOUTCOME_TARGET_STATUS_TRIGGER.json'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-preoutcome-status
      - name: Read target workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,requests,pathlib
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          u=f"{base}/actions/workflows/xau-comex-native-reaction-preoutcome-final.yml/runs"
          z=requests.get(u,headers=h,params={'branch':'agent/xau-comex-acquisition-plan','per_page':5}).json()
          runs=z.get('workflow_runs',[])
          out={'target_workflow':'xau-comex-native-reaction-preoutcome-final.yml','runs_found':len(runs),'runs':[]}
          for r in runs:
              row={k:r.get(k) for k in ['id','name','display_title','head_sha','status','conclusion','created_at','updated_at','run_started_at','run_number','event','html_url']}
              jobs=requests.get(f"{base}/actions/runs/{r['id']}/jobs",headers=h).json().get('jobs',[])
              row['jobs']=[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs]
              out['runs'].append(row)
          pathlib.Path('xau-recovery/PREOUTCOME_TARGET_RUN_STATUS.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Publish status probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xau-recovery/PREOUTCOME_TARGET_RUN_STATUS.json
          git commit -m 'publish isolated preoutcome target status [skip ci]'
          git push origin HEAD:agent/xau-preoutcome-status
