# zero-cost-only: parallel DEV_RANK1 v0 versus n0 panel diagnostic
name: XAU COMEX DEV_RANK1 V0-N0 Panel QA V2

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v4-pilot12-metadata.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 databento requests
      - name: Compare v0 and n0 on all DEV_RANK1 sessions — metadata only
        run: |
          python xau-multiyear/scripts/diagnose_comex_v0_n0_panel_v2.py \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --out /tmp/v0n0
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-v0-n0-panel-v2
          path: /tmp/v0n0/
          retention-days: 90
      - name: Publish V0-N0 panel QA V2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/v0n0');root='xau-final-results/comex_dev_rank1_gate_v1';h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for p in src.iterdir():
              if not p.is_file():continue
              path=f'{root}/{p.name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None;body={'message':f'publish COMEX DEV_RANK1 V0-N0 QA V2 {p.name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
