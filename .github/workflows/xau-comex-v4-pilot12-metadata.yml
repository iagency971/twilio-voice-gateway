# authorized acquisition: trades+tbbo, hard cap USD 4.03
name: XAU COMEX V4 Pilot12 Guarded Acquisition

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v4-pilot12-metadata.yml']

permissions:
  actions: read
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      quoted_total: ${{ steps.gate.outputs.quoted_total }}
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - name: Anti-double-spend lock
        run: |
          if [ -f xau-final-results/comex_v4_pilot12_acquisition/pilot12_qa_summary.json ]; then
            echo 'Acquisition already completed; refusing any second download.' >&2
            exit 1
          fi

      - run: python -m pip install pandas==2.2.3 databento

      - name: Requote and enforce global USD 4.03 cap
        id: gate
        run: |
          python xau-multiyear/scripts/acquire_comex_v4_pilot12.py gate \
            --sessions xau-final-results/comex_v4_pilot12/pilot12_sessions.csv \
            --out /tmp/gate \
            --cap-usd 4.03
          echo "matrix=$(cat /tmp/gate/matrix.json)" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('/tmp/gate/gate.json'))
          print(f"quoted_total={x['current_pre_download_quote_usd']:.12f}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: comex-v4-pilot12-download-gate
          path: /tmp/gate/
          retention-days: 90

  download:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - run: python -m pip install pandas==2.2.3 databento

      - name: Download exactly one authorized range
        run: |
          python xau-multiyear/scripts/acquire_comex_v4_pilot12.py download-one \
            --era '${{ matrix.era }}' \
            --date '${{ matrix.research_trading_date }}' \
            --schema '${{ matrix.schema }}' \
            --start '${{ matrix.start_utc }}' \
            --end '${{ matrix.end_utc }}' \
            --expected-cost '${{ matrix.quoted_cost_usd }}' \
            --expected-records '${{ matrix.quoted_records }}' \
            --tolerance-usd 0.00020 \
            --out /tmp/raw

      - uses: actions/upload-artifact@v4
        with:
          name: pilot12-raw-${{ matrix.research_trading_date }}-${{ matrix.schema }}
          path: /tmp/raw/
          compression-level: 0
          retention-days: 90

  qa:
    needs: [gate, download]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan

      - run: python -m pip install pandas==2.2.3 numpy databento requests

      - uses: actions/download-artifact@v4
        with:
          pattern: pilot12-raw-*
          path: /tmp/raw
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: comex-v4-pilot12-download-gate
          path: /tmp/gate

      - name: Aggregate QA
        run: |
          python xau-multiyear/scripts/qa_comex_v4_pilot12.py \
            --raw-root /tmp/raw \
            --sessions xau-final-results/comex_v4_pilot12/pilot12_sessions.csv \
            --gate /tmp/gate/gate.json \
            --out /tmp/qa

      - name: Preserve raw DBN and QA together
        uses: actions/upload-artifact@v4
        with:
          name: comex-v4-pilot12-raw-and-qa
          path: |
            /tmp/raw/
            /tmp/gate/
            /tmp/qa/
          compression-level: 0
          retention-days: 90

      - name: Publish compact acquisition manifest and QA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64, os, pathlib, requests
          items={
            '/tmp/gate/gate.json':'pilot12_download_gate.json',
            '/tmp/qa/pilot12_qa_summary.json':'pilot12_qa_summary.json',
            '/tmp/qa/pilot12_qa_by_session.csv':'pilot12_qa_by_session.csv',
          }
          root='xau-final-results/comex_v4_pilot12_acquisition'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for src,name in items.items():
            p=pathlib.Path(src); path=f'{root}/{name}'
            u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
            old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']})
            sha=old.json().get('sha') if old.status_code==200 else None
            body={'message':f'publish COMEX V4 pilot12 acquisition {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
            if sha: body['sha']=sha
            r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
