# metadata-only: finalize staged V4 Stage1 plan
name: XAU COMEX V4 Stage1 Staged Plan

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v4-pilot12-metadata.yml']

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 databento requests
      - name: Download canonical session candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: comex-acquisition-plan-v1
          path: /tmp/plan
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32102932187
      - name: Finalize staged plan and M1 metadata costs
        run: |
          python xau-multiyear/scripts/finalize_comex_v4_stage_plan.py \
            --candidates /tmp/plan/session_candidates_all.csv \
            --panel xau-final-results/comex_v4_tier2/tier2_sessions_v4.csv \
            --costs xau-final-results/comex_v4_tier2/tier2_remaining_session_schema_costs.csv \
            --pilot xau-final-results/comex_v4_pilot12/pilot12_sessions.csv \
            --out /tmp/stage1
      - uses: actions/upload-artifact@v4
        with:
          name: comex-v4-stage1-staged-plan
          path: /tmp/stage1/
          retention-days: 90
      - name: Publish staged plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/stage1'); root='xau-final-results/comex_v4_stage1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['stage1_staged_plan.json','stage1_sessions.csv','stage1_strata_weights.csv','stage1_m1_costs.csv']:
              p=src/name; path=f'{root}/{name}'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish COMEX V4 staged plan {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
