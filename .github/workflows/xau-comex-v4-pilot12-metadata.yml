# zero-cost-only: DEV_RANK1 low-session symbology diagnostic
name: XAU COMEX DEV_RANK1 Low-Session Symbology QA

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-v4-pilot12-metadata.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 databento requests
      - name: Diagnose low sessions using free metadata and symbology only
        run: |
          python xau-multiyear/scripts/diagnose_comex_low_sessions.py \
            --quotes xau-final-results/comex_dev_rank1_gate_v1/dev_rank1_new_session_quotes.csv \
            --threshold 5000 \
            --out /tmp/low
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-low-session-qa-v1
          path: /tmp/low/
          retention-days: 90
      - name: Publish low-session QA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/low'); root='xau-final-results/comex_dev_rank1_gate_v1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for p in src.iterdir():
              if not p.is_file(): continue
              path=f'{root}/{p.name}'; u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish COMEX DEV_RANK1 low-session QA {p.name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
