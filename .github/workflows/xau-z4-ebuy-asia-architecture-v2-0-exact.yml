name: XAU Z4 E-BUY Asia Architecture v2.0 Exact

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-asia-architecture-v2-0-exact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  FROZEN_C5_GEOMETRY_RUN_ID: '33009186853'
  ASIA_V1_RUN_ID: '33018338282'

jobs:
  asia-v2-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen prereg and code guards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s xau-wick-zone-pro/session-research/XAUUSD_Z4_EBUY_ASIA_SESSION_PREREG_v2_0_2026-08-26.md
          test -s xau-wick-zone-pro/session-research/xau_ebuy_asia_architecture_v2_0_exact_parity.py
          python -m py_compile xau-wick-zone-pro/session-research/xau_ebuy_asia_architecture_v2_0.py xau-wick-zone-pro/session-research/xau_ebuy_asia_architecture_v2_0_exact_parity.py xau-wick-zone-pro/session-research/xau_ebuy_asia_reaction_v2_0_wrapper.py
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py)" = "ef45037d2a99a705ddf9bfbc3ebc666f88119a80"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py)" = "bfb0d65efce0f5773b2045eaf4c31ed6bc07740f"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_3.py)" = "10747fcf3bc9fa4e362fc7b42592d3eebba2fe12"
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_ebuy_asia_reaction_v1_0.py)" = "07b5a3fe367f7d38bf51c581541c3eeaa32d0300"
          got=$(gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${ASIA_V1_RUN_ID}" --jq .head_sha)
          test "$got" = "54213c52ca4bd49ef06bd2404dceaec0a9c2e5b3"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Download exact frozen source-faithful C5 geometry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_C5_GEOMETRY_RUN_ID }}
          pattern: frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true
      - name: Assemble exact 24M C5 geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'));assert len(fs)==24
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True);z['time']=pd.to_datetime(z.time,utc=True);z=z.sort_values(['time','side','center']).reset_index(drop=True)
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl');print('Z4_READY',len(z),z.time.nunique())
          PY
      - name: Acquire exact 24M BID source and verify hashes
        shell: bash
        run: |
          set -euo pipefail;mkdir -p /tmp/raw /tmp/results
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.load(open(os.environ['MANIFEST']));fs=[x for x in m['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07'];assert len(fs)==24
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/raw')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL);assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          print('RAW_HASH_PASS',len(fs))
          PY
      - name: Run preregistered Asia v2 architecture grid with exact v1 parity
        shell: bash
        run: |
          set -euo pipefail
          python xau-wick-zone-pro/session-research/xau_ebuy_asia_architecture_v2_0_exact_parity.py --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl --output /tmp/results/XAUUSD_Z4_EBUY_ASIA_ARCHITECTURE_RESULT_v2_0.json --selected-csv /tmp/results/XAUUSD_Z4_EBUY_ASIA_SELECTED_CANDIDATES_v2_0.csv
      - name: Conditionally run frozen Asia reaction semantics
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(python - <<'PY'
          import json
          q=json.load(open('/tmp/results/XAUUSD_Z4_EBUY_ASIA_ARCHITECTURE_RESULT_v2_0.json'));print('1' if q.get('reaction_study_authorized') else '0')
          PY
          )
          if [ "$AUTH" = 1 ]; then
            python xau-wick-zone-pro/session-research/xau_ebuy_asia_reaction_v2_0_wrapper.py --files /tmp/raw/*.csv --z4-pkl /tmp/FROZEN_C5_24M.pkl --candidates-csv /tmp/results/XAUUSD_Z4_EBUY_ASIA_SELECTED_CANDIDATES_v2_0.csv --gate-result /tmp/results/XAUUSD_Z4_EBUY_ASIA_ARCHITECTURE_RESULT_v2_0.json --output /tmp/results/XAUUSD_Z4_EBUY_ASIA_REACTION_RESULT_v2_0.json --contacts-csv /tmp/results/XAUUSD_Z4_EBUY_ASIA_CONTACTS_v2_0.csv.gz --br-csv /tmp/results/XAUUSD_Z4_EBUY_ASIA_BR_v2_0.csv.gz
          else
            echo REACTION_NOT_AUTHORIZED
          fi
      - name: Build final evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/results');arch=json.load(open(root/'XAUUSD_Z4_EBUY_ASIA_ARCHITECTURE_RESULT_v2_0.json'))
          files=sorted(p for p in root.iterdir() if p.is_file());man={'status':'ASIA_V2_EXACT_EVIDENCE_COMPLETE','architecture_status':arch['status'],'selected_architecture':arch.get('selected_architecture'),'reaction_executed':(root/'XAUUSD_Z4_EBUY_ASIA_REACTION_RESULT_v2_0.json').exists(),'production_authorization':'NONE','files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (root/'XAUUSD_Z4_EBUY_ASIA_V2_MANIFEST.json').write_text(json.dumps(man,indent=2));print(json.dumps(man,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asia-v2-exact-architecture-and-gated-reaction
          path: /tmp/results/*
          retention-days: 30
