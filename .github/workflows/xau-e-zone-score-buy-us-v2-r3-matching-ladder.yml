name: XAU E-zone V2 R3 matching ladder

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - .github/workflows/xau-e-zone-score-buy-us-v2-r3-matching-ladder.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG: xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2
  DATA: /tmp/xau-v2-data
  WORK: /tmp/xau-r3-ladder

jobs:
  ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Build 2022 outcome-blind design population
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          mkdir -p "$DATA" "$WORK"
          python "$PKG/xau_e_zone_v2_acquire.py" --output-dir "$DATA" --manifest "$DATA/DATA_INPUT_MANIFEST.json"
          FILES=$(python - <<'PY'
          import pandas as pd
          print(' '.join(f'/tmp/xau-v2-data/xauusd_bid_m1_{p.year:04d}_{p.month:02d}.csv' for p in pd.period_range('2021-11','2022-12',freq='M')))
          PY
          )
          python "$PKG/xau_z4_geometry_only_v2.py" --files $FILES --output-pkl "$WORK/z4.pkl" --output-csv "$WORK/z4.csv" --manifest "$WORK/z4_manifest.json" --tag R3_LADDER_VAL
          python "$PKG/xau_e_zone_v2_instrument.py" --files $FILES --z4-pkl "$WORK/z4.pkl" --output-features "$WORK/features.csv.gz" --output-display-all "$WORK/display_all.csv.gz" --output-full-pool "$WORK/full_pool.csv.gz" --output-context "$WORK/context.csv.gz" --manifest "$WORK/instrument_manifest.json" --target-start 2022-01-01T00:00:00Z --target-end 2023-01-01T00:00:00Z
      - name: Run frozen outcome-blind matching ladder
        shell: bash
        run: |
          set -euo pipefail
          python "$PKG/xau_e_zone_v2_r3_matching_ladder.py" --features "$WORK/features.csv.gz" --full-pool "$WORK/full_pool.csv.gz" --context "$WORK/context.csv.gz" --output "$WORK/R3_MATCHING_LADDER_VAL.json"
          cat "$WORK/R3_MATCHING_LADDER_VAL.json"
      - name: Commit ladder result
        shell: bash
        run: |
          set -euo pipefail
          cp "$WORK/R3_MATCHING_LADDER_VAL.json" "$PKG/R3_MATCHING_LADDER_VAL.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PKG/R3_MATCHING_LADDER_VAL.json"
          git commit -m 'record outcome-blind V2 R3 matching ladder'
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          git push origin HEAD:agent/xau-wick-zone-pro-dev
