name: US100 Zero-Data DEV Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/us100-zero-data-dev.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-dev-v1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen 2021-2024 DEV
        shell: bash
        run: |
          set -euo pipefail
          python us100-zero-data/run_or_family_dev_v1.py | tee /tmp/us100_or_dev.log
      - name: Publish result to research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/or_family_v1
          git commit -m "Publish frozen US100 OR-family DEV results [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
