name: US100 Zero-Data DEV Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/us100-zero-data-dev.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-dev-v1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen 2021-2024 DEV
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/or_family_v1
          python us100-zero-data/run_or_family_dev_v1.py 2>&1 | tee us100-zero-data/results/or_family_v1/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/or_family_v1/EXIT_CODE.txt
          if [ "$code" -ne 0 ]; then
            echo "US100_OR_FAMILY_DEV_FAILURE exit_code=$code" > us100-zero-data/results/or_family_v1/WORKFLOW_FAILURE.txt
          else
            rm -f us100-zero-data/results/or_family_v1/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish result to research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/or_family_v1
          git commit -m "Publish frozen US100 OR-family DEV results [skip ci]" || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
