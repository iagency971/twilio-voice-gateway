name: XAU Core Evidence Audit V1 Preflight 2011
on:
  push:
    branches: [agent/xau-core-evidence-audit-v1]
    paths:
      - '.github/workflows/xau-core-evidence-audit-preflight.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Publish RUNNING marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,json,os,requests
          path='xau-final-results/xau_core_evidence_audit_v1_preflight/status.json'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']})
          sha=old.json().get('sha') if old.status_code==200 else None
          payload=json.dumps({'status':'RUNNING','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'source_commit':os.environ.get('GITHUB_SHA')},indent=2).encode()
          body={'message':'mark XAU core audit preflight running [skip ci]','content':base64.b64encode(payload).decode(),'branch':os.environ['BRANCH']}
          if sha: body['sha']=sha
          r=requests.put(u,headers=h,json=body); r.raise_for_status()
          PY
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: Frozen engine tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_vantage_overlay.py xau-multiyear/tests/test_entries_v1.py xau-multiyear/tests/test_entries_v2.py
      - name: Rehydrate exact canonical 2011 input window
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2010-01 --to-month 2012-01 --out /tmp/xau_core_audit_2011.csv
      - name: Reconstruct 2011 core ledger and assert parity
        env:
          PYTHONPATH: xau-multiyear/src
        run: |
          python xau-multiyear/scripts/run_xau_core_audit_annual_v1.py /tmp/xau_core_audit_2011.csv \
            --year 2011 \
            --expected-annual-summary xau-final-results/phase_c_vantage_raw_2011_2025/annual/2011_summary.csv \
            --out /tmp/core_audit_2011
      - name: Publish preflight parity and ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-core-evidence-audit-v1
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def put(path, data, message):
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':message,'content':base64.b64encode(data).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          root='xau-final-results/xau_core_evidence_audit_v1_preflight'
          put(f'{root}/parity_2011.json',pathlib.Path('/tmp/core_audit_2011/parity_2011.json').read_bytes(),'publish XAU core audit 2011 parity [skip ci]')
          put(f'{root}/ledger_2011.csv.gz',pathlib.Path('/tmp/core_audit_2011/ledger_2011.csv.gz').read_bytes(),'publish XAU core audit 2011 ledger [skip ci]')
          status=json.dumps({'status':'PASS','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'source_commit':os.environ.get('GITHUB_SHA')},indent=2).encode()
          put(f'{root}/status.json',status,'mark XAU core audit preflight pass [skip ci]')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-core-audit-preflight-2011
          path: /tmp/core_audit_2011
          retention-days: 7
