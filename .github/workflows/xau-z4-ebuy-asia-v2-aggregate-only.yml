name: XAU Z4 E-BUY Asia v2 Aggregate Only

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-asia-v2-aggregate-only.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '33019797987'
  SOURCE_RUN_SHA: 'd9c3fd4f4aad6204ddf0aa6901723cf6b174f766'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1
      - name: Guard immutable source grid
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          got=$(gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)
          test "$got" = "$SOURCE_RUN_SHA"
          n=$(gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[]|select(.name|startswith("asia-v2-esm-"))]|length')
          test "$n" = 9
          echo SOURCE_GRID_PASS "$got" artifacts="$n"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: asia-v2-esm-*
          path: /tmp/grid
          merge-multiple: false
      - name: Exact v1 parity and deterministic final aggregation
        shell: bash
        run: |
          set -euo pipefail;mkdir -p /tmp/final
          python - <<'PY'
          import importlib.util,json,shutil,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('agg_parent','xau-wick-zone-pro/session-research/xau_ebuy_asia_architecture_v2_0_exact_parity.py');m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m);p=m.mod
          candidates={};worker_runtime=0.0
          fs=sorted(Path('/tmp/grid').glob('asia-v2-esm-*/result.json'));assert len(fs)==9,len(fs)
          for f in fs:
              q=json.load(open(f));assert q['status']=='ASIA_V2_SINGLE_ESM_COMPLETE';assert q['candidate_count']==5;worker_runtime+=float(q['runtime_sec']);candidates.update(q['candidates'])
          assert len(candidates)==45,len(candidates)
          parity=p.parity_v1(candidates)
          passers=sorted(k for k,q in candidates.items() if q['passes_both_windows'])
          selected=None
          if passers:
              def key(cid):
                  q=candidates[cid];h1=q['windows']['H1'];h2=q['windows']['H2'];wc1=min(h1['metrics']['coverage']['1.0'],h2['metrics']['coverage']['1.0']);wc15=min(h1['metrics']['coverage']['1.5'],h2['metrics']['coverage']['1.5']);wp=min(h1['stability']['survival_aware_display_persistence'],h2['stability']['survival_aware_display_persistence']);wn=max(h1['metrics']['nearest_distance_v_p90'],h2['metrics']['nearest_distance_v_p90']);return(q['supplemental_family_count'],-wc1,-wc15,-wp,wn,cid)
              selected=sorted(passers,key=key)[0]
              src=list(Path('/tmp/grid').glob(f'asia-v2-esm-*/csv/{selected}.csv.gz'));assert len(src)==1,src;shutil.copy2(src[0],'/tmp/final/XAUUSD_Z4_EBUY_ASIA_SELECTED_CANDIDATES_v2_0.csv.gz')
          out={'status':'ASIA_V2_ARCHITECTURE_GATE_PASS' if selected else 'ASIA_V2_ARCHITECTURE_GATE_FAIL','scope':'C5_ASIA_18_03_OUTCOME_BLIND_PREEXISTING_ARCHITECTURE_GRID_PARALLEL_IMMUTABLE_AGGREGATION','future_price_outcomes_used':False,'score_used':False,'source_run_id':33019797987,'source_run_sha':'d9c3fd4f4aad6204ddf0aa6901723cf6b174f766','candidate_count':45,'passer_count':len(passers),'passers':passers,'v1_current_architecture_parity':parity,'selection_rule':'pass H1+H2; fewest supplemental families; max worst C1; max worst C1.5; max worst survival persistence; min worst nearest p90; ID','all_candidates':candidates,'selected_architecture':selected,'reaction_study_authorized':bool(selected),'authorization':'AUTHORIZE_ASIA_V2_REACTION_STUDY' if selected else 'STOP_RETAIN_US_ONLY','production_authorization':'NONE','sum_worker_runtime_sec':worker_runtime}
          Path('/tmp/final/XAUUSD_Z4_EBUY_ASIA_ARCHITECTURE_RESULT_v2_0.json').write_text(json.dumps(out,indent=2,default=str));print(json.dumps({'status':out['status'],'candidate_count':45,'passer_count':len(passers),'passers':passers,'selected':selected},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asia-v2-immutable-aggregate
          path: /tmp/final/*
          retention-days: 30
