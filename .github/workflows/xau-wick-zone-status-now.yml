name: XAU Wick Zone Status Now

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-status-now.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot latest workflow statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-wick-zone-pro-dev
        run: |
          python - <<'PY'
          import base64,json,os,urllib.parse,urllib.request,time
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:return json.load(r)
          out={'checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'workflows':{}}
          for wf in ['xau-wick-zone-pro-oos-bid-recovery.yml','xau-wick-zone-pine-parity.yml','xau-wick-zone-score-map.yml','xau-wick-zone-finalization-monitor.yml']:
            q=urllib.parse.quote(os.environ['BRANCH'],safe='')
            rs=get(f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/{wf}/runs?branch={q}&per_page=3").get('workflow_runs',[])
            out['workflows'][wf]=[{'id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'html_url':r.get('html_url')} for r in rs]
          raw=json.dumps(out,indent=2).encode(); path='xau-wick-zone-pro/STATUS_NOW.json'; url=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
          body={'message':'publish current wick-zone workflow status [skip ci]','content':base64.b64encode(raw).decode(),'branch':os.environ['BRANCH']}
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=h,method='PUT')
          try:
            with urllib.request.urlopen(req,timeout=60) as r:print(r.status)
          except urllib.error.HTTPError as e:
            if e.code!=422: raise
          print(raw.decode())
          PY
