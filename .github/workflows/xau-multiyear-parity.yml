name: XAU Multiyear Parity Gate
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - 'xau-multiyear/**'
      - '.github/workflows/xau-multiyear-parity.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - name: Acquire Jan-Apr 2026 BID ASK
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2026-01 --to-month 2026-04 --out /tmp/xau_2026q1.csv
      - name: Run frozen worker
        run: python xau-multiyear/scripts/run_a_annual_worker.py /tmp/xau_2026q1.csv --target-start 2026-01-01 --target-end 2026-05-01 --out /tmp/parity --controls 5
      - name: Verify exact research parity
        run: |
          python - <<'PY'
          import json, pandas as pd, numpy as np
          assert pd.__version__=='2.2.3',pd.__version__
          assert np.__version__=='2.3.5',np.__version__
          m=json.load(open('/tmp/parity/run_manifest.json'))
          assert m['input_bars']==172800,m
          assert m['zones']==33634,m
          assert m['target_events']==26479,m
          assert m['control_draws']==129853,m
          assert m['paired_events_any']==26174,m
          s=pd.read_csv('/tmp/parity/paired_summary_by_family.csv')
          exp={'DISPLACEMENT_ORIGIN':4.909909909909909,'FVG':0.38248898376987606,'MEMORY':0.8406432748538006,'OBJECTIVE_LIQUIDITY':3.646005509641872}
          for fam,val in exp.items():
              got=float(s[(s.family==fam)&(s['mode']=='ANY_CONTROL')].iloc[0].paired_lift_0_5sigma_pp)
              assert np.isclose(got,val,rtol=0,atol=1e-10),(fam,got,val)
          print('MULTIYEAR_PARITY_GATE_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-multiyear-parity
          path: /tmp/parity
          retention-days: 7
