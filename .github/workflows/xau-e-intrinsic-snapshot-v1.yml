name: XAU E intrinsic snapshot V1 outcome-blind

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-intrinsic-snapshot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-real-outcome-blind-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Synthetic deterministic tests
        working-directory: xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1
        run: python test_xau_e_intrinsic_snapshot_v1.py | tee E_INTRINSIC_SNAPSHOT_V1_SYNTHETIC_TESTS.json

      - name: Outcome-blind source provenance hashes
        shell: bash
        run: |
          set -euo pipefail
          PKG='xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1'
          SRC='xau-wick-zone-pro/entry-research/ebuy-coverage-v0-4/XAUUSD_Z4_EBUY_STICKY_CANDIDATES_v0_4.csv.gz'
          LEGACY='dee5bfdd1ed6bb0b7eebc19280cb3cb3ee2e35c3da14a14d3ee1ee644a52a920'
          python "$PKG/xau_e_intrinsic_source_provenance_v1.py" --source "$SRC" --legacy-expected-sha256 "$LEGACY" --output "$PKG/E_INTRINSIC_SNAPSHOT_V1_SOURCE_PROVENANCE.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_SOURCE_PROVENANCE.json')
          d=json.loads(p.read_text())
          assert d['status']=='E_V04_SOURCE_PROVENANCE_LEGACY_HASH_RESOLVED', d
          assert 'decompressed_payload_sha256' in d['legacy_hash_match_modes'], d
          PY

      - name: Build ledger twice from frozen v0.4 source
        shell: bash
        run: |
          set -euo pipefail
          PKG='xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1'
          SRC='xau-wick-zone-pro/entry-research/ebuy-coverage-v0-4/XAUUSD_Z4_EBUY_STICKY_CANDIDATES_v0_4.csv.gz'
          EXP_PAYLOAD='dee5bfdd1ed6bb0b7eebc19280cb3cb3ee2e35c3da14a14d3ee1ee644a52a920'
          python "$PKG/xau_e_intrinsic_snapshot_v1.py" --candidates "$SRC" --output "$PKG/E_INTRINSIC_SNAPSHOT_V1_LEDGER.csv.gz" --manifest "$PKG/E_INTRINSIC_SNAPSHOT_V1_MANIFEST.json" --expected-source-payload-sha256 "$EXP_PAYLOAD"
          python "$PKG/xau_e_intrinsic_snapshot_v1.py" --candidates "$SRC" --output "$PKG/E_INTRINSIC_SNAPSHOT_V1_LEDGER_REPEAT.csv.gz" --manifest "$PKG/E_INTRINSIC_SNAPSHOT_V1_MANIFEST_REPEAT.json" --expected-source-payload-sha256 "$EXP_PAYLOAD"
          cmp "$PKG/E_INTRINSIC_SNAPSHOT_V1_LEDGER.csv.gz" "$PKG/E_INTRINSIC_SNAPSHOT_V1_LEDGER_REPEAT.csv.gz"

      - name: Independent real-ledger QA
        shell: bash
        run: |
          set -euo pipefail
          PKG='xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1'
          SRC='xau-wick-zone-pro/entry-research/ebuy-coverage-v0-4/XAUUSD_Z4_EBUY_STICKY_CANDIDATES_v0_4.csv.gz'
          EXP_PAYLOAD='dee5bfdd1ed6bb0b7eebc19280cb3cb3ee2e35c3da14a14d3ee1ee644a52a920'
          python "$PKG/xau_e_intrinsic_snapshot_qa_v1.py" --candidates "$SRC" --ledger "$PKG/E_INTRINSIC_SNAPSHOT_V1_LEDGER.csv.gz" --manifest "$PKG/E_INTRINSIC_SNAPSHOT_V1_MANIFEST.json" --output "$PKG/E_INTRINSIC_SNAPSHOT_V1_QA.json" --expected-source-payload-sha256 "$EXP_PAYLOAD"

      - name: Freeze package hashes and static QA
        shell: bash
        env:
          FREEZE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          pkg=Path('xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1')
          research=Path('xau-wick-zone-pro/score-research')
          files=[
            research/'XAUUSD_E_SCORE_OUTCOME_BLIND_METHOD_AUDIT_US_BUY_2026-08-28.md',
            pkg/'XAUUSD_E_INTRINSIC_SNAPSHOT_PREREG_v1_0_2026-08-29.md',
            pkg/'XAUUSD_E_INTRINSIC_REACTION_PREREG_v1_0_2026-08-29.md',
            pkg/'XAUUSD_E_INTRINSIC_MODEL_AND_VALIDATION_GATE_PREREG_v1_0_2026-08-29.md',
            pkg/'XAUUSD_E_V04_SOURCE_PROVENANCE_RESOLUTION_2026-08-29.md',
            pkg/'xau_e_intrinsic_snapshot_v1.py',pkg/'xau_e_intrinsic_snapshot_qa_v1.py',
            pkg/'xau_e_intrinsic_source_provenance_v1.py',pkg/'test_xau_e_intrinsic_snapshot_v1.py',pkg/'E_INTRINSIC_SNAPSHOT_V1_SCHEMA.json',
            pkg/'E_INTRINSIC_SNAPSHOT_V1_FEATURE_REGISTRY.json',pkg/'E_INTRINSIC_SNAPSHOT_V1_SOURCE_PROVENANCE.json',
            Path('xau-wick-zone-pro/entry-research/ebuy-coverage-v0-4/XAUUSD_Z4_EBUY_STICKY_CANDIDATES_v0_4.csv.gz'),
            pkg/'E_INTRINSIC_SNAPSHOT_V1_LEDGER.csv.gz',pkg/'E_INTRINSIC_SNAPSHOT_V1_QA.json'
          ]
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          freeze={'status':'E_INTRINSIC_SNAPSHOT_V1_METHOD_CODE_GATES_AND_REAL_LEDGER_FROZEN','git_commit':os.environ['FREEZE_SHA'],'future_price_outcomes_used':False,'sha256':{str(p):h(p) for p in files}}
          (pkg/'E_INTRINSIC_SNAPSHOT_V1_CODE_FREEZE.json').write_text(json.dumps(freeze,indent=2,sort_keys=True)+'\n')
          qa=json.loads((pkg/'E_INTRINSIC_SNAPSHOT_V1_QA.json').read_text())
          static={'status':'E_INTRINSIC_SNAPSHOT_V1_STATIC_AND_REAL_QA_PASS' if qa['status']=='E_INTRINSIC_SNAPSHOT_V1_REAL_QA_PASS' else 'E_INTRINSIC_SNAPSHOT_V1_QA_FAIL','git_commit':os.environ['FREEZE_SHA'],'future_price_outcomes_used':False,'source_provenance':'RESOLVED_PAYLOAD_HASH_MATCH','synthetic_tests':'PASS','deterministic_repeat_cmp':'PASS','real_qa_status':qa['status'],'authorization':'READY_FOR_PRO_PRE_OUTCOME_GATE' if qa['status']=='E_INTRINSIC_SNAPSHOT_V1_REAL_QA_PASS' else 'BLOCK_OUTCOME_OPENING'}
          (pkg/'E_INTRINSIC_SNAPSHOT_V1_STATIC_QA.json').write_text(json.dumps(static,indent=2,sort_keys=True)+'\n')
          if static['authorization']!='READY_FOR_PRO_PRE_OUTCOME_GATE': raise SystemExit(3)
          PY

      - name: Upload frozen outcome-blind package
        uses: actions/upload-artifact@v4
        with:
          name: e-intrinsic-snapshot-v1-real-outcome-blind
          if-no-files-found: error
          retention-days: 90
          path: |
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_LEDGER.csv.gz
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_MANIFEST.json
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_QA.json
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_STATIC_QA.json
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_CODE_FREEZE.json
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_SYNTHETIC_TESTS.json
            xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1/E_INTRINSIC_SNAPSHOT_V1_SOURCE_PROVENANCE.json

      - name: Commit frozen real-ledger QA results to branch
        shell: bash
        run: |
          set -euo pipefail
          PKG='xau-wick-zone-pro/score-research/e-intrinsic-snapshot-v1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_LEDGER.csv.gz" \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_MANIFEST.json" \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_QA.json" \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_STATIC_QA.json" \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_CODE_FREEZE.json" \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_SYNTHETIC_TESTS.json" \
            "$PKG/E_INTRINSIC_SNAPSHOT_V1_SOURCE_PROVENANCE.json"
          git commit -m 'freeze real outcome-blind E intrinsic V1 ledger and QA'
          git push origin HEAD:agent/xau-wick-zone-pro-dev
