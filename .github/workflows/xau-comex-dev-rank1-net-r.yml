# trigger-once: comex-dev-rank1-net-r-surface-2026-08-18
name: XAU COMEX DEV_RANK1 Net-R Surface

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-net-r.yml']

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      outcome_run_id: ${{ steps.locate.outputs.outcome_run_id }}
      feature_run_id: ${{ steps.locate.outputs.feature_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 pyarrow requests
      - name: Locate complete frozen source artifacts
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,requests,time
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          expected_out={f'comex-dev-rank1-vantage-outcomes-{y}-v1' for y in range(2011,2019)}
          expected_feat={f'comex-dev-rank1-entry-decision-{m}-v1' for m in ['PASSIVE_TOUCH','TOUCH_NEXT_OPEN','CLEAN_REJECTION','FAILED_AUCTION','ACCEPTANCE_RETEST','RECLAIM_PULLBACK']}
          def artifacts(run_id):
              out=[]
              for page in range(1,5):
                  z=requests.get(f'{base}/actions/runs/{run_id}/artifacts',headers=h,params={'per_page':100,'page':page});z.raise_for_status();a=z.json().get('artifacts',[]);out+=a
                  if len(a)<100:break
              return {x['name'] for x in out if not x.get('expired')}
          def find_success(workflow, expected, wait=False):
              for cycle in range(80 if wait else 1):
                  z=requests.get(f'{base}/actions/workflows/{workflow}/runs',headers=h,params={'branch':'agent/xau-comex-acquisition-plan','per_page':20});z.raise_for_status()
                  runs=z.json().get('workflow_runs',[])
                  for r in runs:
                      if r.get('status')=='completed' and r.get('conclusion')=='success':
                          have=artifacts(r['id'])
                          if expected.issubset(have):return r['id']
                  if not wait:break
                  # Fail early only if the newest relevant run has completed unsuccessfully.
                  if runs and runs[0].get('status')=='completed' and runs[0].get('conclusion') not in (None,'success'):
                      raise SystemExit(f"latest {workflow} failed: {runs[0].get('conclusion')} run={runs[0]['id']}")
                  time.sleep(20)
              raise SystemExit(f'complete artifacts not found for {workflow}')
          oid=find_success('xau-comex-dev-rank1-vantage-outcomes.yml',expected_out,wait=True)
          fid=find_success('xau-comex-dev-rank1-entry-decision-features.yml',expected_feat,wait=False)
          print(f'outcome_run_id={oid}')
          print(f'feature_run_id={fid}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'outcome_run_id={oid}\nfeature_run_id={fid}\n')
          PY
      - name: Download eight annual Vantage outcome artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: comex-dev-rank1-vantage-outcomes-*-v1
          path: /tmp/annual
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ steps.locate.outputs.outcome_run_id }}
      - name: Freeze one primary-S11 outcome artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          ps=sorted(Path('/tmp/annual').rglob('event_outcomes.parquet'))
          assert len(ps)==8,ps
          frames=[pd.read_parquet(p) for p in ps]
          x=pd.concat(frames,ignore_index=True)
          assert sorted(x.year.unique().tolist())==list(range(2011,2019))
          x=x[x.scenario.eq('S11_C6_PRIMARY')].copy()
          Path('/tmp/primary').mkdir(parents=True,exist_ok=True)
          x.to_parquet('/tmp/primary/dev_rank1_vantage_outcomes_primary.parquet',index=False,compression='zstd')
          meta={'version':'COMEX_DEV_RANK1_VANTAGE_OUTCOMES_PRIMARY_AGG_V1','annual_artifacts':len(ps),'years':sorted(int(y) for y in x.year.unique()),'rows':len(x),'scenario':'S11_C6_PRIMARY','databento_calls':False,'locked_blocks_opened':False}
          Path('/tmp/primary/manifest.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-vantage-outcomes-primary-all-v1
          path: /tmp/primary/
          retention-days: 90

  structural:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model: [PASSIVE_TOUCH, CLEAN_REJECTION, FAILED_AUCTION, ACCEPTANCE_RETEST, RECLAIM_PULLBACK]
        rr: [0.5,1.0,1.5,2.0,2.5,3.0]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-vantage-outcomes-primary-all-v1
          path: /tmp/outcomes
      - uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-entry-decision-${{ matrix.model }}-v1
          path: /tmp/features
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ needs.prepare.outputs.feature_run_id }}
      - name: Run frozen structural Net-R cell
        run: |
          python xau-multiyear/scripts/run_comex_dev_rank1_net_r_cell.py \
            --features /tmp/features/dev_rank1_entry_decision_features.parquet \
            --outcomes /tmp/outcomes/dev_rank1_vantage_outcomes_primary.parquet \
            --entry-model ${{ matrix.model }} \
            --risk-rule STRUCTURAL \
            --target-r ${{ matrix.rr }} \
            --scenario S11_C6_PRIMARY \
            --out /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: net-r-cell-${{ matrix.model }}-STRUCTURAL-RR${{ matrix.rr }}
          path: /tmp/result/
          retention-days: 90

  touch_next_open:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        k: [0.25,0.50,0.75,1.00]
        rr: [0.5,1.0,1.5,2.0,2.5,3.0]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-vantage-outcomes-primary-all-v1
          path: /tmp/outcomes
      - uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-entry-decision-TOUCH_NEXT_OPEN-v1
          path: /tmp/features
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ needs.prepare.outputs.feature_run_id }}
      - name: Run frozen TOUCH_NEXT_OPEN Net-R cell
        shell: bash
        run: |
          RISK=$(printf 'VOL_FLOOR_%.2f' '${{ matrix.k }}')
          python xau-multiyear/scripts/run_comex_dev_rank1_net_r_cell.py \
            --features /tmp/features/dev_rank1_entry_decision_features.parquet \
            --outcomes /tmp/outcomes/dev_rank1_vantage_outcomes_primary.parquet \
            --entry-model TOUCH_NEXT_OPEN \
            --risk-rule "$RISK" \
            --target-r ${{ matrix.rr }} \
            --scenario S11_C6_PRIMARY \
            --out /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: net-r-cell-TOUCH_NEXT_OPEN-K${{ matrix.k }}-RR${{ matrix.rr }}
          path: /tmp/result/
          retention-days: 90

  aggregate:
    needs: [structural, touch_next_open]
    if: ${{ always() && needs.structural.result == 'success' && needs.touch_next_open.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3
      - uses: actions/download-artifact@v4
        with:
          pattern: net-r-cell-*
          path: /tmp/cells
          merge-multiple: false
      - name: Apply frozen six-RR plateau gate
        run: |
          python xau-multiyear/scripts/aggregate_comex_dev_rank1_net_r_cells.py \
            --root /tmp/cells \
            --out /tmp/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-net-r-aggregate-v1
          path: /tmp/aggregate/
          retention-days: 90
      - name: Publish compact frozen Net-R result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/aggregate');root='xau-final-results/comex_dev_rank1_net_r_aggregate_v1'
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['result.json','rr_cell_summary.csv','plateau_verdicts.csv']:
              p=src/name;dst=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{dst}";payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish frozen DEV_RANK1 Net-R aggregate {name} [skip ci]','content':payload,'branch':os.environ['BRANCH']}
                  if sha:body['sha']=sha
                  r=requests.put(u,headers=h,json=body)
                  if r.status_code in (200,201):break
                  if r.status_code not in (409,422):r.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:raise SystemExit(f'could not publish {dst}')
          PY
