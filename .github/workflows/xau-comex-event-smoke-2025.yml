# retrigger 2026-08-18
name: XAU COMEX Event Timing Smoke 2025
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - '.github/workflows/xau-comex-event-smoke-2025.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0
      - run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month 2024-01 --to-month 2026-01 --out /tmp/xau.csv
      - run: python xau-multiyear/scripts/build_comex_event_table.py /tmp/xau.csv --target-start 2025-01-01 --target-end 2026-01-01 --out /tmp/out
      - name: QA causal cutoffs
        run: |
          python - <<'PY'
          import json, pandas as pd
          e=pd.read_csv('/tmp/out/events.csv.gz',compression='gzip',low_memory=False)
          t0=pd.to_datetime(e.contact_time,utc=True)
          assert len(e)==80617, len(e)
          assert (pd.to_datetime(e.uniform_tick_start,utc=True)==t0-pd.Timedelta(minutes=30)).all()
          assert (pd.to_datetime(e.uniform_tick_end,utc=True)==t0+pd.Timedelta(minutes=16)).all()
          for m in ['clean_rejection','failed_auction','reclaim_pullback']:
              q=e[e[m+'_eligible'].astype(str).str.lower().eq('true')]
              if len(q):
                  d=pd.to_datetime(q[m+'_decision_time'],utc=True); c=pd.to_datetime(q.contact_time,utc=True)
                  assert ((d-c)>=pd.Timedelta(minutes=1)).all()
                  assert ((d-c)<=pd.Timedelta(minutes=16)).all(), (m,(d-c).max())
          a=e[e.acceptance_retest_eligible.astype(str).str.lower().eq('true')]
          if len(a): assert ((pd.to_datetime(a.acceptance_retest_decision_time,utc=True)-pd.to_datetime(a.contact_time,utc=True))==pd.Timedelta(minutes=5)).all()
          f=e[e.fvg_only.astype(str).str.lower().eq('true')]
          out={'events':len(e),'fvg_only':len(f),'non_fvg':len(e)-len(f),'behavior':e.behavior_v2.value_counts().to_dict()}
          open('/tmp/out/qa_summary.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - name: Publish compact smoke outputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['manifest.json','qa_summary.json']:
              p=pathlib.Path('/tmp/out')/name; path=f'xau-final-results/comex_event_smoke_2025/{name}'
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"
              r=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=r.json().get('sha') if r.status_code==200 else None
              b={'message':f'publish COMEX 2025 smoke {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:b['sha']=sha
              rr=requests.put(u,headers=h,json=b); rr.raise_for_status()
          PY
