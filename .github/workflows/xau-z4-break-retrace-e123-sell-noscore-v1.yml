name: XAU Z4 Break Retrace E1-E3 SELL No Score v1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-break-retrace-e123-sell-noscore-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  FROZEN_US_STUDY_RUN_ID: '33139524456'
  PREREG: xau-wick-zone-pro/session-research/XAUUSD_Z4_BREAK_RETRACE_E123_SELL_NO_SCORE_PREREG_v1_0_2026-08-28.md

jobs:
  session-study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        session: [US, ASIA_BROAD, ASIA_CORE_STANDALONE, EUROPE]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Frozen preregistration and code guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$PREREG")" = "d03d059c2d4dd29990924cf8884e3d918a50dbc2"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_z4_break_retrace_e123_rejection_v1_0.py)" = "7862638917015838948001a374f9bea7dba83e07"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_4_sticky.py)" = "bfb0d65efce0f5773b2045eaf4c31ed6bc07740f"
          test "$(git hash-object xau-wick-zone-pro/entry-research/xau_ebuy_coverage_v0_1.py)" = "ef45037d2a99a705ddf9bfbc3ebc666f88119a80"
          test "$(git hash-object xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py)" = "536ff1fccf766184d7a61f4a2813b15f2fa79e5c"
          echo SELL_STUDY_PREFLIGHT_PASS

      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1

      - name: Download exact frozen 24M C5 Z4 geometry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_US_STUDY_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true

      - name: Assemble and reflect causal Z4 geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw_orig /tmp/raw_mirror /tmp/results
          python - <<'PY'
          import glob
          import pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'))
          assert len(fs)==24,(len(fs),fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z')
          assert z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z')
          assert set(z.columns)=={'time','landmark_i','center','zlo','zhi','side'},z.columns.tolist()
          m=z.copy()
          old_lo=z.zlo.to_numpy(float); old_hi=z.zhi.to_numpy(float)
          m['center']=-z.center.to_numpy(float)
          m['zlo']=-old_hi
          m['zhi']=-old_lo
          m['side']=-z.side.to_numpy(int)
          assert (m.zlo<=m.center).all() and (m.center<=m.zhi).all()
          m=m.sort_values(['time','side','center']).reset_index(drop=True)
          m.to_pickle('/tmp/FROZEN_C5_24M_SELL_MIRROR.pkl')
          print('SELL_Z4_REFLECTION_PASS',len(m),m.time.nunique(),m.time.min(),m.time.max())
          PY

      - name: Acquire exact BID M1 source, verify hashes, and reflect OHLC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import pandas as pd
          m=json.load(open(os.environ['MANIFEST']))
          rows=[x for x in m['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07']
          assert len(rows)==24,len(rows)
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in rows:
              src=Path('/tmp/raw_orig')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(src)],check=True,stdout=subprocess.DEVNULL)
              got=hashlib.sha256(src.read_bytes()).hexdigest()
              assert got==x['sha256'],(src.name,got,x['sha256'])
              d=pd.read_csv(src)
              for c in ['open','high','low','close']:
                  d[c]=pd.to_numeric(d[c],errors='raise').astype(float)
              o=d.open.to_numpy(float); h=d.high.to_numpy(float); l=d.low.to_numpy(float); c=d.close.to_numpy(float)
              d['open']=-o
              d['high']=-l
              d['low']=-h
              d['close']=-c
              assert (d.high>=d.low).all()
              d.to_csv(Path('/tmp/raw_mirror')/x['file'],index=False)
          print('SELL_RAW_HASH_AND_REFLECTION_PASS',len(rows))
          PY

      - name: Run frozen mirrored structural study
        shell: bash
        env:
          SESSION: ${{ matrix.session }}
        run: |
          set -euo pipefail
          if [ "$SESSION" = "US" ]; then
            python xau-wick-zone-pro/entry-research/xau_z4_break_retrace_e123_rejection_v1_0.py \
              --files /tmp/raw_mirror/*.csv --z4-pkl /tmp/FROZEN_C5_24M_SELL_MIRROR.pkl \
              --output "/tmp/results/${SESSION}_RESULT.json" \
              --episodes-csv "/tmp/results/${SESSION}_EPISODES.csv.gz" \
              --contacts-csv "/tmp/results/${SESSION}_CONTACTS.csv.gz" \
              --trades-csv "/tmp/results/${SESSION}_TRADES.csv.gz"
          else
            python xau-wick-zone-pro/session-research/xau_z4_break_retrace_e123_session_v1_0.py \
              --session "$SESSION" --files /tmp/raw_mirror/*.csv --z4-pkl /tmp/FROZEN_C5_24M_SELL_MIRROR.pkl \
              --output "/tmp/results/${SESSION}_RESULT.json" \
              --episodes-csv "/tmp/results/${SESSION}_EPISODES.csv.gz" \
              --contacts-csv "/tmp/results/${SESSION}_CONTACTS.csv.gz" \
              --trades-csv "/tmp/results/${SESSION}_TRADES.csv.gz"
          fi

      - name: Record immutable session evidence manifest
        shell: bash
        env:
          SESSION: ${{ matrix.session }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/results')
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir())}
          (root/f"{os.environ['SESSION']}_SELL_MANIFEST.json").write_text(json.dumps({
              'session':os.environ['SESSION'],
              'method':'exact sign-reflection of frozen BUY engine',
              'files':files,
              'production_authorization':'NONE'
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: z4br-sell-${{ matrix.session }}
          path: /tmp/results/*
          retention-days: 30

  aggregate:
    needs: session-study
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: z4br-sell-*
          path: /tmp/evidence
          merge-multiple: true

      - name: Build original-space SELL decision table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          import pandas as pd
          import numpy as np

          sessions=['US','ASIA_BROAD','ASIA_CORE_STANDALONE','EUROPE']
          labels={
            'US':'08:00-17:00 America/New_York',
            'ASIA_BROAD':'18:00-03:00 America/New_York',
            'ASIA_CORE_STANDALONE':'21:00-03:00 America/New_York standalone',
            'EUROPE':'03:00-08:00 America/New_York',
          }
          windows={
            'H1':(pd.Timestamp('2024-08-01T00:00:00Z'),pd.Timestamp('2025-08-01T00:00:00Z')),
            'H2':(pd.Timestamp('2025-08-01T00:00:00Z'),pd.Timestamp('2026-08-01T00:00:00Z')),
            'POOLED':(pd.Timestamp('2024-08-01T00:00:00Z'),pd.Timestamp('2026-08-01T00:00:00Z')),
          }
          relmap={'ABOVE_MAIN':'BELOW_MAIN','BELOW_MAIN':'ABOVE_MAIN','INSIDE_MAIN':'INSIDE_MAIN','OVERLAP_MAIN':'OVERLAP_MAIN'}

          def wilson(tp,n):
              if not n:return [None,None]
              p=tp/n; z=1.959963984540054; den=1+z*z/n
              c=(p+z*z/(2*n))/den
              h=z*math.sqrt(p*(1-p)/n+z*z/(4*n*n))/den
              return [max(0.,c-h),min(1.,c+h)]

          def diag(d):
              if len(d)==0:
                  return {'executed':0,'terminal_n':0,'TP_FIRST':0,'INVALIDATION_FIRST':0,'NEITHER':0,'AMBIGUOUS':0,'terminal_tp_rate':None,'wilson95':[None,None],'expectancy_R_before_costs':None,'profit_factor_R':None}
              c=d.outcome.astype(str).value_counts().to_dict()
              tp=int(c.get('TP_FIRST',0)); sl=int(c.get('INVALIDATION_FIRST',0)); n=tp+sl
              vals=[]
              for _,r in d[d.outcome.isin(['TP_FIRST','INVALIDATION_FIRST'])].iterrows():
                  vals.append(float(r.nominal_rr) if r.outcome=='TP_FIRST' else -1.0)
              pos=sum(x for x in vals if x>0); neg=-sum(x for x in vals if x<0)
              return {
                'executed':int(len(d)),'terminal_n':n,'TP_FIRST':tp,'INVALIDATION_FIRST':sl,
                'NEITHER':int(c.get('NEITHER',0)),'AMBIGUOUS':int(c.get('AMBIGUOUS',0)),
                'terminal_tp_rate':float(tp/n) if n else None,'wilson95':wilson(tp,n),
                'expectancy_R_before_costs':float(np.mean(vals)) if vals else None,
                'profit_factor_R':float(pos/neg) if neg>0 else (float('inf') if pos>0 else None),
              }

          def truthy(s):
              if getattr(s,'dtype',None)==bool:return s
              return s.astype(str).str.lower().isin(['true','1','yes'])

          out={
            'status':'SELL_E1_E2_E3_NO_SCORE_STRUCTURAL_STUDY_COMPLETE',
            'date':'2026-08-28',
            'method':'exact sign-reflection of frozen causal BUY engine; reported back in original price space',
            'score_used':False,
            'trigger':'bearish M1 close<open and (high-close)/(high-low)>=0.70',
            'main_break':'confirmed M1 close below causal lower main Z4 lower boundary',
            'main_invalidation':'confirmed M1 close strictly above frozen main_zhi; wick above allowed',
            'target':'next lower causal Z4 frozen at breakout; TP at target_zhi',
            'entry_zones':'mirrored causal sticky E1/E2/E3 upper-wick/resistance zones',
            'direct_analogue_of_buy_above_main':'BELOW_MAIN',
            'sessions':{},
            'production_authorization':'NONE_RETROSPECTIVE_SELL_HYPOTHESIS_STUDY'
          }

          for s in sessions:
              ep=pd.read_csv(f'/tmp/evidence/{s}_EPISODES.csv.gz')
              tr=pd.read_csv(f'/tmp/evidence/{s}_TRADES.csv.gz')
              co=pd.read_csv(f'/tmp/evidence/{s}_CONTACTS.csv.gz')
              for df in [ep,tr,co]:
                  for c in ['breakout_time','contact_time','trigger_time','entry_time','outcome_time','first_retrace_time']:
                      if c in df.columns: df[c]=pd.to_datetime(df[c],utc=True,errors='coerce')
              if len(tr): tr['original_relation']=tr.e_main_relation.astype(str).map(relmap)
              else: tr['original_relation']=pd.Series(dtype=str)
              ss={'label':labels[s]}
              for w,(lo,hi) in windows.items():
                  e=ep[(ep.breakout_time>=lo)&(ep.breakout_time<hi)].copy()
                  t=tr[(tr.breakout_time>=lo)&(tr.breakout_time<hi)].copy()
                  c=co[(co.breakout_time>=lo)&(co.breakout_time<hi)].copy()
                  byrank={r:diag(t[t.entry_label==r]) for r in ['E1','E2','E3']}
                  byrel={r:diag(t[t.original_relation==r]) for r in ['BELOW_MAIN','INSIDE_MAIN','OVERLAP_MAIN','ABOVE_MAIN']}
                  ss[w]={
                    'bearish_breakouts':int(len(e)),
                    'with_next_lower_target':int(e.target_zlo.notna().sum()) if 'target_zlo' in e else 0,
                    'main_retraced_by_wick_or_more':int(truthy(e.main_retrace_seen).sum()) if 'main_retrace_seen' in e else 0,
                    'e_contact_events_after_main_retrace':int(len(c)),
                    'all':diag(t),
                    'by_entry_rank':byrank,
                    'by_e_main_relation':byrel,
                  }
              out['sessions'][s]=ss

          p=Path('/tmp/final/SELL_COMBINED_DECISION.json')
          p.write_text(json.dumps(out,indent=2,default=str,allow_nan=False))
          src={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(Path('/tmp/evidence').iterdir())}
          Path('/tmp/final/SELL_AGGREGATE_MANIFEST.json').write_text(json.dumps({'status':out['status'],'source_files':src},indent=2))
          print(json.dumps(out,indent=2,default=str,allow_nan=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: z4-break-retrace-e123-sell-noscore-v1-final
          path: /tmp/final/*
          retention-days: 30