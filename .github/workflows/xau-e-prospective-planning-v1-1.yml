name: XAU E display episode V1 prospective planning QA v1.1

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-e-prospective-planning-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1
  PLAN: xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/prospective-planning-v1
  SOURCE_MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  DRY_SESSION: '2026-07-15'
  EXPECTED_MODEL_SHA256: 72e7548de826e2ae2ba66ddcaaf6b2fa7cd35ada0f5f2cd9db585d9734fd48e1
  EXPECTED_LABELER_SHA256: 08ed29422ede890c300073789daa4669a22fbe48b74171c68402310c00aebef8
  EXPECTED_MODEL_EVAL_SHA256: f547853609f16b00080049629f708fc0d4170c54071fd22a99228c807cd6dd2e

jobs:
  planning-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact commit, Pro planning authorization and frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['PKG']);plan=Path(os.environ['PLAN'])
          g=json.loads((p/'E_DISPLAY_EPISODE_V1_PRO_POST_REPLICATION_GATE.json').read_text())
          assert g['status']=='PRO_POST_REPLICATION_SCIENTIFIC_GATE_PASS',g
          assert g['decision']=='GO_PROSPECTIVE_CONFIRMATION_PLANNING',g
          assert g['authorization_scope']=='PLANNING_AND_FREEZE_ONLY_NO_PROSPECTIVE_OUTCOME_EXECUTION',g
          assert g['next_checkpoint']['current_prospective_execution_authorization']=='NOT_GRANTED',g
          h=lambda x:hashlib.sha256(Path(x).read_bytes()).hexdigest()
          assert h(p/'dev-freeze-canonical-33264659057/DEV_FROZEN_MODEL.json')==os.environ['EXPECTED_MODEL_SHA256']
          assert h(p/'xau_e_display_episode_reaction_labeler_v1.py')==os.environ['EXPECTED_LABELER_SHA256']
          assert h(p/'xau_e_display_episode_model_eval_v1.py')==os.environ['EXPECTED_MODEL_EVAL_SHA256']
          files=['XAUUSD_E_DISPLAY_EPISODE_PROSPECTIVE_CONFIRMATION_PREREG_v1_0_2026-08-29.md','PROSPECTIVE_CONFIRMATION_POLICY_v1.json','prospective_planning_tool_v1.py','prospective_planning_entry_v1.py','prospective_checkpoint_evaluator_v1.py','test_prospective_planning_v1.py','prospective_collection_workflow_TEMPLATE_v1_1.yml']
          for f in files: assert (plan/f).is_file(),f
          print('PROSPECTIVE_PLANNING_AUTHORIZATION_AND_HASH_GUARDS_PASS')
          PY
          test ! -e "$PKG/prospective-live-v1"
      - name: Install frozen scientific environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          mkdir -p /tmp/results /tmp/raw /tmp/ref /tmp/dry
          python -m pip freeze | sort > /tmp/results/PIP_FREEZE_PROSPECTIVE_PLANNING.txt
          python - <<'PY' > /tmp/results/ENVIRONMENT_PROSPECTIVE_PLANNING.json
          import json,platform,numpy,pandas,scipy,sklearn
          print(json.dumps({'python':platform.python_version(),'numpy':numpy.__version__,'pandas':pandas.__version__,'scipy':scipy.__version__,'scikit_learn':sklearn.__version__},indent=2,sort_keys=True))
          PY
      - name: Compile planning code and run synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$PLAN/prospective_planning_tool_v1.py" "$PLAN/prospective_planning_entry_v1.py" "$PLAN/prospective_checkpoint_evaluator_v1.py" "$PLAN/test_prospective_planning_v1.py"
          python "$PLAN/test_prospective_planning_v1.py" | tee /tmp/results/SYNTHETIC_PROSPECTIVE_PLANNING_TESTS.json
      - name: Verify future evaluator is fail-closed without later Pro token
        shell: bash
        run: |
          set -euo pipefail
          if python "$PLAN/prospective_checkpoint_evaluator_v1.py" --raw-files /tmp/no.csv --ledger-files /tmp/no.csv --checkpoint-lock /tmp/no.json --output-labels /tmp/no.gz --output-report /tmp/no-report.json --output-manifest /tmp/no-manifest.json 2>/tmp/blocked.txt; then exit 1; fi
          grep -q 'PROSPECTIVE_OUTCOME_OPENING_BLOCKED' /tmp/blocked.txt
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/results/FUTURE_OUTCOME_OPENING_GUARD_QA.json').write_text(json.dumps({'status':'FUTURE_OUTCOME_OPENING_GUARD_PASS','prospective_outcome_execution_authorized':False,'unauthorized_evaluator_blocked':True},indent=2,sort_keys=True)+'\n')
          PY
      - name: Download hash-verified June and July 2026 historical BID M1 only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.load(open(os.environ['SOURCE_MANIFEST']));ix={f"{int(x['year']):04d}-{int(x['month']):02d}":x for x in m['files'] if x['side']=='bid'}
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/';meta=[]
          for key in ['2026-06','2026-07']:
              x=ix[key];p=Path('/tmp/raw')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              got=hashlib.sha256(p.read_bytes()).hexdigest();assert got==x['sha256'],(key,got,x['sha256']);meta.append({'month':key,'file':x['file'],'sha256':got,'historical_manifest':True})
          Path('/tmp/dry/source_meta.json').write_text(json.dumps({'historical_dry_run':True,'files':meta},indent=2,sort_keys=True)+'\n')
          PY
      - name: Build first-seen-style canonical dry-run session archive
        shell: bash
        run: |
          set -euo pipefail
          python "$PLAN/prospective_planning_entry_v1.py" ingest-session --files /tmp/raw/*.csv --session-date "$DRY_SESSION" --acquired-at 2026-07-15T21:01:00Z --archive-root /tmp/dry/archive --manifest /tmp/results/HISTORICAL_DRYRUN_INGEST_QA.json --source-meta-json /tmp/dry/source_meta.json --historical-dry-run
          test -s "/tmp/dry/archive/warmup/$DRY_SESSION.csv.gz"; test -s "/tmp/dry/archive/sessions/$DRY_SESSION.csv.gz"
      - name: Rebuild prospective Z4 session from canonical truncated warmup
        shell: bash
        run: |
          set -euo pipefail
          python "$PLAN/prospective_planning_entry_v1.py" z4-session --files "/tmp/dry/archive/warmup/$DRY_SESSION.csv.gz" --session-date "$DRY_SESSION" --output /tmp/dry/z4_session.pkl --manifest /tmp/results/HISTORICAL_DRYRUN_Z4_QA.json
      - name: Download frozen July 2026 Z4 authority and check exact parity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/iagency971/twilio-voice-gateway/actions/artifacts/9673431120/zip -o /tmp/ref/july.zip
          echo '7f3d02ddfcff0c00882de7c24d6823d6b652dd915c2886ba0b1d44313aaee6e6  /tmp/ref/july.zip' | sha256sum -c -
          unzip -q /tmp/ref/july.zip -d /tmp/ref/july
          python - <<'PY'
          import glob,pandas as pd
          fs=glob.glob('/tmp/ref/july/**/*.pkl',recursive=True);assert len(fs)==1,fs
          d=pd.read_pickle(fs[0]);d['time']=pd.to_datetime(d.time,utc=True);ny=d.time.dt.tz_convert('America/New_York');q=d[(ny.dt.date.astype(str)=='2026-07-15')&(ny.dt.hour>=8)&(ny.dt.hour<17)].copy();assert len(q)>0;q.to_pickle('/tmp/ref/z4_session.pkl')
          PY
          python "$PLAN/prospective_planning_entry_v1.py" z4-parity --a /tmp/dry/z4_session.pkl --b /tmp/ref/z4_session.pkl --output /tmp/results/HISTORICAL_DRYRUN_Z4_EXACT_PARITY.json
      - name: Prove Z4 prefix invariance with later bars present
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          warm=pd.read_csv('/tmp/dry/archive/warmup/2026-07-15.csv.gz');jul=pd.read_csv('/tmp/raw/xauusd_bid_m1_2026_07.csv');jul['time']=pd.to_datetime(jul.timestamp,unit='ms',utc=True);future=jul[(jul.time>=pd.Timestamp('2026-07-15T21:00:00Z'))&(jul.time<pd.Timestamp('2026-07-17T00:00:00Z'))].drop(columns=['time']);pd.concat([warm,future],ignore_index=True).to_csv('/tmp/dry/warmup_plus_future.csv',index=False)
          PY
          python "$PLAN/prospective_planning_entry_v1.py" z4-session --files /tmp/dry/warmup_plus_future.csv --session-date "$DRY_SESSION" --output /tmp/dry/z4_with_future.pkl --manifest /tmp/dry/z4_with_future.json
          python "$PLAN/prospective_planning_entry_v1.py" z4-parity --a /tmp/dry/z4_session.pkl --b /tmp/dry/z4_with_future.pkl --output /tmp/results/HISTORICAL_DRYRUN_Z4_PREFIX_INVARIANCE.json
      - name: Build outcome-free feature ledger and compare with historical authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dry/features
          python "$PLAN/prospective_planning_entry_v1.py" feature-session --files "/tmp/dry/archive/warmup/$DRY_SESSION.csv.gz" --z4-pkl /tmp/dry/z4_session.pkl --session-date "$DRY_SESSION" --candidates-output /tmp/dry/features/candidates.csv.gz --ledger-output /tmp/dry/features/ledger.csv.gz --manifest /tmp/results/HISTORICAL_DRYRUN_FEATURE_QA.json
          python "$PLAN/prospective_planning_entry_v1.py" feature-parity --got /tmp/dry/features/ledger.csv.gz --canonical "$PKG/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz" --session-date "$DRY_SESSION" --output /tmp/results/HISTORICAL_DRYRUN_FEATURE_PARITY.json
      - name: Prove contact-only exact parity with frozen historical labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          src=pd.read_csv('xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/E_DISPLAY_EPISODE_LEDGER_V1_REPLICATION.csv.gz',compression='gzip',float_precision='round_trip');t=pd.to_datetime(src.snapshot_time_utc,utc=True);ny=t.dt.tz_convert('America/New_York');q=src[ny.dt.date.astype(str)=='2026-07-15'].copy();q.to_csv('/tmp/dry/canonical_ledger_session.csv.gz',index=False,compression={'method':'gzip','mtime':0},float_format='%.17g')
          PY
          python "$PLAN/prospective_planning_entry_v1.py" contact-only --files /tmp/raw/xauusd_bid_m1_2026_07.csv --ledger /tmp/dry/canonical_ledger_session.csv.gz --session-date "$DRY_SESSION" --output /tmp/dry/contact_only.csv.gz --manifest /tmp/results/HISTORICAL_DRYRUN_CONTACT_ONLY_QA.json
          python "$PLAN/prospective_planning_entry_v1.py" contact-parity --got /tmp/dry/contact_only.csv.gz --frozen-labels "$PKG/replication-freeze-canonical-33266656414/REPLICATION_REACTION_LABELS.csv.gz" --session-date "$DRY_SESSION" --output /tmp/results/HISTORICAL_DRYRUN_CONTACT_ONLY_PARITY.json
      - name: Freeze deterministic width-only interpretation control
        shell: bash
        run: |
          set -euo pipefail
          python "$PLAN/prospective_planning_entry_v1.py" width-historical-dryrun --labels "$PKG/replication-freeze-canonical-33266656414/REPLICATION_REACTION_LABELS.csv.gz" --output /tmp/results/HISTORICAL_WIDTH_CONTROL_DRYRUN.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/results/HISTORICAL_WIDTH_CONTROL_DRYRUN.json'));ref=json.load(open('xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/POST_REPLICATION_PRO_INTERPRETIVE_DIAGNOSTICS.json'))['REPLICATION']
          assert abs(d['width_only_auc']-ref['width_only_auc'])<1e-12,(d,ref)
          assert abs(d['full_auc']-ref['independent_recomputed_full_auc'])<1e-7,(d,ref)
          assert d['gating'] is False and d['rescue_allowed'] is False
          PY
      - name: Static anti-peeking review of hardened future collector template
        shell: bash
        run: |
          set -euo pipefail
          T="$PLAN/prospective_collection_workflow_TEMPLATE_v1_1.yml"
          ! grep -E 'python .*prospective_checkpoint_evaluator_v1.py|python .*xau_e_display_episode_reaction_labeler_v1.py' "$T"
          ! grep -q 'OUTCOME_BLIND_STATUS.json' "$T"
          grep -q 'BLIND_STATUS.json' "$T"
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/results/COLLECTOR_STATIC_FIREWALL_QA.json').write_text(json.dumps({'status':'COLLECTOR_STATIC_FIREWALL_QA_PASS','reaction_labeler_invocation':False,'checkpoint_evaluator_invocation':False,'collector_outputs_outcome_blind_only':True,'safe_blind_status_filename':True},indent=2,sort_keys=True)+'\n')
          PY
      - name: Verify prospective start remains future and build planning manifest
        shell: bash
        env:
          METHOD_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import pandas as pd
          pkg=Path(os.environ['PKG']);plan=Path(os.environ['PLAN']);r=Path('/tmp/results')
          now=pd.Timestamp.now(tz='UTC');start=pd.Timestamp('2026-08-31T12:00:00Z');assert now<start,(now,start)
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          required=['SYNTHETIC_PROSPECTIVE_PLANNING_TESTS.json','FUTURE_OUTCOME_OPENING_GUARD_QA.json','HISTORICAL_DRYRUN_INGEST_QA.json','HISTORICAL_DRYRUN_Z4_EXACT_PARITY.json','HISTORICAL_DRYRUN_Z4_PREFIX_INVARIANCE.json','HISTORICAL_DRYRUN_FEATURE_PARITY.json','HISTORICAL_DRYRUN_CONTACT_ONLY_PARITY.json','HISTORICAL_WIDTH_CONTROL_DRYRUN.json','COLLECTOR_STATIC_FIREWALL_QA.json']
          for f in required: assert (r/f).is_file(),f
          method_files=[plan/'XAUUSD_E_DISPLAY_EPISODE_PROSPECTIVE_CONFIRMATION_PREREG_v1_0_2026-08-29.md',plan/'PROSPECTIVE_CONFIRMATION_POLICY_v1.json',plan/'prospective_planning_tool_v1.py',plan/'prospective_planning_entry_v1.py',plan/'prospective_checkpoint_evaluator_v1.py',plan/'test_prospective_planning_v1.py',plan/'prospective_collection_workflow_TEMPLATE_v1_1.yml',pkg/'xau_ebuy_provenance_instrument_v1.py',pkg/'xau_e_display_episode_snapshot_v1.py',pkg/'xau_e_display_episode_reaction_labeler_v1.py',pkg/'xau_e_display_episode_model_eval_v1.py',pkg/'dev-freeze-canonical-33264659057/DEV_FROZEN_MODEL.json',pkg/'requirements-lock.txt',Path('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py'),Path('.github/workflows/xau-e-prospective-planning-v1-1.yml')]
          qa_files=sorted(p for p in r.iterdir() if p.is_file())
          man={'status':'E_DISPLAY_EPISODE_V1_PROSPECTIVE_PLANNING_QA_PASS','planning_only':True,'prospective_outcomes_generated':False,'prospective_outcomes_read':False,'prospective_performance_scored':False,'method_commit':os.environ['METHOD_COMMIT'],'checkout_commit':os.popen('git rev-parse HEAD').read().strip(),'workflow_run_id':int(os.environ['RUN_ID']),'prospective_start':{'session_date_ny':'2026-08-31','session_open_utc':'2026-08-31T12:00:00Z','planning_run_verified_before_start_utc':now.isoformat()},'method_sha256':{str(p):h(p) for p in method_files},'qa_sha256':{p.name:h(p) for p in qa_files},'next_authorization':'READY_FOR_PRO_PRE_PROSPECTIVE_EXECUTION_GATE','production_authorization':'NONE','pine_modification':'FORBIDDEN'}
          assert man['checkout_commit']==man['method_commit']
          (r/'PROSPECTIVE_PLANNING_QA_MANIFEST.json').write_text(json.dumps(man,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e-display-episode-v1-prospective-planning-qa-v1-1
          path: /tmp/results/*
          retention-days: 90
      - name: Materialize planning QA evidence on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/xau-wick-zone-pro-dev; git reset --hard origin/agent/xau-wick-zone-pro-dev
          rm -rf "$PLAN/qa"; mkdir -p "$PLAN/qa"; cp /tmp/results/* "$PLAN/qa/"
          git add "$PLAN/qa"; git commit -m 'freeze E V1 prospective planning QA evidence v1.1'; git push origin HEAD:agent/xau-wick-zone-pro-dev
