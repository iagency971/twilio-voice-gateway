# cancel duplicate metadata-only V3 exact-cost run 2026-08-18
name: XAU Cancel Obsolete COMEX Runs
on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-cancel-obsolete-comex-runs.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate quote run only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for run_id in [32150549489]:
              u=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{run_id}/cancel"
              r=requests.post(u,headers=h)
              print(run_id,r.status_code,r.text[:200])
          PY
