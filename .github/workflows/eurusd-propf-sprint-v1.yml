name: EURUSD PropF Sprint V1

on:
  push:
    branches:
      - agent/eurusd-propf-sprint-v1
    paths:
      - 'eurusd-propf/run_eurusd_propf_sprint_v1.py'
      - 'eurusd-propf/docs/**'
      - '.github/workflows/eurusd-propf-sprint-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eurusd-propf-sprint-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests tzdata
      - name: Run frozen EURUSD experiment
        run: python eurusd-propf/run_eurusd_propf_sprint_v1.py --out eurusd-propf/results/v1 --workers 10 --start-year 2012 --end-year 2026
      - name: Print terminal result
        if: always()
        run: |
          if [ -f eurusd-propf/results/v1/RESULT.json ]; then
            cat eurusd-propf/results/v1/RESULT.json
          fi
      - name: Persist result on branch
        if: always()
        run: |
          if [ -f eurusd-propf/results/v1/RESULT.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add eurusd-propf/results/v1
            if ! git diff --cached --quiet; then
              git commit -m "Publish EURUSD prop-firm sprint v1 result [skip ci]"
              git push origin HEAD:agent/eurusd-propf-sprint-v1
            fi
          fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-propf-sprint-v1
          path: eurusd-propf/results/v1
          if-no-files-found: warn
          retention-days: 14
