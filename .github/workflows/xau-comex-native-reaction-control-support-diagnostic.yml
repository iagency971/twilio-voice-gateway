name: XAU COMEX Native Reaction Control Support Diagnostic

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths:
      - 'xau-recovery/NATIVE_REACTION_CONTROL_SUPPORT_DIAGNOSTIC_TRIGGER.json'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy requests
      - name: Outcome-blind support-only diagnostic
        run: |
          python xau-multiyear/scripts/diagnose_comex_native_reaction_control_support.py \
            --events xau-final-results/comex_dev_rank1_native_reaction_v1_preoutcome/treated_event_causal_context.csv \
            --controls xau-final-results/comex_dev_rank1_native_reaction_v1_preoutcome/control_candidate_universe.csv.gz \
            --support xau-final-results/comex_dev_rank1_native_reaction_v1_preoutcome/treated_event_support.csv \
            --out /tmp/diag
      - name: Hard guard no outcomes
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/diag/support_diagnostic.json'))
          assert z['outcome_blind'] is True
          assert z['reaction_outcomes_computed'] is False
          assert z['market_data_api_called'] is False
          print('CONTROL_SUPPORT_DIAGNOSTIC_OUTCOME_BLIND_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: comex-native-reaction-control-support-diagnostic-v1
          path: /tmp/diag/
          retention-days: 90
      - name: Publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests,time
          src=pathlib.Path('/tmp/diag');root='xau-final-results/comex_dev_rank1_native_reaction_control_support_diagnostic_v1'
          names=['support_diagnostic.json','support_variant_grid.csv','support_variant_by_year.csv','baseline_support_waterfall_events.csv']
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};base=f"https://api.github.com/repos/{os.environ['REPO']}"
          for name in names:
              p=src/name;dst=f'{root}/{name}';u=f'{base}/contents/{dst}';payload=base64.b64encode(p.read_bytes()).decode()
              for attempt in range(12):
                  old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None
                  body={'message':f'publish reaction support diagnostic {name} [skip ci]','content':payload,'branch':os.environ['BRANCH']}
                  if sha:body['sha']=sha
                  q=requests.put(u,headers=h,json=body)
                  if q.status_code in (200,201):break
                  if q.status_code not in (409,422):q.raise_for_status()
                  time.sleep(min(10,1+attempt))
              else:raise SystemExit(f'could not publish {dst}')
          PY
