name: XAU E-zone V2 V04 parity float diagnostic

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - .github/workflows/xau-e-zone-v2-v04-parity-float-diagnostic.yml
  workflow_dispatch:

concurrency:
  group: xau-e-zone-v2-v04-parity-float-diagnostic
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PKG: xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2
  DATA: /tmp/xau-v2-data
  WORK: /tmp/xau-v04-parity-diag
  FROZEN_Z4_RUN_ID: '33139524456'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install frozen environment and acquire commit-pinned data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          mkdir -p "$DATA" "$WORK"
          python "$PKG/xau_e_zone_v2_acquire.py" --output-dir "$DATA" --manifest "$DATA/DATA_INPUT_MANIFEST.json"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_Z4_RUN_ID }}
          pattern: z4br-frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true

      - name: Assemble canonical frozen 24-month Z4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,pandas as pd
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'))
          assert len(fs)==24,len(fs)
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True)
          z['time']=pd.to_datetime(z.time,utc=True)
          z=z.sort_values(['time','side','center']).reset_index(drop=True)
          z.to_pickle('/tmp/FROZEN_C5_24M.pkl')
          print('FROZEN_Z4_ASSEMBLED',len(z))
          PY

      - name: Diagnose exact residual geometry floats without outcomes
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(python - <<'PY'
          import pandas as pd
          print(' '.join(f'/tmp/xau-v2-data/xauusd_bid_m1_{p.year:04d}_{p.month:02d}.csv' for p in pd.period_range('2024-01','2026-07',freq='M')))
          PY
          )
          python "$PKG/xau_e_zone_v2_parity_float_diagnostic.py" \
            --files $FILES \
            --z4-pkl /tmp/FROZEN_C5_24M.pkl \
            --reference-v04-csv xau-wick-zone-pro/score-research/e-display-episode-reaction-rank-v1/E_DISPLAY_PROVENANCE_V1_24M.csv.gz \
            --report "$WORK/V04_PARITY_FLOAT_DIAGNOSTIC.json" \
            --scratch-dir "$WORK/scratch"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/xau-v04-parity-diag/V04_PARITY_FLOAT_DIAGNOSTIC.json'))
          assert x['status']=='V2_V04_PARITY_FLOAT_DIAGNOSTIC_COMPLETE'
          assert x['future_price_outcomes_used'] is False
          assert x['reference_rows']==x['instrumented_rows']==88557
          print('PARITY_DIAGNOSTIC_FROZEN',x['exact_mismatch_counts'],x['max_absolute_delta'])
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e-zone-v2-v04-parity-float-diagnostic
          retention-days: 90
          compression-level: 6
          path: |
            /tmp/xau-v04-parity-diag/V04_PARITY_FLOAT_DIAGNOSTIC.json
            /tmp/xau-v2-data/DATA_INPUT_MANIFEST.json
