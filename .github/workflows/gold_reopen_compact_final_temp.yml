name: Gold reopen compact final temp

on:
  push:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27
    paths:
      - '.github/workflows/gold_reopen_compact_final_temp.yml'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-reopen-stat-study-2026-08-27
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download recent BID ASK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tail_bid tail_ask
          npx --yes dukascopy-node -i xauusd -from 2026-08-20 -to 2026-08-28 -t m1 -p bid -f csv -bs 1 -bp 5000 -dir tail_bid -fn recent_bid -r 5 -rp 10000 -fr
          sleep 10
          npx --yes dukascopy-node -i xauusd -from 2026-08-20 -to 2026-08-28 -t m1 -p ask -f csv -bs 1 -bp 5000 -dir tail_ask -fn recent_ask -r 5 -rp 10000 -fr
      - name: Compact final risk output
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from concurrent.futures import ThreadPoolExecutor,as_completed
          spec=importlib.util.spec_from_file_location('g','xau-multiyear/reopen-study/gold_reopen_5m_study.py')
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g)
          store={'bid':{},'ask':{}}; tasks=[]
          for side in ('bid','ask'):
            for y in (2025,2026):
              for m in range(1,(8 if y==2026 else 12)+1): tasks.append((side,y,m))
          with ThreadPoolExecutor(max_workers=6) as ex:
            for fut in as_completed([ex.submit(g.load_archive_month,*t) for t in tasks]):
              side,y,m,o,mx=fut.result(); store[side].update(o)
          g.parse_tail('tail_bid/recent_bid.csv','bid',store,None)
          g.parse_tail('tail_ask/recent_ask.csv','ask',store,None)
          events,reject=g.build_events(store)
          out={'reject':reject}
          for y in (2025,2026):
            out[str(y)]={}
            for typ in ('NORMAL','WEEKEND'):
              es=[e for e in events if e['year']==y and e['type']==typ]
              s=g.summarize(es)
              z={'N':s['N']}
              for entry in ('16:55','16:57'):
                v=s['entry'][entry]
                z[entry]={
                  'exit1':v['exit']['1'],'exit3':v['exit']['3'],'exit5':v['exit']['5'],
                  'mfe5':v['total_mfe5'],'mae5':v['total_mae5'],
                  'winner5_mae':v['winner5_total_mae'],'spread':v['spread'],
                  'tp_reach':v['post_tp_reach_pct'],
                  'stops':{sl:{h:v['stop'][sl][h] for h in ('1','3','5')} for sl in ('1.0','2.0','3.0','5.0','7.5','10.0','15.0','20.0')}
                }
              out[str(y)][typ]=z
          # August 2026 normal, entry 16:55
          aug=[e for e in events if e['year']==2026 and e['type']=='NORMAL' and e['date'][5:7]=='08']
          a=g.summarize(aug)['entry']['16:55']
          out['2026_AUG_NORMAL_1655']={'N':len(aug),'exit1':a['exit']['1'],'exit5':a['exit']['5'],'mfe5':a['total_mfe5'],'mae5':a['total_mae5']}
          print('FINAL_COMPACT_JSON_START')
          print(json.dumps(out,sort_keys=True))
          print('FINAL_COMPACT_JSON_END')
          PY
