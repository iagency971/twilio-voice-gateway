name: US100 Zero-Data V17 Robustness V19

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-zero-data-v19-robustness
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ftmo-zero-data-us100-research-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run V19 robustness stress
        shell: bash
        run: |
          set +e
          mkdir -p us100-zero-data/results/v19_v17_070_robustness
          python us100-zero-data/run_v19_v17_070_robustness.py 2>&1 | tee us100-zero-data/results/v19_v17_070_robustness/RUN_LOG.txt
          code=${PIPESTATUS[0]}
          echo "$code" > us100-zero-data/results/v19_v17_070_robustness/EXIT_CODE.txt
          exit 0
      - name: Publish V19 result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- us100-zero-data/results/v19_v17_070_robustness
          git commit -m "Publish V19 V17 robustness [skip ci]" || true
          git pull --rebase origin agent/ftmo-zero-data-us100-research-v1 || true
          git push origin HEAD:agent/ftmo-zero-data-us100-research-v1
