# trigger-once: reclaim-pullback-timeout-recovery-2026-08-18
name: XAU COMEX DEV_RANK1 Fill Parallel Recovery

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-fill-parallel-recovery.yml']

permissions:
  actions: read
  contents: write

jobs:
  fold:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        entry_model: [RECLAIM_PULLBACK]
        feature_group: [B0, B1, B2]
        outer_year: [2011,2012,2013,2014,2015,2016,2017,2018]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow scikit-learn==1.5.2 requests
      - uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-entry-decision-${{ matrix.entry_model }}-v1
          path: /tmp/features
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32192726623
      - run: |
          python xau-multiyear/scripts/run_comex_dev_rank1_fill_fold.py \
            --features /tmp/features/dev_rank1_entry_decision_features.parquet \
            --outer-year ${{ matrix.outer_year }} \
            --model ${{ matrix.feature_group }} \
            --out /tmp/fold
      - uses: actions/upload-artifact@v4
        with:
          name: fill-recovery-${{ matrix.entry_model }}-${{ matrix.feature_group }}-${{ matrix.outer_year }}
          path: /tmp/fold/
          retention-days: 90

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy pyarrow scikit-learn==1.5.2 requests
      - uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-entry-decision-RECLAIM_PULLBACK-v1
          path: /tmp/features
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32192726623
      - uses: actions/download-artifact@v4
        with:
          pattern: fill-recovery-RECLAIM_PULLBACK-*
          path: /tmp/folds
          merge-multiple: true
      - run: |
          python xau-multiyear/scripts/aggregate_comex_dev_rank1_fill_folds.py \
            --features /tmp/features/dev_rank1_entry_decision_features.parquet \
            --fold-root /tmp/folds \
            --out /tmp/result
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-fill-model-RECLAIM_PULLBACK-parallel-recovery-v1
          path: /tmp/result/
          retention-days: 90
      - name: Publish recovered compact result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/result');root='xau-final-results/comex_dev_rank1_fill_model_reclaim_pullback_v1';h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['result.json','metrics.csv','annual_metrics.csv','family_deltas.csv','outer_fold_audit.json','feasibility.json']:
              p=src/name;path=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None;body={'message':f'publish recovered DEV_RANK1 RECLAIM_PULLBACK fill result {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
