name: Temporary patch for prospective artifact redirect handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xau-temp-patch-prospective-artifact-download.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Patch cross-host artifact redirect without forwarding GitHub authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/xau-e-v1-prospective-outcome-blind-collector.yml')
          text = path.read_text()

          old_import = "          import datetime, hashlib, io, json, os, urllib.request, zipfile\n"
          new_import = "          import datetime, hashlib, io, json, os, urllib.error, urllib.request, zipfile\n"
          assert text.count(old_import) == 1, text.count(old_import)
          text = text.replace(old_import, new_import)

          anchor = "          h = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()\n"
          helper = "\n".join([
              "          def github_artifact_bytes(url, headers):",
              "              class NoRedirect(urllib.request.HTTPRedirectHandler):",
              "                  def redirect_request(self, req, fp, code, msg, response_headers, newurl):",
              "                      return None",
              "              opener = urllib.request.build_opener(NoRedirect())",
              "              try:",
              "                  opener.open(urllib.request.Request(url, headers=headers), timeout=60).read()",
              "              except urllib.error.HTTPError as exc:",
              "                  if exc.code not in {301, 302, 303, 307, 308}:",
              "                      raise",
              "                  location = exc.headers.get('Location')",
              "                  if not location:",
              "                      raise RuntimeError('GitHub artifact redirect has no Location header') from exc",
              "              else:",
              "                  raise RuntimeError('GitHub artifact endpoint unexpectedly returned no redirect')",
              "              return urllib.request.urlopen(",
              "                  urllib.request.Request(location, headers={'User-Agent': headers.get('User-Agent', 'xau-e-v1')}),",
              "                  timeout=120,",
              "              ).read()",
              "",
              "",
          ])
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, anchor + helper)

          old_download = (
              "              artifact_bytes = urllib.request.urlopen(\n"
              "                  urllib.request.Request(artifact_url, headers=headers), timeout=120\n"
              "              ).read()\n"
          )
          new_download = "              artifact_bytes = github_artifact_bytes(artifact_url, headers)\n"
          assert text.count(old_download) == 1, text.count(old_download)
          text = text.replace(old_download, new_download)

          path.write_text(text)
          print('MAIN_PROSPECTIVE_ARTIFACT_REDIRECT_PATCH_PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/xau-e-v1-prospective-outcome-blind-collector.yml
          git commit -m 'fix prospective artifact redirect authentication'
          git pull --rebase origin main
          git push origin HEAD:main
