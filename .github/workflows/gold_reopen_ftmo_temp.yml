name: Gold reopen FTMO yearly summary temp

on:
  push:
    branches:
      - agent/gold-reopen-stat-study-2026-08-27
    paths:
      - '.github/workflows/gold_reopen_ftmo_temp.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gold-reopen-stat-study-2026-08-27
      - name: Extract small yearly summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('xau-multiyear/reopen-study/FTMO_YEARLY_2020_2026_2026-08-27.json'))
          def x(z):
            if not z or not z.get('N'): return {'N':0}
            t=z['to1805']
            return {'N':z['N'],'mean':t['mean'],'median':t['median'],'win_pct':t['win_pct'],'pf':t['pf'],
                    'spread_mean':z['spread_mean'],'to1800_mean':z['to1800']['mean'],
                    'move_1800_1805_mean':z['missed1800_1805']['mean'],'swap_be':z['swap_be']}
          o={'years':{},'weekend_years':{},'months2026':{}}
          for y in map(str,range(2020,2027)):
            g=d['years'][y]
            o['years'][y]={'N':g['N'],'entries':{e:x(g['entries'][e]) for e in ('16:45','16:46','16:47','16:48','16:49')}}
            w=d['weekend_years'][y]
            o['weekend_years'][y]={'N':w['N'],'entry_16:49':x(w['entry_16:49']) if w['N'] else {'N':0}}
          for m,g in d['months2026'].items():
            o['months2026'][m]={'N':g['N'],'entry_16:49':x(g['entry_16:49']) if g['N'] else {'N':0}}
          json.dump(o,open('xau-multiyear/reopen-study/FTMO_YEAR_SUMMARY_2020_2026_2026-08-27.json','w'),sort_keys=True,indent=2)
          PY
      - name: Commit small summary
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xau-multiyear/reopen-study/FTMO_YEAR_SUMMARY_2020_2026_2026-08-27.json
          git commit -m 'results: add FTMO yearly headline summary' || exit 0
          git push origin HEAD:agent/gold-reopen-stat-study-2026-08-27
