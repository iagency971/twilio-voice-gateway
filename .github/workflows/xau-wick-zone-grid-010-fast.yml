name: XAU Z4 Pine Grid 0.10 Fast Check

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-wick-zone-grid-010-fast.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/xau-wick-zone-pro-dev}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1
      - name: Verify prereg and frozen reference
        run: |
          test "$(git hash-object xau-wick-zone-pro/xau_zone_episode_dev_z4.py)" = "a8a147615c3fd366c49e93b340fd2018b5b66e9e"
          test -s xau-wick-zone-pro/XAUUSD_Z4_PINE_GRID_STEP_PREREG_v0_1.md
      - name: Download hash-locked DEV BID
        shell: bash
        run: |
          set -euo pipefail; mkdir -p /tmp/xau/bid
          declare -A H
          H[01]=7414d1cf6a02cf4fff5347e79602e9109549622cb73b152e5462188cc797135d;H[02]=45060c59ccfc0ef3d5f78b49d793b7e3f97757a7659c604b887850068346621f;H[03]=28c82e54e1bd7f586f5d22c0c39d9217618f62e8dfdd7eab94602c2c2bb81a14;H[04]=ce55b0d9acdf20c694c37e3c53233455cc8b772269eb39f60357808abe37b9c9;H[05]=18084ecf8e9d5cef352cc290a55de29f27f006653b5da24a6520f8a02488f4f6;H[06]=f7cad6452e9666b37f6f7830bb69a61439095919bb1609daa80839fdb3a8fd39;H[07]=a1c432b64a36118f1934c9c838cee83c1f05181fbfd602452fd3d46acdd4fd52
          for m in 01 02 03 04 05 06 07; do f="xauusd_bid_m1_2024_${m}.csv";curl -fsSL --retry 5 "https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/${f}" -o "/tmp/xau/bid/${f}";test "$(sha256sum /tmp/xau/bid/${f}|awk '{print $1}')" = "${H[$m]}";done
      - name: Exact reference
        run: python xau-wick-zone-pro/xau_zone_episode_dev_z4.py --files /tmp/xau/bid/*.csv --output /tmp/E.pkl --tag E010
      - name: 0.10 Pine 3-box proxy
        run: python xau-wick-zone-pro/xau_wick_zone_pine_grid_proxy.py --step 0.10 --files /tmp/xau/bid/*.csv --output /tmp/P.pkl --tag P010
      - name: Compare and apply frozen 0.10 gate
        run: |
          python xau-wick-zone-pro/xau_wick_zone_parity_compare.py --exact-pkl /tmp/E.pkl --proxy-pkl /tmp/P.pkl --frozen-json xau-wick-zone-pro/results/XAUUSD_Z4_FROZEN_MODEL_PARAMS_v0_1.json --output /tmp/base.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/base.json'));m=r['metrics'];c={'exact_match_ge_090':m['exact_zone_match_rate']>=.90,'proxy_match_ge_090':m['proxy_zone_match_rate']>=.90,'median_iou_ge_080':m['iou_quantiles']['0.5']>=.80,'p10_iou_ge_055':m['iou_quantiles']['0.1']>=.55,'median_center_err_le_008':m['center_err_vseg_quantiles']['0.5']<=.08,'p95_center_err_le_025':m['center_err_vseg_quantiles']['0.95']<=.25,'score_spearman_ge_098':m['score_spearman']>=.98,'score_pearson_ge_098':m['score_pearson']>=.98,'median_score_err_le_0015':m['score_abs_err_quantiles']['0.5']<=.015,'p95_score_err_le_0060':m['score_abs_err_quantiles']['0.95']<=.060,'top1_agreement_ge_085':m['top1_zone_agreement']>=.85};o={'step':.10,'status':'PASS' if all(c.values()) else 'FAIL','metrics':m,'checks':c,'future_outcomes_used':False};open('/tmp/fast010.json','w').write(json.dumps(o,indent=2));print(json.dumps(o,indent=2))
          PY
      - name: Publish
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', BRANCH: 'agent/xau-wick-zone-pro-dev'}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          path='xau-wick-zone-pro/parity/XAUUSD_Z4_PINE_GRID_010_FAST_RESULT_v0_1.json';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};b={'message':'publish isolated 0.10 grid parity [skip ci]','content':base64.b64encode(open('/tmp/fast010.json','rb').read()).decode(),'branch':os.environ['BRANCH']};req=urllib.request.Request(u,data=json.dumps(b).encode(),headers=h,method='PUT');urllib.request.urlopen(req,timeout=60).read()
          PY
