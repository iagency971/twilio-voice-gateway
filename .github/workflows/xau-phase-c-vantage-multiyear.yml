name: XAU Phase C Vantage RAW Multiyear 2011-2025
on:
  push:
    branches: [agent/xau-multiyear-research]
    paths:
      - '.github/workflows/xau-phase-c-vantage-multiyear.yml'
permissions:
  contents: write
jobs:
  annual:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 requests==2.31.0 pytest
      - name: Frozen Vantage overlay and entry tests
        env:
          PYTHONPATH: xau-multiyear/src
        run: python -m pytest -q xau-multiyear/tests/test_vantage_overlay.py xau-multiyear/tests/test_entries_v1.py xau-multiyear/tests/test_entries_v2.py xau-multiyear/tests/test_entries_s1.py
      - name: Resolve annual dates
        id: dates
        shell: bash
        run: |
          Y=${{ matrix.year }}
          echo "from=$((Y-1))-01" >> "$GITHUB_OUTPUT"
          echo "to=$((Y+1))-01" >> "$GITHUB_OUTPUT"
          echo "start=${Y}-01-01" >> "$GITHUB_OUTPUT"
          echo "end=$((Y+1))-01-01" >> "$GITHUB_OUTPUT"
      - name: Acquire warmup target and post-window
        run: python xau-multiyear/scripts/acquire_dukascopy_window.py --from-month ${{ steps.dates.outputs.from }} --to-month ${{ steps.dates.outputs.to }} --out /tmp/xau_vantage_${{ matrix.year }}.csv
      - name: Run frozen corrected Vantage RAW surface
        run: python xau-multiyear/scripts/run_phase_c_vantage_raw.py /tmp/xau_vantage_${{ matrix.year }}.csv --target-start ${{ steps.dates.outputs.start }} --target-end ${{ steps.dates.outputs.end }} --out /tmp/vantage_${{ matrix.year }}
      - name: Validate and publish annual result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-multiyear-research
          YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,requests,pandas as pd
          y=os.environ['YEAR']; out=pathlib.Path(f'/tmp/vantage_{y}')
          m=json.load(open(out/'manifest.json')); s=pd.read_csv(out/'summary.csv')
          assert m['target_events'] > 1000
          assert set(s.scenario)=={'S10_C6','S11_C6_PRIMARY','S12_C6','S18_C9_STRESS'}
          assert {'DISPLACEMENT_ORIGIN_ONLY','OBJECTIVE_LIQUIDITY_ONLY','DOZ_OBJECTIVE_ONLY'}.issubset(set(s['sample']))
          assert 'TOUCH_NEXT_OPEN' in set(s.entry_model)
          assert set(s[s.entry_model=='TOUCH_NEXT_OPEN'].vol_floor_k.dropna().round(2))=={0.25,0.50,0.75,1.00}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for fn in ['summary.csv','manifest.json']:
              src=out/fn; path=f'xau-final-results/phase_c_vantage_raw_2011_2025/annual/{y}_{fn}'
              u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}"; old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']}); sha=old.json().get('sha') if old.status_code==200 else None
              body={'message':f'publish corrected Vantage RAW {y} {fn} [skip ci]','content':base64.b64encode(src.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha: body['sha']=sha
              r=requests.put(u,headers=h,json=body); r.raise_for_status()
          print('VANTAGE_ANNUAL_OK',y,m['target_events'])
          PY
