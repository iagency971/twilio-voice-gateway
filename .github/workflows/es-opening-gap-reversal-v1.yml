name: ES Opening Gap Reversal V1
on:
  push:
    branches: [agent/es-opening-gap-reversal-v1]
    paths: ['opening-gap/**','.github/workflows/es-opening-gap-reversal-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/es-opening-gap-reversal-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run frozen gap reversal
        shell: bash
        run: |
          set +e
          mkdir -p opening-gap/results/v1
          python opening-gap/run_v1.py 2>&1 | tee opening-gap/results/v1/run.log
          code=${PIPESTATUS[0]}; echo "$code" > opening-gap/results/v1/exit_code.txt
          if [ "$code" -ne 0 ]; then echo "OPENING_GAP_V1_FAILURE exit_code=$code" > opening-gap/results/v1/WORKFLOW_FAILURE.txt; fi
          exit 0
      - name: Publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- opening-gap/results/v1
          git commit -m "Publish opening-gap reversal V1 result [skip ci]" || true
          git push origin HEAD:agent/es-opening-gap-reversal-v1
