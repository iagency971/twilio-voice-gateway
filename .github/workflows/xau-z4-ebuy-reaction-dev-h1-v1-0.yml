name: XAU Z4 E-BUY Reaction DEV H1 v1.0

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - '.github/workflows/xau-z4-ebuy-reaction-dev-h1-v1-0.yml'

permissions:
  contents: write

jobs:
  reaction-dev-h1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1

      - name: Frozen protocol and activation guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            xau-wick-zone-pro/entry-research/xau_ebuy_reaction_dev_v1_0.py \
            xau-wick-zone-pro/entry-research/xau_ebuy_reaction_dev_v1_0_1_runtime_repair.py \
            xau-wick-zone-pro/entry-research/xau_ebuy_reaction_dev_v1_0_2_preoutcome_repairs.py \
            xau-wick-zone-pro/entry-research/xau_ebuy_reaction_dev_v1_0_3_final_preoutcome.py
          python - <<'PY'
          import json
          from pathlib import Path
          cov=json.load(open('xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json'))
          assert cov['status']=='EBUY_COVERAGE_OOS_REPLICATION_PASS',cov['status']
          assert cov['results']['OOS_H1']['status']=='PASS'
          assert cov['results']['OOS_H2']['status']=='PASS'
          prereg=Path('xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_CONDITIONAL_2026-08-25.md').read_text()
          for x in ['REACTION_DEV','REACTION_HOLDOUT','TOUCH_REF','RECLAIM_CENTER','RECLAIM_FULL','BULL_REJECTION','No reaction/TP/MFE/MAE/trigger result from H2 may be computed or inspected']:
              assert x in prereg,x
          for f in [
            'XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_ADDENDUM_A_2026-08-25.md',
            'XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_ADDENDUM_B_RUNTIME_STATE_2026-08-25.md',
            'XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_ADDENDUM_C_TOUCH_INTRABAR_2026-08-25.md']:
              assert Path('xau-wick-zone-pro/entry-research/'+f).exists(),f
          print('REACTION_DEV_H1_ACTIVATION_GUARD_PASS')
          PY

      - name: Acquire H1 only and verify frozen hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/h1
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          m=json.load(open('xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json'))
          files=[x for x in m['files'] if x['side']=='bid' and '2024-08' <= f"{x['year']}-{x['month']}" <= '2025-07']
          assert len(files)==12,len(files)
          assert all(f"{x['year']}-{x['month']}" < '2025-08' for x in files)
          root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in files:
              p=Path('/tmp/xau/h1')/x['file']
              subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL)
              got=hashlib.sha256(p.read_bytes()).hexdigest();assert got==x['sha256'],(x['file'],got,x['sha256'])
          names=sorted(p.name for p in Path('/tmp/xau/h1').glob('*.csv'))
          assert len(names)==12
          assert not any('2025_08' in n or '2025_09' in n or '2026_' in n for n in names),names
          print('H1_ONLY_SOURCE_HASH_PASS',names[0],names[-1])
          PY

      - name: Build semantically equivalent geometry-only Z4 H1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/XAUUSD_Z4_C5_SHIFTED_GRID_PARITY.json'))
          assert p['status']=='SHIFTED_GRID_SEMANTIC_PARITY_PASS'
          src=Path('xau-wick-zone-pro/entry-research/geometry-shifted-grid-parity/xau_z4_c5_geometry_shifted_grid_equivalent.py').read_text()
          anchor='    m=len(Z)\n'
          assert src.count(anchor)==1,src.count(anchor)
          insert="    keep=['time','landmark_i','center','zlo','zhi','side']\n    Z[keep].to_pickle(args.output)\n    print(args.tag,'GEOMETRY_ONLY',len(Z),'landmarks',Z.landmark_i.nunique(),flush=True)\n    return\n\n"
          Path('/tmp/z4_h1_geometry_only.py').write_text(src.replace(anchor,insert+anchor))
          PY
          python /tmp/z4_h1_geometry_only.py --files /tmp/xau/h1/*.csv --output /tmp/Z4_C5_REACTION_H1_GEOMETRY.pkl --tag Z4_C5_REACTION_H1
          python - <<'PY'
          import pandas as pd
          d=pd.read_pickle('/tmp/Z4_C5_REACTION_H1_GEOMETRY.pkl')
          assert list(d.columns)==['time','landmark_i','center','zlo','zhi','side'],list(d.columns)
          print('H1_Z4_GEOMETRY_READY',len(d),d.time.min(),d.time.max())
          PY

      - name: Run frozen reaction DEV on H1 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reaction_h1
          python xau-wick-zone-pro/entry-research/xau_ebuy_reaction_dev_v1_0_3_final_preoutcome.py \
            --files /tmp/xau/h1/*.csv \
            --z4-pkl /tmp/Z4_C5_REACTION_H1_GEOMETRY.pkl \
            --coverage-oos-result xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json \
            --contacts-csv /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_CONTACTS_v1_0.csv \
            --trigger-csv /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_TRIGGERS_v1_0.csv \
            --output /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_RESULT_v1_0.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_RESULT_v1_0.json'))
          assert x['reaction_holdout_opened'] is False
          assert x['reaction_dev_window_utc'][0].startswith('2024-08-01')
          assert x['reaction_dev_window_utc'][1].startswith('2025-08-01')
          print('H1_REACTION_RESULT_GUARD_PASS',x['status'],x['contact_episode_count'],x['selected_trigger'])
          PY

      - name: Build immutable H1 reaction provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths={
            'prereg':'xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_CONDITIONAL_2026-08-25.md',
            'addendum_a':'xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_ADDENDUM_A_2026-08-25.md',
            'addendum_b':'xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_ADDENDUM_B_RUNTIME_STATE_2026-08-25.md',
            'addendum_c':'xau-wick-zone-pro/entry-research/XAUUSD_Z4_EBUY_REACTION_DEV_PREREG_v1_0_ADDENDUM_C_TOUCH_INTRABAR_2026-08-25.md',
            'engine_final':'xau-wick-zone-pro/entry-research/xau_ebuy_reaction_dev_v1_0_3_final_preoutcome.py',
            'coverage_oos':'xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json',
            'z4_geometry':'/tmp/Z4_C5_REACTION_H1_GEOMETRY.pkl',
            'result':'/tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_RESULT_v1_0.json',
            'contacts':'/tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_CONTACTS_v1_0.csv',
            'triggers':'/tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_TRIGGERS_v1_0.csv'}
          x=json.load(open(paths['result']))
          out={'status':'REACTION_DEV_H1_PROVENANCE_RECORDED','reaction_status':x['status'],'reaction_holdout_opened':False,'selected_trigger':x.get('selected_trigger'),'contact_episode_count':x.get('contact_episode_count'),
               'sha256':{k:hashlib.sha256(Path(v).read_bytes()).hexdigest() for k,v in paths.items()}}
          Path('/tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_MANIFEST_v1_0.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY

      - name: Publish H1 reaction DEV evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin agent/xau-wick-zone-pro-dev
          out=xau-wick-zone-pro/entry-research/reaction-dev-h1-v1-0
          mkdir -p "$out"
          cp /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_RESULT_v1_0.json "$out/"
          cp /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_MANIFEST_v1_0.json "$out/"
          gzip -c /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_CONTACTS_v1_0.csv > "$out/XAUUSD_Z4_EBUY_REACTION_DEV_H1_CONTACTS_v1_0.csv.gz"
          gzip -c /tmp/reaction_h1/XAUUSD_Z4_EBUY_REACTION_DEV_H1_TRIGGERS_v1_0.csv > "$out/XAUUSD_Z4_EBUY_REACTION_DEV_H1_TRIGGERS_v1_0.csv.gz"
          git add "$out"
          git commit -m 'publish frozen E-BUY reaction DEV H1 v1.0 [skip ci]' || exit 0
          git push origin HEAD:agent/xau-wick-zone-pro-dev
