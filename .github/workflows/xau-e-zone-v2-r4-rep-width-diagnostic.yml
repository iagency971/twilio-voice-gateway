name: XAU E-zone V2 R4 REP width diagnostic

on:
  push:
    branches: [agent/xau-wick-zone-pro-dev]
    paths:
      - .github/workflows/xau-e-zone-v2-r4-rep-width-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG: xau-wick-zone-pro/score-research/e-zone-score-buy-us-v2
  DATA: /tmp/xau-v2-data
  WORK: /tmp/xau-r4-rep-width

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$PKG/requirements-lock.txt"
          python -m py_compile "$PKG/xau_e_zone_v2_rep_width_float_diagnostic.py" "$PKG/xau_e_zone_v2_placebos_r4.py"
      - name: Acquire commit-pinned M1 and rebuild REP outcome-blind
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATA" "$WORK"
          python "$PKG/xau_e_zone_v2_acquire.py" --output-dir "$DATA" --manifest "$DATA/DATA_INPUT_MANIFEST.json"
          FILES=$(python - <<'PY'
          import pandas as pd
          print(' '.join(f'/tmp/xau-v2-data/xauusd_bid_m1_{p.year:04d}_{p.month:02d}.csv' for p in pd.period_range('2022-11','2023-12',freq='M')))
          PY
          )
          python "$PKG/xau_z4_geometry_only_v2.py" --files $FILES --output-pkl "$WORK/z4.pkl" --output-csv "$WORK/z4.csv" --manifest "$WORK/z4_manifest.json" --tag REP_WIDTH_DIAG
          python "$PKG/xau_e_zone_v2_instrument.py" --files $FILES --z4-pkl "$WORK/z4.pkl" --output-features "$WORK/features.csv.gz" --output-display-all "$WORK/display_all.csv.gz" --output-full-pool "$WORK/full_pool.csv.gz" --output-context "$WORK/context.csv.gz" --manifest "$WORK/instrument_manifest.json" --target-start 2023-01-01T00:00:00Z --target-end 2024-01-01T00:00:00Z
          python "$PKG/xau_e_zone_v2_placebos_r4.py" --features "$WORK/features.csv.gz" --full-pool "$WORK/full_pool.csv.gz" --context "$WORK/context.csv.gz" --output "$WORK/placebos.csv.gz" --matching-table "$WORK/matching.csv.gz" --manifest "$WORK/placebo_manifest.json"
      - name: Diagnose width round-trip deltas
        shell: bash
        run: |
          set -euo pipefail
          python "$PKG/xau_e_zone_v2_rep_width_float_diagnostic.py" --matching "$WORK/matching.csv.gz" --output "$WORK/REP_WIDTH_FLOAT_DIAGNOSTIC.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e-zone-v2-r4-rep-width-float-diagnostic
          retention-days: 90
          compression-level: 6
          path: |
            /tmp/xau-r4-rep-width/REP_WIDTH_FLOAT_DIAGNOSTIC.json
            /tmp/xau-r4-rep-width/placebo_manifest.json
            /tmp/xau-r4-rep-width/instrument_manifest.json
            /tmp/xau-v2-data/DATA_INPUT_MANIFEST.json
