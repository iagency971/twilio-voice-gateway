name: MNQ Databento Cost Probe
on:
  push:
    branches: [agent/mnq-databento-cme-validation-v1]
    paths: ['mnq-databento/cost_probe.py','.github/workflows/mnq-databento-cost-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/mnq-databento-cme-validation-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip databento
      - run: python mnq-databento/cost_probe.py
      - name: Publish cost only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-databento/results/cost_probe/RESULT.json
          git commit -m "Publish Databento NQ cost estimate [skip ci]" || true
          git push origin HEAD:agent/mnq-databento-cme-validation-v1

  aug20_cme_completion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/mnq-databento-cme-validation-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Aug20 replay dependencies
        run: python -m pip install --upgrade pip pandas numpy databento matplotlib tabulate python-dotenv ib_insync
      - name: Run authorized Aug20 CME completion
        shell: bash
        run: |
          set +e
          mkdir -p mnq-databento/results/aug20_cme_completion
          python mnq-databento/run_aug20_cme_completion.py 2>&1 | tee mnq-databento/results/aug20_cme_completion/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > mnq-databento/results/aug20_cme_completion/exit_code.txt
          if [ "$code" -ne 0 ]; then
            echo "AUG20_CME_COMPLETION_FAILURE exit_code=$code" > mnq-databento/results/aug20_cme_completion/WORKFLOW_FAILURE.txt
          else
            rm -f mnq-databento/results/aug20_cme_completion/WORKFLOW_FAILURE.txt
          fi
          exit 0
      - name: Publish Aug20 diagnostic results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mnq-databento/results/aug20_cme_completion
          git commit -m "Publish CME Aug20 diagnostic remeasurement [skip ci]" || true
          git pull --rebase origin agent/mnq-databento-cme-validation-v1 || true
          git push origin HEAD:agent/mnq-databento-cme-validation-v1
