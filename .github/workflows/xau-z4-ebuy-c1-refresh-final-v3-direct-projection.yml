name: XAU Z4 E-BUY C1 Refresh Final v3 Direct Projection

on:
  push:
    branches:
      - agent/xau-wick-zone-pro-dev
    paths:
      - .github/workflows/xau-z4-ebuy-c1-refresh-final-v3-direct-projection.yml

permissions:
  contents: read
  actions: read

env:
  MANIFEST: xau-wick-zone-pro/cadence-sensitivity/c5-replication-v0-2/XAUUSD_Z4_C5_HISTORICAL_SOURCE_MANIFEST_v0_2.json
  PRIMARY_RUN_ID: '33009725953'
  PRIMARY_RUN_SHA: '7575e67330b52e5ebc1f6466df9014ed2f04199f'
  FALLBACK_RUN_ID: '33013127430'
  FALLBACK_RUN_SHA: '5f7771b3d5b399f1fdda8dc0aa3b4695004fd4a3'
  PROJECTION_RUN_ID: '33013593231'
  PROJECTION_RUN_SHA: 'add33200084ecb6445237e007728081a8e4094b1'
  FROZEN_SOURCE_RUN_ID: '33009186853'

jobs:
  final-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-wick-zone-pro-dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Frozen methodology and corrected runner guards
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_v1_0_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_A_CAUSAL_INTERVAL_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_B_EPISODE_STATE_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_C_CONTINUOUS_OOS_STATE_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_D_EXACT_MONTHLY_PARTITION_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_E_COMMON_COMPLETE_SESSION_SUPPORT_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_F_DUAL_C5_CAUSAL_CONTROL_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_G_GEOMETRY_PROJECTION_ACCELERATOR_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_H_PER_SESSION_CONSUMPTION_2026-08-26.md \
            xau-wick-zone-pro/cadence-sensitivity/XAUUSD_Z4_C1_REFRESH_EBUY_PREREG_ADDENDUM_I_ALL_DAY_PAIRED_BOOTSTRAP_2026-08-26.md; do test -s "$f"; done
          python -m py_compile \
            xau-wick-zone-pro/cadence-sensitivity/xau_ebuy_c1_refresh_causal_reaction_v1_2_session.py \
            xau-wick-zone-pro/cadence-sensitivity/xau_ebuy_c1_refresh_dual_c5_postprocess_v1_1_session_all_day.py
          for pair in "${PRIMARY_RUN_ID}:${PRIMARY_RUN_SHA}" "${FALLBACK_RUN_ID}:${FALLBACK_RUN_SHA}" "${PROJECTION_RUN_ID}:${PROJECTION_RUN_SHA}"; do
            id=${pair%%:*}; sha=${pair#*:}; got=$(gh api "repos/iagency971/twilio-voice-gateway/actions/runs/$id" --jq .head_sha); test "$got" = "$sha"
          done
          echo FINAL_V3_STATIC_GUARDS_PASS

      - name: Wait only for February and March exact geometry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 240); do
            gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${PRIMARY_RUN_ID}/artifacts?per_page=100" > /tmp/p.json
            gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${FALLBACK_RUN_ID}/artifacts?per_page=100" > /tmp/f.json
            gh api "repos/iagency971/twilio-voice-gateway/actions/runs/${PROJECTION_RUN_ID}/artifacts?per_page=100" > /tmp/g.json
            python - <<'PY' > /tmp/gate.txt
          import json
          P={x['name'] for x in json.load(open('/tmp/p.json'))['artifacts']}
          F={x['name'] for x in json.load(open('/tmp/f.json'))['artifacts']}
          G={x['name'] for x in json.load(open('/tmp/g.json'))['artifacts']}
          base=set()
          months=[]
          for y,a,b in [(2024,8,12),(2025,1,12),(2026,1,7)]: months += [f'{y:04d}-{m:02d}' for m in range(a,b+1)]
          for ym in months:
              base.add(f'mechanical-month-C5-{ym}')
              if ym not in ('2026-02','2026-03'): base.add(f'mechanical-month-C1-{ym}')
          base_ok=base<=P
          src={}
          for ym in ('2026-02','2026-03'):
              if f'mechanical-month-C1-{ym}' in P: src[ym]='PRIMARY_FULL'
              elif f'fallback-mechanical-month-C1-{ym}' in F: src[ym]='TIMEOUT_FULL_FALLBACK'
              elif f'projected-C1-{ym}' in G: src[ym]='GEOMETRY_PROJECTION'
              else: src[ym]=None
          need_proj=any(v=='GEOMETRY_PROJECTION' for v in src.values())
          refs_ok=(not need_proj) or ({'projected-C1-2025-10','projected-C1-2026-04'}<=G)
          ready=base_ok and all(src.values()) and refs_ok
          print('BASE_OK',int(base_ok));print('FEB_SOURCE',src['2026-02'] or 'NONE');print('MAR_SOURCE',src['2026-03'] or 'NONE');print('NEED_PROJECTION',int(need_proj));print('REFS_OK',int(refs_ok));print('READY',int(ready));print('USE_FALLBACK',int(any(v=='TIMEOUT_FULL_FALLBACK' for v in src.values())));print('USE_PROJECTION',int(need_proj))
          PY
            cat /tmp/gate.txt
            ready=$(awk '$1=="READY"{print $2}' /tmp/gate.txt)
            if [ "$ready" = 1 ]; then break; fi
            sleep 20
          done
          test "$ready" = 1
          uf=$(awk '$1=="USE_FALLBACK"{print $2}' /tmp/gate.txt); ug=$(awk '$1=="USE_PROJECTION"{print $2}' /tmp/gate.txt)
          [ "$uf" = 1 ] && echo USE_FALLBACK=true >> "$GITHUB_ENV" || echo USE_FALLBACK=false >> "$GITHUB_ENV"
          [ "$ug" = 1 ] && echo USE_PROJECTION=true >> "$GITHUB_ENV" || echo USE_PROJECTION=false >> "$GITHUB_ENV"

      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.1 scipy==1.16.1

      - name: Download primary mechanical shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.PRIMARY_RUN_ID }}
          pattern: mechanical-month-*
          path: /tmp/primary
          merge-multiple: true

      - name: Download full fallback shards if needed
        if: env.USE_FALLBACK == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FALLBACK_RUN_ID }}
          pattern: fallback-mechanical-month-C1-*
          path: /tmp/fullfallback
          merge-multiple: true

      - name: Download individual projected shards if needed
        if: env.USE_PROJECTION == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.PROJECTION_RUN_ID }}
          pattern: projected-C1-*
          path: /tmp/projection
          merge-multiple: false

      - name: Resolve sources and enforce exact projection double parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mech /tmp/results
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import numpy as np
          import pandas as pd
          P=Path('/tmp/primary'); F=Path('/tmp/fullfallback'); G=Path('/tmp/projection'); O=Path('/tmp/mech')
          source={}
          def geom(path):
              q=pd.read_pickle(path).copy();q['time']=pd.to_datetime(q.time,utc=True);cols=['time','side','center','zlo','zhi'];return q[cols].sort_values(cols).reset_index(drop=True)
          if G.exists():
              refs={}
              for ym in ('2025-10','2026-04'):
                  stem='C1_'+ym.replace('-','_')+'.pkl'; a=geom(G/('projected-C1-'+ym)/stem); b=geom(P/stem)
                  shape=len(a)==len(b); same_time=same_side=False; ec=el=eh=float('inf')
                  if shape:
                      same_time=bool((a.time.to_numpy()==b.time.to_numpy()).all());same_side=bool((a.side.to_numpy()==b.side.to_numpy()).all())
                      if len(a):
                          ec=float(np.max(np.abs(a.center.to_numpy(float)-b.center.to_numpy(float))));el=float(np.max(np.abs(a.zlo.to_numpy(float)-b.zlo.to_numpy(float))));eh=float(np.max(np.abs(a.zhi.to_numpy(float)-b.zhi.to_numpy(float))))
                      else: ec=el=eh=0.0
                  ok=bool(shape and same_time and same_side and ec<=1e-12 and el<=1e-8 and eh<=1e-8);refs[ym]={'projected_rows':len(a),'full_rows':len(b),'same_shape':shape,'same_time':same_time,'same_side':same_side,'center_max_abs_usd':ec,'zlo_max_abs_usd':el,'zhi_max_abs_usd':eh,'pass':ok};assert ok,refs[ym]
              source['projection_double_parity']={'status':'PASS','references':refs}
          months=[]
          for y,a,b in [(2024,8,12),(2025,1,12),(2026,1,7)]: months += [f'{y:04d}_{m:02d}' for m in range(a,b+1)]
          for c in (1,5):
              for ym in months:
                  name=f'C{c}_{ym}.pkl'; rt=f'C{c}_{ym}_RUNTIME_SEC.txt'; choices=[]
                  if (P/name).exists(): choices.append(('PRIMARY_FULL',P/name,P/rt))
                  if c==1 and ym in ('2026_02','2026_03'):
                      if (F/name).exists(): choices.append(('TIMEOUT_FULL_FALLBACK',F/name,F/rt))
                      folder=G/('projected-C1-'+ym.replace('_','-'))
                      if (folder/name).exists(): choices.append(('DOUBLE_PARITY_GEOMETRY_PROJECTION',folder/name,folder/rt))
                  assert choices,(name,'missing');label,p,r=choices[0];assert r.exists(),r;shutil.copy2(p,O/name);shutil.copy2(r,O/rt);source[name]=label
          assert len(list(O.glob('C1_????_??.pkl')))==24 and len(list(O.glob('C5_????_??.pkl')))==24
          Path('/tmp/results/MECHANICAL_SOURCE_MAP.json').write_text(json.dumps(source,indent=2));print(json.dumps({k:v for k,v in source.items() if k.startswith('C1_2026_')},indent=2))
          PY

      - name: Download exact historical source-faithful C5 geometry
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ env.FROZEN_SOURCE_RUN_ID }}
          pattern: frozen-z4-*
          path: /tmp/frozenparts
          merge-multiple: true

      - name: Assemble geometry and acquire exact 24M BID source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xau/oos /tmp/evidence
          python - <<'PY'
          import glob,pandas as pd
          for c in (1,5):
              fs=sorted(glob.glob(f'/tmp/mech/C{c}_????_??.pkl'));assert len(fs)==24
              z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True);z['time']=pd.to_datetime(z.time,utc=True);z=z.sort_values(['time','side','center']).reset_index(drop=True);assert z.time.min()>=pd.Timestamp('2024-08-01T00:00:00Z') and z.time.max()<pd.Timestamp('2026-08-01T00:00:00Z');z.to_pickle(f'/tmp/C{c}_BID_24M_PARTITION.pkl')
          fs=sorted(glob.glob('/tmp/frozenparts/z4_*.pkl'));assert len(fs)==24
          z=pd.concat([pd.read_pickle(f) for f in fs],ignore_index=True);z['time']=pd.to_datetime(z.time,utc=True);z=z.sort_values(['time','side','center']).reset_index(drop=True);z.to_pickle('/tmp/FROZEN_MONTHLY_C5_24M.pkl')
          PY
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.load(open(os.environ['MANIFEST']));fs=[x for x in m['files'] if x['side']=='bid' and '2024-08'<=f"{x['year']}-{x['month']}"<='2026-07'];assert len(fs)==24;root='https://raw.githubusercontent.com/kevingtlin/Market-Data-Lab/main/xauusd/bid/m1/'
          for x in fs:
              p=Path('/tmp/xau/oos')/x['file'];subprocess.run(['curl','--fail','--location','--retry','5','--retry-delay','2',root+x['file'],'-o',str(p)],check=True,stdout=subprocess.DEVNULL);assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          print('RAW_24M_HASH_PASS')
          PY
          C1SEC=$(awk '{s+=$1} END{print s+0}' /tmp/mech/C1_*_RUNTIME_SEC.txt);C5SEC=$(awk '{s+=$1} END{print s+0}' /tmp/mech/C5_*_RUNTIME_SEC.txt);echo "DET_C1_SEC=$C1SEC" >> "$GITHUB_ENV";echo "DET_C5_SEC=$C5SEC" >> "$GITHUB_ENV"

      - name: Rebuild frozen C5 provenance engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('xau-wick-zone-pro/xau_zone_episode_dev_z4.py').read_text();repl=[('p=utc_ts(ts); return p.minute%15==0 and p.second==0','p=utc_ts(ts); return p.minute%5==0 and p.second==0'),('if i<LOOKBACK-1 or i+HORIZON+REACT_MAX>=N or not landmark_ok(T[i]): continue','if i<LOOKBACK-1 or not landmark_ok(T[i]): continue'),('out=outcome_zone(i,zlo,zhi,center,side,v)','out={}'),("'revisit_rate':float(Z.revisited.mean()),'runtime_sec':time.time()-t0","'revisit_rate':None,'runtime_sec':time.time()-t0")]
          for o,n in repl: assert src.count(o)==1; src=src.replace(o,n)
          p=Path('/tmp/z4_c5_geometry_only.py');p.write_text(src);man=json.load(open('xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_MANIFEST_v1_0.json'));assert hashlib.sha256(p.read_bytes()).hexdigest()==man['sha256']['z4_geometry']
          PY

      - name: Run corrected H1 and H2 causal studies
        shell: bash
        run: |
          set -euo pipefail
          for W in H1 H2; do
            mkdir -p "/tmp/evidence/$W"
            python xau-wick-zone-pro/cadence-sensitivity/xau_ebuy_c1_refresh_causal_reaction_v1_2_session.py \
              --window "$W" --files /tmp/xau/oos/*.csv --c1-pkl /tmp/C1_BID_24M_PARTITION.pkl --c5-pkl /tmp/C5_BID_24M_PARTITION.pkl \
              --frozen-c5-z4-pkl /tmp/FROZEN_MONTHLY_C5_24M.pkl --frozen-z4-engine /tmp/z4_c5_geometry_only.py \
              --candidates-gz xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_OOS_STICKY_CANDIDATES_v1_0.csv.gz \
              --coverage-result xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_RESULT_v1_0.json \
              --coverage-manifest xau-wick-zone-pro/entry-research/ebuy-coverage-oos-v1-0/XAUUSD_Z4_EBUY_COVERAGE_OOS_REPLICATION_MANIFEST_v1_0.json --source-manifest "$MANIFEST" \
              --frozen-h1-result xau-wick-zone-pro/entry-research/reaction-dev-h1-v1-0-precomputed-location/XAUUSD_Z4_EBUY_REACTION_DEV_H1_RESULT_v1_0.json \
              --frozen-h2-result xau-wick-zone-pro/entry-research/ebuy-h2-validation-v1-0/XAUUSD_Z4_EBUY_H2_VALIDATION_RESULT_v1_0.json \
              --evidence-dir "/tmp/evidence/$W" --detector-c1-sec "$DET_C1_SEC" --detector-c5-sec "$DET_C5_SEC" --output "/tmp/results/${W}_SOURCE_FAITHFUL_CAUSAL_RESULT.json"
          done

      - name: Run corrected dual-C5 all-day bootstrap
        shell: bash
        run: |
          set -euo pipefail
          for W in H1 H2; do
            python xau-wick-zone-pro/cadence-sensitivity/xau_ebuy_c1_refresh_dual_c5_postprocess_v1_1_session_all_day.py \
              --window "$W" --files /tmp/xau/oos/*.csv --c5-mechanical-pkl /tmp/C5_BID_24M_PARTITION.pkl --c5-source-faithful-pkl /tmp/FROZEN_MONTHLY_C5_24M.pkl \
              --c1-contacts "/tmp/evidence/$W/${W}_CAUSAL_V1_C1_CONTACTS.csv.gz" --c1-trades "/tmp/evidence/$W/${W}_CAUSAL_V1_C1_BR.csv.gz" \
              --c5-source-contacts "/tmp/evidence/$W/${W}_CAUSAL_V1_C5_CONTACTS.csv.gz" --c5-source-trades "/tmp/evidence/$W/${W}_CAUSAL_V1_C5_BR.csv.gz" \
              --mechanical-evidence-dir "/tmp/evidence/$W" --output "/tmp/results/${W}_DUAL_C5_COMMON_SUPPORT_RESULT.json"
          done

      - name: Aggregate corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          B={w:json.load(open(f'/tmp/results/{w}_SOURCE_FAITHFUL_CAUSAL_RESULT.json')) for w in ('H1','H2')};D={w:json.load(open(f'/tmp/results/{w}_DUAL_C5_COMMON_SUPPORT_RESULT.json')) for w in ('H1','H2')}
          for w in ('H1','H2'):
              assert B[w]['frozen_c5_baseline']['pass'] is True;assert B[w]['detector_common_anchor_geometry_parity']['pass'] is True;assert B[w]['preregistered_runtime_semantics']['score_used'] is False;assert D[w]['primary_cadence_isolate']['paired_day_bootstrap']['all_common_days_included'] is True;assert D[w]['historical_bridge_robustness']['paired_day_bootstrap']['all_common_days_included'] is True
          p1=D['H1']['primary_cadence_isolate']['paired_day_bootstrap']['delta_tp1_rate'];p2=D['H2']['primary_cadence_isolate']['paired_day_bootstrap']['delta_tp1_rate'];h12=(p1 is not None and p2 is not None and ((p1>0)==(p2>0)));controls={w:bool(D[w]['direction_coherence_across_C5_controls']) for w in ('H1','H2')}
          out={'status':'C1_REFRESH_FINAL_V3_DIRECT_EVIDENCE_COMPLETE_PENDING_PRO_INTERPRETATION','authorization':'NONE_RETROSPECTIVE_SENSITIVITY_ONLY','production_change_authorized':False,'mechanical_source_map':json.load(open('/tmp/results/MECHANICAL_SOURCE_MAP.json')),'H1':D['H1'],'H2':D['H2'],'base_source_faithful':{'H1':B['H1'],'H2':B['H2']},'primary_h1_h2_direction_coherent':bool(h12),'within_window_direction_coherence_across_C5_controls':controls,'all_direction_coherence':bool(h12 and all(controls.values())),'bootstrap_rule':'ALL_COMMON_NY_TRADING_DAYS_10000_SEED_20260826','episode_consumption_rule':'ONE_FRESH_CONTACT_PER_EPISODE_PER_NY_SESSION','next_gate':'PRO_INTERPRET_PREREG_CRITERIA_NO_AUTO_PROMOTION'}
          Path('/tmp/results/C1_REFRESH_FINAL_V3_DIRECT_AGGREGATE.json').write_text(json.dumps(out,indent=2,default=str));print(json.dumps({'H1_primary_delta':p1,'H1_primary_ci':D['H1']['primary_cadence_isolate']['paired_day_bootstrap']['bootstrap_95'],'H2_primary_delta':p2,'H2_primary_ci':D['H2']['primary_cadence_isolate']['paired_day_bootstrap']['bootstrap_95'],'H1_bridge_delta':D['H1']['historical_bridge_robustness']['paired_day_bootstrap']['delta_tp1_rate'],'H2_bridge_delta':D['H2']['historical_bridge_robustness']['paired_day_bootstrap']['delta_tp1_rate'],'H1_controls_coherent':controls['H1'],'H2_controls_coherent':controls['H2'],'H1_H2_primary_coherent':h12},indent=2))
          PY

      - name: Upload final immutable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: C1-refresh-final-v3-direct-evidence
          path: |
            /tmp/results/*
            /tmp/evidence/*/*
          retention-days: 30
