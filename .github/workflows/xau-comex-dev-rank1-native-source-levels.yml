# trigger-once: native-source-levels-v1-1-tick-rounding-2026-08-18
name: XAU COMEX DEV_RANK1 Native Source Levels

on:
  push:
    branches: [agent/xau-comex-acquisition-plan]
    paths: ['.github/workflows/xau-comex-dev-rank1-native-source-levels.yml']

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xau-comex-acquisition-plan
      - run: python -m pip install pandas==2.2.3 numpy databento requests
      - name: Download successful DEV_RANK1 raw artifacts — GitHub only
        uses: actions/download-artifact@v4
        with:
          pattern: comex-dev-rank1-dual-*
          path: /tmp/new
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819
      - name: Recover early V0 artifact 06610 explicitly
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-06610cec170650590cd663ca
          path: /tmp/new
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819
      - name: Recover early V0 artifact 010384 explicitly
        uses: actions/download-artifact@v4
        with:
          name: comex-dev-rank1-dual-01038430e355d65828fbe711
          path: /tmp/new
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: 32179377819
      - name: Locate paid pilot raw artifact
        id: pilot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os,requests
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};base=f"https://api.github.com/repos/{os.environ['REPO']}";runs=requests.get(f"{base}/actions/workflows/xau-comex-v4-pilot12-metadata.yml/runs",headers=h,params={'branch':'agent/xau-comex-acquisition-plan','status':'success','per_page':50}).json().get('workflow_runs',[]);found=None
          for r in runs:
              arts=requests.get(f"{base}/actions/runs/{r['id']}/artifacts",headers=h,params={'per_page':100}).json().get('artifacts',[])
              if any(x['name']=='comex-v4-pilot12-raw-and-qa' and not x.get('expired') for x in arts):found=r['id'];break
          if not found:raise SystemExit('pilot raw artifact not found')
          print(f'run_id={found}')
          PY
      - name: Download pilot raw
        uses: actions/download-artifact@v4
        with:
          name: comex-v4-pilot12-raw-and-qa
          path: /tmp/pilot
          github-token: ${{ github.token }}
          repository: iagency971/twilio-voice-gateway
          run-id: ${{ steps.pilot.outputs.run_id }}
      - name: Build terminal native source levels — no market API
        run: |
          python xau-multiyear/scripts/build_comex_dev_rank1_native_source_levels.py \
            --new-root /tmp/new \
            --pilot-root /tmp/pilot \
            --requests xau-final-results/comex_dev_rank1_dual_manifest_v1/dev_rank1_dual_requests.csv \
            --sessions xau-final-results/comex_dev_rank1_gate_v1/corrected_primary_sessions.csv \
            --mapping xau-final-results/comex_dev_rank1_gate_v1/frozen_session_mapping_all.csv \
            --routing xau-final-results/comex_dev_rank1_dual_routing_qa_v1/dual_session_routing_qa.csv \
            --out /tmp/native
      - name: Validate GC tick contact registry
        run: |
          python - <<'PY'
          import json,pandas as pd,numpy as np
          x=pd.read_csv('/tmp/native/native_source_levels.csv')
          m=json.load(open('/tmp/native/native_source_manifest.json'))
          assert m['version']=='COMEX_DEV_RANK1_NATIVE_SOURCE_LEVELS_V1_1'
          assert len(x)==368 and x.source_research_date.nunique()==92
          assert 'contact_tick_price' in x.columns
          q=pd.to_numeric(x.contact_tick_price,errors='raise')
          assert np.allclose(q*10,np.round(q*10),atol=1e-8)
          assert set(x.level_type)=={'VWAP','POC','VAH','VAL'}
          print('NATIVE_REGISTRY_V1_1_OK',len(x),x.source_research_date.nunique())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: comex-dev-rank1-native-source-levels-v1-1
          path: /tmp/native/
          retention-days: 90
      - name: Publish source registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: agent/xau-comex-acquisition-plan
        run: |
          python - <<'PY'
          import base64,os,pathlib,requests
          src=pathlib.Path('/tmp/native');root='xau-final-results/comex_dev_rank1_native_source_levels_v1';h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name in ['native_source_levels.csv','native_source_manifest.json']:
              p=src/name;path=f'{root}/{name}';u=f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}";old=requests.get(u,headers=h,params={'ref':os.environ['BRANCH']});sha=old.json().get('sha') if old.status_code==200 else None;body={'message':f'publish DEV_RANK1 native source levels V1.1 {name} [skip ci]','content':base64.b64encode(p.read_bytes()).decode(),'branch':os.environ['BRANCH']}
              if sha:body['sha']=sha
              r=requests.put(u,headers=h,json=body);r.raise_for_status()
          PY
